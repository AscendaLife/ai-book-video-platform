<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书影 BookReel · AI 新书短视频营销平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
/* ============================================================
   书影 BookReel · AI 新书短视频营销平台 — 全局样式
   ============================================================ */

:root{
  --violet:#7c6cff; --violet-2:#a48bff; --cyan:#22d3ee; --pink:#ff5d8f;
  --green:#2ee6a8; --amber:#ffb020; --red:#ff5a65;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --grad:linear-gradient(135deg,var(--violet) 0%,#8b5cf6 45%,var(--cyan) 100%);
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* 主题令牌：默认深色 → 跟随系统 → 用户/查看者显式切换（后者优先） */
:root,[data-theme="dark"],:root[data-theme="dark"]{
  --bg:#080b14; --bg-2:#0d1220; --panel:#111829; --panel-2:#161f34;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --txt:#e9edf7; --txt-2:#9aa3bd; --txt-3:#6b7490;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --glow:radial-gradient(1100px 520px at 82% -12%,rgba(124,108,255,.20),transparent 62%),
         radial-gradient(760px 420px at 8% 0%,rgba(34,211,238,.12),transparent 60%);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f4f6fb; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f7f9fd;
    --line:rgba(16,24,48,.09); --line-2:rgba(16,24,48,.16);
    --txt:#141a2c; --txt-2:#5b657f; --txt-3:#8b94ab;
    --shadow:0 14px 40px rgba(20,30,60,.10);
    --glow:radial-gradient(1000px 480px at 85% -14%,rgba(124,108,255,.16),transparent 62%),
           radial-gradient(700px 400px at 5% 0%,rgba(34,211,238,.12),transparent 60%);
  }
}
[data-theme="light"],:root[data-theme="light"]{
  --bg:#f4f6fb; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f7f9fd;
  --line:rgba(16,24,48,.09); --line-2:rgba(16,24,48,.16);
  --txt:#141a2c; --txt-2:#5b657f; --txt-3:#8b94ab;
  --shadow:0 14px 40px rgba(20,30,60,.10);
  --glow:radial-gradient(1000px 480px at 85% -14%,rgba(124,108,255,.16),transparent 62%),
         radial-gradient(700px 400px at 5% 0%,rgba(34,211,238,.12),transparent 60%);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--txt);
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------------- 侧边栏 ---------------- */
.sidebar{
  width:250px;flex:0 0 250px;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;transition:transform .25s
}
.brand{display:flex;align-items:center;gap:11px;padding:19px 18px 16px}
.brand-logo{
  width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;
  font-weight:800;font-size:18px;color:#fff;box-shadow:0 8px 22px rgba(124,108,255,.45)
}
.brand-title{font-weight:700;font-size:14.5px;letter-spacing:.2px}
.brand-sub{font-size:10.5px;color:var(--txt-3);letter-spacing:1.1px;text-transform:uppercase}

.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nav-group{font-size:10.5px;color:var(--txt-3);letter-spacing:1.4px;padding:16px 10px 7px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
  color:var(--txt-2);font-size:13.5px;margin-bottom:2px;position:relative;transition:.16s
}
.nav-item .ni{width:18px;text-align:center;opacity:.8;font-size:13px}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:var(--panel-2);color:var(--txt);font-weight:600}
.nav-item.active::before{
  content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)
}
.ni-badge{margin-left:auto;background:var(--violet);color:#fff;font-size:10px;padding:1px 6px;border-radius:20px;font-weight:700}
.ni-badge:empty{display:none}

.sidebar-foot{padding:14px;border-top:1px solid var(--line)}
.quota-head{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-3);margin-bottom:6px}
.bar{height:5px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:5px;transition:width .6s}
.user{display:flex;align-items:center;gap:10px;margin-top:14px}
.avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff8a5b,#ff5d8f);display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.user-name{font-size:13px;font-weight:600}
.user-role{font-size:11px;color:var(--txt-3)}

/* ---------------- 顶栏 ---------------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);background-image:var(--glow)}
.topbar{
  height:62px;flex:0 0 62px;display:flex;align-items:center;gap:14px;padding:0 24px;
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
}
.crumb{font-size:15px;font-weight:650}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;width:260px;color:var(--txt-3)}
.search input{background:none;border:0;outline:0;width:100%;font-size:13px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  cursor:pointer;display:grid;place-items:center;color:var(--txt-2);transition:.16s
}
.icon-btn:hover{border-color:var(--line-2);color:var(--txt)}
.only-mobile{display:none}

.view{flex:1;overflow-y:auto;padding:24px 26px 60px}

/* ---------------- 通用组件 ---------------- */
.btn{
  border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:8px 15px;
  cursor:pointer;font-size:13px;font-weight:600;transition:.16s;white-space:nowrap;display:inline-flex;
  align-items:center;gap:7px
}
.btn:hover{background:var(--panel-2);transform:translateY(-1px)}
.btn-primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 22px rgba(124,108,255,.35)}
.btn-primary:hover{box-shadow:0 12px 28px rgba(124,108,255,.5)}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;position:relative}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-t{font-size:14.5px;font-weight:680}
.card-s{font-size:12px;color:var(--txt-3)}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.grid{display:grid;gap:16px}
/* 格线子项预设 min-width:auto，长内容会撑破栏宽导致整页横向溢出 */
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
@media(max-width:1280px){.g4{grid-template-columns:repeat(2,1fr)}.g-2-1,.g-1-2{grid-template-columns:1fr}}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:3px 9px;border-radius:20px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--txt-2);white-space:nowrap}
.tag.v{color:var(--violet-2);border-color:rgba(124,108,255,.35);background:rgba(124,108,255,.12)}
.tag.c{color:var(--cyan);border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.1)}
.tag.g{color:var(--green);border-color:rgba(46,230,168,.3);background:rgba(46,230,168,.1)}
.tag.a{color:var(--amber);border-color:rgba(255,176,32,.3);background:rgba(255,176,32,.1)}
.tag.p{color:var(--pink);border-color:rgba(255,93,143,.3);background:rgba(255,93,143,.1)}
.tag.r{color:var(--red);border-color:rgba(255,90,101,.3);background:rgba(255,90,101,.1)}

.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--txt-3)}
.dot.g{background:var(--green);box-shadow:0 0 0 3px rgba(46,230,168,.18)}
.dot.a{background:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.18)}
.dot.v{background:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.2)}

.page-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-t{font-size:22px;font-weight:750;letter-spacing:-.2px}
.page-d{font-size:13px;color:var(--txt-3);margin-top:3px}
.page-h .right{margin-left:auto;display:flex;gap:9px}

.hint{font-size:12px;color:var(--txt-3)}
.muted{color:var(--txt-2)}
.empty{text-align:center;padding:56px 20px;color:var(--txt-3)}
.empty .big{font-size:40px;opacity:.35;margin-bottom:10px}
.mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:12px}

/* KPI 卡 */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px 19px;overflow:hidden;position:relative}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:var(--grad);opacity:.10;filter:blur(6px)}
.kpi-l{font-size:12px;color:var(--txt-3);display:flex;align-items:center;gap:6px}
.kpi-v{font-size:27px;font-weight:760;margin:7px 0 4px;letter-spacing:-.6px}
.kpi-v small{font-size:13px;font-weight:600;color:var(--txt-3);margin-left:3px}
.kpi-d{font-size:11.5px;color:var(--green);font-weight:600}
.kpi-d.down{color:var(--red)}

/* 表格 */
table{width:100%;border-collapse:collapse}
th{font-size:11.5px;color:var(--txt-3);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.14s}
tbody tr:hover{background:var(--panel-2)}

/* 表单 */
.field{margin-bottom:14px}
.label{font-size:12px;color:var(--txt-2);margin-bottom:6px;display:flex;align-items:center;gap:6px;font-weight:600}
.input,select.input,textarea.input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;transition:.16s;font-size:13px
}
.input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.16)}
textarea.input{resize:vertical;min-height:88px;line-height:1.7}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.switch{width:40px;height:22px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line-2);
  position:relative;cursor:pointer;transition:.2s;flex:0 0 40px}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--txt-3);transition:.2s}
.switch.on{background:var(--grad);border-color:transparent}
.switch.on::after{left:20px;background:#fff}
.setting-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-row .right{margin-left:auto}
input[type=range]{width:100%;accent-color:var(--violet)}

/* 分段控件 */
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--txt-2);transition:.15s}
.seg button.on{background:var(--panel);color:var(--txt);font-weight:650;box-shadow:0 2px 8px rgba(0,0,0,.15)}

/* ---------------- 项目卡 ---------------- */
.book-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  transition:.2s;cursor:pointer;display:flex;flex-direction:column}
.book-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow)}
.book-cover{height:132px;position:relative;display:flex;align-items:flex-end;padding:14px}
.book-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.book-cover .bt{position:relative;z-index:2;color:#fff;font-weight:750;font-size:16px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.book-cover .st{position:absolute;top:12px;right:12px;z-index:2}
.book-b{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:9px}
.book-meta{font-size:12px;color:var(--txt-3)}
.book-stats{display:flex;gap:14px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.bs{font-size:11px;color:var(--txt-3)}
.bs b{display:block;font-size:15px;color:var(--txt);font-weight:700}

/* ---------------- 流水线 ---------------- */
.pipe{display:flex;gap:0;overflow-x:auto;padding:4px 0 14px}
.pstep{
  flex:1;min-width:118px;padding:13px 12px;border:1px solid var(--line);background:var(--panel);position:relative;
  cursor:pointer;transition:.18s
}
.pstep:first-child{border-radius:var(--r) 0 0 var(--r)}
.pstep:last-child{border-radius:0 var(--r) var(--r) 0}
.pstep+.pstep{border-left:0}
.pstep:hover{background:var(--panel-2)}
.pstep.on{background:var(--panel-2)}
.pstep.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad)}
.pstep .pn{font-size:10.5px;color:var(--txt-3);letter-spacing:1px}
.pstep .pt{font-size:12.5px;font-weight:650;margin-top:4px}
.pstep .ps{font-size:10.5px;margin-top:6px;display:flex;align-items:center;gap:5px;color:var(--txt-3)}
.pstep.done .pt{color:var(--green)}
.pstep.run .pt{color:var(--violet-2)}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-top:16px}
.log{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:230px;
  overflow-y:auto;font-family:"JetBrains Mono",Consolas,monospace;font-size:11.5px;line-height:1.9}
.log .l-ok{color:var(--green)}.log .l-run{color:var(--cyan)}.log .l-info{color:var(--txt-3)}.log .l-warn{color:var(--amber)}

.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:750}

.drop{
  border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:34px;text-align:center;transition:.18s;cursor:pointer;background:var(--panel-2)
}
.drop:hover,.drop.over{border-color:var(--violet);background:rgba(124,108,255,.07)}
.drop .di{font-size:34px;opacity:.5}
.file-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);margin-top:8px}
.file-ico{width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:13px;color:#fff;flex:0 0 32px}

/* 内容资产 */
.chip-list{display:flex;flex-wrap:wrap;gap:8px}
.copy-item{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:.16s;position:relative}
.copy-item:hover{border-color:var(--line-2)}
.copy-item .ci-h{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.copy-item .ci-n{font-size:11px;color:var(--txt-3);font-family:monospace}
.copy-item .ci-a{margin-left:auto;opacity:0;transition:.16s;display:flex;gap:6px}
.copy-item:hover .ci-a{opacity:1}
.copy-txt{font-size:13.5px;line-height:1.75}

/* 视频卡 */
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
.vid{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.2s}
.vid:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-2)}
.vid-th{aspect-ratio:9/16;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:11px}
.vid-th::after{content:"";position:absolute;inset:0;background:linear-gradient(190deg,rgba(0,0,0,.28),transparent 42%,rgba(0,0,0,.68))}
.vid-th>*{position:relative;z-index:2}
.vid-cap{color:#fff;font-weight:700;font-size:13px;line-height:1.45;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.vid-play{position:absolute;inset:0;display:grid;place-items:center;z-index:3;opacity:0;transition:.2s;background:rgba(0,0,0,.3)}
.vid:hover .vid-play{opacity:1}
.vid-play span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center;font-size:16px;padding-left:3px}
.vid-b{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.vid-tt{font-size:12.5px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid-m{display:flex;justify-content:space-between;font-size:11px;color:var(--txt-3)}
.plat{position:absolute;top:10px;left:10px;z-index:3;font-size:10.5px;padding:3px 8px;border-radius:6px;
  background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px);font-weight:600}
.dur{position:absolute;bottom:10px;right:10px;z-index:3;font-size:10.5px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff}

/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-h{font-size:11px;color:var(--txt-3);text-align:center;padding:4px 0;font-weight:600}
.cal-d{min-height:92px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px;background:var(--panel-2);font-size:11px;transition:.15s}
.cal-d:hover{border-color:var(--line-2)}
.cal-d.out{opacity:.35}
.cal-d.today{border-color:var(--violet);box-shadow:0 0 0 2px rgba(124,108,255,.18)}
.cal-n{color:var(--txt-3);margin-bottom:5px;font-weight:600}
.cal-e{font-size:10px;padding:2px 5px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:#fff;background:var(--ec);cursor:pointer;transition:.14s;border:1px solid transparent}
.cal-e:hover{filter:brightness(1.12);transform:translateX(1px)}
.cal-e.done{background:transparent;border:1px dashed var(--line-2);color:var(--txt-3)}
.cal-e.done::before{content:"✓ ";font-weight:700;color:var(--green)}
.cal-e.done:hover{filter:none;background:var(--panel)}
.cal-legend{display:flex;gap:14px;align-items:center;font-size:11px;color:var(--txt-3)}
.cal-legend i{display:inline-block;width:14px;height:10px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.cal-legend .lg-p{background:var(--violet)}
.cal-legend .lg-d{background:transparent;border:1px dashed var(--line-2)}

/* 时间线 */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i::before{content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.2)}
.tl-t{font-size:13px;font-weight:640}
.tl-s{font-size:11.5px;color:var(--txt-3)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(4,7,15,.66);backdrop-filter:blur(5px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:24px}
.modal-mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-xl);width:100%;max-width:660px;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pop .22s ease}
.modal.wide{max-width:940px}
@keyframes pop{from{transform:translateY(14px) scale(.985);opacity:0}}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-title{font-size:16px;font-weight:700;flex:1}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.modal-foot:empty{display:none}

/* Toast */
.toasts{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--violet);border-radius:12px;
  padding:12px 16px;box-shadow:var(--shadow);min-width:250px;animation:slide .25s ease;font-size:13px}
.toast.ok{border-left-color:var(--green)}.toast.warn{border-left-color:var(--amber)}.toast.err{border-left-color:var(--red)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}

/* 文档 */
.doc{max-width:900px;line-height:1.85;font-size:14px}
.doc h1{font-size:24px;margin:6px 0 16px;font-weight:750}
.doc h2{font-size:18px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:700}
.doc h3{font-size:15px;margin:20px 0 9px;font-weight:680;color:var(--violet-2)}
.doc p{margin:9px 0;color:var(--txt-2)}
.doc ul,.doc ol{margin:9px 0 9px 22px;color:var(--txt-2)}
.doc li{margin:5px 0}
.doc code{background:var(--panel-2);padding:2px 6px;border-radius:5px;font-family:monospace;font-size:12.5px;color:var(--cyan)}
.doc table{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.doc blockquote{border-left:3px solid var(--violet);padding:8px 14px;margin:12px 0;background:var(--panel-2);border-radius:0 10px 10px 0;color:var(--txt-2)}
.doc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc strong{color:var(--txt)}

/* 分镜 */
.shot{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.shot:last-child{border-bottom:0}
.shot-n{width:56px;height:56px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:700;color:var(--txt-3);font-size:12px}
.shot-t{font-size:13.5px;line-height:1.7}
.shot-d{font-size:11.5px;color:var(--txt-3);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.shot.on{background:rgba(124,108,255,.09);border-radius:10px}
.shot.on .shot-n{border-color:var(--violet);color:var(--violet-2);background:rgba(124,108,255,.14)}
#pv-play:hover{background:#fff;transform:translate(-50%,-50%) scale(1.06)}
#pv-play{transition:.15s}

.persona-hero{
  border-radius:var(--r-xl);padding:26px;background:linear-gradient(135deg,rgba(124,108,255,.22),rgba(34,211,238,.12));
  border:1px solid var(--line-2);display:flex;gap:24px;align-items:center;flex-wrap:wrap
}
.pv{width:112px;height:112px;border-radius:26px;background:linear-gradient(150deg,#5b4bff,#22d3ee);display:grid;place-items:center;
  font-size:40px;font-weight:800;color:#fff;flex:0 0 112px;box-shadow:0 16px 40px rgba(91,75,255,.4)}
.wave{display:flex;align-items:center;gap:3px;height:34px}
.wave i{width:3px;background:var(--cyan);border-radius:3px;animation:w 1.1s ease-in-out infinite}
@keyframes w{0%,100%{height:20%}50%{height:100%}}

/* ---------------- 文档卡 ---------------- */
.doc-card{cursor:pointer;padding:15px 16px;transition:.18s}
.doc-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.doc-card.on{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.14)}
.doc-card .dc-i{font-size:19px;color:var(--violet-2);line-height:1}
.doc-card .dc-n{font-weight:680;font-size:13.5px;margin-top:8px}

/* ---------------- 阶段说明条 ---------------- */
.explain{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--violet);
  border-radius:0 12px 12px 0;padding:13px 16px;margin:-4px 0 18px;display:flex;flex-direction:column;gap:7px}
.ex-r{display:flex;gap:12px;font-size:13px;line-height:1.75}
.ex-k{flex:0 0 84px;color:var(--txt-3);font-size:12px;font-weight:650;padding-top:1px}
.ex-r>span:last-child{color:var(--txt-2);flex:1}
mark.hl{background:rgba(124,108,255,.28);color:var(--txt);border-radius:4px;padding:1px 4px;font-weight:600}
@media(max-width:700px){.ex-r{flex-direction:column;gap:2px}.ex-k{flex:none}}

/* ---------------- 声音来源与声库 ---------------- */
.vsrc{border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;transition:.16s;background:var(--panel-2)}
.vsrc:hover{border-color:var(--line-2)}
.vsrc.on{border-color:var(--violet);background:rgba(124,108,255,.08);box-shadow:0 0 0 3px rgba(124,108,255,.12)}
.vradio{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 14px;transition:.16s}
.vsrc.on .vradio{border-color:var(--violet);background:radial-gradient(circle,var(--violet) 0 45%,transparent 46%)}
.vcard{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.16s;background:var(--panel-2)}
.vcard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.vcard.on{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.12)}
.vdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}

/* ---------------- 模拟成片播放器 ---------------- */
.mv{aspect-ratio:9/16;border-radius:16px;position:relative;overflow:hidden;cursor:pointer;user-select:none}
.mv-vig{position:absolute;inset:0;background:linear-gradient(190deg,rgba(0,0,0,.36),transparent 34%,rgba(0,0,0,.82))}
.mv-broll{position:absolute;inset:0;opacity:0;transition:opacity .5s;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 55%),
             radial-gradient(circle at 75% 70%,rgba(0,0,0,.35),transparent 55%);
  animation:kb 9s ease-in-out infinite alternate}
.mv-broll.show{opacity:1}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.16) translate(-3%,-2%)}}

.mv-person{position:absolute;left:50%;bottom:26%;width:56%;transform:translate(-50%,var(--bob,0px));
  transition:width .6s cubic-bezier(.4,0,.2,1),bottom .6s;filter:drop-shadow(0 10px 26px rgba(0,0,0,.4))}
.mv-person.far{width:34%;bottom:34%}

.mv-book{position:absolute;left:50%;top:16%;transform:translate(-50%,14px);opacity:0;transition:.55s;text-align:center;z-index:2}
.mv-book.show{opacity:1;transform:translate(-50%,0)}
.mv-book-c{width:86px;height:120px;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);
  display:grid;place-items:center;padding:8px;margin:0 auto;border:1px solid rgba(255,255,255,.25)}
.mv-book-c span{color:#fff;font-weight:800;font-size:13px;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.mv-book-t{color:#fff;font-size:10.5px;opacity:.85;margin-top:7px}

.mv-kw{position:absolute;inset:12% 10% auto 10%;z-index:3;color:#fff;font-weight:850;font-size:19px;line-height:1.45;
  text-align:center;text-shadow:0 4px 18px rgba(0,0,0,.65);opacity:0;transform:scale(.94);transition:.4s;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mv-kw.show{opacity:1;transform:scale(1)}

.mv-top{position:absolute;top:12px;left:12px;right:12px;z-index:4;display:flex;justify-content:space-between;align-items:flex-start}
.mv-btn{background:rgba(0,0,0,.5);border:0;color:#fff;border-radius:6px;padding:2px 6px;font-size:11px;cursor:pointer;line-height:1.5}
.mv-btn:hover{background:rgba(0,0,0,.72)}

.mv-bottom{position:absolute;left:14px;right:14px;bottom:14px;z-index:4}
.mv-meta{color:#fff;opacity:.75;font-size:10.5px;letter-spacing:.4px}
.mv-sub{color:#fff;font-weight:750;font-size:14.5px;line-height:1.55;margin-top:5px;
  text-shadow:0 2px 12px rgba(0,0,0,.8);min-height:88px;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mv-cta{margin-top:8px;display:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  border-radius:8px;padding:6px 9px;color:#fff;font-size:11px;backdrop-filter:blur(3px)}
.mv-cta.show{display:block}
.mv-sign{display:flex;align-items:center;gap:7px;margin-top:9px;color:#fff;font-size:11px;opacity:.9}
.mv-track{height:3px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:10px;overflow:hidden}
.mv-track>div{width:0%;height:100%;background:#fff;border-radius:3px}

.mv-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:54px;height:54px;border-radius:50%;
  background:rgba(255,255,255,.93);border:0;cursor:pointer;font-size:17px;color:#111;display:grid;place-items:center;transition:.2s}
.mv-play:hover{background:#fff;transform:translate(-50%,-50%) scale(1.06)}
.mv-play.hide{opacity:0;pointer-events:none}
.mv:hover .mv-play.hide{opacity:.75;pointer-events:auto}
@media(prefers-reduced-motion:reduce){.mv-broll{animation:none}}

/* ---------------- 新手导览 ---------------- */
.tour-mask{position:fixed;inset:0;z-index:150;display:none}
.tour-hole{position:absolute;border-radius:14px;border:2px solid var(--violet);
  box-shadow:0 0 0 9999px rgba(4,7,15,.74),0 0 26px rgba(124,108,255,.6);
  transition:left .3s cubic-bezier(.4,0,.2,1),top .3s cubic-bezier(.4,0,.2,1),width .3s,height .3s,opacity .2s;pointer-events:none}
[data-theme="light"] .tour-hole{box-shadow:0 0 0 9999px rgba(10,16,34,.55),0 0 26px rgba(124,108,255,.5)}
.tour-pop{position:fixed;z-index:151;width:340px;background:var(--panel);border:1px solid var(--line-2);
  border-radius:18px;padding:18px 20px 16px;box-shadow:var(--shadow);display:none;animation:pop .22s ease}
.tour-pop.center{left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px))}
.tour-h{display:flex;align-items:center;margin-bottom:9px}
.tour-n{font-size:11px;color:var(--txt-3);letter-spacing:1px;font-weight:700}
.tour-x{width:26px;height:26px;margin-left:auto;border-radius:8px;font-size:12px}
.tour-t{font-size:16.5px;font-weight:730;margin-bottom:9px;letter-spacing:-.2px;text-wrap:balance}
.tour-b{font-size:13.5px;line-height:1.85;color:var(--txt-2)}
.tour-b b{color:var(--txt)}
.tour-note{margin-top:12px;font-size:11.5px;color:var(--amber);background:rgba(255,176,32,.1);
  border:1px solid rgba(255,176,32,.28);border-radius:9px;padding:7px 10px;line-height:1.6}
.tour-dots{display:flex;gap:5px;margin:15px 0 13px}
.tour-dots i{width:16px;height:3px;border-radius:3px;background:var(--line-2);transition:.2s}
.tour-dots i.on{background:var(--grad);width:24px}
.tour-f{display:flex;align-items:center;gap:8px}
@media(prefers-reduced-motion:reduce){.tour-hole{transition:none}.tour-pop{animation:none}}

@media(max-width:980px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}

  .row2{grid-template-columns:1fr}
  .tour-pop{width:calc(100vw - 24px);left:12px!important}
  #btn-tour{display:none}
}

  /* 生成分镜（时间轴按实际片长等比分配，不写死秒数） */
  function genShots(s, b) {
    const D = s.duration || 45;
    const parts = [
      { t: '开场特写', txt: s.hook, cam: '数字人正面近景', vis: '书封悬浮入场', w: 0.13 },

    ];
    let acc = 0;
    return parts.map((p, i) => {
      const t0 = Math.round(acc * D);
      acc += p.w;
      const t1 = i === parts.length - 1 ? D : Math.round(acc * D);
      return { t: p.t, txt: p.txt, cam: p.cam, vis: p.vis, t0, t1, dur: `${t0}–${t1}s` };

  /* 数据分析（7 日 / 平台 / 漏斗）。统计范围只含已发布的影片 */
  function genAnalytics(all) {

  /* 书籍档案（JSON）→ 专案资料。支援中文与英文栏位名。 */
  function importProfile(json, p) {
    const g = (...keys) => { for (const k of keys) if (json[k] != null) return json[k]; };
    const title = g('书名', 'title');
    if (!title) return { ok: false, msg: '档案里找不到「书名」栏位，请确认格式' };

    p.title = title;
    p.subtitle = g('副标题', 'subtitle') || '';
    p.author = g('作者', 'author') || '佚名';
    p.publisher = g('出版社', 'publisher') || '未填写';

      ? { text: q, chapter: null, page: null }
      : { text: q['文字'] || q.text, chapter: q['章节'] || q.chapter, page: q['页码'] || q.page }))
      .filter(q => q.text);
    p.quotes = p.quoteSrc.map(q => q.text);

    const au = g('读者画像', 'audiences') || [];
    p.audiences = au.map(a => (typeof a === 'string'
      ? { name: a, size: Math.round(100 / au.length), note: '' }
      : { name: a['名称'] || a.name, size: a['占比'] || a.size || 0, note: a['特征'] || a.note || '' }));

    const ci = g('封面配色', 'cover');
    if (typeof ci === 'number' && COVERS[ci]) p.cover = COVERS[ci];

    p.source = { kind: 'profile', label: '完整书籍档案' };
    return {
      ok: true,
      stat: { 论点: p.themes.length, 金句: p.quoteSrc.length, 画像: p.audiences.length, 痛点: p.pains.length, 目录: p.toc.length }
    };
  }

  /* 内文（TXT / MD）→ 本地启发式解析（非 AI，纯规则） */
  function parseText(text) {
    const chars = (text.match(/[一-鿿]/g) || []).length;
    const heads = (text.match(/^(#{1,3}\s*.+|第\s*[0-9一二三四五六七八九十]+\s*章.*)$/gm) || [])
      .map(s => s.replace(/^#+\s*/, '').trim());
    const seen = {};
    const quotes = text
      .split(/[。！？\n]/).map(s => s.replace(/^[#\s>*\-]+/, '').trim())
      .filter(s => {
        if (s.length < 12 || s.length > 40) return false;
        if (/[0-9A-Za-z（）()《》]/.test(s)) return false;
        if (seen[s]) return false;
        seen[s] = 1; return true;
      });
    return { chars, chapters: heads, quotes: quotes.slice(0, 24) };
  }

  return {
    PLATFORMS, ANGLES, STAGES, COVERS, SEED_BOOKS, PERSONA, VOICES,
    importProfile, parseText,
    seedAll, buildProject, genTitles, genHooks, genOpens, genScripts, genScriptBody,
    applyPersona, genShots, genVideos, genStrategy, genAnalytics, uid, rand
  };
})();

    get current() { return state.projects.find(p => p.id === state.currentId) || state.projects[0]; },
    setCurrent(id) { state.currentId = id; emit(); },
    addProject(p) { state.projects.unshift(p); state.currentId = p.id; log('ok', `新建书籍项目《${p.title}》`); emit(); },
    removeProject(id) {
      state.projects = state.projects.filter(p => p.id !== id);
      state.schedule = state.schedule.filter(s => s.projectId !== id);
      if (!state.projects.length) state.projects = DATA.seedAll();
      if (!state.projects.find(p => p.id === state.currentId)) state.currentId = state.projects[0].id;
      emit();
    },
    update() { emit(); },
    log(t, x) { log(t, x); emit(); },
    reset() { state = def(); ensureSchedule(); emit(); },
    on(f) { subs.push(f); }
  };
})();

/* ============================================================
 * ui.js — 通用 UI 工具
 * ========================================================== */
window.UI = (function () {

  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nf = n => n >= 100000000 ? (n / 100000000).toFixed(1) + '亿'
    : n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  function toast(msg, type) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.innerHTML = esc(msg);
    box.appendChild(el);
    if (window.I18N) I18N.apply(el);
    setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = '0'; el.style.transform = 'translateX(24px)'; setTimeout(() => el.remove(), 300); }, 2800);
  }

  /* 弹窗关闭钩子：任何开启或关闭都会触发，用于停掉弹窗内的计时器等资源 */
  const closeHooks = [];
  const onClose = f => closeHooks.push(f);
  const runHooks = () => closeHooks.forEach(f => { try { f(); } catch (e) {} });

  function modal(title, body, foot, wide) {
    runHooks();
    $('#modal-title').innerHTML = title;
    $('#modal-body').innerHTML = body;
    $('#modal-foot').innerHTML = foot || '';
    $('#modal').classList.toggle('wide', !!wide);
    $('#modal-mask').classList.add('show');
    if (window.I18N) I18N.apply($('#modal'));
  }
  function closeModal() { runHooks(); $('#modal-mask').classList.remove('show'); }

  function copy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板', 'ok'); } catch (e) { toast('复制失败，请手动选择', 'warn'); }
    ta.remove();
  }

  function download(name, content) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已导出：' + name, 'ok');
  }

  const statusTag = s => {
    const m = { 'done': ['g', '已完成'], 'ready': ['c', '待生产'], 'producing': ['a', '生产中'], 'draft': ['', '草稿'],
      '已发布': ['g', '已发布'], '待审核': ['a', '待审核'], '排程中': ['c', '排程中'], '草稿': ['', '草稿'], '待发布': ['v', '待发布'] };
    const x = m[s] || ['', s];
    return `<span class="tag ${x[0]}"><i class="dot ${x[0]}"></i>${x[1]}</span>`;
  };

  const scoreBar = v => `<div style="display:flex;align-items:center;gap:8px">
      <div class="bar" style="width:56px"><i style="width:${v}%"></i></div>
      <span style="font-size:11px;color:var(--txt-3);font-weight:600">${v}</span></div>`;

  return { $, $$, esc, nf, toast, modal, closeModal, onClose, copy, download, statusTag, scoreBar };
})();


/* ===== charts.js ===== */
/* ============================================================
 * charts.js — 纯 SVG 图表（无第三方依赖）
 * ========================================================== */
window.CHART = (function () {
  const nf = n => window.UI ? UI.nf(n) : n;

  /* 折线 + 面积图（双系列） */
  function line(data, opt) {
    opt = opt || {};
    const W = 720, H = 230, PL = 46, PR = 14, PT = 16, PB = 28;
    const max = Math.max.apply(null, data.map(d => d.view)) * 1.18 || 1;
    const iw = W - PL - PR, ih = H - PT - PB;
    const x = i => PL + (iw / (data.length - 1 || 1)) * i;
    const y = v => PT + ih - (v / max) * ih;

    const p1 = data.map((d, i) => `${i ? 'L' : 'M'}${x(i)},${y(d.view)}`).join(' ');
    const area = p1 + ` L${x(data.length - 1)},${PT + ih} L${PL},${PT + ih} Z`;
    const p2 = data.map((d, i) => `${i ? 'L' : 'M'}${x(i)},${y(d.inter * 8)}`).join(' ');

    let grid = '', ylab = '';
    for (let g = 0; g <= 4; g++) {
      const gy = PT + (ih / 4) * g;
      grid += `<line x1="${PL}" y1="${gy}" x2="${W - PR}" y2="${gy}" stroke="var(--line)" stroke-dasharray="3 5"/>`;
      ylab += `<text x="${PL - 9}" y="${gy + 4}" text-anchor="end" font-size="10" fill="var(--txt-3)">${nf(Math.round(max - (max / 4) * g))}</text>`;
    }
    const xlab = data.map((d, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--txt-3)">${d.label}</text>`).join('');
    const dots = data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.view)}" r="3.6" fill="var(--bg)" stroke="#7c6cff" stroke-width="2"><title>${d.label} 播放 ${nf(d.view)} · 互动 ${nf(d.inter)}</title></circle>`).join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7c6cff" stop-opacity=".38"/><stop offset="100%" stop-color="#7c6cff" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}${ylab}
      <path d="${area}" fill="url(#ga)"/>
      <path d="${p1}" fill="none" stroke="#7c6cff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="${p2}" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
      ${dots}${xlab}
    </svg>`;
  }

  /* 横向条形图 */
  function bars(items) {
    const max = Math.max.apply(null, items.map(i => i.value)) || 1;
    return `<div style="display:flex;flex-direction:column;gap:13px">` + items.map(i => `
      <div>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px">
          <span style="display:flex;align-items:center;gap:7px"><i style="width:8px;height:8px;border-radius:2px;background:${i.color};display:inline-block"></i>${UI.esc(i.name)}
            <span style="color:var(--txt-3);font-size:11px">${i.count ? i.count + ' 支' : ''}</span></span>
          <b style="font-weight:650">${nf(i.value)}</b>
        </div>
        <div class="bar" style="height:7px"><i style="width:${(i.value / max * 100).toFixed(1)}%;background:${i.color}"></i></div>
      </div>`).join('') + `</div>`;
  }

  /* 环形图 */
  function donut(items, center) {
    const total = items.reduce((a, i) => a + i.value, 0) || 1;
    const R = 62, C = 2 * Math.PI * R;
    let off = 0;
    const segs = items.map(i => {
      const len = (i.value / total) * C;
      const s = `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${i.color}" stroke-width="17"
        stroke-dasharray="${len - 2.5} ${C - len + 2.5}" stroke-dashoffset="${-off}" stroke-linecap="round"
        transform="rotate(-90 80 80)"><title>${UI.esc(i.name)} ${((i.value / total) * 100).toFixed(1)}%</title></circle>`;
      off += len; return s;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <div style="position:relative;width:160px;height:160px;flex:0 0 160px">
        <svg viewBox="0 0 160 160" style="width:160px;height:160px">
          <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="17"/>${segs}</svg>
        <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
          <div><div style="font-size:20px;font-weight:750">${center || nf(total)}</div>
          <div style="font-size:10.5px;color:var(--txt-3)">总播放</div></div></div>
      </div>
      <div style="flex:1;min-width:170px;display:flex;flex-direction:column;gap:9px">
        ${items.map(i => `<div style="display:flex;align-items:center;gap:9px;font-size:12.5px">
          <i style="width:9px;height:9px;border-radius:3px;background:${i.color}"></i>
          <span style="flex:1">${UI.esc(i.name)}</span>
          <b>${((i.value / total) * 100).toFixed(1)}%</b></div>`).join('')}
      </div></div>`;
  }

  /* 漏斗 */
  function funnel(items) {
    const max = items[0].v || 1;
    const cols = ['#7c6cff', '#8b5cf6', '#a855f7', '#22d3ee', '#2ee6a8', '#ffb020'];
    return `<div style="display:flex;flex-direction:column;gap:9px">` + items.map((it, i) => {
      const w = Math.max(12, (it.v / max) * 100);
      const rate = i ? ((it.v / items[i - 1].v) * 100).toFixed(1) + '%' : '—';
      return `<div style="display:flex;align-items:center;gap:12px">
        <div style="width:66px;font-size:12px;color:var(--txt-2)">${it.k}</div>
        <div style="flex:1;background:var(--panel-2);border-radius:8px;overflow:hidden;height:32px;position:relative">
          <div style="width:${w}%;height:100%;background:linear-gradient(90deg,${cols[i]},${cols[i]}aa);border-radius:8px;
            display:flex;align-items:center;padding-left:11px;font-size:12px;font-weight:650;color:#fff">${nf(it.v)}</div>
        </div>
        <div style="width:52px;text-align:right;font-size:11.5px;color:var(--txt-3)">${rate}</div>
      </div>`;
    }).join('') + `</div>`;
  }

  /* 进度环 */
  function ring(pct, label) {
    const R = 56, C = 2 * Math.PI * R;
    return `<div class="ring"><svg viewBox="0 0 132 132" width="132" height="132">
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="10"/>
      <defs><linearGradient id="rg"><stop offset="0%" stop-color="#7c6cff"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C - C * pct / 100}" style="transition:stroke-dashoffset .5s"/>
      </svg><div class="rv">${label != null ? label : Math.round(pct) + '%'}</div></div>`;
  }

  /* 雷达图（人格特征） */
  function radar(items) {
    const cx = 110, cy = 105, R = 78, n = items.length;
    const pt = (i, r) => {
      const a = (Math.PI * 2 / n) * i - Math.PI / 2;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    };
    let webs = '';
    [.25, .5, .75, 1].forEach(f => {
      webs += `<polygon points="${items.map((_, i) => pt(i, R * f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
    });
    const axes = items.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, R)[0]}" y2="${pt(i, R)[1]}" stroke="var(--line)"/>`).join('');
    const poly = items.map((it, i) => pt(i, R * it.v / 100).join(',')).join(' ');
    const labs = items.map((it, i) => {
      const [x, y] = pt(i, R + 18);
      return `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10.5" fill="var(--txt-3)">${it.k}</text>`;
    }).join('');
    return `<svg viewBox="0 0 220 215" style="width:100%;max-width:250px;height:auto">
      ${webs}${axes}
      <polygon points="${poly}" fill="rgba(124,108,255,.28)" stroke="#7c6cff" stroke-width="2"/>
      ${items.map((it, i) => { const p = pt(i, R * it.v / 100); return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#22d3ee"/>`; }).join('')}
      ${labs}</svg>`;
  }

  /* 迷你走势 */
  function spark(vals, color) {
    const W = 100, H = 28, max = Math.max.apply(null, vals) || 1, min = Math.min.apply(null, vals);
    const p = vals.map((v, i) => `${i ? 'L' : 'M'}${(W / (vals.length - 1)) * i},${H - ((v - min) / (max - min || 1)) * (H - 4) - 2}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:28px">
      <path d="${p}" fill="none" stroke="${color || '#7c6cff'}" stroke-width="2" stroke-linecap="round"/></svg>`;
  }

  return { line, bars, donut, funnel, ring, radar, spark };
})();


/* ===== engine.js ===== */
/* ============================================================
 * engine.js — 生产流水线执行引擎（模拟异步任务编排）
 * 真实接入：把 runTask 换成轮询后端任务状态即可。
 * ========================================================== */
window.ENGINE = (function () {

  let running = null;   // { projectId, stageIndex, taskIndex, timer }
  const listeners = [];
  const logs = [];

  function on(f) { listeners.push(f); }
  function emit(evt) { listeners.forEach(f => f(evt, snapshot())); }
  function snapshot() {
    return { running: !!running, projectId: running && running.projectId,
      stageIndex: running ? running.stageIndex : -1, taskIndex: running ? running.taskIndex : -1, logs: logs.slice(0, 200) };
  }
  function addLog(cls, text) {
    const t = new Date();
    const ts = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
    logs.unshift({ cls, text, ts });
    if (logs.length > 300) logs.pop();
  }

  /* 启动全流程 */
  function start(project, fromIndex) {
    if (running) { UI.toast('已有任务在执行中', 'warn'); return; }
    logs.length = 0;
    addLog('l-info', `任务队列已创建 · 项目《${project.title}》`);
    addLog('l-info', `调用模型：${STORE.s.settings.llm} · 声音模型：${STORE.s.settings.tts}`);
    project.status = 'producing';
    running = { projectId: project.id, stageIndex: fromIndex || 0, taskIndex: -1, timer: null };
    project.stages = DATA.STAGES.map((s, i) => ({ key: s.key, state: i < (fromIndex || 0) ? 'done' : 'todo' }));
    STORE.update();
    step();
  }

  function stop() {
    if (running && running.timer) clearTimeout(running.timer);
    if (running) {
      const p = STORE.s.projects.find(x => x.id === running.projectId);
      if (p) { p.stages.forEach(s => { if (s.state === 'run') s.state = 'todo'; }); p.status = 'ready'; }
      addLog('l-warn', '任务已被用户中止');
    }
    running = null; STORE.update(); emit('stop');
  }

  function step() {
    if (!running) return;
    const p = STORE.s.projects.find(x => x.id === running.projectId);
    if (!p) { running = null; return; }
    const stage = DATA.STAGES[running.stageIndex];
    if (!stage) return finish(p);

    running.taskIndex++;
    p.stages[running.stageIndex].state = 'run';

    if (running.taskIndex >= stage.tasks.length) {
      // 阶段完成
      p.stages[running.stageIndex].state = 'done';
      addLog('l-ok', `✔ ${stage.n} ${stage.t} — 完成`);
      applyStageResult(p, stage.key);
      running.stageIndex++; running.taskIndex = -1;
      p.progress = Math.round((running.stageIndex / DATA.STAGES.length) * 100);
      STORE.update(); emit('stage');
      running.timer = setTimeout(step, 420);
      return;
    }

    const task = stage.tasks[running.taskIndex];
    addLog('l-run', `▶ ${stage.t} · ${task}`);
    STORE.update(); emit('task');
    running.timer = setTimeout(() => {
      addLog('l-ok', `  └ ${task} ✓ ${extra(stage.key, running.taskIndex)}`);
      emit('task');
      step();
    }, 320 + Math.random() * 460);
  }

  function extra(key, i) {
    const m = {
      upload: ['4 个文件校验通过', '抽取 86,420 字', '识别图内文字 312 处', '切分 12 章 / 148 段', '向量索引 1,486 条'],
      read: ['摘要 1,200 字', '核心论点 7 条', '金句 32 条', '受众画像 4 类', '匹配热点话题 5 个', '可传播单元 46 个'],
      strategy: ['8 个平台评分完成', '内容矩阵 32 支', '排期跨度 21 天', 'CTA 方案 6 套'],
      script: ['开场 20 条', 'Hook 20 条', '标题 20 条', '脚本 14 篇 / 7 类', '合规风险 0 项'],
      persona: ['人格模型载入成功', '改写 14 篇', '口头禅植入 26 处', '一致性 96.4%'],
      avatar: ['音频 14 段 / 共 9分12秒', '口型对齐误差 <40ms', '表情关键帧 1,240', '手势节拍 386', '渲染 30 支 · 1080P'],
      package: ['字幕 1,860 行', '书封插入 30 处', '大字动效 240 处', 'B-roll 匹配 96 段', 'BGM 已平衡 -14 LUFS', '片头片尾已套用'],
      export: ['转码 3 种分辨率', '字幕样式 7 套', '封面 30 张', '话题标签已写入', '已推送至排程']
    };
    return (m[key] && m[key][i]) ? '（' + m[key][i] + '）' : '';
  }

  /* 每个阶段产出实际数据 */
  function applyStageResult(p, key) {
    if (key === 'read') {
      if (p.source && p.source.kind === 'profile') {
        // 已汇入完整书籍档案：直接采用，不覆写
        addLog('l-ok', `  └ 使用上传的书籍档案：论点 ${p.themes.length} 条 / 金句 ${p.quoteSrc.length} 条（含出处）`);
      } else if (p.parsed && p.parsed.quotes.length) {
        // 仅上传内文：用本机规则抽取的结果，并明确标示
        p.summary = p.summary || `本书共 ${p.parsed.chapters.length} 个章节、约 ${p.parsed.chars.toLocaleString()} 字。以下内容由本机规则从上传内文中抽取，未经 AI 理解，仅供流程验证。`;
        p.themes = (p.themes && p.themes.length) ? p.themes : p.parsed.chapters.slice(0, 5);
        p.quoteSrc = p.parsed.quotes.map(t => ({ text: t, chapter: null, page: null }));
        p.quotes = p.parsed.quotes;
        const s = DATA.SEED_BOOKS[0];
        p.audiences = p.audiences || s.audiences; p.pains = p.pains || s.pains; p.hots = p.hots || s.hots;
        addLog('l-warn', '  └ 未提供书籍档案，改用内文本地规则抽取（非 AI 阅读）');
      } else if (!p.summary) {
        const s = DATA.SEED_BOOKS.find(b => b.title === p.title) || DATA.SEED_BOOKS[0];
        p.summary = `本书围绕「${(p.tags && p.tags[0]) || p.category}」展开，提出一套可落地的方法论，并用大量案例说明如何在真实场景中使用。`;
        p.themes = s.themes; p.quotes = s.quotes;
        p.audiences = s.audiences; p.pains = s.pains; p.hots = s.hots;
        addLog('l-warn', '  └ 未上传任何资料，本阶段使用内建演示数据');
      }
    }
    if (key === 'strategy') p.strategy = DATA.genStrategy(p);
    if (key === 'script') {
      p.titles = DATA.genTitles(p, 20); p.hooks = DATA.genHooks(p, 20);
      p.opens = DATA.genOpens(p); p.scripts = DATA.genScripts(p, 14);
    }
    if (key === 'persona' && STORE.s.settings.autoPersona) p.scripts = p.scripts.map(DATA.applyPersona);
    if (key === 'avatar') p.videos = DATA.genVideos(p, p.scripts);
    if (key === 'export') {
      p.videos = p.videos.concat(DATA.genVideos(p, DATA.genScripts(p, 16)));
      (p.videos || []).slice(0, 12).forEach(v => STORE.s.schedule.push({
        id: DATA.uid('sc'), projectId: p.id, bookTitle: p.title, videoId: v.id, title: v.title,
        platform: v.platformName, color: v.color, day: v.day, hour: [8, 12, 18, 20, 21][Math.floor(Math.random() * 5)], status: '待发布'
      }));
    }
  }

  function finish(p) {
    p.status = 'done'; p.progress = 100;
    addLog('l-ok', `🎉 全流程完成：共产出 ${p.videos.length} 支视频 / ${p.titles.length} 个标题 / ${p.hooks.length} 个 Hook`);
    STORE.s.settings.quotaUsed = Math.min(STORE.s.settings.quotaTotal, STORE.s.settings.quotaUsed + p.videos.length);
    STORE.log('ok', `《${p.title}》全流程生产完成，产出 ${p.videos.length} 支视频`);
    running = null; STORE.update(); emit('finish');
    UI.toast(`《${p.title}》生产完成，共 ${p.videos.length} 支视频`, 'ok');
  }

  return { start, stop, on, snapshot, get logs() { return logs; }, get isRunning() { return !!running; } };
})();

**在做什么**：像一个读得很快的编辑通读全书，找出这本书到底在讲什么、哪几句最有传播力、该讲给谁听。

**在做什么**：不是写一篇，是一次写几十条备选。

**在做什么**：AI 写的稿子谁用都一样，一股机器味。这一步按本人平时的说话方式重写一遍。

# 常见问题

## 使用

**跑完一本书要多久？**
演示环境约 15 秒。真实环境从上传到 30 支成片，预计 2–4 小时（多支视频并发渲染）。

**只传书封、不传 PDF 内文行吗？**
能跑，但内容会比较空——AI 没读到书，只能从书名和简介发挥。**想要好效果，内文是最重要的一份资料。**

**生成的稿子能改吗？**
能。每条标题、Hook、脚本都可以人工编辑、锁定、或者只重生成这一条，不影响其他内容。

**一本书能出多少条？**
一次跑完是 30 支视频 + 20 标题 + 20 Hook + 14 篇脚本。不够可以再跑，每次角度和措辞都不一样。

**换一本新书，人格要重新设置吗？**
不用。人格模型是跟人走的，不是跟书走的。设一次，之后所有书都用同一套。

## 内容质量

**AI 会不会写错书里的内容、或者编造？**
系统强制要求每条金句必须能回溯到原文的具体页码，点开就能看出处。做不到溯源的内容不会被采用。

**生成的内容会不会跟别人撞车？**
每次生成都会换角度和措辞。但同类书的通用观点难免相似，所以数据分析里有「角度表现排行」——表现差的角度会自动降低下一轮的生成比重。

**为什么有的稿子被退回了？**
两种情况：一是「像不像本人」评分低于 90 分；二是命中了合规检查（绝对化用语、未证实的数据、医疗或投资承诺）。两种都会显示具体是哪一段有问题。

## 发布

**生成完会自动发出去吗？**
**不会。** 所有内容默认需要人工确认才发布。系统设置里有「生成后自动发布」开关，建议一直保持关闭——发布是收不回来的动作。

**为什么有的视频显示「待审核」？**
说明它还没走完审核流程。在发布排程里点确认就会进入发布队列。

**现在按「发布」是真的发出去了吗？**
**不是。** 目前只是把状态改成已发布，方便你验证流程。要真的送到平台，每个平台都要申请开发者帐号、通过应用审核、完成帐号授权，而且必须由服务端呼叫接口——浏览器做不到。
另外要有心理准备：**不是每个平台都能一键发布**。YouTube Shorts 门槛最低；抖音、TikTok、Meta 系需要审核；**小红书目前没有公开的发布接口**，只能人工上传。


**日历上怎么分辨发了没发？**
实心色块＝待发布，虚线外框加 ✓＝已发布；每格右上角还有「已发布/总数」。点任一条目可以预览、改标题、改平台与时间、立即发布或移出排程。

**平台会不会因为是 AI 生成而限流？**
有这个风险。所以系统默认在成片里加 AI 生成标识（很多平台和地区也强制要求），并且建议提高原创解读的比重、多平台分散发布。

## 数据

**数据分析里的数字是真的吗？**

**数据有什么用？**

演示版本存在你自己的浏览器里，换电脑就没了。系统设置里可以「重置演示数据」恢复初始状态。

# 名词解释

短视频行业的黑话不少，这里只解释系统里会出现的。

## 内容相关

**Hook（钩子）**
视频前 3 秒说的那句话。决定观众是继续看还是划走，是整支视频最关键的部分。所以系统一次生成 20 个备选。

**CTA**
Call To Action，行动引导。就是结尾那句「点击左下角购书链接」「评论区扣书单」。

**开场白**
Hook 之后的第一句自我介绍或场景引入，比如「我是⋯⋯，今天聊一本刚拿到的新书」。

**金句**
书里最适合单独拎出来传播的句子。通常短、有张力、能引起共鸣。

**脚本角度**
同一本书的七种讲法：故事版、痛点版、金句版、商业版、知识版、书摘版、作者故事版。**同一个观点换角度讲，能覆盖不同的人群。**

**分镜表**
一支视频拆成几个镜头，每个镜头讲什么、怎么运镜、画面上出现什么、持续几秒。点开任意脚本就能看到。

## 制作相关

**口型同步（Lip-sync）**
数字人说话时嘴型和声音对得上。误差超过 60 毫秒人眼就能看出「假」，系统控制在 40 毫秒以内。

**B-roll**
穿插在人物画面之间的辅助镜头（空镜、素材画面）。作用是让视频不那么单调，也方便遮掉剪辑点。

**人格一致性评分**
系统给改写后的稿子打分，衡量「像不像本人说的」。低于 90 分会被退回重写。

## 数据相关

**完播率**
看完整支视频的人占播放量的比例。短视频最重要的指标，直接影响平台推不推你。

**转化漏斗**
从曝光 → 播放 → 看完一半 → 互动 → 点击书链 → 下单，每一层会掉多少人。看哪一层掉得最狠，就知道该优化哪里。

**适配度评分**
系统判断这本书的内容在某个平台上表现会有多好，0–100 分。分数低的平台可以少做或不做。

**响度平衡（LUFS）**
让所有视频的音量听起来一样大，不会这支很吵下一支听不见。行业标准是 -14 LUFS。

  /* ---- 极简 Markdown 渲染 ---- */
  function render(md) {
    const lines = md.trim().split('\n');
    let out = '', inList = false, inOl = false, inCode = false, inTable = false;
    const inline = s => UI.esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');

    const closeList = () => { if (inList) { out += '</ul>'; inList = false; } if (inOl) { out += '</ol>'; inOl = false; } };
    const closeTable = () => { if (inTable) { out += '</tbody></table>'; inTable = false; } };

    for (let i = 0; i < lines.length; i++) {
      const L = lines[i];
      if (/^```/.test(L)) {
        if (!inCode) { closeList(); closeTable(); out += '<pre style="background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;margin:12px 0"><code style="background:none;color:var(--txt-2);font-size:12px;line-height:1.7;white-space:pre">'; inCode = true; }
        else { out += '</code></pre>'; inCode = false; }
        continue;
      }
      if (inCode) { out += UI.esc(L) + '\n'; continue; }

      if (/^\|/.test(L)) {
        const cells = L.split('|').slice(1, -1).map(c => c.trim());
        if (/^\|[\s:\-|]+\|$/.test(L)) continue;
        if (!inTable) { closeList(); out += '<table><thead><tr>' + cells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'; inTable = true; }
        else out += '<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
        continue;
      } else closeTable();

      if (/^### /.test(L)) { closeList(); out += `<h3>${inline(L.slice(4))}</h3>`; }
      else if (/^## /.test(L)) { closeList(); out += `<h2>${inline(L.slice(3))}</h2>`; }
      else if (/^# /.test(L)) { closeList(); out += `<h1>${inline(L.slice(2))}</h1>`; }
      else if (/^> /.test(L)) { closeList(); out += `<blockquote>${inline(L.slice(2))}</blockquote>`; }
      else if (/^---+$/.test(L)) { closeList(); out += '<hr>'; }
      else if (/^[-*] /.test(L)) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(L.slice(2))}</li>`; }
      else if (/^\d+\. /.test(L)) { if (!inOl) { out += '<ol>'; inOl = true; } out += `<li>${inline(L.replace(/^\d+\.\s/, ''))}</li>`; }
      else if (L.trim() === '') closeList();
      else { closeList(); out += `<p>${inline(L)}</p>`; }
    }
    closeList(); closeTable();
    return out;
  }

  return {

  }

  function timeAgo(t) {
    const d = Date.now() - t, h = Math.floor(d / 3600e3);
    if (h < 1) return Math.max(1, Math.floor(d / 60e3)) + ' 分钟前';
    if (h < 24) return h + ' 小时前';
    return Math.floor(h / 24) + ' 天前';
  }

  /* =======================================================
   * 书籍项目
   * ===================================================== */
  VIEWS.projects = function (q) {
    const filter = (q && q.f) || 'all';
    let list = STORE.s.projects;
    if (filter !== 'all') list = list.filter(p => p.status === filter);

    if (kw) list = list.filter(p => (p.title + p.author + p.publisher).indexOf(kw) >= 0);

    return `
    <div class="page-h">
      <div><div class="page-t">书籍项目</div><div class="page-d">每一本书都是一条独立的内容生产线</div></div>
      <div class="right">
        <div class="seg" data-seg="proj-filter">

          <div style="font-size:12px;color:var(--txt-3);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.summary || '尚未进行 AI 阅读，上传资料后即可自动生成解读。')}</div>
          <div class="book-stats">

  /* =======================================================
   * 生产流水线
   * ===================================================== */
  VIEWS.pipeline = function (q) {
    const p = STORE.current;
    if (!p) return '<div class="card empty">请先创建书籍项目</div>';
    const stages = p.stages || DATA.STAGES.map(s => ({ key: s.key, state: 'todo' }));
    const activeKey = (q && q.s) || (stages.find(s => s.state === 'run') || {}).key ||
      (stages.filter(s => s.state === 'done').slice(-1)[0] || {}).key || 'upload';
    const doneCount = stages.filter(s => s.state === 'done').length;
    const pct = Math.round(doneCount / DATA.STAGES.length * 100);

    return `
    <div class="page-h">
      <div><div class="page-t">生产流水线</div>
        <div class="page-d">当前项目：《${esc(p.title)}》 · ${esc(p.author)} 著 · ${esc(p.publisher)}</div></div>
      <div class="right">
        <select class="input" style="width:190px" data-act="switch-proj">
          ${STORE.s.projects.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>《${esc(x.title)}》</option>`).join('')}
        </select>
        ${ENGINE.isRunning
          ? `<button class="btn" data-act="stop-run">■ 中止任务</button>`
          : `<button class="btn btn-primary" data-act="run-all">▶ 一键跑完整流程</button>`}
      </div>
    </div>

    <div class="pipe">${DATA.STAGES.map((st, i) => {
      const s = stages[i] || { state: 'todo' };
      const ico = s.state === 'done' ? '<i class="dot g"></i>已完成' : s.state === 'run' ? '<i class="dot v"></i>执行中' : '<i class="dot"></i>待执行';
      return `<div class="pstep ${s.state} ${activeKey === st.key ? 'on' : ''}" data-act="sel-stage" data-k="${st.key}">
        <div class="pn">${st.n}</div><div class="pt">${st.t}</div><div class="ps">${ico}</div></div>`;
    }).join('')}</div>

    <div class="grid g-2-1" style="margin-top:16px">
      <div>${stagePanel(p, activeKey)}</div>
      <div class="card">
        <div class="card-h"><div class="card-t">总体进度</div></div>
        <div style="display:flex;gap:18px;align-items:center">
          ${CHART.ring(pct)}
          <div style="flex:1;font-size:12.5px;line-height:2">
            <div>已完成阶段 <b>${doneCount}/8</b></div>
            <div>产出脚本 <b>${(p.scripts || []).length}</b> 篇</div>
            <div>产出视频 <b>${(p.videos || []).length}</b> 支</div>
            <div>预计剩余 <b>${ENGINE.isRunning ? Math.max(1, (8 - doneCount) * 3) + ' 分钟' : '—'}</b></div>
          </div>

          <div class="right"><span class="tag ${ENGINE.isRunning ? 'g' : ''}"><i class="dot ${ENGINE.isRunning ? 'g' : ''}"></i>${ENGINE.isRunning ? '运行中' : '空闲'}</span></div></div>
        <div class="log" id="run-log">${ENGINE.logs.length
          ? ENGINE.logs.map(l => `<div class="${l.cls}">[${l.ts}] ${esc(l.text)}</div>`).join('')

        ${ms.length ? `<div style="margin-top:14px">${ms.map(m => `

    const days = new Date(y, m + 1, 0).getDate();
    const filter = (q && q.p) || 'all';

    if (filter !== 'all') sc = sc.filter(x => x.platform === filter);

    let cells = '';

    for (let d = 1; d <= days; d++) {
      const all = sc.filter(x => x.day === d);

    const upcoming = STORE.s.schedule.filter(x => x.status === '待发布').slice(0, 8);
    const plats = ['all'].concat(DATA.PLATFORMS.map(p => p.name));

    const AUTHED = { tiktok: 1, reels: 1, shorts: 1, fb: 1, threads: 1, xhs: 1 };

    return `
    <div class="page-h">
      <div><div class="page-t">发布排程</div>
        <div class="page-d">${y} 年 ${m + 1} 月 · 共 ${STORE.s.schedule.length} 条排期，其中待发布 ${STORE.s.schedule.filter(x => x.status === '待发布').length} 条</div></div>
      <div class="right">
        <select class="input" style="width:150px" data-act="plat-filter">
          ${plats.map(x => `<option value="${x}" ${filter === x ? 'selected' : ''}>${x === 'all' ? '全部平台' : x}</option>`).join('')}
        </select>
        <button class="btn btn-primary" data-act="publish-all">✓ 批量确认发布</button>
      </div>
    </div>

    <div class="grid g-2-1">
      <div class="card">
        <div class="card-h"><div><div class="card-t">发布日历</div>
            <div class="card-s">点任一条目可预览与编辑，点空白处看整天清单</div></div>
          <div class="right cal-legend"><span><i class="lg-p"></i>待发布</span><span><i class="lg-d"></i>✓ 已发布</span></div></div>
        <div class="cal" style="margin-bottom:8px">${['日', '一', '二', '三', '四', '五', '六'].map(d => `<div class="cal-h">${d}</div>`).join('')}</div>
        <div class="cal">${cells}</div>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-h"><div class="card-t">平台账号</div></div>
          ${DATA.PLATFORMS.map((p, i) => `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)">
            <i style="width:9px;height:9px;border-radius:3px;background:${p.color}"></i>
            <span style="flex:1;font-size:13px">${p.name}</span>
            ${AUTHED[p.key] ? '<span class="tag g"><i class="dot g"></i>已授权</span>' : '<button class="btn btn-sm" data-act="auth-plat" data-n="' + p.name + '">去授权</button>'}
          </div>`).join('')}
        </div>
        <div class="card">
          <div class="card-h"><div class="card-t">即将发布</div></div>
          ${upcoming.length ? upcoming.map(x => `
            <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer"
                 data-act="open-sched" data-id="${x.id}">
              <div style="width:3px;height:32px;border-radius:3px;background:${x.color}"></div>
              <div style="flex:1;min-width:0">
                <div style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}</div>
                <div style="font-size:11px;color:var(--txt-3)">《${esc(x.bookTitle)}》 · ${x.platform} · ${x.day} 日 ${x.hour}:00</div>
              </div>
              <button class="btn btn-sm" data-act="pub-one" data-id="${x.id}">发布</button>
            </div>`).join('') : '<div class="hint">暂无待发布内容</div>'}
        </div>
      </div>
    </div>`;
  };

  /* =======================================================
   * 数据分析
   * ===================================================== */
  VIEWS.analytics = function (q) {
    const scope = (q && q.sc) || 'all';
    const ps = STORE.s.projects;
    const videos = scope === 'all' ? ps.reduce((a, p) => a.concat(p.videos || []), []) : (STORE.current.videos || []);
    const an = DATA.genAnalytics(videos);
    /* 统计只能算已发布的：没发布的影片不可能有数据 */
    const live = videos.filter(v => v.status === '已发布');

    /* 按角度聚合 */
    const byAngle = DATA.ANGLES.map(a => {
      const vs = live.filter(v => v.angle === a.name);
      const views = vs.reduce((x, v) => x + v.views, 0);
      const watch = vs.length ? Math.round(vs.reduce((x, v) => x + v.watch, 0) / vs.length) : 0;
      return { name: a.name, color: a.color, value: views, count: vs.length, watch };
    }).filter(x => x.count).sort((a, b) => b.value - a.value);

    const top = live.slice().sort((a, b) => b.views - a.views).slice(0, 6);
    const totalLike = live.reduce((a, v) => a + v.like, 0);
    const totalShare = live.reduce((a, v) => a + v.share, 0);
    const totalClick = live.reduce((a, v) => a + v.click, 0);
    const avgWatch = live.length ? Math.round(live.reduce((a, v) => a + v.watch, 0) / live.length) : 0;

    return `
    <div class="page-h">
      <div><div class="page-t">数据分析</div>
        <div class="page-d">数据会自动回流到写稿引擎，高表现特征将提高后续生成权重</div></div>
      <div class="right">
        <div class="seg" data-seg="ana-scope">
          <button data-v="all" class="${scope === 'all' ? 'on' : ''}">全部项目</button>
          <button data-v="cur" class="${scope === 'cur' ? 'on' : ''}">《${esc(STORE.current.title)}》</button>
        </div>
        <button class="btn" data-act="export-report">⬇ 导出数据报告</button>
      </div>
    </div>

    <div class="explain" style="margin-bottom:16px;border-left-color:var(--cyan)">
      <div class="ex-r"><span class="ex-k">统计范围</span><span>共 <b>${videos.length}</b> 支影片，其中<b>已发布 ${live.length} 支</b>。
        以下数据只统计已发布的——没发布出去的影片不会有观看、按赞或点击。</span></div>
    </div>

    ${live.length ? '' : `<div class="card empty" style="margin-bottom:16px"><div class="big">◷</div>
      <div style="font-weight:650;color:var(--txt-2)">这个范围内还没有任何影片发布</div>
      <div style="margin-top:6px;font-size:12.5px">到「发布排程」发布之后，数据才会开始累积。</div></div>`}

    <div class="grid g4" style="margin-bottom:16px">
      ${[['总播放量', nf(an.total), '已发布 ' + live.length + ' 支', ''],
         ['平均完播率', avgWatch + '%', avgWatch >= 35 ? '优于均值' : '待优化', avgWatch < 30 ? 'down' : ''],
         ['总互动量', nf(totalLike + totalShare), '点赞 ' + nf(totalLike) + ' · 分享 ' + nf(totalShare), ''],
         ['书链点击', nf(totalClick), '点击率 ' + ((totalClick / (an.total || 1)) * 100).toFixed(2) + '%', '']]
        .map(x => `<div class="kpi"><div class="kpi-l">${x[0]}</div><div class="kpi-v">${x[1]}</div>
          <div class="kpi-d ${x[3]}">${x[2]}</div></div>`).join('')}
    </div>

    <div class="grid g-2-1" style="margin-bottom:16px">
      <div class="card">
        <div class="card-h"><div><div class="card-t">播放与互动趋势</div><div class="card-s">近 7 日</div></div></div>
        ${CHART.line(an.days)}
      </div>
      <div class="card">
        <div class="card-h"><div class="card-t">转化漏斗</div></div>
        ${CHART.funnel(an.funnel)}
        <div class="hint" style="margin-top:12px">从曝光到下单的整体转化率约 ${((an.funnel[5].v / an.funnel[0].v) * 100).toFixed(3)}%，主要流失在「播放 → 看完 50%」，建议优化前 3 秒 Hook。</div>
      </div>
    </div>

    <div class="grid g2" style="margin-bottom:16px">
      <div class="card">
        <div class="card-h"><div class="card-t">平台表现</div><div class="right"><span class="card-s">按总播放排序</span></div></div>
        ${CHART.bars(an.byPlat)}
      </div>
      <div class="card">
        <div class="card-h"><div class="card-t">脚本角度表现</div><div class="right"><span class="card-s">决定下一轮生成配比</span></div></div>
        <table><thead><tr><th>角度</th><th>支数</th><th>总播放</th><th>完播率</th></tr></thead><tbody>
          ${byAngle.map(a => `<tr><td><span class="tag" style="color:${a.color}">${a.name}</span></td>
            <td>${a.count}</td><td>${nf(a.value)}</td><td>${scoreBar(a.watch)}</td></tr>`).join('')}
        </tbody></table>
      </div>
    </div>

    <div class="card">
      <div class="card-h"><div><div class="card-t">表现最好的内容</div><div class="card-s">系统会自动分析这些内容的共性并写回提示词</div></div></div>
      <div class="vid-grid">${top.map(v => vidCard(v)).join('')}</div>
    </div>`;
  };

  /* =======================================================
   * 系统设置
   * ===================================================== */
  VIEWS.settings = function () {
    const st = STORE.s.settings;
    const sw = (k, t, d) => `<div class="setting-row"><div><div style="font-size:13.5px;font-weight:600">${t}</div>
      <div class="hint">${d}</div></div><div class="right"><div class="switch ${st[k] ? 'on' : ''}" data-act="toggle" data-k="${k}"></div></div></div>`;

    return `
    <div class="page-h">
      <div><div class="page-t">系统设置</div><div class="page-d">模型、自动化、合规与账户</div></div>
      <div class="right"><button class="btn" data-act="reset-demo">↺ 重置演示数据</button></div>
    </div>

    <div class="grid g2">
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-h"><div class="card-t">模型与引擎</div></div>
          <div class="field"><div class="label">内容理解与写稿模型</div>
            <select class="input" data-act="set" data-k="llm">
              ${[['claude-opus-5', 'Claude Opus 5（推荐 · 长上下文理解整本书）'],
                 ['claude-sonnet-5', 'Claude Sonnet 5（速度与成本平衡）'],
                 ['claude-haiku-4-5-20251001', 'Claude Haiku 4.5（批量清洗与分类）']]
                .map(o => `<option value="${o[0]}" ${st.llm === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
            </select>
            <div class="hint" style="margin-top:6px">建议：主链路用 Opus 5 保证理解质量，批量分类与去噪用 Haiku 降本。</div>
          </div>
          <div class="field"><div class="label">声音模型</div>
            <select class="input" data-act="set" data-k="tts">
              <option value="zhao-voice-v3" ${st.tts === 'zhao-voice-v3' ? 'selected' : ''}>主理人声音模型 v3（相似度 96.4%）</option>
              <option value="zhao-voice-v2">主理人声音模型 v2</option>
              <option value="generic">通用中文播报音</option>
            </select></div>
          <div class="field"><div class="label">数字人引擎</div>
            <input class="input" value="${esc(st.avatarEngine)}" data-act="set" data-k="avatarEngine"></div>
        </div>

        <div class="card">
          <div class="card-h"><div class="card-t">自动化开关</div></div>
          ${sw('autoPersona', '自动套用主理人人格', '写稿完成后自动进入人格改写，无需手动触发')}
          ${sw('autoSubtitle', '自动字幕', '自动断句并按平台样式生成字幕')}
          ${sw('autoBroll', '自动 B-roll 匹配', '按语义匹配空镜与素材，提升观感')}
          ${sw('autoBgm', '自动背景音乐', '按情绪匹配 BGM 并做响度平衡')}
          ${sw('autoPublish', '生成后自动发布', '关闭时所有视频需人工确认才会发布（建议保持关闭）')}
        </div>
      </div>

      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-h"><div class="card-t">合规与安全</div></div>
          ${sw('compliance', '内容合规校验', '拦截绝对化用语、未证实数据、医疗与投资承诺')}
          ${sw('watermark', 'AI 生成标识与水印', '按平台与地区法规要求，在成片中标注 AI 生成')}
          <div class="setting-row"><div><div style="font-size:13.5px;font-weight:600">书籍原文使用范围</div>
            <div class="hint">仅用于本项目生成，不进入任何模型训练集</div></div>
            <div class="right"><span class="tag g">已锁定</span></div></div>
          <div class="setting-row"><div><div style="font-size:13.5px;font-weight:600">声音与形象模型权限</div>
            <div class="hint">密钥托管，仅授权环境可调用，禁止导出</div></div>
            <div class="right"><span class="tag g">已加密</span></div></div>
        </div>

        <div class="card" style="margin-bottom:16px">
          <div class="card-h"><div class="card-t">用量与额度</div></div>
          <div style="display:flex;align-items:center;gap:18px">
            ${CHART.ring(Math.round(st.quotaUsed / st.quotaTotal * 100))}
            <div style="flex:1;font-size:13px;line-height:2.1">
              <div>本月已生成 <b>${st.quotaUsed}</b> / ${st.quotaTotal} 支</div>
              <div>预估本月成本 <b>内部版可见</b></div>
              <div>剩余额度 <b>${st.quotaTotal - st.quotaUsed}</b> 支</div>
            </div>
          </div>
          <div class="hint" style="margin-top:12px">成本按「大模型 + TTS + 数字人渲染 + 存储」综合估算，实际以供应商账单为准。</div>
        </div>

        <div class="card">
          <div class="card-h"><div class="card-t">成员与权限</div></div>
          <table><tbody>
            ${[['主', '主理人', '超级管理员', 'g'], ['助', '内容助理', '内容运营', 'v'], ['审', '张审核', '审核', 'c'], ['出', '远见文化', '只读', '']]
              .map(x => `<tr><td style="width:44px"><div class="avatar" style="width:30px;height:30px;font-size:12px;border-radius:9px">${x[0]}</div></td>
                <td><b>${x[1]}</b></td><td><span class="tag ${x[3]}">${x[2]}</span></td>
                <td style="text-align:right"><button class="btn btn-sm">管理</button></td></tr>`).join('')}
          </tbody></table>
        </div>
      </div>
    </div>`;
  };

  /* =======================================================
   * 文档中心
   * ===================================================== */
  VIEWS.docs = function (q) {
    const key = (q && q.d) || 'start';
    const doc = DOCS.list.find(d => d.key === key) || DOCS.list[0];

    /* 公开版不含项目文件，分组要跟着内容自动增减 */
    const groups = DOCS.groups.filter(g => DOCS.list.some(d => d.group === g.key));
    const groupBlock = g => {
      const items = DOCS.list.filter(d => d.group === g.key);
      return `
      <div style="margin-bottom:18px">
        <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:10px">
          <span style="font-size:13px;font-weight:700">${g.name}</span>
          <span class="hint">${g.sub}</span>
        </div>
        <div class="grid g4">
          ${items.map(d => `<div class="card doc-card ${d.key === key ? 'on' : ''}" data-act="sel-doc" data-k="${d.key}">
            <div class="dc-i">${d.icon}</div>
            <div class="dc-n">${d.name}</div>
            <div class="hint" style="margin-top:4px;line-height:1.6">${d.desc}</div></div>`).join('')}
        </div>
      </div>`;
    };

    return `
    <div class="page-h">
      <div><div class="page-t">文档中心</div><div class="page-d">${groups.length > 1
        ? '不知道怎么用，先看「快速上手」；要看方案，翻下面的项目文档'
        : '不知道怎么用，从「快速上手」开始'}</div></div>
      <div class="right"><button class="btn" data-act="dl-doc" data-k="${doc.key}">⬇ 导出为 Markdown</button>
        <button class="btn" data-act="print">🖨 打印 / 存为 PDF</button></div>
    </div>
    ${groups.map(groupBlock).join('')}
    <div class="card"><div class="doc" id="doc-body">${DOCS.render(doc.md)}</div></div>`;
  };

})();

      route: 'docs', sel: '.grid.g4',
      title: '不会用的时候来这里',
      text: '这里是<b>使用手册</b>：快速上手、八个步骤详解、常见问题、名词解释。<br><br>Hook、完播率、B-roll 这些短视频黑话，名词解释里都有说明。<br><br>每份都能导出 Markdown 或打印成 PDF。'
    },
    {
      center: true, route: 'dashboard',
      title: '就这些，去试试吧',
      text: '现在去<b>「生产流水线」</b>点<b>「一键跑完整流程」</b>，15 秒看完全过程。<br><br>右上角的 <b>◐</b> 可以切换深色与浅色显示。<br><br>想重看这份导览，随时点顶栏的<b>「导览」</b>。'
    }
  ];

  let idx = 0, mask = null, hole = null, pop = null, active = false;

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function build() {
    mask = el('div', 'tour-mask');
    hole = el('div', 'tour-hole');
    pop = el('div', 'tour-pop');
    mask.appendChild(hole);
    document.body.appendChild(mask);
    document.body.appendChild(pop);
    mask.addEventListener('click', e => { if (e.target === mask) next(); });
    document.addEventListener('keydown', onKey);
  }

  function onKey(e) {
    if (!active) return;
    if (e.key === 'Escape') stop();
    if (e.key === 'ArrowRight' || e.key === 'Enter') next();
    if (e.key === 'ArrowLeft') prev();
  }

  function render() {
    const s = STEPS[idx];
    if (s.route && typeof go === 'function') go(s.route);

    setTimeout(() => {
      const target = s.center ? null : document.querySelector(s.sel);
      const pad = 8;

      if (target) {
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
        setTimeout(() => place(target, pad), 220);
      } else {
        hole.style.opacity = '0';
        pop.className = 'tour-pop center';
        pop.style.left = ''; pop.style.top = '';
      }
      paint();
      if (window.I18N) I18N.apply(pop);
    }, s.route ? 60 : 0);
  }

  function place(target, pad) {
    const r = target.getBoundingClientRect();
    hole.style.opacity = '1';
    hole.style.left = (r.left - pad) + 'px';
    hole.style.top = (r.top - pad) + 'px';
    hole.style.width = (r.width + pad * 2) + 'px';
    hole.style.height = (r.height + pad * 2) + 'px';

    pop.className = 'tour-pop';
    const pw = 340, ph = pop.offsetHeight || 240;
    let left = r.left, top = r.bottom + 16;
    if (top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 16);
    if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
    if (left < 12) left = 12;
    if (top < 12) top = 12;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  function paint() {
    const s = STEPS[idx];
    pop.innerHTML = `
      <div class="tour-h">
        <span class="tour-n">${idx + 1} / ${STEPS.length}</span>
        <button class="icon-btn tour-x" data-t="stop" title="关闭导览">✕</button>
      </div>
      <div class="tour-t">${s.title}</div>
      <div class="tour-b">${s.text}</div>
      ${s.note ? `<div class="tour-note">${s.note}</div>` : ''}
      <div class="tour-dots">${STEPS.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('')}</div>
      <div class="tour-f">
        <button class="btn btn-sm btn-ghost" data-t="stop">跳过</button>
        <span style="flex:1"></span>
        ${idx > 0 ? '<button class="btn btn-sm" data-t="prev">上一步</button>' : ''}
        <button class="btn btn-sm btn-primary" data-t="next">${idx === STEPS.length - 1 ? '开始使用' : '下一步'}</button>
      </div>`;
    pop.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', ev => {
      ev.stopPropagation();
      const a = b.dataset.t;
      if (a === 'next') next(); else if (a === 'prev') prev(); else stop();
    }));
  }

  function next() { if (idx < STEPS.length - 1) { idx++; render(); } else stop(); }
  function prev() { if (idx > 0) { idx--; render(); } }

  function start(from) {
    if (active) return;
    active = true; idx = from || 0;
    if (!mask) build();
    mask.style.display = 'block'; pop.style.display = 'block';
    render();
  }

  function stop() {
    active = false;
    if (mask) mask.style.display = 'none';
    if (pop) pop.style.display = 'none';
    if (STORE && !STORE.s.settings.tourDone) { STORE.s.settings.tourDone = true; STORE.update(); }
  }

  return { start, stop, get active() { return active; }, steps: STEPS.length };
})();

  }

  const KB = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

  function readAsText(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error('读取失败'));
      r.readAsText(file, 'UTF-8');
    });

        </div>

        <div class="mv-person" id="mv-person">
          <svg viewBox="0 0 120 150" width="100%" height="100%">
            <ellipse cx="60" cy="150" rx="46" ry="42" fill="rgba(255,255,255,.92)"/>
            <rect x="52" y="72" width="16" height="20" rx="7" fill="#f0c9a8"/>
            <ellipse cx="60" cy="52" rx="30" ry="34" fill="#f7d7b8"/>
            <path d="M30 44 Q60 8 90 44 Q86 26 60 20 Q34 26 30 44Z" fill="#2f2a37"/>
            <ellipse id="mv-eyeL" cx="49" cy="52" rx="3.2" ry="2.6" fill="#2f2a37"/>
            <ellipse id="mv-eyeR" cx="71" cy="52" rx="3.2" ry="2.6" fill="#2f2a37"/>
            <path d="M43 43 Q49 40 55 43" stroke="#2f2a37" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M65 43 Q71 40 77 43" stroke="#2f2a37" stroke-width="2" fill="none" stroke-linecap="round"/>
            <ellipse id="mv-mouth" cx="60" cy="68" rx="6" ry="0.6" fill="#c2536a"/>
            <ellipse cx="41" cy="60" rx="4" ry="3" fill="rgba(240,140,140,.28)"/>
            <ellipse cx="79" cy="60" rx="4" ry="3" fill="rgba(240,140,140,.28)"/>
          </svg>
        </div>

        <div class="mv-kw" id="mv-kw"></div>

        <div class="mv-top">
          <span class="plat" style="position:static;background:${v.color}dd">${v.platformName}</span>
          <span style="display:flex;gap:6px;align-items:center">
            <button id="pv-mute" class="mv-btn" title="声音开关">🔊</button>
            <span class="dur" style="position:static" id="pv-time">0:00 / ${mmss(v.duration)}</span>
          </span>
        </div>

        <div class="mv-bottom">
          <div id="mv-shot" class="mv-meta">镜头 1/${shots.length} · ${first ? first.t : ''}</div>
          <div id="mv-sub" class="mv-sub">${esc(first ? first.txt : capFallback)}</div>
          <div id="mv-vis" class="mv-meta" style="margin-top:6px">${first ? first.cam + '　|　' + first.vis : ''}</div>
          <div class="mv-cta" id="mv-cta">📖 ${esc((p && p.title) || '本书')} · 点击左下角购书连结</div>
          <div class="mv-sign"><div class="avatar" style="width:24px;height:24px;font-size:12px;border-radius:7px">${esc(STORE.s.account.initial || STORE.s.account.name.slice(0,1))}</div>
            <span>${esc(STORE.s.account.name)} · AI 生成</span></div>
          <div class="mv-track"><div id="pv-bar"></div></div>
        </div>

        <button id="pv-play" class="mv-play" title="播放 / 暂停">▶</button>
      </div>
      <div id="pv-novoice" class="hint" style="display:none;margin-top:8px;color:var(--amber)">
        这个浏览器没有中文语音，将只播放画面。Chrome 与 Edge 通常内建。</div>`;
  }

  function shotList(shots) {
    return `<div id="pv-shots">${shots.map((sh, i) => `
      <div class="shot ${i === 0 ? 'on' : ''}">
        <div class="shot-n">${String(i + 1).padStart(2, '0')}</div>
        <div><div style="font-size:14px;color:var(--violet-2);font-weight:650;margin-bottom:3px">${sh.t}</div>
          <div class="shot-t">${esc(sh.txt)}</div>
          <div class="shot-d"><span>🎥 ${sh.cam}</span><span>🖼 ${sh.vis}</span><span>⏱ ${sh.dur}</span></div></div>
      </div>`).join('')}</div>`;
  }

  function schedModal(id) {
    const it = STORE.s.schedule.find(x => x.id === id);
    if (!it) return;
    const p = STORE.s.projects.find(x => x.id === it.projectId) || STORE.current;
    const v = (p.videos || []).find(x => x.id === it.videoId);
    if (!v) { toast('找不到对应的成片，可能已被重置', 'warn'); return; }
    const script = (p.scripts || []).find(s => s.id === v.scriptId) || (p.scripts || [])[0];
    const shots = script ? DATA.genShots(script, p) : [];
    const days = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
    const pub = it.status === '已发布';

    modal('排程项目 · 预览与编辑', `
      <div style="display:flex;gap:22px;flex-wrap:wrap">
        <div style="flex:0 0 220px">
          ${phoneFrame(v, shots, v.caption, p)}
          <div class="hint" style="margin-top:9px;text-align:center">分镜预览 · 非真实影片</div>
        </div>
        <div style="flex:1;min-width:260px">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
            ${UI.statusTag(it.status)}
            <span class="tag">《${esc(p.title)}》</span><span class="tag">${v.angle}</span><span class="tag">${v.duration}s</span>
          </div>

          <div class="field"><div class="label">影片标题（发布时使用）</div>
            <textarea class="input" id="sc-title" style="min-height:62px">${esc(it.title)}</textarea></div>

          <div class="row2">
            <div class="field"><div class="label">发布平台</div>
              <select class="input" id="sc-plat">
                ${DATA.PLATFORMS.map(x => `<option value="${x.name}" ${x.name === it.platform ? 'selected' : ''}>${x.name}</option>`).join('')}
              </select></div>
            <div class="field"><div class="label">发布日期</div>
              <select class="input" id="sc-day">
                ${Array.from({ length: days }, (_, i) => i + 1).map(d => `<option value="${d}" ${d === it.day ? 'selected' : ''}>${d} 日</option>`).join('')}
              </select></div>
          </div>
          <div class="field"><div class="label">发布时间</div>
            <select class="input" id="sc-hour">
              ${[6, 7, 8, 9, 12, 13, 17, 18, 19, 20, 21, 22].map(h => `<option value="${h}" ${h === it.hour ? 'selected' : ''}>${h}:00</option>`).join('')}
            </select></div>

          <div class="field"><div class="label">话题标签</div>
            <div class="chip-list">${(p.hots || []).map(h => `<span class="tag c">${esc(h)}</span>`).join('')}</div></div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
            <button class="btn btn-sm" data-modal-act="sched-save" data-id="${it.id}">储存变更</button>
            <button class="btn btn-sm" data-modal-act="open-script" data-id="${script ? script.id : ''}">查看完整脚本</button>
            ${pub ? `<button class="btn btn-sm" data-modal-act="sched-unpub" data-id="${it.id}">撤回为待发布</button>`
              : `<button class="btn btn-sm btn-primary" data-modal-act="sched-pub" data-id="${it.id}">立即发布</button>`}
            <button class="btn btn-sm" data-modal-act="sched-del" data-id="${it.id}">移出排程</button>
          </div>
          ${pub ? `<div class="hint" style="margin-top:10px">这条已标记为已发布。演示环境不会真的送到平台——真实发布需由服务端对接各平台开放接口，并完成帐号授权。</div>` : ''}
        </div>
      </div>
      ${shots.length ? `<div class="label" style="margin-top:20px">分镜表（播放时同步高亮）</div>${shotList(shots)}` : ''}`, '', true);

    pvInit(v, shots);
  }

  function dayModal(d) {
    const items = STORE.s.schedule.filter(x => x.day === d);
    const pending = items.filter(x => x.status === '待发布').length;
    modal(`${new Date().getMonth() + 1} 月 ${d} 日 · 排期明细`,
      items.length ? items.map(x => `
        <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)">
          <div style="width:3px;height:36px;border-radius:3px;background:${x.color}"></div>
          <div style="flex:1;min-width:0;cursor:pointer" data-modal-act="open-sched" data-id="${x.id}">
            <div style="font-size:15px;font-weight:620">${esc(x.title)}</div>
            <div style="font-size:13.5px;color:var(--txt-3)">《${esc(x.bookTitle)}》 · ${x.platform} · ${x.hour}:00</div></div>
          ${UI.statusTag(x.status)}
          <button class="btn btn-sm" data-modal-act="open-sched" data-id="${x.id}">预览 / 编辑</button>
          ${x.status !== '待发布' ? ''
            : x.platform === 'Instagram Reels'
              ? `<button class="btn btn-sm btn-primary" data-modal-act="ig-open" data-id="${x.id}">真实发布</button>`
              : x.platform === 'YouTube Shorts'
                ? `<button class="btn btn-sm btn-primary" data-modal-act="yt-open" data-id="${x.id}">真实上传</button>`
              : `<button class="btn btn-sm btn-primary" data-modal-act="pub-one" data-id="${x.id}" data-day="${d}">发布</button>`}
        </div>`).join('')
        + (pending > 1 ? `<div style="margin-top:14px;text-align:right">
             <button class="btn btn-sm" data-modal-act="pub-day" data-day="${d}">发布这一天的全部 ${pending} 条</button></div>` : '')
        : '<div class="empty">这一天没有排期</div>');
  }

  function exportAll() {
    const p = STORE.current;
    let out = `《${p.title}》内容资产包\n作者：${p.author}　出版社：${p.publisher}\n导出时间：${new Date().toLocaleString('zh-CN')}\n${'='.repeat(56)}\n\n`;
    out += `【全书摘要】\n${p.summary || '（未生成）'}\n\n`;
    out += `【核心论点】\n${(p.themes || []).map((t, i) => `${i + 1}. ${t}`).join('\n')}\n\n`;
    out += `【金句】\n${(p.quotes || []).map((q, i) => `${i + 1}. ${q}`).join('\n')}\n\n`;
    out += `【标题 ${(p.titles || []).length} 个】\n${(p.titles || []).map(t => `${t.n}. ${t.text}  [${t.tag} · ${t.score}分]`).join('\n')}\n\n`;
    out += `【Hook ${(p.hooks || []).length} 个】\n${(p.hooks || []).map(t => `${t.n}. ${t.text}  [${t.tag} · ${t.score}分]`).join('\n')}\n\n`;
    out += `【开场白 ${(p.opens || []).length} 个】\n${(p.opens || []).map(t => `${t.n}. ${t.text}`).join('\n')}\n\n`;
    out += `【脚本 ${(p.scripts || []).length} 篇】\n`;
    (p.scripts || []).forEach(s => {
      out += `\n${'-'.repeat(56)}\n#${s.n} 【${s.angleName}】${s.platformName} · ${s.duration}s\n标题：${s.title}\nHook：${s.hook}\n正文：\n${s.body}\nCTA：${s.cta}\n`;
    });
    download(`${p.title}_内容资产包.txt`, out);
  }

  function exportReport() {
    const ps = STORE.s.projects;
    const videos = ps.reduce((a, p) => a.concat(p.videos || []), []);
    const an = DATA.genAnalytics(videos);
    let out = `AI 数字人短视频数据报告\n生成时间：${new Date().toLocaleString('zh-CN')}\n${'='.repeat(56)}\n\n`;
    out += `项目数：${ps.length}　视频数：${videos.length}　总播放：${an.total}\n\n【平台表现】\n`;
    an.byPlat.forEach(p => out += `${p.name}：${p.count} 支 · 播放 ${p.value}\n`);
    out += `\n【转化漏斗】\n`;
    an.funnel.forEach(f => out += `${f.k}：${f.v}\n`);
    out += `\n【单支明细】\n`;
    videos.forEach(v => out += `${v.platformName}\t${v.angle}\t播放${v.views}\t完播${v.watch}%\t${v.title}\n`);
    download('数据报告.txt', out);
  }

  /* ---------------- 引擎事件 ---------------- */
  let logTimer = null;
  ENGINE.on((evt) => {
    // 暂停时就算人在别页也要提示一声，否则会以为流程自己停住了
    if (evt === 'pause') toast('流程已暂停，请回「一键生成短视频」确认设定', 'warn');
    if (route !== 'pipeline') { if (evt === 'finish' || evt === 'stage' || evt === 'pause') render(); return; }
    // 只刷新日志与步骤条，避免整页重绘打断滚动
    const logEl = $('#run-log');
    if (logEl) {
      logEl.innerHTML = ENGINE.logs.map(l => `<div class="${l.cls}">[${l.ts}] ${esc(l.text)}</div>`).join('');
      if (window.I18N) I18N.apply(logEl);
    }
    if (evt === 'stage' || evt === 'finish' || evt === 'stop' || evt === 'pause' || evt === 'resume') {
      clearTimeout(logTimer);
      logTimer = setTimeout(render, 60);
    }
  });

  /* ---------------- 启动 ---------------- */
  // 未手动切换过时不写 data-theme，让页面跟随系统/查看者的浅色深色偏好
  if (STORE.s.settings.themeSet) document.documentElement.setAttribute('data-theme', STORE.s.settings.theme);
  render();
  I18N.set('hant');   // 全站固定台湾繁体中文，不提供切换
  resumePendingVideos();   // 接回上次没查完的影片生成，否则重整后会永远卡在「生成中」

  // 首次进入自动播放导览；看过之后只在点「导览」时出现
  if (!STORE.s.settings.tourDone) setTimeout(() => TOUR.start(0), 500);
  else setTimeout(() => toast('欢迎回来 · 需要重看用法请点顶栏「导览」', 'ok'), 700);
})();

function setVideoDuration(videoId, value, notify) {
  const duration = clampDuration(value);
  let hit = null;
  (STORE.s.projects || []).forEach(p => (p.videos || []).forEach(v => {
    if (v.id === videoId) hit = { p, v };
  }));
  if (!hit) return;
  hit.v.duration = duration;
  const script = (hit.p.scripts || []).find(s => s.id === hit.v.scriptId);
  if (script) script.duration = duration;
  STORE.update();
  if (notify) {
    render();
    UI.toast(`片长已设为 ${duration} 秒`, 'ok');
  }
}

function defaultVideoMode() {
  const mode = window.STORE && STORE.s && STORE.s.persona ? STORE.s.persona.videoMode : 'single';
  return mode === 'conversation' ? 'conversation' : 'single';
}

function setVideoFormat(videoId, value, notify) {
  const format = value === 'conversation' ? 'conversation' : 'single';
  let hit = null;
  (STORE.s.projects || []).forEach(p => (p.videos || []).forEach(v => {
    if (v.id === videoId) hit = { p, v };
  }));
  if (!hit) return;
  hit.v.format = format;
  STORE.update();
  if (notify) {
    render();
    UI.toast(format === 'conversation' ? '已改为访谈式对谈' : '已改为单人口播', 'ok');
  }
}


</script>
</body>
</html>

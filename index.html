          <div style="font-size:14.5px;font-weight:700;margin-top:6px">上传我的照片</div>
          <div style="font-size:12.5px;color:var(--txt-3);margin-top:3px;line-height:1.5">做一个<br>专属自己的数字人</div>
        </div>
        <div class="hg-avatar" data-act="hg-gen-avatar-btn"
            style="border:2px dashed var(--cyan);border-radius:14px;padding:8px;cursor:pointer;text-align:center;
                   display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;
                   background:rgba(34,211,238,.07)">
          <div style="font-size:26px;color:var(--cyan)">✨</div>
          <div style="font-size:14.5px;font-weight:700;margin-top:6px">用提示词生成</div>
          <div style="font-size:12.5px;color:var(--txt-3);margin-top:3px;line-height:1.5">描述长相<br>直接造一个形象</div>
        </div>
        ${hgLib().map(it => {
          const on = HG.mode === 'image' && HG.assetId === it.assetId;
          return `<div class="hg-avatar ${on ? 'on' : ''}" data-act="hg-lib-use" data-id="${esc(it.id)}"
            style="position:relative;border:2px solid ${on ? 'var(--violet-2)' : 'var(--line)'};border-radius:14px;padding:8px;cursor:pointer;text-align:center">
            <span data-act="hg-lib-del" data-id="${esc(it.id)}" title="从形象库移除"
              style="position:absolute;top:4px;right:6px;z-index:2;width:22px;height:22px;line-height:20px;border-radius:50%;
                     background:rgba(0,0,0,.55);color:#fff;font-size:15px;cursor:pointer">×</span>
            ${it.url ? `<img src="${esc(it.url)}" style="width:100%;height:112px;object-fit:cover;border-radius:10px;margin-bottom:6px">` : ''}
            <div style="font-size:14px;font-weight:600">${esc(it.name)}</div>
            <div style="font-size:12.5px;color:var(--txt-3)">${it.source === 'prompt' ? '提示词生成' : '我上传的'}${on ? ' · 使用中' : ''}</div>
          </div>`;
        }).join('')}
        ${HG.avatars.slice(0, 10).map(a => `<div class="hg-avatar ${HG.mode === 'avatar' && a.id === HG.avatarId ? 'on' : ''}" data-act="hg-pick-avatar" data-id="${esc(a.id)}"
            style="border:2px solid ${HG.mode === 'avatar' && a.id === HG.avatarId ? 'var(--violet-2)' : 'var(--line)'};border-radius:14px;padding:8px;cursor:pointer;text-align:center">
          ${a.preview ? `<img src="${esc(a.preview)}" style="width:100%;height:112px;object-fit:cover;border-radius:10px;margin-bottom:6px">` : ''}
          <div style="font-size:14px;font-weight:600">${esc(a.name || a.id)}</div>
          <div style="font-size:12.5px;color:var(--txt-3)">${a.own ? '你帐号里的' : '官方形象'}${a.gender ? ' · ' + esc(a.gender) : ''}</div>
        </div>`).join('')}
      </div>
      ${!HG.avatars.length
        ? `<div class="hint" style="color:var(--amber);margin-bottom:8px">现成形象清单目前是空的（服务连不上，或帐号里没有建好的形象）。
             <b>上传自己的照片</b>不受影响，直接点上面那一格就行。</div>` : ''}
      <div class="hint">照片要<b>正脸、五官完整、光线均匀</b>——太贴近局部（比如只有眼睛）的裁切照会被判定「没侦测到脸」。上传免费，花钱的是之后「生成影片」那一步。</div>`;
  }

  /* ============================================================
   * 用提示词生成形象
   *
   * 为什么要有这个：以前要有专属数字人，只能上传自己的照片。想要一个
   * 「不是真人、但长这样」的主持人就没辙。这里把已经在跑的文生图接上，
   * 让人用一句话描述就能造一个形象出来。
   *
   * 生成的图会先送去数字人服务当素材（走 ?url= 由服务端代取，避开跨域），
   * 拿到 assetId 之后，跟上传照片走的是同一条路——所以后面的口播生成
   * 完全不用改，嘴型一样会对上稿子。
   * ========================================================== */
  const GA = { url: null, busy: false };

  /* 生成记录。
   * 每一张图都是真的花过钱的，但弹窗一关就找不回来——手滑点到旁边空白
   * 就没了，使用者回报过。所以生成成功当下立刻存起来，重开弹窗还看得到，
   * 点一下就能换回那张。 */
  const GA_HISTORY_MAX = 8;

  function gaHistory() {
    const p = STORE.s.persona;
    if (!Array.isArray(p.gaHistory)) p.gaHistory = [];
    return p.gaHistory;
  }

  function gaHistoryAdd(url, desc, sceneKey) {
    if (!url) return;
    const h = gaHistory();
    if (h.some(x => x.url === url)) return;
    const sc = GA_SCENES.find(x => x[0] === sceneKey);
    h.unshift({ url, desc: (desc || '').slice(0, 20), scene: sc ? sc[1] : '', at: Date.now() });
    if (h.length > GA_HISTORY_MAX) h.length = GA_HISTORY_MAX;
    STORE.update();
  }

  function gaHistoryHtml() {
    const h = gaHistory();
    if (!h.length) return '';
    return `<div class="label" style="margin-top:16px">生成记录
        <span class="hint" style="margin-left:8px;font-weight:400">点一下换回那张。只留最近 ${GA_HISTORY_MAX} 张</span></div>
      <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">
        ${h.map(it => `<div data-modal-act="ga-pick-history" data-url="${esc(it.url)}"
            style="flex:0 0 74px;cursor:pointer;text-align:center">
          <img src="${esc(it.url)}" style="width:74px;height:104px;object-fit:cover;border-radius:8px;border:1px solid var(--line)">
          <div style="font-size:11px;color:var(--txt-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(it.scene || '')}</div>
        </div>`).join('')}
      </div>
      <div class="hint" style="margin-top:6px">图片网址由生成服务托管，可能会过期；真的要留就先按「用這張」，那一步会把图存进形象库。</div>`;
  }

  /* ---- 形象库 ----
   * 生成或上传过的形象存下来，之后可以直接点回去用，不用每次重做。
   * 存的是素材编号（assetId）与预览网址——素材编号是数字人服务那边的
   * 长期凭据，只要它还在，随时可以拿来生成新影片。
   * 存在 persona 底下，跟「目前选了谁」是分开的两件事。 */
  const LIB_MAX = 12;

  function hgLib() {
    const p = STORE.s.persona;
    if (!Array.isArray(p.avatarLib)) p.avatarLib = [];
    return p.avatarLib;
  }

  function hgLibAdd(item) {
    if (!item || !item.assetId) return;
    const lib = hgLib();
    // 同一个素材只留一份，重复加就把它挪到最前面
    const i = lib.findIndex(x => x.assetId === item.assetId);
    if (i >= 0) lib.splice(i, 1);
    lib.unshift({
      id: 'av' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      assetId: item.assetId,
      url: item.url || '',
      name: item.name || (item.source === 'prompt' ? '生成的形象' : '我的照片'),
      source: item.source || 'upload',
      at: new Date().toISOString()
    });
    if (lib.length > LIB_MAX) lib.length = LIB_MAX;
    STORE.update();
  }

  function hgLibUse(id) {
    const it = hgLib().find(x => x.id === id);
    if (!it) return;
    HG.mode = 'image'; HG.assetId = it.assetId; HG.avatarId = null;
    HG.assetPreview = it.url || HG.assetPreview;
    hgSaveChoice();
    toast('已切换成「' + it.name + '」', 'ok');
    hgRenderAvatars(); hgRenderGenerate(); hgRenderChoiceSummary();
  }

  function hgLibDel(id) {
    const lib = hgLib();
    const i = lib.findIndex(x => x.id === id);
    if (i < 0) return;
    const wasUsing = HG.mode === 'image' && HG.assetId === lib[i].assetId;
    lib.splice(i, 1);
    STORE.update();
    // 删掉的正好是目前在用的，就退回「还没选」，不要留一个指向已删项目的状态
    if (wasUsing) { HG.assetId = null; HG.assetPreview = null; HG.mode = 'avatar'; hgSaveChoice(); }
    hgRenderAvatars(); hgRenderGenerate(); hgRenderChoiceSummary();
  }

  /* 生成形象时的场景。这一层很重要：mode:'image' 是拿这张图去动，
   * 图里是什么背景，影片里就是什么背景——所以「有没有书房」在这里决定，
   * 不是之后能再补的。 */
  /* 场景描写要够细，模型才画得出层次。只写「书房」两个字，出来的就是
   * 一面平板书架；把光线、材质、桌上有什么、窗外什么样都讲清楚，画面
   * 才有纵深，也才像真的有人在那里工作。 */
  const GA_SCENES = [
    ['study', '家里的阅读角',
     '身后是家中一面及腰到胸口高度的木书架，书摆得不算整齐、有几本横躺着，'
     + '架上还放着相框、一株小盆栽和一个陶马克杯，'
     + '旁边是一张软布单椅与一盏落地阅读灯，光晕打在书背上，'
     + '木地板，侧边窗户透进午后的斜光，整体是自家客厅的尺度，不是图书馆'],
    ['bookstore', '书店',
     '身后是独立书店的原木书架与斜摆的陈列平台，书籍封面朝外排列，'
     + '架上挂着手写的推荐小卡，天花板垂下暖黄色吊灯，'
     + '更远处有另一排书架自然虚化，走道尽头透进街边的自然光'],
    ['studio', '访谈棚',
     '深色调的专业访谈棚，两盏柔光箱从左右侧前方打光，脸上有柔和的明暗过渡，'
     + '背景是深灰色墙面与几点失焦的暖色光点，桌前放着一支落地麦克风'],
    ['home', '居家书墙',
     '身后是客厅的整面书墙与几株绿植，旁边有一张亚麻布沙发与暖色地毯，'
     + '午后的日光从侧面的落地窗斜射进来，在墙上留下柔和的光影'],
    ['plain', '纯色棚',
     '中性灰的无缝背景纸，柔光箱从正面偏侧打光，背景由中央向四周有轻微的明暗渐层'],
    ['custom', '自己写背景',
     '（不自动加场景，背景请自己写在上面的描述里，连打光也一起写）']
  ];

  /* 人脸侦测过不过，取决于脸够不够正、够不够清楚；但要不要有书房背景，
   * 是构图的事，两者不冲突。之前把「背景干净简单」写死进去，等于主动
   * 把书房排除掉，产出的都是大头照——那不是讲书的样子。 */
  function gaPrompt(desc, sceneKey) {
    const sc = GA_SCENES.find(x => x[0] === sceneKey) || GA_SCENES[0];
    /* 选「自己写背景」时，场景与打光这两段都不加。
     * 场景不加是当然的；打光也要一起拿掉——使用者写了「只开一盏桌灯、
     * 明暗对比明显」，我们却还硬加一句「窗光为主光、侧后方有柔和补光」，
     * 两段会打架，出来的光就是四不像。
     * 镜头、肤质、反向条列那几段留着：那些跟背景无关，是真人感的来源。 */
    const own = sc[0] === 'custom';
    return `${desc.trim()}。`
      + (own ? '' : `场景：${sc[2]}。`)
      /* 构图：留头顶空间、人物偏一侧，之后影片才有地方摆字幕与书封 */
      + '中景，人物在画面中间偏一侧、上半身入镜并留出头顶空间，'
      + '脸部正对镜头、五官完整清晰不被遮挡，'
      /* 摄影语言。像不像真人，这一段比「真实风格」四个字有用得多——
       * 给镜头、光圈、景深、肤质这些具体条件，模型才不会输出那种
       * 一眼假的磨皮塑胶脸。 */
      + '以全画幅相机搭配 85mm 定焦镜头拍摄，光圈 f/2.0，浅景深，背景自然虚化，'
      + (own ? '' : '窗光为主光、侧后方有柔和补光，明暗有层次，')
      + '皮肤保有真实质感与细微毛孔、脸上有自然的光泽与瑕疵，'
      + '发丝与衣物织纹清晰可见，'
      + '神情自然放松、眼神有神，像抓拍而不是摆拍，'
      + '纪实人像摄影，色调自然不过饱和，高解析度，'
      /* 反向条列：这几样是「一眼看出是 AI」的主要来源 */
      + '不要磨皮、不要美颜滤镜、不要塑胶感皮肤、不要过度锐化、'
      + '不要 HDR 感、不要过曝、不要 3D 渲染感、不要插画或卡通风格，'
      + '不要侧脸、不要背影、不要墨镜口罩、不要多个人、'
      + '不要任何文字、浮水印，'
      /* 实测生成结果会自己长出笔电厂牌标志、大学马克杯这类东西。
       * 影片是要对外发布的，先在提示词里挡掉，免得有商标争议。 */
      + '画面中不要出现任何品牌标志、商标或可辨识的校徽。';
  }

  /* 穿着刻意写得居家、放松。讲书的人穿全套西装反而有距离感，
   * 观众要的是「像个真的会读书的人坐在自己家里跟你聊」。 */
  const GA_PRESETS = [
    ['居家女主人', '三十五岁亚洲女性，米白色宽松针织毛衣，头发随意扎起几缕散落，素颜带自然气色，神情放松'],
    ['居家男主人', '三十五岁亚洲男性，浅灰色棉质卫衣，短发微乱，没有刻意整理，笑起来眼角有细纹'],
    ['文艺读书人', '四十岁亚洲女性，燕麦色棉麻衬衫外罩薄开衫，长发微卷自然垂下，戴细框眼镜'],
    ['週末的讲师', '四十多岁亚洲男性，深蓝色法兰绒衬衫袖口随意捲起，短发有些花白，神情温和']
  ];

  function hgGenAvatarModal() {
    /* 一打开就把最近生成的那张选起来。
     * 以前每次重开都清空，使用者明明刚生成过一张、缩图也还在，却因为
     * 「用这张」是灰的而按不动，按「生成形象」又被要求重新描述一次——
     * 图都有了还要描述，这个流程本身就不合理。 */
    const last = gaHistory()[0];
    GA.url = last ? last.url : null;
    modal('用提示词生成形象', `
      <div class="explain" style="margin:0 0 14px">
        <div class="ex-r"><span class="ex-k">这是做什么的</span><span>
          用一句话描述你想要的主持人长相，系统生成一张形象照。满意的话按「用这张」，
          之后生成的口播影片就会用这个形象，<b>嘴型一样会跟着稿子动</b>。</span></div>
        <div class="ex-r"><span class="ex-k">要花钱吗</span><span>
          生成一张图约 <b>US$0.03–0.07</b>，很便宜，不满意可以一直重生成。
          真正贵的是之后「生成影片」那一步。</span></div>
      </div>

      <div class="label">想要什么样的形象</div>
      <div class="chip-list" style="margin-bottom:8px">
        ${GA_PRESETS.map(x => `<span class="tag" style="cursor:pointer" data-modal-act="ga-preset" data-text="${esc(x[1])}">${esc(x[0])}</span>`).join('')}
      </div>
      <textarea id="ga-prompt" class="input" rows="3"
        placeholder="例如：三十多岁亚洲女性，气质知性，深色西装外套，短发"></textarea>
      <div class="hint" style="margin-top:6px">正脸、五官清楚这些条件系统会自动加上，你只要描述长相、年龄、穿着、气质就好。</div>

      <div class="field" style="margin-top:12px">
        <div class="label">拍摄场景<span class="hint" style="margin-left:8px;font-weight:400">影片的背景就是这里选的，之后改不了</span></div>
        <select class="input" id="ga-scene">
          ${GA_SCENES.map((x, i) => `<option value="${x[0]}" ${i === 0 ? 'selected' : ''}>${x[1]}</option>`).join('')}
        </select>
        <div class="hint" id="ga-scene-hint" style="margin-top:6px"></div>
      </div>

      <div id="ga-result" style="margin-top:14px">${GA.url
        ? `<img src="${esc(GA.url)}" style="width:100%;max-height:340px;object-fit:contain;border-radius:12px;border:1px solid var(--line)">
           <div class="hint" style="margin-top:6px">这是你上次生成的。直接按「用这张」就能用；想换就改描述再按「生成形象」。</div>`
        : ''}</div>

      <div id="ga-history">${gaHistoryHtml()}</div>

      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn btn-primary" data-modal-act="ga-run">✨ 生成形象</button>
        <button class="btn ${GA.url ? 'btn-primary' : ''}" data-modal-act="ga-use" id="ga-use"
          ${GA.url ? '' : 'disabled style="opacity:.45;pointer-events:none"'}>用这张</button>
      </div>
    `);

    /* 选到「自己写背景」时，提示要跟着换掉。
     * 不然使用者只看到下拉选单变了，不会知道背景跟打光现在都得自己写，
     * 描述里没写背景就等于没背景。 */
    const sel = $('#ga-scene');
    const tip = $('#ga-scene-hint');
    const ta = $('#ga-prompt');
    if (sel && tip) {
      const sync = () => {
        const own = sel.value === 'custom';
        const sc = GA_SCENES.find(x => x[0] === sel.value);
        tip.innerHTML = own
          ? '<b>场景和打光都不会自动加</b>，请在上面的描述里连背景、连光线一起写完，没写就等于没背景。'
          : esc(sc ? sc[2] : '') + '<br>镜头、打光、构图系统会自动加，你只要选场景就好。';
        if (ta) {
          ta.placeholder = own
            ? '例如：三十五岁亚洲女性，米白色宽松针织毛衣…。背景是自家客厅靠窗的一角，一面及胸高的原木书架，书脊高低不齐…'
            : '例如：三十多岁亚洲女性，气质知性，深色西装外套，短发';
        }
      };
      sel.addEventListener('change', sync);
      sync();
    }
  }

  function gaRender(html) { const b = $('#ga-result'); if (b) b.innerHTML = html; }

  async function hgGenAvatarRun() {
    const desc = ($('#ga-prompt') && $('#ga-prompt').value || '').trim();
    if (!desc) return toast('先描述一下想要什么样的形象', 'err');
    if (GA.busy) return;
    GA.busy = true; GA.url = null;
    const useBtn = $('#ga-use');
    if (useBtn) { useBtn.disabled = true; useBtn.style.opacity = '.45'; useBtn.style.pointerEvents = 'none'; }
    gaRender('<div class="hint">正在生成，约需 10–30 秒…</div>');
    try {
      const scene = ($('#ga-scene') && $('#ga-scene').value) || 'study';
      const j = await hgFetchSlow('/api/ai/image', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        /* deevid 这一组是给第二条路用的：Model Router 的图像服务目前缺金钥，
         * 服务端会自动改走 DeeVid。1K 是它接受的解析度值（720p 会被打回），
         * 竖版才符合短影音的比例。 */
        body: JSON.stringify({
          prompt: gaPrompt(desc, scene),
          quality: 'balanced',
          deevid: { resolution: '1K', size: 'NINE_BY_SIXTEEN' }
        })
      /* 生一张图实测 22-25 秒，预设的 15 秒会在服务端还在画的时候就先
       * 放弃，画面显示「连线逾时」，但那张图其实照样生出来了、钱照样花。
       * 给到 90 秒，比服务端自己的 60 秒上限还宽，让服务端的错误讯息
       * 有机会回得来。 */
      });
      if (!j.url) throw new Error('模型没有回传图片网址');
      GA.url = j.url;
      gaHistoryAdd(j.url, desc, scene);
      const hb = $('#ga-history'); if (hb) hb.innerHTML = gaHistoryHtml();
      gaRender(`<img src="${esc(j.url)}" style="width:100%;max-height:340px;object-fit:contain;border-radius:12px;border:1px solid var(--line)">
        <div class="hint" style="margin-top:6px">不满意就改描述再按一次「生成形象」。</div>`);
      if (useBtn) { useBtn.disabled = false; useBtn.style.opacity = '1'; useBtn.style.pointerEvents = 'auto'; }
    } catch (e) {
      gaRender(`<div class="hint" style="color:var(--red)">生成失败：${esc(e.message)}</div>`);
    } finally { GA.busy = false; }
  }

  async function hgGenAvatarUse() {
    if (!GA.url || GA.busy) return;
    GA.busy = true;
    gaRender('<div class="hint">正在把这个形象送进数字人服务…</div>');
    try {
      const j = await hgFetch(
        `/api/heygen/upload?url=${encodeURIComponent(GA.url)}&name=${encodeURIComponent('ai-avatar.png')}`,
        { method: 'POST' });
      HG.assetId = j.assetId; HG.avatarId = null; HG.mode = 'image';
      HG.assetPreview = j.url || GA.url;
      const desc = ($('#ga-prompt') && $('#ga-prompt').value || '').trim();
      hgLibAdd({ assetId: j.assetId, url: HG.assetPreview, source: 'prompt',
                 name: desc.slice(0, 12) || '生成的形象' });
      hgSaveChoice();
      closeModal();
      toast('形象已建立，之后生成影片会用这一个', 'ok');
      hgRenderAvatars(); hgRenderGenerate(); hgRenderChoiceSummary();
    } catch (e) {
      // 人脸侦测没过是最常见的失败，直接讲清楚怎么改，不要只丢一句英文错误
      const hint = /face|detect/i.test(e.message || '')
        ? '这张图没通过人脸侦测。请在描述里强调「正面半身、脸部完整清楚」，或换一个presets再试。'
        : e.message;
      gaRender(`<div class="hint" style="color:var(--red)">套用失败：${esc(hint)}</div>`);
    } finally { GA.busy = false; }
  }

  async function hgUploadPhoto(file) {
    if (!file) return;
    const localPreview = URL.createObjectURL(file);
    HG.assetPreview = localPreview; HG.mode = 'image'; hgRenderAvatars();
    try {
      const buf = await file.arrayBuffer();
      // 走 hgFetch 而不是原生 fetch——它会自动带上写入凭证，
      // 少了这个标头服务端一律回「凭证不正确」。
      const j = await hgFetch(
        `/api/heygen/upload?mime=${encodeURIComponent(file.type || 'image/jpeg')}&name=${encodeURIComponent(file.name || 'photo')}`,
        { method: 'POST', body: buf });
      HG.assetId = j.assetId; HG.avatarId = null;
      // 上传成功才存——服务端回传的网址才是长期有效的，本机预览网址
      // （blob:）一关页面就失效，存了下次读回来是破图
      HG.assetPreview = j.url || HG.assetPreview;
      hgLibAdd({ assetId: j.assetId, url: HG.assetPreview, source: 'upload',
                 name: (file.name || '我的照片').replace(/\.[^.]+$/, '').slice(0, 12) });
      hgSaveChoice();
      toast('照片已上传，之后生成影片会用这张', 'ok'); hgRenderGenerate(); hgRenderChoiceSummary();
    } catch (e) {
      toast('上传失败：' + e.message, 'err'); HG.mode = 'avatar'; hgRenderAvatars();
    }
  }

  /* ---- 声音：挑现成的，或上传录音克隆 ----
   *
   * 以前这里写死只显示前 9 个，而服务端又用白名单只放行三个台湾腔，
   * 使用者反映「声音太少了」——实际上语音服务能讲中文的有一百个。
   * 现在服务端把全部拿回来并标上腔调，这里按腔调分组 + 可搜寻。
   *
   * 粤语那两个一定要单独标出来：名字叫 HiuMaan / HiuGaai，从名字完全
   * 看不出是粤语，选到了整支影片都会是粤语，钱就白花了。 */
  const VOICE_GROUPS = [
    ['tw', '台湾腔', '微软官方 zh-TW。咬字最标准，但语气偏平，长句容易听起来僵。'],
    ['multi', '语气自然', '别家模型的声音，起伏和停顿明显自然得多，讲书最适合——但腔调不保证，一定要先试听。'],
    ['cn', '大陆腔', '微软官方 zh-CN。'],
    ['other', '其他中文', '供应商没标腔调，先试听再决定。'],
    ['yue', '粤语', '⚠ 这是粤语不是国语。选了整支影片都会是粤语。']
  ];

  function hgVoiceMatch(v) {
    if (HG.voiceFilter && HG.voiceFilter !== 'all' && v.accent !== HG.voiceFilter) return false;
    const q = (HG.voiceQuery || '').trim().toLowerCase();
    return !q || (v.name || '').toLowerCase().indexOf(q) >= 0 || (v.zh || '').indexOf(q) >= 0 || (v.note || '').indexOf(q) >= 0;
  }

  function hgVoiceListHtml() {
    const list = HG.voices.filter(hgVoiceMatch);
    if (!list.length) return '<div class="hint" style="padding:14px 2px">没有符合的声音。换个分类，或把搜寻字清掉。</div>';
    return `<div class="grid g3">${list.map(v => {
      const g = VOICE_GROUPS.find(x => x[0] === v.accent);
      const on = v.id === HG.voiceId;
      return `<div class="hg-avatar ${on ? 'on' : ''}" data-act="hg-pick-voice" data-id="${esc(v.id)}"
          style="border:1px solid ${on ? 'var(--violet-2)' : 'var(--line)'};border-radius:12px;padding:10px;cursor:pointer">
        <div style="font-size:15px;font-weight:700">${esc(voiceLabel(v))}</div>
        <div class="hint" style="margin-top:3px">${esc(g ? g[1] : (v.language || ''))}${v.gender && v.gender !== 'unknown' ? ' · ' + esc(v.gender === 'male' ? '男' : '女') : ''}${v.age ? ' · ' + AGE_NAME[v.age] : ''}</div>
        ${v.note ? `<div class="hint" style="margin-top:2px;opacity:.85">${esc(v.note)}</div>` : ''}
        ${v.preview ? `<audio src="${esc(v.preview)}" preload="none" controls
            style="width:100%;height:28px;margin-top:6px" onclick="event.stopPropagation()"></audio>` : ''}
      </div>`;
    }).join('')}</div>`;
  }

  /* 只重画清单、不动搜寻框——不然每打一个字焦点就掉，根本没办法搜。 */
  function hgRenderVoiceList() {
    const box = $('#hg-voice-list');
    if (box) box.innerHTML = hgVoiceListHtml();
  }

  function hgRenderVoices() {
    const panel = $('#hg-voice-panel');
    if (!panel) return;
    if (!HG.voiceFilter) HG.voiceFilter = 'all';
    const n = k => HG.voices.filter(v => v.accent === k).length;
    const cur = VOICE_GROUPS.find(g => g[0] === HG.voiceFilter);
    panel.innerHTML = `
      <div class="chip-list" style="margin-bottom:8px">
        <span class="tag ${HG.voiceFilter === 'all' ? 'v' : ''}" style="cursor:pointer"
          data-act="hg-voice-filter" data-k="all">全部 ${HG.voices.length}</span>
        ${VOICE_GROUPS.filter(g => n(g[0])).map(g => `<span class="tag ${HG.voiceFilter === g[0] ? 'v' : ''}"
          style="cursor:pointer" data-act="hg-voice-filter" data-k="${g[0]}">${g[1]} ${n(g[0])}</span>`).join('')}
      </div>
      ${cur ? `<div class="hint" style="margin-bottom:8px">${esc(cur[2])}</div>` : ''}
      <input class="input" id="hg-voice-search" placeholder="搜声音名字…"
        value="${esc(HG.voiceQuery || '')}" style="margin-bottom:10px">
      <div id="hg-voice-list" style="max-height:430px;overflow-y:auto;padding-right:4px">${hgVoiceListHtml()}</div>
      <div class="grid g3" style="margin-top:10px">
        <div class="hg-avatar" data-act="hg-upload-audio-btn"
            style="border:1px dashed var(--line-2);border-radius:12px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:90px">
          <div style="font-size:24px;color:var(--txt-3)">＋</div><div style="font-size:14px;color:var(--txt-2);margin-top:4px">上传录音克隆</div>
        </div>
      </div>
      <div class="hint" style="margin-top:10px">试听是免费的，多听几个再决定——声音换了要重新生成影片才听得到差别，已经做好的不会变。
        上传一段 <b>30 秒以上、安静环境、正常语速</b>的清晰朗读录音可以克隆自己的声音，上传免费，
        <b>克隆这一步会花一点钱</b>（比生成影片便宜），送出前会再跟你确认一次。</div>`;
  }

  async function hgUploadAudio(file) {
    if (!file) return;
    let assetId;
    try {
      const buf = await file.arrayBuffer();
      // 同上：一定要走 hgFetch，原生 fetch 不会带凭证
      const j = await hgFetch(
        `/api/heygen/upload?mime=${encodeURIComponent(file.type || 'audio/mpeg')}&name=${encodeURIComponent(file.name || 'voice')}`,
        { method: 'POST', body: buf });
      assetId = j.assetId;
    } catch (e) { return toast('上传失败：' + e.message, 'err'); }

    modal('确定要克隆这段声音吗？',
      '<div style="font-size:15.5px">录音已经上传好了。按下面「确认克隆」会真的送去训练一个新声音，从你的额度扣一点钱，无法撤销。</div>',
      `<button class="btn" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-primary" data-modal-act="confirm-hg-clone" data-asset="${esc(assetId)}">确认克隆（会扣钱）</button>`);
  }

  async function hgDoCloneVoice(assetId) {
    const panel = $('#hg-voice-panel');
    if (panel) panel.insertAdjacentHTML('afterbegin', '<div class="hint" id="hg-clone-status">送出克隆中…</div>');
    const setStatus = t => { const el = $('#hg-clone-status'); if (el) el.textContent = t; };
    try {
      const r = await hgFetchSlow('/api/heygen/clone-voice', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: '我的声音 ' + new Date().toLocaleDateString('zh-CN'), assetId })
      });
      setStatus('克隆中，通常 1-2 分钟…');
      const tick = async () => {
        try {
          const s = await hgFetch('/api/status?service=heygen-voice&id=' + encodeURIComponent(r.voiceCloneId));
          if (s.status === 'complete') {
            HG.voices.unshift(decorateVoice({ id: s.voiceId, name: s.name, language: 'Chinese', preview: s.preview, accent: 'other' }));
            HG.voiceId = s.voiceId;
            hgSaveChoice();
            toast('声音克隆完成，已自动选用这个新声音', 'ok'); hgRenderVoices(); hgRenderGenerate(); hgRenderChoiceSummary();
            return;
          }
          if (s.status === 'failed') { toast('克隆失败', 'err'); hgRenderVoices(); return; }
          setStatus('克隆中…（' + (s.status || 'processing') + '）'); setTimeout(tick, 5000);
        } catch (e) { setStatus('查询失败：' + e.message); }
      };
      tick();
    } catch (e) { toast('克隆失败：' + e.message, 'err'); hgRenderVoices(); }
  }

  /* ---- 生成 ---- */
  /* 中文 TTS 大约每秒 4.5 个字（不算标点空白），乘上使用者调的语速。
   * 这只是估算，用来让人在按下去之前心里有数——影片按秒计费，
   * 稿子多长直接决定这一支多少钱，之前完全看不出来。 */
  function hgEstimate(text) {
    const n = String(text || '').replace(/\s/g, '').length;
    const speed = STORE.s.persona.voiceSpeed == null ? 1 : Number(STORE.s.persona.voiceSpeed);
    const sec = n / (4.5 * (speed || 1));
    return { n, sec, usd: sec * USD_PER_SEC };
  }

  function hgEstimateHtml(text) {
    const e = hgEstimate(text);
    if (!e.n) return '还没写字';
    return `${e.n} 字 · 估约 ${e.sec < 60 ? Math.round(e.sec) + ' 秒' : Math.floor(e.sec / 60) + ' 分 ' + Math.round(e.sec % 60) + ' 秒'}`
      + ` · 估约 US$${e.usd.toFixed(2)}`;
  }

  function hgRenderGenerate() {
    const panel = $('#hg-gen-panel');
    if (!panel) return;
    /* 正在生成时不要重画。轮询靠 #hg-result 还在不在页面上判断要不要继续，
     * 重画会把它换掉、轮询就停了——使用者只是顺手点了另一个声音想比较，
     * 影片其实照做照扣钱，画面却什么都不再更新，看起来像失败。 */
    if (HG.busy && panel.querySelector('#hg-result')) return;
    const avName = HG.mode === 'image' ? '你上传的照片' : ((HG.avatars.find(a => a.id === HG.avatarId) || {}).name || '（未选）');
    const voName = (HG.voices.find(v => v.id === HG.voiceId) || {}).name || '（未选）';
    const ready = (HG.mode === 'image' ? HG.assetId : HG.avatarId) && HG.voiceId;
    panel.innerHTML = `
      <div class="chip-list" style="margin-bottom:10px"><span class="tag v">形象：${esc(avName)}</span><span class="tag c">声音：${esc(voName)}</span></div>
      ${ready ? '' : '<div class="hint" style="color:var(--amber);margin-bottom:10px">形象或声音还没选，上面两区各选一个就能生成。</div>'}
      <div class="field"><div class="label">要说的话
          <span class="hint" style="margin-left:auto;font-weight:400" id="hg-est">${hgEstimateHtml(HG.text)}</span></div>
        <textarea class="input" id="hg-text" rows="7"
          placeholder="直接贴你自己写的稿子。写什么就念什么——不要写【】这种标注，会被一起念出来。"
        >${esc(HG.text || '')}</textarea>
        <div class="hint" style="margin-top:6px">影片按秒计费，稿子越长越贵。先用两三句话试一支，确认形象和声音搭起来满意，再写长的。</div></div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px" data-act="hg-generate">生成这一支（真的花钱）</button>
      <div id="hg-wallet" style="margin-top:10px">${hgWalletHtml()}</div>
      <div id="hg-result" style="margin-top:14px"></div>
      <div id="hg-vhistory"></div>`;
    hgRenderVideoHistory();
    hgResumePending();
    hgLoadWallet();
  }

  /* ---- 数位人服务的真实余额 ----
   *
   * 左下角那条「本月生成额度」是我们自己的支数计数器，跟钱没有关系。
   * 之前它显示 279/500、看起来还有一大半，实际上钱包只剩 US$0.02，
   * 按下去就是失败——画面上完全看不出来。真正会挡住人的是这个数字。 */
  const HGW = { balance: null, at: 0, loading: false };

  async function hgLoadWallet(force) {
    if (!hgCanWrite()) return;
    if (HGW.loading) return;
    if (!force && HGW.at && Date.now() - HGW.at < 60000) return;
    HGW.loading = true;
    try {
      const j = await hgFetch('/api/status?service=hg-wallet');
      HGW.balance = j.balance;
      HGW.at = Date.now();
    } catch (e) {
      HGW.balance = null;   // 查不到就别显示，不要编一个数字
    } finally {
      HGW.loading = false;
      hgRenderWallet();
    }
  }

  function hgWalletHtml() {
    if (HGW.balance == null) return '';
    const low = HGW.balance < 1;
    return `<span class="tag ${low ? 'r' : 'g'}">余额 US$${HGW.balance.toFixed(2)}</span>`
      + (low ? `<span class="hint" style="margin-left:8px">余额太低，生成会失败。到 app.heygen.com 的 Billing 储值
           <b>API credits</b>（跟订阅方案是两个池子）</span>` : '');
  }

  function hgRenderWallet() {
    const box = $('#hg-wallet');
    if (box) box.innerHTML = hgWalletHtml();
  }

  /* ---- 试生成的影片记录 ----
   *
   * 以前结果只画在 #hg-result 上，页面一重整、或点了别的东西重画，
   * 记录就没了——影片钱照花，但你连它生成到哪一步都看不到。形象生成
   * 那边早就有历史，这里当初漏了。
   *
   * 记录存进 STORE，所以：重整还在、隔天回来还在；还没跑完的那几支
   * 回来会自动接着追踪，不用重送（重送等于再花一次钱）。 */
  const HGV_MAX = 12;

  function hgVideos() {
    const p = STORE.s.persona;
    if (!Array.isArray(p.testVideos)) p.testVideos = [];
    return p.testVideos;
  }

  function hgVideoAdd(rec) {
    const h = hgVideos();
    h.unshift(rec);
    if (h.length > HGV_MAX) h.length = HGV_MAX;
    STORE.update();
  }

  function hgVideoPatch(id, patch) {
    const rec = hgVideos().find(x => x.id === id);
    if (!rec) return;
    Object.assign(rec, patch);
    STORE.update();
    hgRenderVideoHistory();
  }

  function hgVideoHistoryHtml() {
    const h = hgVideos();
    return `<div class="label" style="margin-top:18px">生成记录
        <span class="hint" style="margin-left:8px;font-weight:400">只留最近 ${HGV_MAX} 支。影片网址约 7 天后失效，要保留请自行下载</span>
        <button class="btn btn-sm" style="margin-left:auto" data-act="hg-recover">找回之前生成的</button></div>
      ${h.length ? '' : '<div class="hint" style="padding:10px 2px">还没有记录。这一版之前生成的影片没有存下来，按上面「找回之前生成的」可以从服务端拉回来。</div>'}
      ${h.map(r => {
        const when = new Date(r.at).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        const money = r.duration ? ' · 约 US$' + (r.duration * USD_PER_SEC).toFixed(2) : '';
        const len = r.duration ? Math.round(r.duration) + ' 秒' : '';
        return `<div style="display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)">
          <div style="flex:0 0 96px">
            ${r.url
              ? `<video src="${esc(r.url)}" controls preload="none" ${r.thumb ? `poster="${esc(r.thumb)}"` : ''}
                   style="width:96px;border-radius:8px;background:#000"></video>`
              : `<div style="width:96px;height:128px;border-radius:8px;border:1px dashed var(--line-2);
                   display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--txt-3);text-align:center">${
                     r.status === 'failed' ? '失败' : '生成中'}</div>`}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-size:14px;line-height:1.5">${esc(r.text || '')}</div>
            <div class="hint" style="margin-top:4px">${esc(when)}${len ? ' · ' + len : ''}${money}</div>
            ${r.status === 'failed'
              ? `<div class="hint" style="color:var(--red);margin-top:4px">${esc(r.error || '未知原因')}</div>`
              : r.status === 'pending'
                ? '<div class="hint" style="color:var(--violet-2);margin-top:4px">生成中，可以离开这一页，回来会接着追踪</div>'
                : ''}
          </div>
        </div>`;
      }).join('')}`;
  }

  function hgRenderVideoHistory() {
    const box = $('#hg-vhistory');
    if (box) box.innerHTML = hgVideoHistoryHtml();
  }

  /* 还在生成中的那几支，重新进页面时自动接着轮询。
   * pollingIds 挡重复：同一支被两个轮询同时追会互相覆盖状态。 */
  const hgPolling = {};
  function hgResumePending() {
    hgVideos().forEach(r => {
      if (r.status === 'pending' && !hgPolling[r.id]) hgPoll(r.id, null);
    });
  }

  /* 从服务端把这个帐号最近生成过的影片拉回来，补进记录。
   * 之前的版本根本没存过记录，使用者花过钱的影片等于凭空消失——
   * 服务端那边其实都还查得到，拉回来就是了。 */
  async function hgRecover() {
    if (!hgCanWrite()) return hgDemoNotice();
    toast('正在从服务端找…', 'ok');
    try {
      const j = await hgFetch('/api/status?service=heygen-recent&limit=20');
      const list = j.videos || [];
      const have = new Set(hgVideos().map(x => x.id));
      let n = 0;
      /* 由旧到新塞，最后排出来才是新的在最上面。 */
      list.slice().reverse().forEach(v => {
        if (!v.id || have.has(v.id)) return;
        hgVideoAdd({
          id: v.id,
          at: (v.created_at || 0) * 1000 || Date.now(),
          status: v.status === 'completed' ? 'done' : v.status === 'failed' ? 'failed' : 'pending',
          text: '（更早生成的，找回来的记录）',
          url: v.video_url || null,
          thumb: v.thumbnail_url || null,
          duration: v.duration || null,
          error: v.failure_message || null
        });
        n++;
      });
      hgRenderVideoHistory();
      hgResumePending();
      toast(n ? '找回 ' + n + ' 支' : '没有找到记录以外的影片', n ? 'ok' : 'warn');
    } catch (e) {
      toast('找不回来：' + e.message, 'err');
    }
  }

  async function hgDoGenerate() {
    const result = $('#hg-result');
    if (!result) return;
    result.innerHTML = '<div class="hint">送出中…</div>';
    HG.busy = true;
    try {
      const r = await hgFetch('/api/heygen/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: HG.mode, avatarId: HG.avatarId, assetId: HG.assetId, voiceId: HG.voiceId, text: HG.text })
      });
      /* 记录在送出的当下就建立，不是等成功才建——失败的那几支同样
       * 要留着，不然使用者只会看到「又没了」，不知道失败过几次、为什么。 */
      const snippet = (HG.text || '').slice(0, 40);
      /* Model Router 那条路是同步的，会直接把影片网址回来，没有任务
       * 编号可以轮询。两种回应都要接得住。 */
      if (r.videoUrl) {
        HG.busy = false;
        hgVideoAdd({ id: r.videoId || ('mr-' + Date.now()), at: Date.now(), status: 'done',
                     text: snippet, url: r.videoUrl, via: r.via || null });
        hgRenderVideoHistory();
        result.innerHTML = `<video src="${esc(r.videoUrl)}" controls style="width:100%;max-width:280px;border-radius:12px"></video>
          <div class="hint" style="margin-top:8px">影片网址约 7 天后失效，要保留请自行下载存档。</div>`;
        return;
      }
      if (!r.videoId) throw new Error('服务没有回传影片网址或任务编号');
      result.innerHTML = '<div class="hint">已送出，生成中，通常 1-3 分钟…</div>';
      hgVideoAdd({ id: r.videoId, at: Date.now(), status: 'pending', text: snippet, via: r.via || null });
      hgRenderVideoHistory();
      hgPoll(r.videoId, result, r.via);
    } catch (e) {
      HG.busy = false;
      result.innerHTML = `<div class="hint" style="color:var(--red)">生成失败：${esc(e.message)}</div>`;
    }
  }

  /* result 可以是 null：从生成记录续追时没有那个容器，状态只写回记录。
   * 轮询不再绑在容器活着与否上——绑了就变成「切一下页面就不再更新」，
   * 影片其实照做照扣钱。 */
  function hgPoll(videoId, result, via) {
    hgPolling[videoId] = true;
    const paint = html => { if (result && document.body.contains(result)) result.innerHTML = html; };
    /* 两条路的任务编号是两套东西，拿错地方查只会得到「not found」。
     * via 是送出时服务端告诉我们的，记录里也存了一份，重整回来照样对。 */
    const rec = hgVideos().find(x => x.id === videoId);
    const svc = (via || (rec && rec.via)) === 'model-router' ? 'mr-task' : 'heygen-video';
    const tick = async () => {
      try {
        const s = await hgFetch('/api/status?service=' + svc + '&id=' + encodeURIComponent(videoId));
        if (s.status === 'completed' && s.videoUrl) {
          HG.busy = false; delete hgPolling[videoId];
          hgVideoPatch(videoId, { status: 'done', url: s.videoUrl, thumb: s.thumbnailUrl || null, duration: s.duration || null });
          hgLoadWallet(true);
          paint(`<video src="${esc(s.videoUrl)}" controls style="width:100%;max-width:280px;border-radius:12px"></video>
            <div class="hint" style="margin-top:8px">影片网址约 7 天后失效，要保留请自行下载存档。</div>`);
          return;
        }
        if (s.status === 'failed') {
          HG.busy = false; delete hgPolling[videoId];
          hgVideoPatch(videoId, { status: 'failed', error: s.error || '未知原因' });
          paint(`<div class="hint" style="color:var(--red)">生成失败：${esc(s.error || '未知原因')}</div>`);
          return;
        }
        paint(`<div class="hint">生成中…（${esc(s.status || 'processing')}）</div>`);
        setTimeout(tick, 5000);
      } catch (e) {
        delete hgPolling[videoId];
        paint(`<div class="hint" style="color:var(--amber)">查询失败：${esc(e.message)}</div>`);
      }
    };
    tick();
  }

  /* ============================================================
   * 影片按需生成：把某一支的稿子，用你选好的数字人与声音真的做成影片
   *
   * 为什么是「一支一支做」而不是跑完流程就有 30 支：
   *   真的生成要送去外部数字人服务，一支约 US$1-3、要等 1-3 分钟。
   *   一本书 30 支就是 US$30-90，不该在使用者没同意的情况下自动花掉。
   *
   * 轮询刻意放在模块层级、不绑在弹窗上：使用者关掉弹窗或切到别页，
   * 生成仍会继续，完成后结果写回 STORE，回来就看得到。
   * ========================================================== */
  const videoJobs = {};   // videoId -> true，挡住同一支被重复送出

  function findVideo(id) {
    let hit = null;
    STORE.s.projects.forEach(p => (p.videos || []).forEach(v => { if (v.id === id) hit = { v, p }; }));
    return hit;
  }

  /* 取出这支影片要念的台词。
   * 稿子本身就是单人口播（一个人从头讲到尾），所以直接把每句接起来就是
   * 完整台词——念的人、稿子、成品三者一致，不需要任何取舍或说明。 */
  function scriptToSpeech(v, p) {
    const s = (p.scripts || []).find(x => x.id === v.scriptId);
    if (!s) return v.title || '';
    /* 手动改过的优先。使用者改了稿子却还是念 AI 那版，是最糟的情况——
     * 他会以为编辑没生效，而且钱已经花掉了。 */
    if (s.manualSpeech && s.manualSpeech.trim()) return cleanSpeech(s.manualSpeech);
    if (!(s.dialogue || []).length) return v.title || '';
    return cleanSpeech(s.dialogue.map(l => l.text).join('  '));
  }

  /* ---------- 访谈式对谈影片 ----------
   * 三种形式（AI 提问者 / 作者 / 书中主角）差别只有「谁问谁答」。
   * 稿子一律用固定 5 段：提问方开场 → 回答方回答 → 提问方追问 →
   * 回答方补充 → 提问方收尾 CTA；再按形式把这 5 段分配给主理人与对方。 */

  function currentFormat() {
    return DATA.interviewFormat(STORE.s.persona.interviewFormat);
  }

  /* 对面坐的那个人叫什么。书中主角要读这本书自己的角色表。 */
  function guestNameOf(p) {
    const pa = STORE.s.persona;
    const fmt = currentFormat();
    if (fmt.id === 'character') {
      const list = (p && p.characters) || [];
      const bound = list.find(c => c.name && c.name === pa.guestCharacterName);
      return (bound && bound.name) || (list[0] && list[0].name) || fmt.guestName;
    }
    if (fmt.id === 'author') return pa.guestName || p.author || fmt.guestName;
    return pa.guestName || fmt.guestName;
  }

  /* 书中主角形式：把角色的定妆照与外貌描述带给 Model Router，
   * 不然生出来的脸跟「书中角色」那一段做好的角色对不上。 */
  function guestCharacterOf(p) {
    if (currentFormat().id !== 'character') return null;
    const list = (p && p.characters) || [];
    const pa = STORE.s.persona;
    return list.find(c => c.name && c.name === pa.guestCharacterName) || list[0] || null;
  }

  /* 提问方 / 回答方各是谁（host = 主理人自己的形象与声音） */
  function interviewRoles(p) {
    const fmt = currentFormat();
    const hostName = STORE.s.account.name || '主理人';
    const guestName = guestNameOf(p);
    return fmt.hostAsks
      ? { fmt, asker: 'host', answerer: 'guest', askerName: hostName, answererName: guestName, hostName, guestName }
      : { fmt, asker: 'guest', answerer: 'host', askerName: guestName, answererName: hostName, hostName, guestName };
  }

  function scriptToConversation(v, p) {
    const s = (p.scripts || []).find(x => x.id === v.scriptId);
    const R = interviewRoles(p);
    const lines = (s && Array.isArray(s.dialogue) ? s.dialogue : []).filter(x => x && x.text);
    const seed = lines.length ? lines : [{ text: v.title || p.title || '这本书值得聊一聊', cue: '开场' }];
    const take = i => (seed[i] || seed[seed.length - 1] || {}).text || '';
    const out = [
      {
        role: 'ask',
        cue: '提问方开场，5-8 秒，直接抛出主题',
        text: `我们今天聊《${p.title}》。这本书最值得先讲的，是它怎么回应「${(p.pains || [])[0] || '很多人很努力却没有结果'}」这个问题。`
      },
      { role: 'answer', cue: '回答方回答，10-15 秒，讲核心观点', text: take(0) },
      { role: 'ask', cue: '提问方追问或插嘴，5-8 秒，像真人交流', text: '等一下，这里我想插一句。这个观点听起来很对，但普通人最容易误会的地方是什么？' },
      { role: 'answer', cue: '回答方补充，10-15 秒，给一个具体动作或书中金句', text: take(1) || take(0) },
      { role: 'ask', cue: '提问方总结 CTA，5-8 秒，自然收尾', text: `所以这本书不是叫你更忙，而是让你做对更少的事。想看《${p.title}》更完整的拆解，留言「书摘」。` }
    ].map(x => assignSpeaker(x, R));
    return scaleConversation(out, Number(v.duration) || defaultVideoDuration());
  }

  function assignSpeaker(line, R) {
    const speaker = line.role === 'ask' ? R.asker : R.answerer;
    return Object.assign({}, line, {
      speaker,
      speakerName: speaker === 'host' ? R.hostName : R.guestName
    });
  }

  function scaleConversation(lines, duration) {
    const list = Array.isArray(lines) ? lines : [];
    const D = clampDuration(duration);
    return list.map((line, i) => {
      const t0 = +(i * D / list.length).toFixed(1);
      const t1 = +((i + 1) * D / list.length).toFixed(1);
      return Object.assign({}, line, { t: `${t0.toFixed(1)}-${t1.toFixed(1)}s` });
    });
  }

  /* 文字框里用真实名字当前缀，使用者才知道哪一句是谁讲的 */
  function conversationToText(lines, R) {
    return (lines || []).map(l => {
      const name = l.speaker === 'host' ? R.hostName : R.guestName;
      return `${name}：${l.text}`;
    }).join('\n');
  }

  function parseConversationText(text, R) {
    /* 介面切到繁体时，文字框里的名字也会被转成繁体（林致远 → 林致遠），
     * 但资料里存的是简体。两边都先转成繁体再比，否则整段会被误判成同一个人讲的。 */
    const norm = x => {
      const t = String(x || '').trim().toLowerCase();
      return (window.I18N && I18N.toTrad) ? I18N.toTrad(t) : t;
    };
    const hostAlias = [R.hostName, '主持人', '主理人', 'host'].filter(Boolean).map(norm);
    const guestAlias = [R.guestName, '来宾', '嘉宾', 'guest', '作者', '主角'].filter(Boolean).map(norm);
    return String(text || '').split(/\n+/).map(line => line.trim()).filter(Boolean).map(line => {
      const m = line.match(/^([^：:]{1,12})\s*[：:]\s*(.+)$/);
      if (!m) return { speaker: R.answerer, text: line };
      const who = norm(m[1]);
      if (hostAlias.indexOf(who) >= 0) return { speaker: 'host', text: m[2].trim() };
      if (guestAlias.indexOf(who) >= 0) return { speaker: 'guest', text: m[2].trim() };
      return { speaker: R.answerer, text: line };   // 认不出前缀就整句当台词，不吃掉内容
    }).filter(x => x.text);
  }

  /* 不管使用者怎么改，最后一定补回固定 5 段，缺的用预设句顶上 */
  function fixedConversation(lines, p) {
    const R = interviewRoles(p);
    const list = (Array.isArray(lines) ? lines : []).filter(x => x && x.text);
    const asks = list.filter(x => x.speaker === R.asker);
    const answers = list.filter(x => x.speaker === R.answerer);
    const pick = (arr, i, fallback) => (arr[i] && arr[i].text) || fallback;
    return [
      { role: 'ask', text: pick(asks, 0, `我们今天聊《${p.title}》，先讲它最值得注意的一点。`) },
      { role: 'answer', text: pick(answers, 0, '这本书真正有价值的地方，是它把一个复杂问题讲得很具体。') },
      { role: 'ask', text: pick(asks, 1, '我插一句，普通读者听到这里，最容易误会的地方是什么？') },
      { role: 'answer', text: pick(answers, 1, '不要只把它当成道理，要回到自己今天能改变的一个动作。') },
      { role: 'ask', text: pick(asks, 2, `想看《${p.title}》更完整的拆解，留言「书摘」。`) }
    ].map(x => assignSpeaker(x, R));
  }

  /* 送给 Model Router 的模板变数。
   * line_1..line_5 按固定结构顺序，speaker 明写是谁，避免形式一（主理人回答）
   * 被后端按「host 一定先讲」的旧假设念反。host_line_* / guest_line_* 保留给
   * 既有的固定访谈模板，只有在主理人负责提问时才对得上，因此按形式给。 */
  function conversationVariables(lines, p) {
    const fixed = fixedConversation(lines, p);
    const R = interviewRoles(p);
    const vars = {
      book_title: p.title || '',
      book_author: p.author || '',
      interview_format: R.fmt.id,
      asker: R.asker,
      asker_name: R.askerName,
      answerer: R.answerer,
      answerer_name: R.answererName
    };
    fixed.forEach((l, i) => {
      vars[`line_${i + 1}`] = l.text;
      vars[`line_${i + 1}_speaker`] = l.speaker;
    });
    const asks = fixed.filter(l => l.role === 'ask').map(l => l.text);
    const answers = fixed.filter(l => l.role === 'answer').map(l => l.text);
    if (R.fmt.hostAsks) {
      Object.assign(vars, {
        host_line_1: asks[0], guest_line_1: answers[0],
        host_line_2: asks[1], guest_line_2: answers[1], host_line_3: asks[2]
      });
    } else {
      Object.assign(vars, {
        guest_line_1: asks[0], host_line_1: answers[0],
        guest_line_2: asks[1], host_line_2: answers[1], guest_line_3: asks[2]
      });
    }
    return vars;
  }

  function genVideoModal(id) {
    const hit = findVideo(id);
    if (!hit) return;
    const { v, p } = hit;
    const pa = STORE.s.persona;
    const avLabel = pa.realAvatarMode === 'image' ? '你上传的照片' : (pa.realAvatarName || '');
    const voLabel = pa.realVoiceName || '';

    if (!avLabel || !voLabel) {
      return modal('还没选好数字人和声音', `
        <div class="explain" style="margin:0;border-left-color:var(--amber)">
          <div class="ex-r"><span class="ex-k">缺什么</span><span>
            形象：<b>${avLabel ? esc(avLabel) : '还没选'}</b>　声音：<b>${voLabel ? esc(voLabel) : '还没选'}</b></span></div>
          <div class="ex-r"><span class="ex-k">为什么要先选</span><span>影片里出现的那张脸、那个声音，就是这里选的。两个都选好才做得出影片。</span></div>
        </div>`,
        `<button class="btn" onclick="UI.closeModal()">取消</button>
         <button class="btn btn-primary" data-modal-act="goto-persona">去选形象和声音</button>`);
    }

    const format = v.format || defaultVideoMode();
    if (format === 'conversation') {
      const R = interviewRoles(p);
      const fmt = R.fmt;
      const lines = scriptToConversation(v, p);
      const guestAuto = !pa.guestAvatarId || !pa.guestVoiceId;
      const chr = guestCharacterOf(p);
      const charMissing = fmt.id === 'character' && !chr;
      return modal('要真的生成这支访谈对谈影片吗？', `
        <div style="font-size:16px;font-weight:700;line-height:1.5;margin-bottom:12px">${esc(v.title)}</div>
        <div class="explain" style="margin:0 0 14px;border-left-color:var(--violet)">
          <div class="ex-r"><span class="ex-k">这支是什么形式</span><span><b>${esc(fmt.name)}</b>　
            ${esc(R.askerName)} 负责问，${esc(R.answererName)} 负责答，机位在两人之间来回切。</span></div>
          <div class="ex-r"><span class="ex-k">会送到哪里</span><span>Model Router <b>/v1/tasks</b>，任务类型 <b>conversation_video</b>。BookReel 不直接接第三方金钥。</span></div>
          <div class="ex-r"><span class="ex-k">你自己（主理人）</span><span>形象 <b>${esc(avLabel)}</b>　声音 <b>${esc(voLabel)}</b>　这支里负责<b>${fmt.hostAsks ? '提问' : '回答'}</b></span></div>
          <div class="ex-r"><span class="ex-k">对面那位</span><span>${esc(R.guestName)}　Avatar <b>${esc((chr && chr.portraitUrl) ? '书中角色定妆照' : (pa.guestAvatarId || 'Model Router 自动配'))}</b>　Voice <b>${esc(pa.guestVoiceId || 'Model Router 自动配')}</b></span></div>
          <div class="ex-r"><span class="ex-k">要等多久</span><span>对谈要分段生成再剪辑，通常比单人口播久。完成后要回传不失效的 MP4 URL。</span></div>
          ${charMissing ? '<div class="ex-r"><span class="ex-k" style="color:var(--amber)">缺角色</span><span>这本书还没有任何书中角色，对面会变成一个没有依据的陌生人。建议先去「创意分镜 · 书中角色」读出角色并生成定妆照。</span></div>' : ''}
          ${guestAuto && !chr ? '<div class="ex-r"><span class="ex-k">提醒</span><span>对方的 Avatar / Voice 目前空白，会交给 Model Router 自动配；要固定同一个人，请回「数字人 / 声音」填 ID。</span></div>' : ''}
        </div>
        <div class="row2">
          <div class="field"><div class="label">访谈场景</div>
            <select class="input" id="gv-scene">
              ${[
                ['professional_interview_room', '专业访谈室'],
                ['street_interview', '马路街访'],
                ['car_conversation', '车内聊天'],
                ['bookstore_talk', '书店圆桌'],
                ['podcast_studio', '播客录音室']
              ].map(x => `<option value="${x[0]}" ${pa.conversationScene === x[0] ? 'selected' : ''}>${x[1]}</option>`).join('')}
            </select></div>
          <div class="field"><div class="label">片长</div>
            <input class="input" id="gv-duration" type="number" min="15" max="180" step="5" value="${Number(v.duration) || defaultVideoDuration()}"></div>
        </div>
        <div class="field"><div class="label">固定 5 段一问一答（可以改，前面的名字决定这句谁讲）</div>
          <textarea class="input" id="gv-dialogue" style="min-height:190px;line-height:1.75">${esc(conversationToText(lines, R))}</textarea></div>
        <div class="hint">固定结构：${esc(R.askerName)}开场 → ${esc(R.answererName)}回答 → ${esc(R.askerName)}追问 → ${esc(R.answererName)}补充 → ${esc(R.askerName)} CTA。
          送出时会转成 line_1…line_5 并标明每一句是谁讲的，模板 <b>${esc(pa.conversationTemplateId || fmt.templateId)}</b>。</div>`,
        `<button class="btn" onclick="UI.closeModal()">取消</button>
         <button class="btn btn-primary" data-modal-act="confirm-conversation-video" data-id="${esc(id)}">确认生成对谈影片（会扣钱）</button>`, true);
    }

    const text = scriptToSpeech(v, p);
    modal('要真的生成这一支影片吗？', `
      <div style="font-size:16px;font-weight:700;line-height:1.5;margin-bottom:12px">${esc(v.title)}</div>
      <div class="explain" style="margin:0 0 14px">
        <div class="ex-r"><span class="ex-k">会用谁</span><span>形象 <b>${esc(avLabel)}</b>　声音 <b>${esc(voLabel)}</b></span></div>
        <div class="ex-r"><span class="ex-k">会花多少</span><span><b style="color:var(--amber)">这一步真的会产生费用</b>，一支约 US$1-3，从你的额度扣。做出来之后无法退。</span></div>
        <div class="ex-r"><span class="ex-k">要等多久</span><span>通常 1-3 分钟。送出后你可以关掉这个窗、去看别的，做好了会自己更新。</span></div>
        <div class="ex-r"><span class="ex-k">出来会是什么</span><span>一支<b>单人口播</b>短片——<b>${esc(avLabel)}</b>对着镜头，用<b>${esc(voLabel)}</b>把下面这段话讲完。稿子写的就是成品的样子。</span></div>
      </div>
      <div class="field"><div class="label">实际要念的台词（可以改）</div>
        <textarea class="input" id="gv-text" style="min-height:120px;line-height:1.75">${esc(text)}</textarea></div>
      <div class="hint">约 ${text.length} 字。太长会让影片变长、费用变高，可以自行删减。</div>`,
      `<button class="btn" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-primary" data-modal-act="confirm-gen-video" data-id="${esc(id)}">确认生成（会扣钱）</button>`);
  }

  async function doGenVideo(id) {
    const hit = findVideo(id);
    if (!hit) return;
    const { v } = hit;
    if (videoJobs[id]) return toast('这一支已经在生成中了', 'warn');

    const ta = $('#gv-text');
    const text = ta ? ta.value.trim() : '';
    closeModal();
    if (!text) return toast('台词是空的，没东西可念', 'warn');

    toast('已送出，生成中，通常 1-3 分钟', 'ok');
    try { await submitVideo(id, text); }
    catch (e) { toast('送出失败：' + e.message, 'err'); }
  }

  /* 目前选中的形象叫什么——形象库里的就用库里的名字，
   * 不要一律写「你上传的照片」，那对提示词生成出来的形象是错的。 */
  function currentAvatarLabel() {
    const pa = STORE.s.persona;
    if (pa.realAvatarMode !== 'image') return pa.realAvatarName || '';
    const hit = (pa.avatarLib || []).find(x => x.assetId === pa.realPhotoAssetId);
    return hit ? hit.name : '你上传的照片';
  }

  /* 送出一支影片并开始轮询。逐支生成与批量生成共用这一段——
   * 只有一条送出路径，之后要改重试或计费才不会漏改其中一边。
   * 失败时把状态写成「生成失败」并往外抛，让呼叫端决定要不要继续。 */
  async function submitVideo(id, text) {
    const hit = findVideo(id);
    if (!hit) throw new Error('找不到这一支影片');
    const { v } = hit;
    // 额度是花钱的闸门。以前只是显示，用满了照样能一直生成，账单会失控。
    if (quotaLeft() <= 0) throw new Error('本月额度已用完（可到「系统设置 → 用量与额度」调高上限）');
    const pa = STORE.s.persona;
    videoJobs[id] = true;
    v.status = '生成中'; v.error = null;
    v.avatarName = currentAvatarLabel();
    v.voiceName = pa.realVoiceName || '';
    STORE.update(); render();
    try {
      const r = await hgFetch('/api/heygen/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: pa.realAvatarMode || 'avatar',
          avatarId: pa.realAvatarId, assetId: pa.realPhotoAssetId,
          voiceId: pa.realVoiceId, text,
          voiceSettings: voiceSettings()
        })
      });
      v.heygenId = r.videoId;
      STORE.update();
      STORE.log('ok', `送出生成：${v.title}`);
      pollVideo(id);
    } catch (e) {
      delete videoJobs[id];
      v.status = '生成失败'; v.error = e.message;
      STORE.update(); render();
      throw e;
    }
  }


  /* ============================================================
   * 批量生成
   *
   * 一本书通常有十几支待生成，一支一支点太累。但也不能按一下就
   * 全部送出去——这是真的花钱，而且一次送太多会撞到服务端限流。
   * 所以：预设只跑前 5 支、同时最多 2 支在跑、每一支都看得到结果，
   * 中途可以停。
   * ========================================================== */
  /* 声音设定：内建 TTS 预设念起来偏平，这三个值能拉回来一些。
   * 预设不是平台预设值，而是实测比较不像机器的组合——
   * 稳定度调低会有起伏，情绪强度拉高一点会有语气。 */
  /* c 传进来时用这个人物自己的语速。
   * 为什么需要：声音清单只有性别、没有年龄，七十一岁的角色配到的
   * 「台湾腔男声」听起来还是三十几岁。语速是我们唯一真的能压低年龄感
   * 的旋钮——放慢到 0.85-0.9 会明显变沉、变老。一本书里的人物年龄
   * 差很多，这个一定要能各自设，不能共用同一个。 */
  function voiceSettings(c) {
    const p = STORE.s.persona;
    if (c && c.voiceSpeed != null) {
      return {
        speed: Number(c.voiceSpeed),
        stability: p.voiceStability == null ? 0.4 : Number(p.voiceStability),
        style: p.voiceStyle == null ? 0.35 : Number(p.voiceStyle)
      };
    }
    return {
      speed: p.voiceSpeed == null ? 1 : Number(p.voiceSpeed),
      stability: p.voiceStability == null ? 0.4 : Number(p.voiceStability),
      style: p.voiceStyle == null ? 0.35 : Number(p.voiceStyle)
    };
  }

  /* 数位人影片按秒计费，参考单价约 US$0.05/秒（依供应商方案而异）。
   * 这是估算不是帐单——真正的数字以供应商后台为准，所以显示时要讲明白。 */
  const USD_PER_SEC = 0.05;

  function videoCost(v) {
    const sec = Number(v && v.realDuration);
    if (!sec) return null;
    return { sec, usd: sec * USD_PER_SEC };
  }

  function videoCostHtml(v) {
    const c = videoCost(v);
    if (!c) {
      return v && v.videoUrl
        ? '<span class="hint">时长未记录，无法估算费用</span>'
        : '';
    }
    return `<span class="hint">实际时长 <b>${c.sec.toFixed(1)} 秒</b>　估算费用 <b>约 US$${c.usd.toFixed(2)}</b>
      <span style="opacity:.7">（按 US$${USD_PER_SEC}/秒 估，实际以供应商帐单为准）</span></span>`;
  }

  /* 旧影片没存过时长，开详情时补查一次。这支查询是唯读、免费的。 */
  async function backfillDuration(v) {
    if (!v || v.realDuration || !v.heygenId || !v.videoUrl) return;
    try {
      const s = await hgFetch('/api/status?service=heygen-video&id=' + encodeURIComponent(v.heygenId));
      if (s && s.duration) { v.realDuration = Number(s.duration); STORE.update(); render(); }
    } catch (e) { /* 补查失败就算了，不要因为这个打断看影片 */ }
  }

  function quotaLeft() {
    const st = STORE.s.settings;
    return Math.max(0, (st.quotaTotal || 0) - (st.quotaUsed || 0));
  }

  const BATCH = { running: false, stop: false };
  const BATCH_CONCURRENCY = 2;

  function batchPending() {
    const p = STORE.current;
    return (p.videos || []).filter(v => (v.status === '待生成' || v.status === '生成失败') && !videoJobs[v.id]);
  }

  function batchGenModal() {
    if (BATCH.running) return toast('已经有一批在跑了', 'warn');
    if (!hgCanWrite()) return hgDemoNotice();
    const pa = STORE.s.persona;
    if (!pa.realVoiceId) return toast('还没选声音，先去「数字人 · 声音」选一个', 'err');
    if (pa.realAvatarMode === 'image' ? !pa.realPhotoAssetId : !pa.realAvatarId) {
      return toast('还没选形象，先去「数字人 · 声音」选一个', 'err');
    }
    const list = batchPending();
    if (!list.length) return toast('没有待生成的影片', 'warn');

    const left = quotaLeft();
    if (left <= 0) return toast('本月额度已用完，可到「系统设置 → 用量与额度」调高上限', 'err');

    const failed = list.filter(v => v.status === '生成失败').length;
    const fresh = list.length - failed;
    // 能跑几支同时受「待处理数量」与「剩余额度」两个上限夹制
    const cap = Math.min(list.length, left);
    const def = Math.min(5, cap);
    modal('批量生成影片', `
      <div class="explain" style="margin:0 0 14px">
        <div class="ex-r"><span class="ex-k">会用谁</span><span>形象 <b>${esc(currentAvatarLabel())}</b>　声音 <b>${esc(pa.realVoiceName || '')}</b></span></div>
        <div class="ex-r"><span class="ex-k">会花多少</span><span><b style="color:var(--amber)">真的会扣钱</b>，一支约 US$1-3。跑 <b id="bg-n-echo">${def}</b> 支大约 <b id="bg-cost">US$${def}-${def * 3}</b>。</span></div>
        <div class="ex-r"><span class="ex-k">怎么跑</span><span>一次最多 ${BATCH_CONCURRENCY} 支同时进行，跑完一支接一支。中途可以按「停止」，已经送出去的那几支不会取消。</span></div>
      </div>
      <div class="field">
        <div class="label">这一批要跑几支<span class="hint" style="margin-left:8px;font-weight:400">待处理 ${list.length} 支${failed ? `（其中 ${failed} 支是上次失败要重试的）` : ''}　剩余额度 ${left} 支</span></div>
        <input class="input" type="number" id="bg-n" min="1" max="${cap}" value="${def}"
          oninput="(function(el){var n=Math.max(1,Math.min(${cap},+el.value||1));
            document.getElementById('bg-n-echo').textContent=n;
            document.getElementById('bg-cost').textContent='US$'+n+'-'+(n*3);})(this)">
      </div>
      <div class="hint">建议先跑 3-5 支看效果，满意再跑剩下的。稿子有问题的话，跑完整批才发现会很浪费。</div>
      <div id="bg-log" style="margin-top:14px"></div>`,
      `<button class="btn" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-primary" data-modal-act="bg-run">开始生成（会扣钱）</button>`);
  }

  async function batchGenRun() {
    const input = $('#bg-n');
    const list = batchPending();
    const n = Math.max(1, Math.min(list.length, quotaLeft(), +(input && input.value) || 1));
    const targets = list.slice(0, n);
    closeModal();

    BATCH.running = true; BATCH.stop = false;
    toast(`开始批量生成 ${targets.length} 支`, 'ok');
    STORE.log('run', `批量生成开始：${targets.length} 支`);

    let ok = 0, fail = 0, queue = targets.slice();
    const worker = async () => {
      while (queue.length && !BATCH.stop) {
        const v = queue.shift();
        const text = scriptToSpeech(v, STORE.current);
        if (!text || !text.trim()) { fail++; STORE.log('warn', `跳过（没有台词）：${v.title}`); continue; }
        try { await submitVideo(v.id, text); ok++; }
        catch (e) {
          fail++; STORE.log('err', `送出失败：${v.title} — ${e.message}`);
          // 额度用完就整批停住，继续送只会一支一支全部失败
          if (/额度/.test(e.message || '')) { BATCH.stop = true; }
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(BATCH_CONCURRENCY, targets.length) }, worker));

    BATCH.running = false;
    const stopped = BATCH.stop ? '（中途停止）' : '';
    STORE.log(fail ? 'warn' : 'ok', `批量生成送出完毕${stopped}：成功 ${ok} 支、失败 ${fail} 支`);
    toast(`送出完毕${stopped}：成功 ${ok}、失败 ${fail}。影片还在生成，好了会自己更新`, fail ? 'warn' : 'ok');
    render();
  }

  async function aipTask(payload) {
    return hgFetchSlow('/api/ai-platform/tasks', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }, 30000);
  }

  async function aipStatus(taskId) {
    return hgFetch('/api/ai-platform/tasks/' + encodeURIComponent(taskId), null, 20000);
  }

  function taskResult(body) {
    return body && (body.result || body.data || body.task || body);
  }

  function taskIdOf(body) {
    const r = taskResult(body) || {};
    return r.id || r.task_id || r.taskId || r.job_id || body?.id || body?.task_id || body?.taskId;
  }

  function taskStatusOf(body) {
    const r = taskResult(body) || {};
    return String(r.status || body?.status || '').toLowerCase();
  }

  function taskErrorOf(body) {
    const r = taskResult(body) || {};
    return r.error || r.message || body?.error || body?.message || '';
  }

  function taskVideoUrlOf(body) {
    const r = taskResult(body) || {};
    const a = r.completed_assets || r.completedAssets || r.assets || r.output || body?.completed_assets || {};
    return a.final_video_url || a.conversation_video_url || a.avatar_video_url || a.video_url ||
      r.final_video_url || r.conversation_video_url || r.avatar_video_url || r.video_url || r.url || body?.videoUrl;
  }

  function isTaskDone(status) {
    return ['completed', 'complete', 'succeeded', 'success', 'done'].includes(status);
  }

  function isTaskFailed(status) {
    return ['failed', 'error', 'canceled', 'cancelled'].includes(status);
  }

  async function doGenConversationVideo(id) {
    const hit = findVideo(id);
    if (!hit) return;
    const { v, p } = hit;
    if (videoJobs[id]) return toast('这一支已经在生成中了', 'warn');

    const R = interviewRoles(p);
    const fmt = R.fmt;
    const dialogue = fixedConversation(parseConversationText(($('#gv-dialogue') || {}).value || '', R), p);
    const variables = conversationVariables(dialogue, p);
    const scene = (($('#gv-scene') || {}).value || STORE.s.persona.conversationScene || 'professional_interview_room');
    const duration = clampDuration((($('#gv-duration') || {}).value) || v.duration || defaultVideoDuration());
    closeModal();
    if (!variables.line_1 || !variables.line_2) return toast('对谈至少要有一问一答', 'warn');

    const pa = STORE.s.persona;
    const hostAvatar = pa.realAvatarMode === 'image'
      ? { mode: 'image', asset_id: pa.realPhotoAssetId, name: '你上传的照片' }
      : { mode: 'avatar', avatar_id: pa.realAvatarId, name: pa.realAvatarName || STORE.s.account.name };
    /* 书中主角形式：把定妆照和外貌描述一起送过去，成片里的脸才会跟
     * 「书中角色」那一段已经确认过的角色一致，而不是另外长一张。 */
    const chr = guestCharacterOf(p);
    const guestAvatar = chr && chr.portraitUrl
      ? { mode: 'image', image_url: chr.portraitUrl, name: chr.name || R.guestName, look: chr.look || '' }
      : { mode: 'avatar', avatar_id: pa.guestAvatarId || 'auto', name: R.guestName };
    const payload = {
      task: 'conversation_video',
      template_id: pa.conversationTemplateId || fmt.templateId,
      interview_format: fmt.id,
      quality: 'balanced',
      ratio: v.ratio || '9:16',
      duration_seconds: duration,
      callback_id: `bookreel_${v.id}`,
      scene,
      title: v.title,
      source: {
        app: 'bookreel',
        project_id: p.id,
        script_id: v.scriptId,
        book: { title: p.title, author: p.author, publisher: p.publisher }
      },
      variables,
      speakers: [
        { id: 'host', role: 'host', turn: fmt.hostAsks ? 'asker' : 'answerer',
          name: STORE.s.account.name || '主理人', avatar: hostAvatar, voice_id: pa.realVoiceId, voice_name: pa.realVoiceName },
        { id: 'guest', role: fmt.id === 'author' ? 'author' : (fmt.id === 'character' ? 'book_character' : 'ai_interviewer'),
          turn: fmt.hostAsks ? 'answerer' : 'asker',
          name: R.guestName, avatar: guestAvatar, avatar_id: (chr && chr.portraitUrl) ? undefined : (pa.guestAvatarId || 'auto'), voice_id: pa.guestVoiceId || 'auto' }
      ],
      dialogue,
      output: {
        format: 'mp4',
        store: true,
        completed_assets: ['final_video_url', 'conversation_video_url']
      }
    };

    videoJobs[id] = true;
    v.status = '生成中'; v.error = null; v.format = 'conversation'; v.duration = duration;
    v.interviewFormat = fmt.id;
    v.avatarName = `${STORE.s.account.name || '主理人'} + ${R.guestName}`;
    v.voiceName = `${pa.realVoiceName || '主理人声音'} + ${pa.guestVoiceId ? '对方声音' : 'Model Router 自动配音'}`;
    STORE.update(); render();
    toast(`${fmt.name} 对谈影片已送出，等待 Model Router 生成`, 'ok');

    try {
      const created = await aipTask(payload);
      const url = taskVideoUrlOf(created);
      if (url) {
        delete videoJobs[id];
        v.status = '已生成'; v.videoUrl = url; v.aiPlatformTaskId = taskIdOf(created) || '';
        STORE.update(); render();
        toast('对谈影片已生成', 'ok');
        return;
      }
      const taskId = taskIdOf(created);
      if (!taskId) throw new Error('Model Router 没有回传 result.id / task_id，无法轮询');
      v.aiPlatformTaskId = taskId;
      STORE.update();
      STORE.log('ok', `送出对谈影片（${fmt.name}）：${v.title}`);
      pollAiPlatformVideo(id);
    } catch (e) {
      delete videoJobs[id];
      v.status = '生成失败'; v.error = e.message;
      STORE.update(); render();
      toast('对谈影片送出失败：' + e.message, 'err');
    }
  }

  function pollAiPlatformVideo(id) {
    const tick = async () => {
      const hit = findVideo(id);
      if (!hit) { delete videoJobs[id]; return; }
      const { v } = hit;
      if (!v.aiPlatformTaskId) { delete videoJobs[id]; return; }
      try {
        const s = await aipStatus(v.aiPlatformTaskId);
        const status = taskStatusOf(s);
        const url = taskVideoUrlOf(s);
        if ((isTaskDone(status) && url) || url) {
          delete videoJobs[id];
          v.status = '已生成'; v.videoUrl = url;
          const st = STORE.s.settings;
          st.quotaUsed = Math.min(st.quotaTotal, st.quotaUsed + 1);
          STORE.update(); render();
          STORE.log('ok', `对谈影片已生成：${v.title}`);
          toast(`《${v.title}》对谈影片已生成好了`, 'ok');
          return;
        }
        if (isTaskFailed(status)) {
          delete videoJobs[id];
          v.status = '生成失败'; v.error = taskErrorOf(s) || 'Model Router 回报失败';
          STORE.update(); render();
          toast('对谈影片生成失败：' + v.error, 'err');
          return;
        }
        setTimeout(tick, 6000);
      } catch (e) {
        setTimeout(tick, 9000);
      }
    };
    tick();
  }

  function pollVideo(id) {
    const tick = async () => {
      const hit = findVideo(id);
      if (!hit) { delete videoJobs[id]; return; }   // 项目被删了
      const { v } = hit;
      if (!v.heygenId) { delete videoJobs[id]; return; }
      try {
        const s = await hgFetch('/api/status?service=heygen-video&id=' + encodeURIComponent(v.heygenId));
        if (s.status === 'completed' && s.videoUrl) {
          delete videoJobs[id];
          v.status = '已生成'; v.videoUrl = s.videoUrl;
          /* 时长要存。它是算钱的唯一依据，而状态查询本来就有回传，
           * 以前直接丢掉，事后就再也答不出「这支花了多少钱」。 */
          if (s.duration) v.realDuration = Number(s.duration);
          // 额度只在这里扣：影片真的做出来了才算用掉一支
          const st = STORE.s.settings;
          st.quotaUsed = Math.min(st.quotaTotal, st.quotaUsed + 1);
          STORE.update(); render();
          STORE.log('ok', `影片已生成：${v.title}`);
          toast(`《${v.title}》已生成好了`, 'ok');
          return;
        }
        if (s.status === 'failed') {
          delete videoJobs[id];
          v.status = '生成失败'; v.error = s.error || '未知原因';
          STORE.update(); render();
          toast('生成失败：' + v.error, 'err');
          return;
        }
        setTimeout(tick, 5000);
      } catch (e) {
        // 查询失败通常是暂时的（网络断一下），继续再试，不要直接判死
        setTimeout(tick, 8000);
      }
    };
    tick();
  }

  /* 页面重新载入时，把「上次关掉页面时还在生成」的那几支接回来继续查。
   * 没有这段的话，重整一次就永远卡在「生成中」。 */
  function resumePendingVideos() {
    STORE.s.projects.forEach(p => (p.videos || []).forEach(v => {
      if (v.status === '生成中' && v.heygenId && !videoJobs[v.id]) {
        videoJobs[v.id] = true;
        pollVideo(v.id);
      }
      if (v.status === '生成中' && v.aiPlatformTaskId && !videoJobs[v.id]) {
        videoJobs[v.id] = true;
        pollAiPlatformVideo(v.id);
      }
    }));
    // 人物自述影片同理：重整一次就永远卡在「生成中」的话，等于影片凭空消失
    STORE.s.projects.forEach(p => (p.characters || []).forEach(c => {
      if (c.videoStatus === '生成中' && c.heygenId && c.id && !charJobs[c.id]) {
        charJobs[c.id] = true;
        pollCharVideo(p.id, c.id);
      }
    }));
  }

  async function ytDoUpload(schedId, btn) {
    const f = $('#yt-file').files[0];
    if (!f) return toast('请先选一个影片档', 'warn');
    const box = $('#yt-progress');
    btn.disabled = true;
    const line = t => { box.innerHTML += `<div class="hint" style="margin-top:6px">${esc(t)}</div>`; };
    box.innerHTML = '<div class="label" style="margin-top:14px">上传进度</div>';
    line(`档案：${f.name}（${(f.size / 1048576).toFixed(1)} MB）`);
    try {
      const q = new URLSearchParams({
        title: $('#yt-title').value, description: $('#yt-desc').value,
        privacy: $('#yt-privacy').value, mime: f.type || 'video/mp4'
      });
      const r = await fetch(igBase() + '/api/youtube/upload?' + q, {
        method: 'POST', headers: { 'Content-Type': f.type || 'video/mp4' }, body: f
      });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      let last = '';
      const timer = setInterval(async () => {
        try {
          const s = await igFetch('/api/publish/' + j.jobId);
          if (s.step !== last) { last = s.step; line('· ' + s.step); }
          if (s.state === 'done') {
            clearInterval(timer);
            line('✔ 已上传，状态：' + (s.privacyStatus || '未知'));
            if (s.forcedPrivate) line('⚠ 专案尚未过稽核，影片被强制设为私人');
            box.innerHTML += `<div style="margin-top:8px"><a class="btn btn-sm" href="${esc(s.link)}" target="_blank">在 YouTube 上查看 →</a></div>`;
            const it = STORE.s.schedule.find(x => x.id === schedId);
            if (it) { it.status = '已发布'; syncVideoStatus(it, true); STORE.log('ok', `YouTube 上传：${it.title}`); STORE.update(); render(); }
            toast('已上传到 YouTube', 'ok');
          }
          if (s.state === 'error') {
            clearInterval(timer); btn.disabled = false; line('✘ ' + s.error);
            if (s.detail) box.innerHTML += `<div class="hint" style="color:var(--amber);margin-top:6px"><code style="font-size:13px">${esc(JSON.stringify(s.detail))}</code></div>`;
          }
        } catch (e) { clearInterval(timer); btn.disabled = false; line('✘ ' + e.message); }
      }, 1500);
    } catch (e) { btn.disabled = false; line('✘ ' + e.message); }
  }

  /* ---------------- 真实档案上传 ---------------- */
  const KB = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

  function readAsText(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error('读取失败'));
      r.readAsText(file, 'UTF-8');
    });
  }

  /* 把抽出来的内文收进专案：摘要用的统计放主状态，整本原文另存一个 key。
   * 同一本书传第二个档案（例如正文 + 附录）就接在后面，不是覆盖掉。 */
  function takeBookText(p, text, item, kindLabel) {
    const old = STORE.getBookText(p.id);
    const full = old ? (old + '\n\n' + text) : text;
    const saved = STORE.setBookText(p.id, full);
    const r = DATA.parseText(full);
    p.parsed = r;
    if (!p.source) p.source = { kind: 'text', label: kindLabel + '本地解析' };
    /* 建位置索引。只存数字（章节在第几个字、每段在第几个字），不复制
     * 文字——原文本来就存着了，再存一份会把浏览器空间撑爆。
     * 有了它，写稿才有原文可依据，也才回溯得到出处。 */
    try {
      p.bookIndex = window.BOOKLIB ? BOOKLIB.buildIndex(full) : null;
    } catch (e) { p.bookIndex = null; }

    item.type = kindLabel; item.status = '已解析';
    item.note = `${r.chars.toLocaleString()} 字 · ${r.chapters.length} 个章节标题 · 候选金句 ${r.quotes.length} 条`;
    if (p.bookIndex) item.note += ` · 原文片段 ${p.bookIndex.segs.length} 段（可检索）`;
    if (saved === false) item.note += ' · ⚠ 浏览器空间不足，整本原文没能留住，AI 只会读到开头那一段';
    else if (typeof saved === 'number') item.note += ` · ⚠ 浏览器空间不足，只留住前 ${saved.toLocaleString()} 字`;
  }

  async function handleFiles(files) {
    const p = STORE.current;
    if (!p) return;
    let imported = 0, parsed = 0;

    for (const f of Array.from(files)) {
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      const item = { name: f.name, size: KB(f.size), bytes: f.size, ext };

      if (f.size > 200 * 1024 * 1024) {
        item.type = '过大'; item.status = '未处理'; item.note = '超过 200MB 上限';
        p.materials.push(item); continue;
      }

      try {
        if (ext === 'json') {
          const text = await readAsText(f);
          const json = JSON.parse(text);
          const r = DATA.importProfile(json, p);
          if (!r.ok) { item.type = 'JSON'; item.status = '格式错误'; item.note = r.msg; }
          else {
            item.type = '书籍档案'; item.status = '已汇入';
            item.note = Object.keys(r.stat).map(k => `${k} ${r.stat[k]}`).join(' · ');
            imported++;
          }
        } else if (ext === 'txt' || ext === 'md') {
          takeBookText(p, await readAsText(f), item, '内文');
          parsed++;
        } else if (PARSE.EXT_LABEL[ext]) {
          /* PDF / Word / EPUB / 简报：真的在浏览器里拆开抽文字。
           * 出版社手上就是 PDF，这一格以前写「待服务端解析」，
           * 等于整条流水线的入口是空的。 */
          const r = await PARSE.file(f);
          takeBookText(p, r.text, item, r.kind);
          parsed++;
        } else {
          item.type = { jpg: '图片', jpeg: '图片', png: '图片', svg: '图片' }[ext] || '其他';
          item.status = '已加入';
          item.note = '图片与其他素材只登记，不抽文字';
        }
      } catch (e) {
        item.type = ext.toUpperCase(); item.status = '读取失败'; item.note = e.message;
      }
      p.materials.push(item);
    }

    if (imported) p.progress = Math.max(p.progress, 12);
    STORE.update(); render();
    const msg = imported ? `已汇入书籍档案：《${p.title}》`
      : parsed ? '内文已完成本地解析'
        : `已加入 ${files.length} 个档案`;
    toast(msg, 'ok');
    if (imported) STORE.log('ok', `汇入书籍档案《${p.title}》`);
  }

        <div class="field"><div class="label">声音配置</div>
          <div style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.9;white-space:pre-wrap">${esc(voiceText || '未配置')}</div></div>
      </div>
      <div class="field"><div class="label">口播稿　<span class="hint" style="font-weight:400">这就是数字人会念的内容。可以直接改，也可以整段贴上你自己写的稿子</span></div>
        <textarea class="input" id="sm-speech" rows="10"
          style="line-height:1.95;white-space:pre-wrap">${esc(s.manualSpeech || plainSpeech || s.body || '')}</textarea>

          存档之后，生成影片就会念你改的版本，不会再被 AI 覆盖。
          ${s.manualSpeech ? '目前用的是<b>你手动改过的版本</b>。' : ''}
        </div></div>

      <div class="label" style="margin-top:18px">分镜表</div>

        <div class="shot-n">${String(i + 1).padStart(2, '0')}</div>
        <div><div style="font-size:14px;color:var(--violet-2);font-weight:650;margin-bottom:3px">${sh.t}</div>
          <div class="shot-t">${esc(sh.txt)}</div>

      </div>`).join('')}`,
      `<button class="btn" data-act="copy" data-t="${esc(full)}" onclick="UI.copy(this.dataset.t)">复制全文</button>
       <button class="btn" data-modal-act="ai-rewrite" data-id="${s.id}">✨ 用真实 AI 重写</button>
       ${s.manualSpeech ? `<button class="btn" data-modal-act="revert-script" data-id="${esc(s.id)}">还原成 AI 版本</button>` : ''}
       <button class="btn btn-primary" data-modal-act="save-script" data-id="${esc(s.id)}">保存口播稿</button>
       <button class="btn" onclick="UI.closeModal()">关闭</button>`, true);

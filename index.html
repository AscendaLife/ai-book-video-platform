  async function handleFiles(files) {
    const p = STORE.current;
    if (!p) return;
    let imported = 0, parsed = 0;

    for (const f of Array.from(files)) {
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      const item = { name: f.name, size: KB(f.size), bytes: f.size, ext };

      if (f.size > 200 * 1024 * 1024) {
        item.type = '过大'; item.status = '未处理'; item.note = '超过 200MB 上限';
        p.materials.push(item); continue;
      }

      try {
        if (ext === 'json') {
          const text = await readAsText(f);
          const json = JSON.parse(text);
          const r = DATA.importProfile(json, p);
          if (!r.ok) { item.type = 'JSON'; item.status = '格式错误'; item.note = r.msg; }
          else {
            item.type = '书籍档案'; item.status = '已汇入';
            item.note = Object.keys(r.stat).map(k => `${k} ${r.stat[k]}`).join(' · ');
            imported++;
          }
        } else if (ext === 'txt' || ext === 'md') {
          const text = await readAsText(f);
          const r = DATA.parseText(text);
          p.parsed = r;
          item.type = '内文'; item.status = '已解析';
          item.note = `${r.chars.toLocaleString()} 字 · ${r.chapters.length} 个章节标题 · 候选金句 ${r.quotes.length} 条`;
          if (!p.source) p.source = { kind: 'text', label: '内文本地解析' };
          parsed++;
        } else {
          item.type = { pdf: 'PDF', docx: '文档', epub: '电子书', pptx: '简报', jpg: '图片', jpeg: '图片', png: '图片', svg: '图片' }[ext] || '其他';
          item.status = '待服务端解析';
          item.note = '演示版不含 PDF / OCR 解析，接入后端后由解析服务处理';
        }
      } catch (e) {
        item.type = ext.toUpperCase(); item.status = '读取失败'; item.note = e.message;
      }
      p.materials.push(item);
    }

    if (imported) p.progress = Math.max(p.progress, 12);
    STORE.update(); render();
    const msg = imported ? `已汇入书籍档案：《${p.title}》`
      : parsed ? '内文已完成本地解析'
        : `已加入 ${files.length} 个档案`;
    toast(msg, 'ok');
    if (imported) STORE.log('ok', `汇入书籍档案《${p.title}》`);
  }

  /* ============================================================
   * 模拟成片播放器：真的有声音、有人物、有画面
   *   - 声音：浏览器语音合成（正式版换成主理人声音模型）
   *   - 人物：SVG 数字人，会眨眼、说话时对口型
   *   - 画面：书封入场 / 关键词大字 / B-roll / 字幕 / 片尾 CTA
   * ========================================================== */
  let pv = null;                       // 播放状态
  const mmss = s => Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2);
  const T = x => (window.I18N ? I18N.toTrad(x) : x);

  function stopPreview() {
    if (pv && pv.timer) clearInterval(pv.timer);
    try { speechSynthesis.cancel(); } catch (e) {}
    pv = null;
  }
  UI.onClose(stopPreview);

  /* 挑一个中文语音；没有就只播画面。语音清单是非同步载入的，要等 voiceschanged */
  function pickVoice() {
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { return null; }
    return vs.find(v => /zh[-_]TW|zh[-_]HK/i.test(v.lang))
      || vs.find(v => /^zh/i.test(v.lang))
      || vs.find(v => /Chinese|中文|國語|普通话/i.test(v.name))
      || null;
  }
  try {
    speechSynthesis.addEventListener('voiceschanged', () => {
      if (!pv) return;
      pv.voice = pickVoice();
      const w = document.getElementById('pv-novoice');
      if (w) w.style.display = pv.voice ? 'none' : 'block';
    });
  } catch (e) {}

  /* 依「声音来源」设定语速与音高。系统音只能模拟差异，正式版由 TTS 服务产生 */
  function voiceParams() {
    const pa = STORE.s.persona;
    let rate = 0.75 + (pa.speed / 100) * 0.6, pitch = 1;
    if (pa.voiceMode === 'library') {
      const a = DATA.VOICES.find(v => v.id === pa.voiceActor);
      if (a) { rate *= a.rate; pitch = a.pitch; }
    } else if (pa.voiceMode === 'clone') {
      rate *= 0.97; pitch = 0.95;
    }
    return { rate: Math.max(0.5, Math.min(2, rate)), pitch: Math.max(0.5, Math.min(2, pitch)) };
  }

  function utter(text) {
    const u = new SpeechSynthesisUtterance(T(text).replace(/[【】]/g, ' '));
    const v = (pv && pv.voice) || pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
    const q = voiceParams();
    u.rate = q.rate; u.pitch = q.pitch;
    return u;
  }

  function speak(text) {
    if (!pv || pv.muted || !text) return;
    try {
      speechSynthesis.cancel();
      const u = utter(text);
      u.onboundary = () => { if (pv) pv.talkPulse = 1; };
      pv.utter = u;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* 声音试听（人格页） */
  const SAMPLE_LINE = '我讲得直白一点。你不是时间不够，你是把时间花在了不产生复利的事情上。说句实在话，这件事我自己也是很晚才想明白的。';
  function tryVoice(id) {
    const pa = STORE.s.persona;
    const prev = { mode: pa.voiceMode, actor: pa.voiceActor };
    if (id && id !== 'clone' && id !== 'system') { pa.voiceMode = 'library'; pa.voiceActor = id; }
    else if (id === 'system') pa.voiceMode = 'system';
    try {
      speechSynthesis.cancel();
      const u = utter(SAMPLE_LINE);
      u.onend = () => { pa.voiceMode = prev.mode; pa.voiceActor = prev.actor; };
      u.onerror = u.onend;
      speechSynthesis.speak(u);
      const v = DATA.VOICES.find(x => x.id === id);
      toast(v ? '试听：' + v.name : id === 'clone' ? '试听：主理人本人声音（演示以系统音代替）' : '试听：系统合成音', 'ok');
      if (!pickVoice()) toast('这个浏览器没有中文语音，听不到声音', 'warn');
    } catch (e) { toast('这个浏览器不支持语音合成', 'warn'); }
    finally { pa.voiceMode = prev.mode; pa.voiceActor = prev.actor; }
  }

  const SCENE = ['open', 'point', 'broll', 'quote', 'cta'];

  function pvApplyShot(i) {
    const el = id => document.getElementById(id);
    if (!el('mv-sub')) return;
    const s = pv.shots[i];
    const kind = SCENE[Math.min(i, SCENE.length - 1)];
    el('mv-shot').textContent = T(`镜头 ${i + 1}/${pv.shots.length} · ${s.t}`);
    el('mv-sub').textContent = T(s.txt);
    el('mv-vis').textContent = T(`${s.cam}　|　${s.vis}`);
    el('mv-book').classList.toggle('show', kind === 'open' || kind === 'cta');
    el('mv-broll').classList.toggle('show', kind === 'broll');
    el('mv-kw').classList.toggle('show', kind === 'quote');
    el('mv-cta').classList.toggle('show', kind === 'cta');
    if (kind === 'quote') el('mv-kw').textContent = T(s.txt);
    el('mv-person').classList.toggle('far', kind === 'broll' || kind === 'quote');
    document.querySelectorAll('#pv-shots .shot').forEach((e, n) => e.classList.toggle('on', n === i));
    speak(s.txt);
  }

  function pvFrame() {
    if (!pv) return;
    const ts = performance.now();
    const el = id => document.getElementById(id);
    if (!el('mv-sub')) { stopPreview(); return; }

    if (pv.playing) {
      const dt = pv.last ? Math.min(0.5, (ts - pv.last) / 1000) : 0;   // 分页被节流时不要一次跳太多
      pv.last = ts;
      pv.t = Math.min(pv.dur, pv.t + dt);
      let i = pv.shots.findIndex(s => pv.t < s.t1);
      if (i < 0) i = pv.shots.length - 1;
      if (i !== pv.shot) { pv.shot = i; pvApplyShot(i); }
      el('pv-time').textContent = `${mmss(pv.t)} / ${mmss(pv.dur)}`;
      el('pv-bar').style.width = (pv.t / pv.dur * 100) + '%';
      if (pv.t >= pv.dur) {
        pv.playing = false;
        try { speechSynthesis.cancel(); } catch (e) {}
        const b = el('pv-play'); if (b) { b.textContent = '↻'; b.classList.remove('hide'); }
      }
    }

    /* 口型与眨眼 */
    let talking = false;
    try { talking = pv.playing && !pv.muted && speechSynthesis.speaking; } catch (e) {}
    if (pv.playing && pv.muted) talking = true;          // 静音时也让嘴动，画面才不呆
    pv.talkPulse = Math.max(0, (pv.talkPulse || 0) - 0.06);
    const mouth = el('mv-mouth');
    if (mouth) {
      const open = talking ? 1.6 + Math.sin(ts / 70) * 1.1 + pv.talkPulse * 2.2 : 0.6;
      mouth.setAttribute('ry', Math.max(0.6, open).toFixed(2));
    }
    if (!pv.blinkAt || ts > pv.blinkAt) { pv.blinkAt = ts + 2200 + Math.random() * 2600; pv.blinking = ts; }
    const lid = ts - (pv.blinking || 0) < 130;
    ['mv-eyeL', 'mv-eyeR'].forEach(k => { const e = el(k); if (e) e.setAttribute('ry', lid ? 0.4 : 2.6); });
    const body = el('mv-person');
    if (body) body.style.setProperty('--bob', (Math.sin(ts / 900) * 3).toFixed(2) + 'px');
  }

  function pvToggle() {
    if (!pv) return;
    const btn = document.getElementById('pv-play');
    if (pv.playing) {
      pv.playing = false; pv.last = 0;
      try { speechSynthesis.cancel(); } catch (e) {}
      btn.textContent = '▶'; btn.classList.remove('hide');
      return;
    }
    if (pv.t >= pv.dur) { pv.t = 0; pv.shot = -1; }
    pv.playing = true; pv.last = 0;
    btn.textContent = '❚❚'; btn.classList.add('hide');
    if (pv.shot < 0) { pv.shot = 0; pvApplyShot(0); }
  }

  function pvMute() {
    if (!pv) return;
    pv.muted = !pv.muted;
    const b = document.getElementById('pv-mute');
    if (b) b.textContent = pv.muted ? '🔇' : '🔊';
    if (pv.muted) { try { speechSynthesis.cancel(); } catch (e) {} }
    else if (pv.playing) speak(pv.shots[pv.shot].txt);
  }

  /* 建立播放器（在 modal 之后呼叫） */
  function pvInit(v, shots) {
    pv = { shots, dur: v.duration, t: 0, shot: -1, playing: false, muted: false, timer: 0, last: 0, voice: pickVoice() };
    const play = document.getElementById('pv-play');
    const mute = document.getElementById('pv-mute');
    if (play) play.addEventListener('click', e => { e.stopPropagation(); pvToggle(); });
    if (mute) mute.addEventListener('click', e => { e.stopPropagation(); pvMute(); });
    // 点画面任意处也能播放/暂停；但按钮自己已处理，别让它冒泡上来重复触发
    const stage = document.getElementById('mv-stage');
    if (stage) stage.addEventListener('click', e => {
      if (e.target.closest('#pv-play') || e.target.closest('#pv-mute')) return;
      pvToggle();
    });
    if (shots.length) { pv.shot = 0; pvApplyShot(0); try { speechSynthesis.cancel(); } catch (e) {} }
    const warn = document.getElementById('pv-novoice');
    if (warn && !pv.voice) warn.style.display = 'block';
    // 用计时器而不是 requestAnimationFrame：分页不在前台时 rAF 会整个停住
    pv.timer = setInterval(pvFrame, 50);
  }

  /* ---- 排程项目：预览 + 编辑 ---- */
  function phoneFrame(v, shots, capFallback, p) {
    const first = shots.length ? shots[0] : null;
    return `
      <div class="mv" id="mv-stage" style="background:${v.cover}">
        <div class="mv-broll" id="mv-broll"></div>
        <div class="mv-vig"></div>

        <div class="mv-book" id="mv-book">
          <div class="mv-book-c" style="background:${v.cover}">
            <span>${esc((p && p.title) || '')}</span>
          </div>
          <div class="mv-book-t">${esc((p && p.author) || '')} 著</div>
        </div>

        <div class="mv-person" id="mv-person">
          <svg viewBox="0 0 120 150" width="100%" height="100%">
            <ellipse cx="60" cy="150" rx="46" ry="42" fill="rgba(255,255,255,.92)"/>
            <rect x="52" y="72" width="16" height="20" rx="7" fill="#f0c9a8"/>
            <ellipse cx="60" cy="52" rx="30" ry="34" fill="#f7d7b8"/>
            <path d="M30 44 Q60 8 90 44 Q86 26 60 20 Q34 26 30 44Z" fill="#2f2a37"/>
            <ellipse id="mv-eyeL" cx="49" cy="52" rx="3.2" ry="2.6" fill="#2f2a37"/>
            <ellipse id="mv-eyeR" cx="71" cy="52" rx="3.2" ry="2.6" fill="#2f2a37"/>
            <path d="M43 43 Q49 40 55 43" stroke="#2f2a37" stroke-width="2" fill="none" stroke-linecap="round"/>
            <path d="M65 43 Q71 40 77 43" stroke="#2f2a37" stroke-width="2" fill="none" stroke-linecap="round"/>
            <ellipse id="mv-mouth" cx="60" cy="68" rx="6" ry="0.6" fill="#c2536a"/>
            <ellipse cx="41" cy="60" rx="4" ry="3" fill="rgba(240,140,140,.28)"/>
            <ellipse cx="79" cy="60" rx="4" ry="3" fill="rgba(240,140,140,.28)"/>
          </svg>
        </div>

        <div class="mv-kw" id="mv-kw"></div>

        <div class="mv-top">
          <span class="plat" style="position:static;background:${v.color}dd">${v.platformName}</span>
          <span style="display:flex;gap:6px;align-items:center">
            <button id="pv-mute" class="mv-btn" title="声音开关">🔊</button>
            <span class="dur" style="position:static" id="pv-time">0:00 / ${mmss(v.duration)}</span>
          </span>
        </div>

        <div class="mv-bottom">
          <div id="mv-shot" class="mv-meta">镜头 1/${shots.length} · ${first ? first.t : ''}</div>
          <div id="mv-sub" class="mv-sub">${esc(first ? first.txt : capFallback)}</div>
          <div id="mv-vis" class="mv-meta" style="margin-top:6px">${first ? first.cam + '　|　' + first.vis : ''}</div>
          <div class="mv-cta" id="mv-cta">📖 ${esc((p && p.title) || '本书')} · 点击左下角购书连结</div>
          <div class="mv-sign"><div class="avatar" style="width:24px;height:24px;font-size:10px;border-radius:7px">主</div>
            <span>主理人 · AI 生成</span></div>
          <div class="mv-track"><div id="pv-bar"></div></div>
        </div>

        <button id="pv-play" class="mv-play" title="播放 / 暂停">▶</button>
      </div>
      <div id="pv-novoice" class="hint" style="display:none;margin-top:8px;color:var(--amber)">
        这个浏览器没有中文语音，将只播放画面。Chrome 与 Edge 通常内建。</div>`;
  }

  function shotList(shots) {
    return `<div id="pv-shots">${shots.map((sh, i) => `
      <div class="shot ${i === 0 ? 'on' : ''}">
        <div class="shot-n">${String(i + 1).padStart(2, '0')}</div>
        <div><div style="font-size:12px;color:var(--violet-2);font-weight:650;margin-bottom:3px">${sh.t}</div>
          <div class="shot-t">${esc(sh.txt)}</div>
          <div class="shot-d"><span>🎥 ${sh.cam}</span><span>🖼 ${sh.vis}</span><span>⏱ ${sh.dur}</span></div></div>
      </div>`).join('')}</div>`;
  }

  function schedModal(id) {
    const it = STORE.s.schedule.find(x => x.id === id);
    if (!it) return;
    const p = STORE.s.projects.find(x => x.id === it.projectId) || STORE.current;
    const v = (p.videos || []).find(x => x.id === it.videoId);
    if (!v) { toast('找不到对应的成片，可能已被重置', 'warn'); return; }
    const script = (p.scripts || []).find(s => s.id === v.scriptId) || (p.scripts || [])[0];
    const shots = script ? DATA.genShots(script, p) : [];
    const days = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
    const pub = it.status === '已发布';

    modal('排程项目 · 预览与编辑', `
      <div style="display:flex;gap:22px;flex-wrap:wrap">
        <div style="flex:0 0 220px">
          ${phoneFrame(v, shots, v.caption, p)}
          <div class="hint" style="margin-top:9px;text-align:center">分镜预览 · 非真实影片</div>
        </div>
        <div style="flex:1;min-width:260px">
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
            ${UI.statusTag(it.status)}
            <span class="tag">《${esc(p.title)}》</span><span class="tag">${v.angle}</span><span class="tag">${v.duration}s</span>
          </div>

          <div class="field"><div class="label">影片标题（发布时使用）</div>
            <textarea class="input" id="sc-title" style="min-height:62px">${esc(it.title)}</textarea></div>

          <div class="row2">
            <div class="field"><div class="label">发布平台</div>
              <select class="input" id="sc-plat">
                ${DATA.PLATFORMS.map(x => `<option value="${x.name}" ${x.name === it.platform ? 'selected' : ''}>${x.name}</option>`).join('')}
              </select></div>
            <div class="field"><div class="label">发布日期</div>
              <select class="input" id="sc-day">
                ${Array.from({ length: days }, (_, i) => i + 1).map(d => `<option value="${d}" ${d === it.day ? 'selected' : ''}>${d} 日</option>`).join('')}
              </select></div>
          </div>
          <div class="field"><div class="label">发布时间</div>
            <select class="input" id="sc-hour">
              ${[6, 7, 8, 9, 12, 13, 17, 18, 19, 20, 21, 22].map(h => `<option value="${h}" ${h === it.hour ? 'selected' : ''}>${h}:00</option>`).join('')}
            </select></div>

          <div class="field"><div class="label">话题标签</div>
            <div class="chip-list">${(p.hots || []).map(h => `<span class="tag c">${esc(h)}</span>`).join('')}</div></div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px">
            <button class="btn btn-sm" data-modal-act="sched-save" data-id="${it.id}">储存变更</button>
            <button class="btn btn-sm" data-modal-act="open-script" data-id="${script ? script.id : ''}">查看完整脚本</button>
            ${pub ? `<button class="btn btn-sm" data-modal-act="sched-unpub" data-id="${it.id}">撤回为待发布</button>`
              : `<button class="btn btn-sm btn-primary" data-modal-act="sched-pub" data-id="${it.id}">立即发布</button>`}
            <button class="btn btn-sm" data-modal-act="sched-del" data-id="${it.id}">移出排程</button>
          </div>
          ${pub ? `<div class="hint" style="margin-top:10px">这条已标记为已发布。演示环境不会真的送到平台——真实发布需由服务端对接各平台开放接口，并完成帐号授权。</div>` : ''}
        </div>
      </div>
      ${shots.length ? `<div class="label" style="margin-top:20px">分镜表（播放时同步高亮）</div>${shotList(shots)}` : ''}`, '', true);

    pvInit(v, shots);
  }

  function dayModal(d) {
    const items = STORE.s.schedule.filter(x => x.day === d);
    const pending = items.filter(x => x.status === '待发布').length;
    modal(`${new Date().getMonth() + 1} 月 ${d} 日 · 排期明细`,
      items.length ? items.map(x => `
        <div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)">
          <div style="width:3px;height:36px;border-radius:3px;background:${x.color}"></div>
          <div style="flex:1;min-width:0;cursor:pointer" data-modal-act="open-sched" data-id="${x.id}">
            <div style="font-size:13px;font-weight:620">${esc(x.title)}</div>
            <div style="font-size:11.5px;color:var(--txt-3)">《${esc(x.bookTitle)}》 · ${x.platform} · ${x.hour}:00</div></div>
          ${UI.statusTag(x.status)}
          <button class="btn btn-sm" data-modal-act="open-sched" data-id="${x.id}">预览 / 编辑</button>
          ${x.status === '待发布'
            ? `<button class="btn btn-sm btn-primary" data-modal-act="pub-one" data-id="${x.id}" data-day="${d}">发布</button>`
            : ''}
        </div>`).join('')
        + (pending > 1 ? `<div style="margin-top:14px;text-align:right">
             <button class="btn btn-sm" data-modal-act="pub-day" data-day="${d}">发布这一天的全部 ${pending} 条</button></div>` : '')
        : '<div class="empty">这一天没有排期</div>');
  }

  function exportAll() {
    const p = STORE.current;
    let out = `《${p.title}》内容资产包\n作者：${p.author}　出版社：${p.publisher}\n导出时间：${new Date().toLocaleString('zh-CN')}\n${'='.repeat(56)}\n\n`;
    out += `【全书摘要】\n${p.summary || '（未生成）'}\n\n`;
    out += `【核心论点】\n${(p.themes || []).map((t, i) => `${i + 1}. ${t}`).join('\n')}\n\n`;
    out += `【金句】\n${(p.quotes || []).map((q, i) => `${i + 1}. ${q}`).join('\n')}\n\n`;
    out += `【标题 ${(p.titles || []).length} 个】\n${(p.titles || []).map(t => `${t.n}. ${t.text}  [${t.tag} · ${t.score}分]`).join('\n')}\n\n`;
    out += `【Hook ${(p.hooks || []).length} 个】\n${(p.hooks || []).map(t => `${t.n}. ${t.text}  [${t.tag} · ${t.score}分]`).join('\n')}\n\n`;
    out += `【开场白 ${(p.opens || []).length} 个】\n${(p.opens || []).map(t => `${t.n}. ${t.text}`).join('\n')}\n\n`;
    out += `【脚本 ${(p.scripts || []).length} 篇】\n`;
    (p.scripts || []).forEach(s => {
      out += `\n${'-'.repeat(56)}\n#${s.n} 【${s.angleName}】${s.platformName} · ${s.duration}s\n标题：${s.title}\nHook：${s.hook}\n正文：\n${s.body}\nCTA：${s.cta}\n`;
    });
    download(`${p.title}_内容资产包.txt`, out);
  }

  function exportReport() {
    const ps = STORE.s.projects;
    const videos = ps.reduce((a, p) => a.concat(p.videos || []), []);
    const an = DATA.genAnalytics(videos);
    let out = `AI 数字人短视频数据报告\n生成时间：${new Date().toLocaleString('zh-CN')}\n${'='.repeat(56)}\n\n`;
    out += `项目数：${ps.length}　视频数：${videos.length}　总播放：${an.total}\n\n【平台表现】\n`;
    an.byPlat.forEach(p => out += `${p.name}：${p.count} 支 · 播放 ${p.value}\n`);
    out += `\n【转化漏斗】\n`;
    an.funnel.forEach(f => out += `${f.k}：${f.v}\n`);
    out += `\n【单支明细】\n`;
    videos.forEach(v => out += `${v.platformName}\t${v.angle}\t播放${v.views}\t完播${v.watch}%\t${v.title}\n`);
    download('数据报告.txt', out);
  }

  /* ---------------- 引擎事件 ---------------- */
  let logTimer = null;
  ENGINE.on((evt) => {
    if (route !== 'pipeline') { if (evt === 'finish' || evt === 'stage') render(); return; }
    // 只刷新日志与步骤条，避免整页重绘打断滚动
    const logEl = $('#run-log');
    if (logEl) {
      logEl.innerHTML = ENGINE.logs.map(l => `<div class="${l.cls}">[${l.ts}] ${esc(l.text)}</div>`).join('');
      if (window.I18N) I18N.apply(logEl);
    }
    if (evt === 'stage' || evt === 'finish' || evt === 'stop') {
      clearTimeout(logTimer);
      logTimer = setTimeout(render, 60);
    }
  });

  /* ---------------- 启动 ---------------- */
  // 未手动切换过时不写 data-theme，让页面跟随系统/查看者的浅色深色偏好
  if (STORE.s.settings.themeSet) document.documentElement.setAttribute('data-theme', STORE.s.settings.theme);
  render();
  I18N.set('hant');   // 全站固定台湾繁体中文，不提供切换

  // 首次进入自动播放导览；看过之后只在点「导览」时出现
  if (!STORE.s.settings.tourDone) setTimeout(() => TOUR.start(0), 500);
  else setTimeout(() => toast('欢迎回来 · 需要重看用法请点顶栏「导览」', 'ok'), 700);
})();

</script>
</body>
</html>

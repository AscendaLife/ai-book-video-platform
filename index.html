  /* =======================================================
   * 数据分析
   * ===================================================== */
  VIEWS.analytics = function (q) {
    const scope = (q && q.sc) || 'all';
    const ps = STORE.s.projects;
    const videos = scope === 'all' ? ps.reduce((a, p) => a.concat(p.videos || []), []) : (STORE.current.videos || []);
    const an = DATA.genAnalytics(videos);
    /* 统计只能算已发布的：没发布的影片不可能有数据 */
    const live = videos.filter(v => v.status === '已发布');

    /* 按角度聚合 */
    const byAngle = DATA.ANGLES.map(a => {
      const vs = live.filter(v => v.angle === a.name);
      const views = vs.reduce((x, v) => x + v.views, 0);
      const watch = vs.length ? Math.round(vs.reduce((x, v) => x + v.watch, 0) / vs.length) : 0;
      return { name: a.name, color: a.color, value: views, count: vs.length, watch };
    }).filter(x => x.count).sort((a, b) => b.value - a.value);

    const top = live.slice().sort((a, b) => b.views - a.views).slice(0, 6);
    const totalLike = live.reduce((a, v) => a + v.like, 0);
    const totalShare = live.reduce((a, v) => a + v.share, 0);
    const totalClick = live.reduce((a, v) => a + v.click, 0);
    const avgWatch = live.length ? Math.round(live.reduce((a, v) => a + v.watch, 0) / live.length) : 0;

    /* 这一页的数据全部来自 video 物件上的 views / like / watch 等栏位，
     * 而那些栏位目前只有内建示范书才有值（而且是随机造的）。
     * 真实产出的影片一律是 0，因为没有真的发布到任何平台、也没有平台回传数据。
     * 所以必须先算清楚「这页现在显示的到底是真是假」，摆在最上面讲明白。 */
    const demoLive = live.filter(v => v.demo).length;
    const allDemo = live.length > 0 && demoLive === live.length;

    return `
    <div class="page-h">
      <div><div class="page-t">数据分析</div>
        <div class="page-d">${allDemo ? '目前显示的是内建示范书的模拟数据' : '统计已发布影片的实际表现'}</div></div>
      <div class="right">
        <div class="seg" data-seg="ana-scope">
          <button data-v="all" class="${scope === 'all' ? 'on' : ''}">全部项目</button>
          <button data-v="cur" class="${scope === 'cur' ? 'on' : ''}">《${esc(STORE.current.title)}》</button>
        </div>
        <button class="btn" data-act="export-report">⬇ 导出数据报告</button>
      </div>
    </div>

    ${live.length === 0
      ? `<div class="explain" style="margin-bottom:16px;border-left-color:var(--amber)">
           <div class="ex-r"><span class="ex-k">这页现在是空的</span><span>共 <b>${videos.length}</b> 支影片，<b>一支都还没发布</b>，所以没有任何数据。</span></div>
           <div class="ex-r"><span class="ex-k">数据从哪来</span><span>影片要先<b>真的生成出来</b>（在内容资产库逐支生成），再<b>真的发布到平台</b>，平台回传之后这里才会有数字。</span></div>
           <div class="ex-r"><span class="ex-k">下面的图</span><span>下面的折线、圆饼、漏斗<b>全是示意用的假图</b>，不代表任何真实表现。</span></div>
         </div>`
      : allDemo
        ? `<div class="explain" style="margin-bottom:16px;border-left-color:var(--amber)">
             <div class="ex-r"><span class="ex-k" style="color:var(--amber)">⚠ 全部是假数据</span><span>
               这页现在显示的 <b>${live.length}</b> 支「已发布」影片，<b>全部来自内建示范书</b>，
               播放量、完播率、按赞、转化漏斗<b>都是随机产生的假数字</b>，不是真实表现。</span></div>
             <div class="ex-r"><span class="ex-k">怎么看到真的</span><span>自己建一本书跑完流程 → 在资产库逐支生成影片 → 发布到平台，之后这里才会出现真数据。</span></div>
           </div>`
        : `<div class="explain" style="margin-bottom:16px;border-left-color:var(--cyan)">
             <div class="ex-r"><span class="ex-k">统计范围</span><span>共 <b>${videos.length}</b> 支影片，已发布 <b>${live.length}</b> 支${demoLive ? `，其中 <b style="color:var(--amber)">${demoLive} 支是示范书的假数据</b>` : ''}。</span></div>
           </div>`}

    ${live.length ? '' : `<div class="card empty" style="margin-bottom:16px"><div class="big">◷</div>
      <div style="font-weight:650;color:var(--txt-2)">这个范围内还没有任何影片发布</div>
      <div style="margin-top:6px;font-size:14.5px">到「发布排程」发布之后，数据才会开始累积。</div></div>`}

    <div class="grid g4" style="margin-bottom:16px">
      ${[['总播放量', nf(an.total), '已发布 ' + live.length + ' 支', ''],
         ['平均完播率', avgWatch + '%', avgWatch >= 35 ? '优于均值' : '待优化', avgWatch < 30 ? 'down' : ''],
         ['总互动量', nf(totalLike + totalShare), '点赞 ' + nf(totalLike) + ' · 分享 ' + nf(totalShare), ''],
         ['书链点击', nf(totalClick), '点击率 ' + ((totalClick / (an.total || 1)) * 100).toFixed(2) + '%', '']]
        .map(x => `<div class="kpi"><div class="kpi-l">${x[0]}</div><div class="kpi-v">${x[1]}</div>
          <div class="kpi-d ${x[3]}">${x[2]}</div></div>`).join('')}
    </div>

    <div class="grid g-2-1" style="margin-bottom:16px">
      <div class="card">
        <div class="card-h"><div><div class="card-t">播放与互动趋势</div><div class="card-s">近 7 日</div></div></div>
        ${CHART.line(an.days)}
      </div>
      <div class="card">

    const groups = DOCS.groups.filter(g => DOCS.list.some(d => d.group === g.key));

      return `

})();

/* ============================================================
 * views-roles.js — 书影（书中人物）（单独功能，不在流水线里）
 *
 * 这一页做的事：把书里的男主角、女主角与其他主要人物，一个一个变成
 * 数字人，让他自己对着镜头做自我介绍——我是谁、这本书是什么情景、
 * 我现在什么心态、正在做什么、身边是什么环境、心里在想什么、接下来
 * 要做什么。
 *
 * 为什么单独一个入口，不塞进「一键生成短视频」那条流水线：
 *   - 流水线是整批产线：一本书 → 三十支主理人口播短片，一条龙跑完。
 *     人物自述是另一件事——挑一个人物、生成一支，跟书跑到第几步无关。
 *   - 塞进流水线就要排在某一步后面，等于逼使用者先跑完前面几步才能用；
 *     单独放在侧边栏最外层，随时进来就能做一支。
 *
 * 自述稿的结构（INTRO_GROUPS）不是随手分的段落，是照「一支自述短片
 * 实际念出来的顺序」排的，每一段都有它非在不可的理由：
 *
 *   开场 ── ①一句话钩子：短视频前三秒决定人走不走，先讲一句让人停下来的话，
 *           不要一开口就自报名字（「大家好我是⋯」是最快被划掉的开头）
 *   他是谁、在哪里 ── ②我是谁 ③这本书的情景 ④我周遭的环境 ⑤我现在的行为
 *           （情景／环境／行为是这个功能被提出来时就指定要讲的三件事）
 *   他心里的事 ── ⑥我的心态 ⑦我怎么走到这一步 ⑧我卡在哪里 ⑨我身边的人
 *           ⑩我的想法 ⑪我后来明白了什么
 *           前史与「卡在哪里」是补上去的：只讲此刻的心态与想法，一段自述会很平，
 *           没有张力就没有人看完。「我身边的人」则让同一本书的几个人物互相提到
 *           对方，几支影片才会像同一个故事，而不是各讲各的。
 *           「我后来明白了什么」是这本书的观点落在人物身上的地方——书评是别人
 *           讲道理，人物自己讲出来才有人听。
 *   收尾 ── ⑫我接下来要做什么 ⑬我最想说的一句话 ⑭给看到这里的你
 *           金句是拿来当封面字与截图转发的；最后一句把人带回这本书，
 *           不然影片好看归好看，跟卖书没有关系。
 *
 * 每一段都可以自己改、可以留空（留空就不会念到），改完按「用这几段重新组稿」
 * 重新拼成要念的台词。另外两个不会被念出来的设定：影片长度（决定 AI 写多少字，
 * 也就决定这支影片多贵）与念的口吻（男主角跟女主角不该同一个语气）。
 *
 * 人物名单跟「创意分镜 · 书中角色」共用同一份资料（p.characters）：
 * 在那边读出来、生成过定妆照的角色，这边直接看得到，不用再做一次。
 * ========================================================== */
(function () {
  const { esc } = UI;

  /* 角色定位：AI 读出来的会落在这几档，使用者也可以自己改 */
  const CASTS = ['男主角', '女主角', '主要人物', '配角', '叙述者', '作者本人', '读者化身'];

  /* 自述稿的结构。顺序就是念出来的顺序；k 要跟 AI 回传的 JSON 栏位一致，
   * ask 是这一段给模型的写作指示——介面与提示词共用同一份定义，
   * 以后要加一段、改一段，只改这里，两边不会走岔。 */
  const INTRO_GROUPS = [
    { g: '开场 · 前三秒', parts: [
      { k: 'hook', t: '一句话钩子', ph: '第一句就要让人停下来：一个问题、一句反常的话、一个具体的画面',
        ask: '开场第一句，三秒内要让人停下来。可以是一个问题、一句反常的话或一个很具体的画面。不要在这一句自报名字，不要「大家好」。' } ] },
    { g: '他是谁、他在哪里', parts: [
      { k: 'identity', t: '我是谁', ph: '自报名字与身份：我是谁、在这本书里是什么人',
        ask: '自报名字与身份，一句话讲清楚我是谁、在这本书里是什么人。' },
      { k: 'scene', t: '这本书的情景', ph: '这个故事发生在什么时候、什么地方、正在发生什么事',
        ask: '这本书的情景：故事发生在什么时候、什么地方、正在发生什么事。' },
      { k: 'surroundings', t: '我周遭的环境', ph: '身边有什么人、什么声音、什么光线、什么味道',
        ask: '我周遭的环境：身边有什么、什么声音、什么光线、什么气味，写得让人看得见。' },
      { k: 'action', t: '我现在的行为', ph: '镜头前这一刻他正在做什么',
        ask: '我现在的行为：镜头前这一刻我正在做的事，一个具体的动作，不是笼统的「我在努力」。' } ] },
    { g: '他心里的事', parts: [
      { k: 'mindset', t: '我的心态', ph: '此刻心里是什么状态：焦虑、笃定、不甘、疲惫…',
        ask: '我的心态：此刻心里是什么状态，用感觉讲，不要用形容词堆。' },
      { k: 'past', t: '我怎么走到这一步', ph: '很短的前史：以前是什么样、中间发生过什么事',
        ask: '我怎么走到这一步：很短的前史，以前是什么样、中间发生过什么，一两句就好。' },
      { k: 'conflict', t: '我卡在哪里', ph: '最难的是什么、我在跟什么较劲——没有这一段，自述会很平',
        ask: '我卡在哪里：最难的是什么、我在跟什么较劲。这一段是整支影片的张力来源，一定要具体。' },
      { k: 'relation', t: '我身边的人', ph: '书里跟我有关系的人：谁支持我、谁挡我、我欠谁一句话',
        ask: '我身边的人：书里跟我有关系的人，谁支持我、谁挡着我、我欠谁一句话。有名字就点名字。' },
      { k: 'thought', t: '我的想法', ph: '我怎么看这件事、怎么看我自己',
        ask: '我的想法：我怎么看这件事、怎么看我自己，可以带一点自嘲或不服气。' },
      { k: 'turn', t: '我后来明白了什么', ph: '这本书真正在讲的道理，从我的经历里长出来',
        ask: '我后来明白了什么：把这本书真正想讲的道理，从我自己的经历里讲出来，是体会不是说教，不要剧透结局。' } ] },
    { g: '收尾', parts: [
      { k: 'plan', t: '我接下来要做什么', ph: '我打算怎么做，下一步是什么',
        ask: '我接下来要做什么：具体的下一步，讲得出来、做得到。' },
      { k: 'line', t: '我最想说的一句话', ph: '短、能当封面字、能被截图转发的一句',
        ask: '我最想说的一句话：短，二十字以内，能当封面字、能被截图转发。' },
      { k: 'cta', t: '给看到这里的你', ph: '把观众引回这本书：你如果也在…，这本书写的就是这件事',
        ask: '给看到这里的你：把观众引回这本书，「你如果也在⋯⋯，这本书写的就是这件事」，一句话，不要硬推销。' } ] }
  ];
  const INTRO_PARTS = INTRO_GROUPS.reduce((a, g) => a.concat(g.parts), []);
  window.ROLE_INTRO_PARTS = INTRO_PARTS;

  /* 影片长度：中文口播大约每秒 4.5 个字，长度直接决定这支影片多少钱
   * （数字人按秒计费），所以在写稿前就选，而不是写完再删。 */
  const INTRO_LENGTHS = [
    { id: '30', t: '30 秒 · 约 135 字', note: '一个点讲透，最省钱，适合先试水温' },
    { id: '60', t: '60 秒 · 约 270 字', note: '预设。够讲完情景、心里的事与收尾' },
    { id: '90', t: '90 秒 · 约 400 字', note: '人物复杂、故事线长的书才需要' }
  ];
  window.ROLE_INTRO_LENGTHS = INTRO_LENGTHS;

  VIEWS.roles = function () {
    const p = STORE.current;
    if (!p) return '<div class="card empty">请先创建书籍项目</div>';
    const list = Array.isArray(p.characters) ? p.characters : [];
    const pa = STORE.s.persona;
    const done = list.filter(c => c.videoUrl).length;

    return `
    <div class="page-h">
      <div><div class="page-t">书影（书中人物）</div>
        <div class="page-d">当前项目：《${esc(p.title)}》 · 让书里的人物自己站出来讲一段话，跟流水线无关，随时可以做一支</div></div>
      <div class="right">
        <select class="input" style="width:190px" data-act="switch-proj">
          ${STORE.s.projects.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>《${esc(x.title)}》</option>`).join('')}
        </select>
        <span class="tag v">单独功能</span>
      </div>
    </div>

    ${/* 这一段本来是五列的说明表，占掉快一整屏。使用者的原话是「写的太多，
         占据了太多的位置，一句话介绍清楚就行了」——对，说明是给第一次来的人
         看的，不该每次进来都挡在最前面。留一句，其余收进「说明」。 */''}
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      <span style="font-size:15px">让书里的人物自己出来，对着镜头讲一段话——<b>一人一张脸、一个声音</b>。</span>
      <span class="tag ${done ? 'g' : ''}">${done ? '已做出 ' + done + ' 支' : '还没做过'}</span>
      <details class="adv" style="flex:1 0 100%;margin-top:6px">
        <summary>说明：跟流水线的差别、他会讲什么、花多少钱</summary>
        <div class="adv-b">
          <div class="explain" style="margin:0;border-left-color:var(--violet)">
            <div class="ex-r"><span class="ex-k">跟流水线的差别</span><span>「一键生成短视频」是<b>主理人</b>用同一张脸讲三十支书评；
              这一页是<b>书里的人</b>自己出来讲话。</span></div>
            <div class="ex-r"><span class="ex-k">他会讲什么</span><span>照影片实际念出来的顺序分四块：
              <b>开场钩子</b> → <b>他是谁、在哪里</b> → <b>他心里的事</b>（心态 / 前史 / 卡在哪里 / 身边的人 / 后来明白了什么）→
              <b>收尾</b>。每一段都可以改，留空就不会念到。</span></div>
            <div class="ex-r"><span class="ex-k">为什么不只讲此刻</span><span>只讲「现在在做什么」的自述很平，没有张力没人看完。
              前史与卡在哪里撑张力，身边的人让几支影片像同一个故事，最后一句把人带回这本书。</span></div>
            <div class="ex-r"><span class="ex-k">花多少</span><span>读人物几乎不花钱；定妆照一张约 <b>US$0.03-0.07</b>；
              真正贵的是生成影片那一步，一支约 <b>US$1-3</b>。前两步随便试，第三步才要想一下。</span></div>
          </div>
        </div>
      </details>
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-h"><div><div class="card-t">人物名单</div>
          <div class="card-s">跟「创意分镜 · 书中角色」共用同一份名单；在那边读过的角色这里直接看得到</div></div>
        <div class="right"><span class="tag">${list.length} 个人物</span></div></div>

      <div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px">
        <button class="btn btn-primary btn-sm" data-act="ai-read-cast">✨ 让 AI 从书里读出主要人物</button>
        <button class="btn btn-sm" data-act="add-blank-char">＋ 自己加一个人物</button>
        ${list.length ? `<button class="btn btn-sm" data-act="auto-voice-all"
          title="照每个人物的性别与年龄重新配一次声音">♪ 重新配声音</button>` : ''}
        ${window.CHARX && CHARX.canRestore() ? `<button class="btn btn-sm" data-act="restore-char"
          style="border-color:var(--violet-2);color:var(--violet-2)">↺ 复原删掉的（${CHARX.trash().length}）</button>` : ''}
        ${list.length ? `<button class="btn btn-sm" data-act="clear-chars">清空全部人物</button>` : ''}
      </div>
      <div id="ai-cast-status"></div>
      <div class="hint">AI 会优先抓男主角、女主角这类核心人物；非虚构的书没有故事人物时，会抓书里出现的真实人物、案例主角，
        或一个能代表读者的具体化身。读出来之后名字、身份、长相都可以自己改。</div>
    </div>

    ${!STORE.s.persona.realVoiceId ? `
    <div class="card" style="margin-bottom:18px;border-color:var(--amber)">
      <div class="card-h"><div><div class="card-t">还没有可用的声音</div>
        <div class="card-s">人物要开口讲话，得先有一个声音；每个人物可以在自己那张卡上单独换</div></div></div>
      <button class="btn btn-sm" data-act="goto" data-route="persona">去「数字人 / 声音 / 克隆」选一个声音</button>
    </div>` : ''}

    ${list.length
      ? `<div class="grid g2">${list.map((c, i) => roleCard(c, i, p, pa)).join('')}</div>`
      : `<div class="card empty">还没有人物。按上面「让 AI 从书里读出主要人物」，AI 读完这本书会把男主角、女主角与其他主要人物列出来。</div>`}
`;
  };

  /* 一张人物卡以前把十几个栏位全摊开在同一层：定妆照、补充说明、名字、
   * 定位、身份、长相、影片长度、口吻、14 段自述、完整稿、声音、语速、
   * 生成按钮。使用者的原话是「整个页面也很乱」「看不出先做哪个」——
   * 说得对，那是一份表格，不是一个流程。
   *
   * 改成四步，一次只展开当前该做的那一步；做完的收起来只留一行结论。
   * 步骤本身就是顺序：没有脸就没得写稿，没有稿就没得出片。 */
  function roleCard(c, i, p, pa) {
    const intro = c.intro || {};
    const voices = (window.HGINFO && HGINFO.voices()) || [];
    const voiceId = c.voiceId || pa.realVoiceId || '';
    const script = (c.introScript || '').trim();
    const curVoice = voices.find(v => v.id === voiceId);
    const AGE = { old: '年长', mid: '中年', young: '年轻', child: '儿童' };
    const vLabel = v => v ? ((v.zh ? v.zh + '（' + v.name + '）' : v.name)
      + (v.gender && v.gender !== 'unknown' ? ' · ' + (v.gender === 'male' ? '男' : '女') : '')
      + (v.age ? ' · ' + AGE[v.age] : '')) : '';

    /* 每一步做完没：这四个条件也是后面每一步的前提。 */
    const st = [
      { n: '①', t: '这个人是谁', ok: !!(c.name || '').trim() && !!(c.look || '').trim(),
        sum: (c.name || '未命名') + (c.role ? ' · ' + c.role : '') },
      { n: '②', t: '他的脸', ok: !!c.portraitUrl,
        sum: c.portraitUrl ? '定妆照已生成' + ((c.portraitHistory || []).length > 1 ? '（共 ' + c.portraitHistory.length + ' 张可切换）' : '') : '还没有定妆照' },
      { n: '③', t: '他要说什么', ok: !!script,
        sum: script ? '约 ' + script.length + ' 字 · 念起来约 ' + Math.max(1, Math.round(script.length / 4.5)) + ' 秒' : '还没有稿子' },
      { n: '④', t: '怎么念、做成影片', ok: !!c.videoUrl,
        sum: c.videoUrl ? '影片已生成' : (curVoice ? vLabel(curVoice) + ' · ' + (c.voiceSpeed == null ? 1 : c.voiceSpeed) + '×' : '还没选声音') }
    ];
    const cur = st.findIndex(x => !x.ok);          // -1 代表四步都完成了
    const open = k => (cur === -1 ? k === 3 : k === cur) ? 'open' : '';
    const head = (k) => `<summary style="cursor:pointer;padding:9px 0;font-weight:650">
        <span style="color:${st[k].ok ? 'var(--green)' : (k === cur ? 'var(--violet-2)' : 'var(--txt-3)')}">${st[k].ok ? '✓' : st[k].n}</span>
        ${st[k].t}
        <span class="hint" style="font-weight:400;margin-left:8px">${esc(st[k].sum)}</span></summary>`;

    return `
    <div class="card" style="background:var(--panel-2);margin:0">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <span class="tag v">${String(i + 1).padStart(2, '0')}</span>
        <b style="font-size:16px;flex:1">${esc(c.name || '未命名人物')}</b>
        ${c.cast ? `<span class="tag c">${esc(c.cast)}</span>` : ''}
        <b data-act="del-char" data-i="${i}" title="删掉整个人物（会先问一次）"
           style="cursor:pointer;opacity:.4;padding:2px 8px;margin-left:4px">✕</b>
      </div>
      ${/* 进度条：一眼看出走到哪、还差什么，不用把整张卡卷完 */''}
      <div style="display:flex;gap:4px;margin-bottom:12px">
        ${st.map((x, k) => `<div title="${esc(x.t)}" style="flex:1;height:4px;border-radius:2px;background:${
          x.ok ? 'var(--green)' : (k === cur ? 'var(--violet-2)' : 'var(--line-2)')}"></div>`).join('')}
      </div>

      <details class="step" ${open(0)} style="border-bottom:1px solid var(--line)">
        ${head(0)}
        <div style="padding-bottom:12px">
          <div class="row2" style="margin-bottom:8px">
            <div class="field"><div class="label">名字</div>
              <input class="input" data-act="edit-char" data-i="${i}" data-k="name" value="${esc(c.name || '')}" placeholder="人物的名字"></div>
            <div class="field"><div class="label">角色定位</div>
              <select class="input" data-act="char-cast" data-i="${i}">
                <option value="">未标注</option>
                ${CASTS.map(x => `<option value="${esc(x)}" ${c.cast === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}
              </select></div>
          </div>
          <div class="field" style="margin-bottom:8px"><div class="label">在书里是谁</div>
            <input class="input" data-act="edit-char" data-i="${i}" data-k="role" value="${esc(c.role || '')}" placeholder="例如：故事的男主角、书中的年轻工程师、作者本人"></div>
          <div class="field" style="margin-bottom:0"><div class="label">长什么样
              <span class="hint" style="margin-left:8px;font-weight:400">这段就是画定妆照的依据，脸不对先改这里</span></div>
            <textarea class="input" data-act="edit-char" data-i="${i}" data-k="look" rows="3"
              placeholder="年龄、性别、脸型、发型、穿着、神情、时代感…越具体越像">${esc(c.look || '')}</textarea></div>
        </div>
      </details>

      <details class="step" ${open(1)} style="border-bottom:1px solid var(--line)">
        ${head(1)}
        <div style="padding-bottom:12px">
          <div class="char-portrait" data-for="${i}">${c.portraitUrl
            ? `<img src="${esc(c.portraitUrl)}" data-act="view-portrait" data-url="${esc(c.portraitUrl)}" title="点一下看完整大图"
                 style="width:100%;max-height:300px;object-fit:cover;border-radius:10px;margin-bottom:8px;cursor:zoom-in">
               <div class="hint" style="margin-bottom:10px">卡片上这张是裁过的，<b>点图片看完整大图</b>——影片用的是完整那张。</div>`
            : `<div class="hint" style="background:var(--panel);border:1px dashed var(--line);border-radius:10px;
                 padding:26px 10px;text-align:center;margin-bottom:10px">还没有定妆照。这张脸就是影片里会出现的脸。</div>`}</div>

          ${(c.portraitHistory || []).length > 1 ? `
          <div class="label" style="margin-top:2px">生成过的<span class="hint" style="margin-left:6px;font-weight:400">点一下换回那张</span></div>
          <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px">
            ${c.portraitHistory.map(u => `<img src="${esc(u)}" data-act="pick-portrait" data-i="${i}" data-url="${esc(u)}"
              title="点一下换回这张"
              style="flex:0 0 52px;width:52px;height:74px;object-fit:cover;border-radius:6px;cursor:pointer;
                     border:2px solid ${u === c.portraitUrl ? 'var(--violet)' : 'var(--line)'}">`).join('')}
          </div>` : ''}

          <div class="field" style="margin-bottom:10px">
            <div class="label">想调整什么<span class="hint" style="margin-left:6px;font-weight:400">写在这会加进生成条件</span></div>
            <input class="input" value="${esc(c.portraitNote || '')}" data-act="edit-char" data-i="${i}" data-k="portraitNote"
              placeholder="例如：年纪再大一点、表情更疲惫、光线暗一些">
          </div>
          <button class="btn btn-sm ${c.portraitUrl ? '' : 'btn-primary'}" data-act="gen-char-portrait" data-i="${i}">
            ${c.portraitUrl ? '重生成定妆照' : '✨ 生成定妆照'}</button>
          <span class="hint" style="margin-left:8px">一张约 US$0.03-0.07，可以一直重生成</span>
        </div>
      </details>

      <details class="step" ${open(2)} style="border-bottom:1px solid var(--line)">
        ${head(2)}
        <div style="padding-bottom:12px">
          <div class="row2" style="margin-bottom:10px">
            ${/* 这一格只在「让 AI 写稿」时有用——它是告诉 AI 写多少字。
                 使用者自己贴了稿子之后它完全不起作用，但标签原本写「直接
                 决定这支多贵」，看起来像是这里在控制影片长度。实际长度永远
                 以下面那篇稿子为准。 */''}
            <div class="field"><div class="label">让 AI 写多长
                <span class="hint" style="margin-left:6px;font-weight:400">只影响下面那颗「写自述稿」</span></div>
              <select class="input" data-act="char-len" data-i="${i}">
                ${INTRO_LENGTHS.map(x => `<option value="${x.id}" ${String(c.introLength || '60') === x.id ? 'selected' : ''}>${esc(x.t)}</option>`).join('')}
              </select></div>
            <div class="field"><div class="label">念的口吻</div>
              <input class="input" data-act="edit-char" data-i="${i}" data-k="introTone" value="${esc(c.introTone || '')}"
                placeholder="低沉、压着火／轻快带笑／疲惫但温柔"></div>
          </div>
          <button class="btn btn-sm btn-primary" data-act="ai-char-intro" data-i="${i}">✨ 写自述稿</button>
          <span class="hint" style="margin-left:8px">几分钱，可以一直重写${script
            ? '。已经有稿子了——<b>实际长度以下面那篇为准</b>，上面那个下拉只在重写时才起作用' : ''}</span>
          <div class="char-intro-status" data-for="${i}"></div>

          <div class="field" style="margin:12px 0 8px">
            <div class="label">他要念的自述稿
              <span class="hint" style="margin-left:8px;font-weight:400">${script ? '约 ' + script.length + ' 字，念起来约 ' + Math.max(1, Math.round(script.length / 4.5)) + ' 秒' : '还没有稿子'}</span></div>
            <textarea class="input" data-act="edit-char" data-i="${i}" data-k="introScript" rows="6"
              placeholder="第一人称，从头到尾都是这个人物自己在讲话">${esc(c.introScript || '')}</textarea>
          </div>

          ${/* 逐段改是进阶用法，平常看的是上面那篇组好的稿子 */''}
          <details class="adv">
            <summary>逐段改（${INTRO_PARTS.length} 段）<span class="hint" style="font-weight:400">钩子／他是谁、在哪里／他心里的事／收尾——留空的不会念到</span></summary>
            <div class="adv-b">
              <div class="char-intro-parts" data-for="${i}">${INTRO_GROUPS.map(group => `
                <div class="label" style="margin:14px 0 8px;color:var(--violet-2)">${group.g}</div>
                ${group.parts.map(part => `
                  <div class="field" style="margin-bottom:8px"><div class="label">${part.t}</div>
                    <textarea class="input" data-act="edit-char-intro" data-i="${i}" data-k="${part.k}" rows="2"
                      placeholder="${esc(part.ph)}">${esc(intro[part.k] || '')}</textarea></div>`).join('')}`).join('')}</div>
              <button class="btn btn-sm" data-act="compose-intro" data-i="${i}">用这几段重新组稿</button>
            </div>
          </details>
        </div>
      </details>

      <details class="step" ${open(3)}>
        ${head(3)}
        <div style="padding-bottom:4px">
          <div class="field" style="margin-bottom:10px"><div class="label">用哪个声音
              <span class="hint" style="margin-left:8px;font-weight:400">按播放听一下，别让老先生配到少女音</span></div>
            ${voices.length
              ? `<select class="input" data-act="char-voice" data-i="${i}">
                  ${voices.map(v => `<option value="${esc(v.id)}" ${v.id === voiceId ? 'selected' : ''}>${esc(vLabel(v) + (v.note ? ' · ' + v.note : ''))}</option>`).join('')}
                </select>
                ${curVoice && curVoice.preview
                  ? `<audio src="${esc(curVoice.preview)}" controls preload="none" style="width:100%;height:32px;margin-top:8px"></audio>`
                  : '<div class="hint" style="margin-top:6px">这个声音没有试听档。</div>'}
                <div class="field" style="margin-top:10px;margin-bottom:0"><div class="label">语速
                    <span style="margin-left:auto;color:var(--violet-2);font-weight:700">${(c.voiceSpeed == null ? 1 : c.voiceSpeed)}×</span></div>
                  <input type="range" min="0.8" max="1.15" step="0.05" value="${c.voiceSpeed == null ? 1 : c.voiceSpeed}"
                    data-act="char-speed" data-i="${i}">
                  <div class="hint" style="margin-top:4px">年长角色 <b>0.85-0.9</b> 会明显变沉；
                    <b>语速要生成影片才听得到</b>，试听那个播放器听不出差别。</div></div>`
              : `<div class="hint">${voiceId ? '目前用「数字人 / 声音」那边选好的声音。' : '声音清单还没读到；先去「数字人 / 声音 / 克隆」选一个。'}</div>`}
          </div>

          <button class="btn btn-primary btn-sm" data-act="gen-char-video" data-i="${i}" style="width:100%">🎬 生成这个人物的自述短片（会扣额度）</button>
          <div class="hint" style="margin-top:8px">${script
            ? '这一支约 <b>' + Math.max(1, Math.round(script.length / 4.5)) + ' 秒</b>、估约 <b>US$'
              + (script.length / 4.5 * 0.05).toFixed(2) + '</b>，并占一支月额度。稿子越短越便宜。'
            : '还没有稿子，先回上一步写一篇。'}</div>
          <div class="char-video" data-for="${i}">${charVideoHtml(c)}</div>
        </div>
      </details>
    </div>`;
  }

  /* 影片区块：待生成 / 生成中 / 已生成 / 失败，四种状态都要看得懂 */
  function charVideoHtml(c) {
    if (c.videoUrl) {
      const sec = Number(c.realDuration);
      return `<video src="${esc(c.videoUrl)}" controls style="width:100%;max-width:280px;border-radius:10px;margin-top:10px"></video>
        <div class="hint" style="margin-top:6px">
          ${sec ? `实际时长 <b>${sec.toFixed(1)} 秒</b>　估算费用 <b>约 US$${(sec * 0.05).toFixed(2)}</b><span style="opacity:.7">（按 US$0.05/秒 估，实际以供应商帐单为准）</span><br>` : ''}
          影片网址可能有时效，要保留请自行下载。</div>`;
    }
    if (c.videoStatus === '生成中') {
      return '<div class="hint" style="margin-top:8px;color:var(--violet-2)">生成中，通常 1-3 分钟…可以关掉这一页去看别的，做好了会自己更新。</div>';
    }
    if (c.videoStatus === '生成失败') {
      return `<div class="hint" style="margin-top:8px;color:var(--red)">生成失败：${esc(c.videoError || '未知原因')}</div>`;
    }
    return '';
  }

  window.ROLE_VIDEO_HTML = charVideoHtml;

})();

    },
    {
      route: 'engine', sel: '.engine-card',
      title: '一个平台，可以服务多个人',

            '下面还有训练闭环、评分器规划与资料表设计——' +

    },
    {
      center: true, route: 'dashboard',
      title: '最后两件小事',
      text: '<b>左下角</b>点一下可以改显示名称——系统里所有「这个数字人属于谁」都会跟着变，' +
            '目前是「{OWNER}」。<br><br>' +   // {OWNER} 在显示时才代入，不能在载入时求值

            '想重看这份导览，随时点顶栏的<b>「导览」</b>。'
    }
  ];

  let idx = 0, mask = null, hole = null, pop = null, active = false;

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function build() {
    mask = el('div', 'tour-mask');
    hole = el('div', 'tour-hole');
    pop = el('div', 'tour-pop');
    mask.appendChild(hole);
    document.body.appendChild(mask);
    document.body.appendChild(pop);
    mask.addEventListener('click', e => { if (e.target === mask) next(); });
    document.addEventListener('keydown', onKey);
  }

  function onKey(e) {
    if (!active) return;
    if (e.key === 'Escape') stop();
    if (e.key === 'ArrowRight' || e.key === 'Enter') next();
    if (e.key === 'ArrowLeft') prev();
  }

  function render() {
    const s = STEPS[idx];
    if (s.route && typeof go === 'function') go(s.route);

    setTimeout(() => {
      const target = s.center ? null : document.querySelector(s.sel);
      const pad = 8;

      // 窄画面时侧栏是收起的（移到画面外），指着它没有意义 → 先打开
      if (target && target.closest('#sidebar')) {
        const sb = document.getElementById('sidebar');
        if (sb && sb.getBoundingClientRect().right <= 0) sb.classList.add('open');
      }

      if (target && visible(target)) {
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
        setTimeout(() => place(target, pad, !!s.centerPop), 220);
      } else {
        hole.style.opacity = '0';
        pop.className = 'tour-pop center';
        pop.style.left = ''; pop.style.top = '';
      }
      paint();
      if (window.I18N) I18N.apply(pop);
    }, s.route ? 60 : 0);
  }

  /* 目标真的看得到吗？看不到就退回置中卡，不要指一个画面外的东西 */
  function visible(el) {
    const r = el.getBoundingClientRect();
    return r.width > 4 && r.height > 4 && r.right > 0 && r.bottom > 0
      && r.left < innerWidth && r.top < innerHeight;
  }

  function place(target, pad, centerPop) {
    const r = target.getBoundingClientRect();
    hole.style.opacity = '1';
    hole.style.left = (r.left - pad) + 'px';
    hole.style.top = (r.top - pad) + 'px';
    hole.style.width = (r.width + pad * 2) + 'px';
    hole.style.height = (r.height + pad * 2) + 'px';

    pop.className = centerPop ? 'tour-pop center' : 'tour-pop';
    if (centerPop) {
      pop.style.left = '';
      pop.style.top = '';
      return;
    }
    const pw = 340, ph = pop.offsetHeight || 240;
    let left = r.left, top = r.bottom + 16;
    if (top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 16);
    if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
    if (left < 12) left = 12;
    if (top < 12) top = 12;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  function paint() {
    const s = STEPS[idx];
    pop.innerHTML = `
      <div class="tour-h">
        <span class="tour-n">${idx + 1} / ${STEPS.length}</span>
        <button class="icon-btn tour-x" data-t="stop" title="关闭导览">✕</button>
      </div>
      <div class="tour-t">${s.title}</div>
      <div class="tour-b">${s.text.replace(/\{OWNER\}/g, OWNER())}</div>
      ${s.note ? `<div class="tour-note">${s.note}</div>` : ''}
      <div class="tour-dots">${STEPS.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('')}</div>
      <div class="tour-f">
        <button class="btn btn-sm btn-ghost" data-t="stop">跳过</button>
        <span style="flex:1"></span>
        ${idx > 0 ? '<button class="btn btn-sm" data-t="prev">上一步</button>' : ''}
        <button class="btn btn-sm btn-primary" data-t="next">${idx === STEPS.length - 1 ? '开始使用' : '下一步'}</button>
      </div>`;
    pop.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', ev => {
      ev.stopPropagation();
      const a = b.dataset.t;
      if (a === 'next') next(); else if (a === 'prev') prev(); else stop();
    }));
  }

  function next() { if (idx < STEPS.length - 1) { idx++; render(); } else stop(); }
  function prev() { if (idx > 0) { idx--; render(); } }

  function start(from) {
    if (active) return;
    active = true; idx = from || 0;
    if (!mask) build();
    mask.style.display = 'block'; pop.style.display = 'block';
    render();
  }

  function stop() {
    active = false;
    if (mask) mask.style.display = 'none';
    if (pop) pop.style.display = 'none';
    if (STORE && !STORE.s.settings.tourDone) { STORE.s.settings.tourDone = true; STORE.update(); }
  }

  return { start, stop, get active() { return active; }, steps: STEPS.length };
})();

  function render() {

    if (route === 'persona' || route === 'pipeline') hgAutoCheck();

    if (route === 'roles') rolesLoadVoices();
    if (window.I18N) { I18N.apply($('#view')); I18N.apply($('#crumb')); }
    tidyExplains();
  }
  window.render = render;

  /* ---- 说明区块自动收合 ----
   *
   * 每一页都配了大段的「这一步在做什么 / 你需要做什么 / 这一步产出」。
   * 当初写那些是因为客户第一次看根本不知道在干嘛；但每天在用的人每次
   * 进来都要先卷过它们才看得到能按的东西。使用者的原话：「写的太多，
   * 占据了太多的位置」。
   *
   * 不逐一改十九个模板——那既慢又容易改坏。改成渲染完统一处理一次：
   * 超过两条的说明只留第一条，其余收起来。
   *
   * 两种不收：
   *   - 警告色（琥珀 / 红）：那些是「这是假数据」「这一步真的会扣钱」，
   *     收起来就等于把风险藏起来
   *   - 使用者已经手动展开过的：同一次浏览里不要一直弹回去
   */
  const explainOpened = {};      // 这一次浏览里被展开过的，重画后维持展开

  function tidyExplains() {
    const box = $('#view');
    if (!box) return;
    $$('#view .explain').forEach((el, n) => {
      if (el.dataset.tidied) return;
      const style = el.getAttribute('style') || '';
      if (/amber|red/.test(style)) return;              // 警告不收
      const rows = Array.prototype.slice.call(el.querySelectorAll('.ex-r'));
      if (rows.length < 3) return;

      /* 用「第一条的文字」当识别，比用序号稳——同一页重画后顺序不变，
       * 但换一页序号就会撞在一起。 */
      const key = (rows[0].textContent || '').replace(/\s+/g, '').slice(0, 24) + '|' + rows.length;
      el.dataset.tidied = '1';
      const open = !!explainOpened[key];

      const more = document.createElement('div');
      more.className = 'hint';
      more.style.cssText = 'cursor:pointer;padding:6px 0 0;color:var(--violet-2);font-weight:600';
      const apply = () => {
        rows.forEach((r, i) => { if (i > 0) r.style.display = explainOpened[key] ? '' : 'none'; });
        more.textContent = explainOpened[key]
          ? '收起说明 ▴'
          : '还有 ' + (rows.length - 1) + ' 条说明 · 展开 ▾';
      };
      explainOpened[key] = open;
      more.addEventListener('click', () => { explainOpened[key] = !explainOpened[key]; apply(); });
      el.appendChild(more);
      apply();
    });
  }

  function go(r, q) { route = r; query = q || {}; $('#sidebar').classList.remove('open'); render(); }
  window.go = go;

  /* ---------------- 导航 ---------------- */
  $('#nav').addEventListener('click', e => {
    const it = e.target.closest('.nav-item');
    if (it) go(it.dataset.route);
  });
  $('#btn-menu').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $('#btn-new').addEventListener('click', newProjectModal);
  $('#modal-close').addEventListener('click', closeModal);
  $('#modal-mask').addEventListener('click', e => { if (e.target.id === 'modal-mask') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  $('#btn-tour').addEventListener('click', () => TOUR.start(0));
  $('#user-block').addEventListener('click', accountModal);

  /* 帐户设定：决定左下角显示谁、数字人属于谁 */

      <div class="explain" style="margin:0 0 16px;border-left-color:var(--violet)">
        <div class="ex-r"><span class="ex-k">这里改什么</span><span>左下角显示的名字，以及整个系统里「这个数字人属于谁」的称呼。</span></div>
        <div class="ex-r"><span class="ex-k">为什么要改</span><span>每个使用者有自己的专属数字人与声音模型。填上本人名字后，人格页、影片署名都会跟着变。</span></div>
      </div>
      <div class="row2">
        <div class="field"><div class="label">显示名称 <span style="color:var(--red)">*</span></div>
          <input class="input" id="ac-name" value="${esc(ac.name)}" placeholder="填本人的名字或称呼"></div>
        <div class="field"><div class="label">职称 / 角色</div>
          <input class="input" id="ac-title" value="${esc(ac.title)}" placeholder="例如：超级管理员"></div>
      </div>
      <div class="field"><div class="label">头像文字<span class="hint" style="margin-left:8px;font-weight:400">留空就取名字第一个字</span></div>
        <input class="input" id="ac-initial" value="${esc(ac.initial || '')}" maxlength="2" style="width:120px"></div>
      <div class="hint">这只是显示设定。真正的数字人形象与声音在「数字人 · 声音 · 人格」页面训练与切换。</div>`,
      `<button class="btn" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-primary" data-modal-act="save-account">保存</button>`);
  }

  /* 支付与方案：呼叫本机/自建的支付后端建立 Checkout（前端不保存任何金流 Key） */
  async function checkoutPlan(planId) {
    const input = $('#payment-server');
    const base = (input && input.value.trim()) || STORE.s.settings.paymentServer || 'http://localhost:8788';
    STORE.s.settings.paymentServer = base.replace(/\/+$/, '');
    STORE.update();
    const plan = (DATA.BILLING_PLANS || []).find(p => p.id === planId);
    if (!plan) return toast('找不到这个方案', 'warn');
    try {
      toast('正在建立付款页面...', 'ok');
      const res = await fetch(`${STORE.s.settings.paymentServer}/api/payments/checkout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          planId,
          projectId: STORE.current && STORE.current.id,
          customerEmail: STORE.s.account.email || '',
          customerName: STORE.s.account.name || ''
        })
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.url) throw new Error(body.error || `HTTP ${res.status}`);
      location.href = body.url;
    } catch (err) {
      toast(`付款服务未就绪：${err.message}`, 'warn');
    }
  }

      || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nx);
    STORE.s.settings.theme = nx; STORE.s.settings.themeSet = true; STORE.update();
  });

  $('#global-search').addEventListener('input', () => {
    clearTimeout(searchTimer);

  });

  /* ---------------- 全局事件委托 ---------------- */
  /* 上传照片 / 上传录音。
   * 这两个 input 现在放在 index.html 里当常驻元素（不在 #view 内），
   * 所以直接绑在元素本身，不再走 #view 的委派——委派的前提是元素在
   * #view 里面，搬出去之后事件根本传不到。
   * 为什么要搬出去：选档视窗是非同步的，从按下去到使用者选完档案中间
   * 隔了好几秒，这期间只要画面重画一次，原本那个 input 就被销毁了，
   * 选完档案的 change 会发在一个已经脱离文件的元素上，等于毫无反应。 */

    hgUploadPhoto(e.target.files[0]);

  });

      if (name === 'proj-filter') return go('projects', { f: seg.dataset.v });
      if (name === 'lib-tab') return go('library', { t: seg.dataset.v });
      if (name === 'ana-scope') return go('analytics', { sc: seg.dataset.v });

    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    switch (act) {
      case 'goto': return go(el.dataset.route);
      case 'gen-video': return genVideoModal(el.dataset.id);
      case 'del-proj': return delProjectModal(el.dataset.id);
      case 'open-proj': STORE.setCurrent(el.dataset.id); return go('pipeline');
      case 'new-proj': return newProjectModal();
      case 'sel-stage': return go('pipeline', { s: el.dataset.k });
      case 'copy': return copy(el.dataset.t);
      case 'print': return window.print();

      case 'quick-run':
      case 'run-all': {

        if (ENGINE.isRunning) return toast('已有任务在执行中', 'warn');

        toast(`《${p.title}》全流程已启动`, 'ok');
        return;
      }
      case 'run-stage': {
        const idx = DATA.STAGES.findIndex(s => s.key === el.dataset.k);
        if (ENGINE.isRunning) return toast('已有任务在执行中', 'warn');
        ENGINE.start(STORE.current, idx);
        return;
      }
      case 'stop-run': return ENGINE.stop();
      case 'resume-run': return ENGINE.resume();

      case 'view-script': return scriptModal(el.dataset.id);
      case 'play': return playerModal(el.dataset.id);
      case 'checkout-plan': return checkoutPlan(el.dataset.plan);
      case 'copy-payment-env': {
        return copy([
          'STRIPE_SECRET_KEY=sk_test_...',
          'STRIPE_WEBHOOK_SECRET=whsec_...',
          'STRIPE_PRICE_STARTER=price_...',
          'STRIPE_PRICE_PRO=price_...',
          'STRIPE_PRICE_STUDIO=price_...',
          'PUBLIC_APP_URL=http://127.0.0.1:8081'
        ].join('\n'));
      }
      case 'pick-file': return $('#file-input').click();
      case 'clear-files': {
        const p = STORE.current;
        p.materials = []; p.source = null; p.parsed = null;
        STORE.update(); render(); toast('已清空本项目的上传资料', 'ok');
        return;
      }
      case 'export-all': return exportAll();
      case 'export-report': return exportReport();

      case 'day-detail': return dayModal(+el.dataset.d);
      case 'open-sched': return schedModal(el.dataset.id);
      case 'pub-one': {
        const it = STORE.s.schedule.find(x => x.id === el.dataset.id);
        if (it) {
          it.status = '已发布'; syncVideoStatus(it, true);
          STORE.log('ok', `已发布：${it.title}（${it.platform}）`);
          toast('已发布至 ' + it.platform + '，数据待平台回传', 'ok'); render();
        }
        return;
      }
      case 'publish-all': {
        const n = STORE.s.schedule.filter(x => x.status === '待发布').length;
        if (!n) return toast('没有待发布内容', 'warn');
        return modal('批量确认发布', `<div style="font-size:15.5px;line-height:1.9">
            即将发布 <b>${n}</b> 条内容到已授权平台。<br>发布后可在数据分析中查看表现。</div>
            <div class="hint" style="margin-top:12px">提示：发布是不可撤回的对外动作，请确认内容已审核通过。</div>`,
          `<button class="btn" onclick="UI.closeModal()">取消</button>
           <button class="btn btn-primary" data-modal-act="confirm-pub">确认发布 ${n} 条</button>`);
      }
      case 'auth-plat': return toast(`请在「${el.dataset.n}」开放平台完成授权后回到本页`, 'warn');

      /* ---- Instagram Reels 真实发布 ---- */
      case 'ig-check': return igCheck();
      case 'ig-save-app': return igSaveApp();
      case 'ig-connect': {
        window.open(igBase() + '/auth/start', '_blank');
        toast('已开新分页进行授权，完成后回来按「检测」', 'ok');
        return;
      }
      case 'ig-disconnect': {
        fetch(igBase() + '/api/disconnect', { method: 'POST' })
          .then(() => { toast('已断开连接', 'ok'); igCheck(); })
          .catch(() => toast('无法连上发布服务', 'err'));
        return;
      }
      case 'ig-publish': return igPublishModal(el.dataset.id);

      /* ---- YouTube Shorts 真实发布 ---- */
      case 'yt-save-app': return ytSaveApp();
      case 'yt-connect': {
        window.open(igBase() + '/auth/youtube/start', '_blank');
        toast('已开新分页进行授权，完成后回来按「检测」', 'ok'); return;
      }
      case 'yt-disconnect': {
        fetch(igBase() + '/api/youtube/disconnect', { method: 'POST' })
          .then(() => { toast('已断开连接', 'ok'); igCheck(); })
          .catch(() => toast('无法连上发布服务', 'err'));
        return;
      }
      case 'yt-publish': return ytPublishModal(el.dataset.id);

      /* ---- 数字人开口说话（外部真实数字人生成服务）---- */
      case 'hg-check': return hgCheck();
      case 'hg-pick-avatar': {
        HG.mode = 'avatar'; HG.avatarId = el.dataset.id; HG.assetId = null;
        hgSaveChoice(); hgRenderAvatars(); hgRenderGenerate(); hgRenderChoiceSummary();
        toast('已选定这个数字人形象', 'ok'); return;
      }
      case 'hg-pick-voice': {
        HG.voiceId = el.dataset.id;
        hgSaveChoice(); hgRenderVoiceList(); hgRenderGenerate(); hgRenderChoiceSummary();
        toast('已选定这个声音', 'ok'); return;
      }
      case 'view-source': {
        const p = STORE.current;
        const sc = p && (p.scripts || []).find(x => x.id === el.dataset.id);
        if (!sc) return;
        return modal('这一段的出处', `
          <div class="hint" style="margin-bottom:10px">${esc(sc.source || '（没有记录出处）')}</div>

      }

      case 'view-portrait': {
        const u = el.dataset.url;
        if (!u) return;
        return modal('定妆照原图', `
          <img src="${esc(u)}" style="width:100%;max-height:72vh;object-fit:contain;border-radius:12px;background:var(--panel)">
          <div class="hint" style="margin-top:10px">这就是影片里会用的那张。

            图片网址由生成服务托管，可能会过期，要留就先存下来。</div>`);
      }
      case 'auto-voice-all': return autoVoiceAll();
      case 'hook-mark': return hookMark(el.dataset.t, el.dataset.v);
      case 'pub-register': return pubRegisterModal(el.dataset.id);
      case 'pub-manual': return pubManualModal();
      case 'pub-del': return pubDel(el.dataset.id);
      case 'hg-recover': return hgRecover();
      case 'hg-voice-filter': {
        HG.voiceFilter = el.dataset.k || 'all';
        hgRenderVoices(); return;
      }
      case 'ai-scene-image': return aiSceneImage(el.dataset.id);
      /* ---- 提示词直接生成短片（不受固定场景限制）---- */
      case 'ai-write-prompts': return aiWritePrompts();
      case 'add-blank-prompt': {
        const p = STORE.current; if (!p) return;
        p.videoPrompts = (p.videoPrompts || []).concat([{ label: '自己写的', text: '' }]);
        STORE.update(); render(); return;
      }
      case 'clear-prompts': {
        const p = STORE.current; if (!p) return;
        p.videoPrompts = []; STORE.update(); render(); return;
      }
      case 'del-prompt': {
        const p = STORE.current; if (!p) return;
        (p.videoPrompts || []).splice(+el.dataset.i, 1);
        STORE.update(); render(); return;
      }
      case 'template-to-prompt': {
        const t = (DATA.sceneTemplateLibrary ? DATA.sceneTemplateLibrary() : []).find(x => x.id === el.dataset.id);
        const p = STORE.current;
        if (!t || !p) return;
        p.videoPrompts = (p.videoPrompts || []).concat([{
          label: t.name + '（参考模板，可改）',

        }]);
        STORE.update(); render();
        toast(`已把「${t.name}」写成提示词，可以再改`, 'ok');
        window.scrollTo({ top: 0, behavior: 'smooth' });

      }
      /* ---- 书中角色：让书里的主角走进影片 ---- */
      case 'ai-read-characters': return aiReadCharacters();
      case 'add-blank-char': {
        const p = STORE.current; if (!p) return;
        p.characters = (p.characters || []).concat([{ id: DATA.uid('ch'), name: '', role: '', look: '', scene: '', intro: {} }]);
        STORE.update(); render(); return;
      }
      case 'clear-chars': {
        const p = STORE.current; if (!p) return;
        p.characters = []; STORE.update(); render(); return;
      }
      /* 以前这颗叉是按下去就删，没有确认也没有复原。使用者点开定妆照
       * 想看大图、手滑按到旁边的叉，一个花钱生成过定妆照、写好自述稿的
       * 人物就这样消失了。花过钱的东西不该一键蒸发。 */
      case 'del-char': {
        const p = STORE.current; if (!p) return;
        const idx = +el.dataset.i;

        if (!c) return;
        const has = [];
        if (c.portraitUrl) has.push('定妆照');
        if ((c.introScript || '').trim()) has.push('自述稿');
        if (c.videoUrl) has.push('已生成的影片');
        return modal('要删掉这个人物吗？', `
          <div style="font-size:16px;font-weight:700;margin-bottom:10px">${esc(c.name || '未命名人物')}</div>
          <div style="font-size:15.5px;line-height:1.8">
            ${has.length
              ? '这个人物的 <b>' + has.join('、') + '</b> 会一起消失。定妆照和影片都是花钱产出来的。'
              : '这个人物还没有产出任何东西。'}
            <br>删掉之后可以按人物名单那排的「↺ 复原刚删掉的」救回来，但只限这一次。</div>`,
          `<button class="btn" onclick="UI.closeModal()">取消</button>
           <button class="btn btn-primary" data-modal-act="confirm-del-char" data-i="${idx}">确定删掉</button>`);
      }
      case 'restore-char': {
        const t = charTrashFor();
        if (!t.length) return toast('这本书没有删掉过人物', 'warn');
        return modal('复原删掉的人物', `
          <div class="hint" style="margin-bottom:12px">这本书最近删掉的，点一下救回来。定妆照的图片网址可能已经过期，
            救回来之后重生成一张就好，其余栏位都在。</div>
          ${t.map(x => {
            const c = x.c || {};
            const has = [c.portraitUrl ? '定妆照' : '', (c.introScript || '').trim() ? '自述稿' : '', c.videoUrl ? '影片' : '']
              .filter(Boolean).join(' · ') || '只有基本资料';
            return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)">
              <div style="flex:1">
                <div style="font-weight:650">${esc(c.name || '未命名人物')}${c.cast ? ' · ' + esc(c.cast) : ''}</div>
                <div class="hint">${esc(c.role || '')}${c.role ? ' · ' : ''}${esc(has)} · 删于 ${new Date(x.at).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
              </div>
              <button class="btn btn-sm btn-primary" data-modal-act="do-restore-char" data-at="${x.at}">救回来</button>
            </div>`;
          }).join('')}`);
      }
      case 'gen-char-portrait': return aiCharPortrait(+el.dataset.i);
      case 'pick-portrait': {
        const p2 = STORE.current;
        const c2 = p2 && (p2.characters || [])[+el.dataset.i];
        if (!c2) return;
        c2.portraitUrl = el.dataset.url;
        STORE.update(); render();

        return;

      case 'char-to-prompt': return charToPrompt(+el.dataset.i);

      /* ---- 书影（书中人物）（单独功能，不在流水线里）---- */
      case 'ai-read-cast': return aiReadCast();

      case 'compose-intro': return composeIntro(+el.dataset.i);

      case 'gen-prompt-video': return promptVideoConfirm(+el.dataset.i);
      case 'hg-upload-photo-btn':
        if (!hgCanWrite()) return hgDemoNotice();
        return $('#hg-photo-input').click();
      case 'batch-gen': return batchGenModal();
      case 'hg-lib-use': return hgLibUse(el.dataset.id);
      case 'hg-lib-del': {
        e.stopPropagation();
        const it = hgLib().find(x => x.id === el.dataset.id);
        if (it && confirm('要从形象库移除「' + it.name + '」吗？只是从清单拿掉，不影响已经生成好的影片。')) hgLibDel(el.dataset.id);
        return;
      }
      case 'hg-gen-avatar-btn':
        if (!hgCanWrite()) return hgDemoNotice();
        return hgGenAvatarModal();
      case 'hg-upload-audio-btn':
        if (!hgCanWrite()) return hgDemoNotice();
        return $('#hg-audio-input').click();
      case 'hg-generate': {
        if (!hgCanWrite()) return hgDemoNotice();
        const textEl = $('#hg-text');
        const hasSubject = HG.mode === 'image' ? HG.assetId : HG.avatarId;
        if (!hasSubject || !HG.voiceId || !textEl || !textEl.value.trim()) return toast('请先选好形象、声音，并填台词', 'warn');
        HG.text = textEl.value.trim();
        /* 余额不够就先挡下来。送出去要等 1-3 分钟才被打回，讯息还是
         * 一句看不懂的英文——不如在这里讲清楚。 */
        const est = hgEstimate(HG.text);
        if (HGW.balance != null && HGW.balance < est.usd) {
          return toast('余额只剩 US$' + HGW.balance.toFixed(2) + '，这一支估要 US$' + est.usd.toFixed(2)
            + '，先去 app.heygen.com 的 Billing 储值 API credits', 'err');
        }
        return modal('确定要真的生成吗？',
          '<div style="font-size:15.5px">这会真的呼叫外部数字人生成服务产出一支影片，从你的额度扣钱（约 US$1-3，按秒计费），送出后无法撤销、无法退款。</div>',
          `<button class="btn" onclick="UI.closeModal()">取消</button>
           <button class="btn btn-primary" data-modal-act="confirm-hg-gen">确认生成（会扣钱）</button>`);
      }

      /* ---- 人物引擎（合并自同事版本）---- */
      case 'engine-select': return go('engine', { id: el.dataset.id });
      case 'engine-add': {
        const n = (STORE.s.people || []).length + 1;
        STORE.s.people = (STORE.s.people || DATA.PEOPLE.slice()).concat([{
          id: 'p' + String(n).padStart(2, '0') + '_' + Math.random().toString(36).slice(2, 5),
          name: '新人物 ' + n, status: '待训练', score: 0, materialMin: 0,
          scripts: 0, approved: 0, rejected: 0, videos: 0,
          style: ['待上传语料后自动提取'], moat: ['人物档案待建立'],
          next: '上传演讲、文章、短视频脚本，生成第一版风格包'
        }]);
        STORE.update(); render(); toast('已新增人物档案，请上传语料', 'ok');
        return;
      }

      case 'pick-model': return MODELPICK.change(el.dataset.k);

      case 'switch-proj': return;
      case 'toggle': {
        const k = el.dataset.k;
        STORE.s.settings[k] = !STORE.s.settings[k];
        STORE.update(); render();
        toast((STORE.s.settings[k] ? '已开启：' : '已关闭：') + el.closest('.setting-row').querySelector('div>div').textContent, 'ok');
        return;
      }
      case 'reset-demo': {
        return modal('重置演示数据', '<div style="font-size:15.5px">将清空当前所有项目、排程与设置，恢复到初始演示状态。此操作不可撤销。</div>',
          `<button class="btn" onclick="UI.closeModal()">取消</button>
           <button class="btn btn-primary" data-modal-act="confirm-reset">确认重置</button>`);
      }

      case 'add-habit': {
        const v = ($('#new-habit') || {}).value;

      /* 访谈形式那三张卡是点选的，不是下拉；下拉走 change 事件那条路，

      case 'persona-save': { STORE.update(); toast('人格参数已保存，后续生成将立即生效', 'ok'); return; }
      case 'voice-mode': {
        STORE.s.persona.voiceMode = el.dataset.v; STORE.update(); render();
        toast({ clone: '已改用' + STORE.s.account.name + '本人声音', library: '已改用配音员声库', system: '已改用系统合成音' }[el.dataset.v], 'ok');
        return;
      }
      case 'pick-voice': {
        STORE.s.persona.voiceActor = el.dataset.id; STORE.update(); render();
        const v = DATA.VOICES.find(x => x.id === el.dataset.id);
        toast('已选用 ' + v.name, 'ok');
        return;
      }
      case 'try-voice': return tryVoice(el.dataset.id);
      case 'add-sample': {
        const n = STORE.s.persona.cloneSamples.length + 1;
        STORE.s.persona.cloneSamples.push({ name: `录音样本_${String(n).padStart(2, '0')}.wav`, min: 20 + Math.floor(Math.random() * 40) });

  /* 发布/撤回时同步更新影片状态。刚发布的影片数据归零，等平台回传 */
  function syncVideoStatus(item, published) {
    const p = STORE.s.projects.find(x => x.id === item.projectId);
    const v = p && (p.videos || []).find(x => x.id === item.videoId);
    if (!v) return;
    if (published) {
      if (v.status !== '已发布') { v.status = '已发布'; v.views = 0; v.watch = 0; v.like = 0; v.share = 0; v.click = 0; }
    } else {
      v.status = '待审核'; v.views = 0; v.watch = 0; v.like = 0; v.share = 0; v.click = 0;
    }
  }

  /* ============================================================
   * Instagram Reels 真实发布（透过 server/ 的发布服务）
   * 权杖只存在服务端，浏览器拿不到；Meta 也不接受网页直接呼叫
   * ========================================================== */
  const igBase = () => (($('#ig-server') && $('#ig-server').value) || STORE.s.settings.pubServer || 'http://localhost:8787').replace(/\/+$/, '');

  async function igFetch(p, opt) {
    const r = await fetch(igBase() + p, opt);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

            <div class="ex-r"><span class="ex-k">回呼网址</span><span><code>${esc(cfg.redirectUri)}</code></span></div>
          </div>
          <div class="row2">
            <div class="field"><div class="label">Client ID</div><input class="input" id="yt-id" value="${esc(cfg.clientId)}"></div>

  async function ytSaveApp() {
    try {
      await igFetch('/api/youtube/config', {

  /* ============================================================
   * 数字人开口说话（外部真实数字人生成服务）
   * 静态 API Key，没有 OAuth 流程。三种操作、三种花费等级：
   *   - 查询形象/声音、上传照片/录音本身：免费
   *   - 克隆一个声音：会花一点钱
   *   - 生成一支影片：会花比较多钱（约 US$1-3）
   * 故意不做「一键生成全部」的批次按钮。
   * ========================================================== */
  const HG = {
    mode: 'avatar',      // 'avatar' 用现成形象 / 'image' 用刚上传的照片
    avatarId: null, assetId: null, assetPreview: null,
    voiceId: null, text: '',
    avatars: [], voices: [], voiceFilter: 'all', voiceQuery: ''
  };
  /* 部署在 Vercel、一直开着的数字人生成服务，金钥存在 Vercel 项目的
   * 环境变量里——网页上不再需要「服务网址」「API Key」这些欄位，
   * 用户完全看不到、也不用管本机有没有开着什么服务。
   *
   * 「看」（形象、声音列表）对所有人开放，所以公开展示版一进页面就
   * 直接显示得出来；「做」（上传 / 克隆 / 生成，会写入帐号或真的花钱）
   * 需要下面这把凭证，只有内部版建置时才会被 build.js 填进来。 */
  const HG_BASE = 'https://heygen-api-self.vercel.app';
  const HG_WRITE_TOKEN = "wSZNS0NgUyQGOSGmPC7xaJlCQe7ZaI_d"; /* build-token */
  const hgCanWrite = () => !!HG_WRITE_TOKEN;

  /* 一定要有逾时：fetch 预设永远不会自己放弃，网路卡住时那个 Promise
   * 既不成功也不失败，介面就永远停在「连线中…」——使用者只看到一个
   * 转不完的圈，也没有任何出路。逾时后当成失败处理，才有机会显示重试。 */
  /* 会真的跑模型的请求，一律走这支。
   * 预设的 15 秒是给 config / avatars 这种唯读查询用的；读书、写稿、
   * 生图这些服务端自己就要跑 20-60 秒，用预设值等于服务端还在算、
   * 前端先放弃——画面报「连线逾时」，但那边照样算完、钱照样花，
   * 而且结果永远拿不回来。写稿常常只有几篇是真 AI、其余退回模板，
   * 多半就是这样来的。给 90 秒，比服务端自己的 60 秒上限还宽。 */
  /* ============================================================
   * Token 记帐
   *
   * 模型接口本来就会回传 usage（用了多少 input / output token），
   * 但我们一直丢掉——所以事后完全答不出「这一步花了多少」。
   *
   * 记在 hgFetchSlow 这一层：所有会真的跑模型的呼叫都经过它，
   * 一个地方拦就全部涵盖，不用在五个呼叫点各加一次、也不会漏。
   * ========================================================== */
  function aiUsage() {
    const st = STORE.s.settings;
    if (!st.aiUsage) st.aiUsage = { calls: 0, inTok: 0, outTok: 0, usd: 0 };
    return st.aiUsage;
  }

  function recordUsage(u, modelId) {
    if (!u) return;
    const a = aiUsage();
    const inTok = Number(u.prompt_tokens || u.input_tokens || 0);
    const outTok = Number(u.completion_tokens || u.output_tokens || 0);
    if (!inTok && !outTok) return;
    a.calls += 1;
    a.inTok += inTok;
    a.outTok += outTok;
    /* 单价查得到才算钱。查不到宁可只记 token，不要编一个数字给人当真。 */
    const m = (mpCache || []).find(x => x.id === modelId);
    if (m && m.unit === 'tokens' && m.inPrice != null) {
      a.usd += m.inPrice * inTok / 1e6 + (m.outPrice || 0) * outTok / 1e6;
    }
    STORE.update();
    const money = (m && m.inPrice != null)
      ? ' · 约 ' + mpMoney(m.inPrice * inTok / 1e6 + (m.outPrice || 0) * outTok / 1e6)
      : '';
    /* 用量数字要精确。nf() 会把 18400 显示成「1.8万」，看帐时那不够用。 */
    const fmt = function (n) { return n.toLocaleString('en-US'); };
    toast('这一步用了 ' + fmt(inTok + outTok) + ' tokens（输入 ' + fmt(inTok)
      + ' / 输出 ' + fmt(outTok) + '）' + money, 'ok');
  }

  function hgFetchSlow(p, opt) {
    return hgFetch(p, opt, 90000).then(function (j) {
      if (j && j.usage) recordUsage(j.usage, j.model);
      return j;
    });
  }

  async function hgFetch(p, opt, timeoutMs) {
    const o = Object.assign({}, opt);
    if (HG_WRITE_TOKEN) o.headers = Object.assign({}, o.headers, { 'x-bookreel-token': HG_WRITE_TOKEN });
    const ac = new AbortController();
    o.signal = ac.signal;
    const ms = timeoutMs || 15000;
    const timer = setTimeout(() => ac.abort(), ms);
    let r;
    try {
      r = await fetch(HG_BASE + p, o);
    } catch (e) {
      if (e.name === 'AbortError') throw new Error(`连线逾时（超过 ${Math.round(ms / 1000)} 秒没有回应）`);
      throw new Error('连不上服务器：' + e.message);
    } finally {
      clearTimeout(timer);
    }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      /* 服务端回错时会另外带一个「详情」阵列，讲清楚每一条路各自为什么
       * 失败。之前只取 error，画面上就永远是那句笼统的「两个图像服务都
       * 失败了」——缺金钥、超时、模型不存在长得一模一样，每次都得重猜。 */
      const d = j['详情'] || j.details;
      throw new Error((j.error || ('HTTP ' + r.status))
        + (d ? '｜' + (Array.isArray(d) ? d.join('；') : d) : ''));
    }
    return j;
  }

  /* 把「选了哪个形象、哪个声音」写进 STORE。
   * 这一步是三个问题的共同解法：选择存下来之后，页面重整不会掉，
   * 生产流水线也才读得到——在这之前这些选择只活在记忆体里，
   * 除了手动「试跑一支」以外没有任何地方会用到。 */
  function hgSaveChoice() {
    const p = STORE.s.persona;
    p.realAvatarMode = HG.mode;
    p.realAvatarId = HG.avatarId;
    p.realAvatarName = (HG.avatars.find(a => a.id === HG.avatarId) || {}).name || '';
    p.realPhotoAssetId = HG.assetId;
    p.realPhotoPreview = HG.assetPreview;
    p.realVoiceId = HG.voiceId;
    p.realVoiceName = (HG.voices.find(v => v.id === HG.voiceId) || {}).name || '';
    STORE.update();
    /* 在流水线的暂停闸门里就地选形象或声音时，要让闸门上的状态与
     * 「确认，继续生成」按钮立刻跟着变——否则选完了按钮还是灰的，
     * 使用者会以为没选到。 */
    if (route === 'pipeline' && window.ENGINE && ENGINE.isPaused) render();
  }

  /* 反向：进页面时把存过的选择放回记忆体，让介面显示上次选的 */
  function hgRestoreChoice() {
    const p = STORE.s.persona;
    if (p.realAvatarMode) HG.mode = p.realAvatarMode;
    if (p.realAvatarId) HG.avatarId = p.realAvatarId;
    if (p.realPhotoAssetId) HG.assetId = p.realPhotoAssetId;
    if (p.realPhotoPreview) HG.assetPreview = p.realPhotoPreview;
    if (p.realVoiceId) HG.voiceId = p.realVoiceId;
  }

  /* 公开展示版按下会花钱的动作时，与其送出去被挡、跳一个看起来像坏掉的
   * 错误，不如直接讲清楚这是展示版。 */
  function hgDemoNotice() {
    modal('这是公开展示版', `
      <div style="font-size:15.5px;line-height:1.9">
        这一页的<b>形象与声音是真的</b>，可以随便浏览、试听。<br><br>
        但「上传照片 / 上传录音克隆 / 生成影片」会<b>真的产生费用</b>（约 US$1-3 一支），
        所以只开放在内部版操作，公开网址上不开放。
      </div>`,
      `<button class="btn btn-primary" onclick="UI.closeModal()">知道了</button>`);
  }

  let hgTried = false;
  /* 只有第一次进这个页面才真的去连线；之后这页因为其他操作（比如加一句
   * 口头禅）整页重画时，直接从快取重画形象/声音，不用每次都重打网络请求，
   * 也不会打断正在进行中的生成/克隆轮询。 */
  function hgAutoCheck() {
    if (HG.avatars.length || HG.voices.length) {
      hgRenderAvatars(); hgRenderVoices(); hgRenderGenerate(); hgRepaintStatus(); hgRenderChoiceSummary();
      return;
    }
    /* 挂载点还没画出来时不要算「试过了」。
     * hgCheck() 开头找不到 #hg-status 会直接 return，什么都没做；
     * 但如果这里已经把 hgTried 设成 true，之后就永远不会再试，
     * 画面会一直停在「读取中…」。流水线页就是这样——一开始没有闸门、
     * 没有挂载点，等暂停闸门出现时早就被标记成试过了。 */
    if (!$('#hg-status')) return;
    if (hgTried) return;
    hgTried = true;
    hgCheck();
  }

  /* 选好形象/声音之后要有明确反馈，不然使用者点完不知道有没有生效、
   * 接下来该干嘛。这里显示目前选到哪，以及缺哪一样、下一步去哪做。 */
  function hgRenderChoiceSummary() {
    const box = $('#hg-choice-summary');
    if (!box) return;
    const avName = HG.mode === 'image' ? '你上传的照片' : (HG.avatars.find(a => a.id === HG.avatarId) || {}).name;
    const voName = (HG.voices.find(v => v.id === HG.voiceId) || {}).name;
    if (!avName && !voName) {
      box.innerHTML = '<div class="hint">先在上面选一个形象、选一个声音。</div>';
      return;
    }
    box.innerHTML = `
      <div class="explain" style="margin:0">
        <div class="ex-r"><span class="ex-k">目前选好的</span><span>
          <span class="tag ${avName ? 'v' : ''}">形象：${avName ? esc(avName) : '还没选'}</span>
          <span class="tag ${voName ? 'c' : ''}" style="margin-left:6px">声音：${voName ? esc(voName) : '还没选'}</span>
          ${avName && voName ? '　<b style="color:var(--green)">✓ 已选好，会用在这本书接下来生成的所有影片上</b>　→ 去「一键生成短视频」的 STEP 6 就能真的试跑一支' : '　两个都选了才能生成影片，再选一下缺的那个'}
        </span></div>
      </div>`;
  }

  function hgRepaintStatus() {
    const status = $('#hg-status');
    if (status) status.innerHTML = '<div class="hint" style="color:var(--green)">已连接</div>';
  }

  async function hgCheck() {
    const status = $('#hg-status');
    if (!status) return;
    status.innerHTML = '<div class="hint">连线中…（最多等 15 秒）</div>';
    // 就算连不上，也要先让「上传自己的照片」这条路可以走——那条路不依赖形象清单
    hgRenderAvatars(); hgRenderVoices();
    try {
      const cfg = (await hgFetch('/api/config')).heygen;
      if (!cfg.configured) {
        hgTried = false;
        status.innerHTML = `<div class="hint" style="color:var(--amber)">服务还没设定好（管理员需要在 Vercel 项目设置 HEYGEN_API_KEY）。
          你仍然可以<b>上传自己的照片</b>当数字人。</div>`;
        return;
      }
      const [av, vo] = await Promise.all([hgFetch('/api/heygen/avatars'), hgFetch('/api/heygen/voices')]);
      HG.avatars = (av.avatars || []).map(a => Object.assign({ own: true }, a));
      HG.voices = (vo.voices || []).map(decorateVoice);
      hgRestoreChoice();   // 先放回上次存的选择，再决定要不要给预设值
      if (!HG.avatarId && HG.avatars[0]) HG.avatarId = HG.avatars[0].id;
      if (!HG.voiceId && HG.voices[0]) HG.voiceId = HG.voices[0].id;
      hgSaveChoice();
      // 先把自己建的画出来，不要被下面拉公版的请求拖慢
      status.innerHTML = `<div class="hint" style="color:var(--green)">已连接</div>`;
      hgRenderAvatars(); hgRenderVoices(); hgRenderGenerate(); hgRenderChoiceSummary();

      /* 再补上官方公版里的亚洲脸。这是额外的，拿不到也不影响上面已经能用的东西，
       * 所以独立 try 住、失败静默。 */
      try {
        const pub = await hgFetch('/api/heygen/avatars?scope=public', null, 20000);
        const have = new Set(HG.avatars.map(a => a.id));
        const extra = pickAsian(pub.avatars || []).filter(a => !have.has(a.id));
        if (extra.length) {
          HG.avatars = HG.avatars.concat(extra);
          hgRenderAvatars();
        }
      } catch (e) { /* 公版是加分项，没有就算了 */ }
      const st = $('#hg-status');
      if (st) st.innerHTML = `<div class="hint" style="color:var(--green)">已连接 · ${HG.avatars.length} 个形象 / ${HG.voices.length} 个声音可选</div>`;
    } catch (e) {
      hgTried = false; // 失败了，下次进这一页还可以再自动试一次
      status.innerHTML = `<div class="hint" style="color:var(--amber)">连不上数字人服务：${esc(e.message)}
          <br>现成的形象与声音清单读不到，但<b>上传自己的照片</b>这条路不受影响，还是可以用。</div>
        <button class="btn btn-sm" style="margin-top:8px" data-act="hg-check">重新连线</button>`;
      hgRenderAvatars(); hgRenderVoices();
    }
  }

  /* 从官方公版清单里挑亚洲脸。
   * 供应商各版本的字段名不一致（ethnicity / race / tags / description…），
   * 与其猜字段名，不如把整笔资料转成字串比对关键字，来得可靠。
   * 一个都没命中时退回前 8 个——有得选总比空的好，但不假装它们是亚洲脸。 */
  function pickAsian(list) {
    const RE = /asian|chinese|japanese|korean|taiwan|东亚|亞洲|亚洲|中文|华|華/i;
    const hit = list.filter(a => RE.test(JSON.stringify(a)));
    return (hit.length ? hit : list).slice(0, 8).map(a => Object.assign({}, a, { own: false, asian: !!hit.length }));
  }

  /* ---- 形象：挑现成的，或上传照片 ---- */
  function hgRenderAvatars() {
    const panel = $('#hg-avatar-panel');
    if (!panel) return;
    /* 「上传自己的照片」放第一格而且做大：这是唯一不依赖外部清单、永远能用的路，
     * 也是多数人真正想要的东西（专属自己的数字人）。清单读不到时它照样能点。 */
    panel.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px;margin-bottom:12px">
        <div class="hg-avatar" data-act="hg-upload-photo-btn"
            style="border:2px dashed var(--violet);border-radius:14px;padding:8px;cursor:pointer;text-align:center;
                   display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;
                   background:rgba(124,108,255,.07)">

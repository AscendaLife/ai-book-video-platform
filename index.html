  /* 生成单人口播脚本。
   *
   * 为什么是单人不是双人对谈：数字人服务一次只能让「一个形象 + 一个声音」
   * 念一段话，做不出两个人真的对谈。以前这里写的是主持人＋作者的双人对谈稿，
   * 但生成时只能由同一个数字人把两边台词都念完——稿子和实际做得出来的东西
   * 对不上，等于给人看一份永远拍不出来的剧本。
   * 改成单人口播后，稿子写什么、影片就是什么，完全一致。
   * 资料结构维持 [{t, speaker, cue, text}] 不变，分镜表与预览都能沿用。 */
  function genSceneDialogue(b, angle, i) {
    const q = (b.quotes && b.quotes[i % b.quotes.length]) || '把力气用在真正会变大的地方。';
    const pain = (b.pains && b.pains[i % b.pains.length]) || '很努力却看不到结果';
    const theme = (b.themes && b.themes[i % b.themes.length]) || '先判断任务的回报结构';
    const pool = sceneTemplateLibrary();
    /* 优先用使用者在「创意分镜」选好的场景。以前这里一律用
     * (i*3+n) 自动分配，使用者选了也没用——这是「选了没反应」的根因。
     * 没选才退回自动分配，行为跟以前一样。 */
    const picked = (b.sceneIds || []).map(id => pool.find(x => x.id === id)).filter(Boolean);
    const scenes = [0, 1, 2].map(n => {
      const t = picked.length ? picked[n % picked.length] : pool[(i * 3 + n) % pool.length];
      return { name: t.name, visual: t.setting, role: t.fit };
    });
    const style = {
      story: '故事感',
      pain: '痛点追问',
      quote: '金句拆解',
      biz: '专业访谈',
      know: '知识图解',
      excerpt: '书摘讨论',
      author: '作者观察'
    }[angle] || '口播';
    /* 单人口播：一个人对着镜头把这本书讲清楚。
     * 每句都是同一个人说的，所以 speaker 一律是主讲人——影片里也就只会
     * 出现这一个数字人、这一个声音，跟你在「数字人/声音」页选的完全一致。 */
    const me = OWNER();
    const dialogue = [
      { t: '0.0-4.0s', speaker: me, cue: '直接抛问题，别铺陈', text: `先别急着说你没时间。${pain}——这件事《${b.title}》讲得比我狠。` },
      { t: '4.0-10.0s', speaker: me, cue: '给结论，语速稳下来', text: `这本书讲的不是成功学，是面对「${pain}」的时候，你到底该怎么少走弯路。` },
      { t: '10.0-17.0s', speaker: me, cue: '停一下再讲重点', text: `它的核心其实就一句：${theme}。` },
      { t: '17.0-24.0s', speaker: me, cue: '念金句，放慢、加重', text: `书里有句话我抄下来了：${q}` },
      { t: '24.0-31.0s', speaker: me, cue: '解释为什么', text: '为什么这句重要？因为低倍数的努力只会让你越来越忙，高倍数的判断才会让结果自己长出来。' },
      { t: '31.0-38.0s', speaker: me, cue: '预设反驳，自问自答', text: '你可能会说，道理我都懂。但问题从来不是懂不懂，是你有没有真的停下来算过这笔账。' },
      { t: '38.0-46.0s', speaker: me, cue: '给具体动作，语速回快', text: '所以今晚做一件事就够：拿张纸列三栏——消耗、维持、放大。先删掉一个消耗你的任务。' },
      { t: '46.0-52.0s', speaker: me, cue: '收束，讲人话', text: '不用一次改完。删掉一个，你这周就能感觉到差别。' },
      { t: '52.0-60.0s', speaker: me, cue: 'CTA，自然一点别硬推', text: `想看《${b.title}》第一章的书摘，留言「书摘」，下一支我直接拆里面的方法。` }
    ];
    return {
      template: '单人口播',
      style,
      rhythm: '短句、停顿、自问自答、语速有快慢差',
      scenePlan: scenes,
      voicePlan: [
        { role: '主讲人', voice: '用你在「数字人 / 声音 / 克隆」页选好的那个声音', pace: '180-200 wpm', emotion: '像跟朋友讲话，有停顿、有轻重' }
      ],
      dialogue
    };
  }

  /* 生成完整脚本对象 */
  function genScripts(b, count) {
    b = withDefaults(b);
    const out = [];
    for (let i = 0; i < (count || 10); i++) {
      const a = ANGLES[i % ANGLES.length];
      const p = PLATFORMS[i % PLATFORMS.length];
      const duration = defaultVideoDuration();
      const sceneDialogue = genSceneDialogue(b, a.key, i);
      out.push({
        id: uid('s'), n: i + 1, angle: a.key, angleName: a.name, platform: p.key, platformName: p.name,
        title: TITLE_TPL[i % TITLE_TPL.length](b),
        hook: HOOK_TPL[i % HOOK_TPL.length](b),
        body: genScriptBody(b, a.key),
        sceneMode: sceneDialogue.template,
        sceneStyle: sceneDialogue.style,
        rhythm: sceneDialogue.rhythm,
        scenePlan: sceneDialogue.scenePlan,
        voicePlan: sceneDialogue.voicePlan,
        dialogue: scaleDialogue(sceneDialogue.dialogue, duration),
        cta: p.cta, duration, words: Math.round(duration * 4.7),
        score: 66 + Math.floor(Math.random() * 32), persona: false
      });
    }
    return out;
  }

  function scaleDialogue(dialogue, duration) {
    const lines = Array.isArray(dialogue) ? dialogue : [];
    if (!lines.length) return lines;
    const D = clampDuration(duration);
    return lines.map((line, i) => {
      const t0 = +(i * D / lines.length).toFixed(1);
      const t1 = +((i + 1) * D / lines.length).toFixed(1);
      return Object.assign({}, line, { t: `${t0.toFixed(1)}-${t1.toFixed(1)}s` });
    });
  }

  /* 人格改写（Step 5） */
  const HABITS = ['我讲得直白一点，', '你听我说完，', '这里我要停一下，', '说句实在话，', '我自己的体会是，'];
  function applyPersona(s) {
    const dialogue = (s.dialogue || []).map((line, i) => Object.assign({}, line, {
      text: line.speaker === '作者' && i % 2
        ? rand(HABITS) + line.text
        : line.text
    }));
    return Object.assign({}, s, {
      persona: true,
      hook: rand(HABITS) + s.hook,
      body: s.body.replace(/\n\n/g, () => '\n\n') + `\n\n【${OWNER()}收尾】我不劝你一定要买这本书，我只希望你把刚才那句话想清楚。想清楚了，这条视频就没白看。`,
      dialogue,
      score: Math.min(99, s.score + 5 + Math.floor(Math.random() * 6))
    });
  }

  /* 生成分镜（时间轴按实际片长等比分配，不写死秒数） */
  function genShots(s, b) {
    const D = clampDuration(s.duration || defaultVideoDuration());
    if (s.scenePlan && s.dialogue) {
      const scenes = s.scenePlan;
      const lines = s.dialogue;
      const first = scenes[0] || { name: '马路街访', visual: '街景与路人', role: '开场' };
      const second = scenes[1] || { name: '专业访谈室', visual: '书架与沙发', role: '观点' };
      const third = scenes[2] || { name: '车内聊天', visual: '车窗城市', role: '收尾' };
      /* 单人口播的镜头语言：全程同一个人，靠景别、书封、金句卡和换场做变化，
       * 不再有「双人交叉剪」「插嘴重叠」这种数字人做不出来的东西。
       * txt 直接取台词本文，不加「谁说的」前缀——反正全篇只有一个人在讲。 */
      const say = (...idx) => idx.map(n => lines[n]).filter(Boolean).map(x => x.text).join('\n');
      const parts = [
        { t: first.name + '开场', txt: say(0) || s.hook, cam: '中景，背后看得见场地，人物占画面 45%', vis: '前 3 秒字幕大字 + 环境声', w: 0.07 },
        { t: '给结论', txt: say(1), cam: '正面中近景，轻微推镜', vis: '结论关键词大字', w: 0.10 },
        { t: '讲核心观点', txt: say(2), cam: '近景，语速稳', vis: '书封插入 + 核心句字幕', w: 0.12 },
        { t: '金句停顿', txt: say(3), cam: '人物让位，切书页划线与金句卡', vis: '全屏金句卡 + 停顿留白', w: 0.12 },
        { t: second.name + '换场解释', txt: say(4), cam: `换到${second.visual}，中景`, vis: second.role, w: 0.12 },
        { t: '自问自答', txt: say(5), cam: '正面近景，直视镜头', vis: '反问字幕卡', w: 0.12 },
        { t: '给具体做法', txt: say(6), cam: '中景，语速回快', vis: '三栏清单动画（消耗/维持/放大）', w: 0.13 },
        { t: third.name + '收束', txt: say(7), cam: `${third.visual}，中景`, vis: third.role, w: 0.10 },
        { t: 'CTA 与 AI 标识', txt: say(8) || s.cta, cam: '书封 + 人物小窗 + 留言提示', vis: '留言书摘 / 试读 / AI 生成声明', w: 0.12 }
      ];
      let acc = 0;
      return parts.map((p, i) => {
        const t0 = +(acc * D).toFixed(1);
        acc += p.w;
        const t1 = i === parts.length - 1 ? D : +(acc * D).toFixed(1);
        return { t: p.t, txt: p.txt, cam: p.cam, vis: p.vis, t0, t1, dur: `${t0}–${t1}s` };
      });
    }
    const parts = [
      { t: '开场特写', txt: s.hook, cam: '数字人正面近景', vis: '书封悬浮入场', w: 0.13 },
      { t: '观点抛出', txt: s.body.split('\n\n')[1] || s.body.slice(0, 60), cam: '中景 + 轻微推镜', vis: '关键词大字动效', w: 0.27 },
      { t: '论证展开', txt: s.body.split('\n\n')[2] || '展开论证段落', cam: '中景', vis: 'B-roll 场景素材', w: 0.30 },
      { t: '金句强调', txt: rand(b.quotes) || '', cam: '静止近景', vis: '全屏金句卡 + 停顿', w: 0.20 },
      { t: '收尾 CTA', txt: s.cta, cam: '正面中景', vis: '书封 + 购买链接角标', w: 0.10 }
    ];
    let acc = 0;
    return parts.map((p, i) => {
      const t0 = Math.round(acc * D);
      acc += p.w;
      const t1 = i === parts.length - 1 ? D : Math.round(acc * D);
      return { t: p.t, txt: p.txt, cam: p.cam, vis: p.vis, t0, t1, dur: `${t0}–${t1}s` };
    });
  }

  /* 生成视频。只有「已发布」的才有数据——没发布过的影片不可能有观看数 */
  /* 真实流程用：一篇稿子 = 一支待生成的影片。
   * 这里刻意不产生任何播放量、按赞、完播率——那些数字只有影片真的做出来、
   * 真的发布到平台、平台真的回传之后才会有。凭空生成会让人以为影片已经存在。 */
  function genPendingVideos(b, scripts) {
    return scripts.map((s, i) => {
      const p = PLATFORMS.find(x => x.key === s.platform);
      return {
        id: uid('v'), scriptId: s.id, title: s.title, caption: s.hook.slice(0, 26) + '…',
        platform: s.platform, platformName: p.name, color: p.color, ratio: p.ratio,
        angle: s.angleName, duration: s.duration, format: defaultVideoMode(), cover: COVERS[i % COVERS.length],
        status: '待生成',

        heygenId: null,      // 送去生成后的任务编号，用来查进度
        avatarName: '', voiceName: '',   // 这支实际用了哪个形象与声音

  /* 仅供内建示范专案使用：连播放数据一起造，好让工作台/数据分析页有东西可看。
   * 每一支都带 demo:true，介面必须据此标示「演示数据」，不可与真实产出混为一谈。 */
  function genVideos(b, scripts) {
    // 状态用加权随机，不能跟平台一样按序号循环——否则周期互相整除，
    // 会变成永远只有固定那几个平台有已发布的影片
    const pick = () => {
      const r = Math.random();
      return r < 0.4 ? '已发布' : r < 0.65 ? '待审核' : r < 0.85 ? '排程中' : '草稿';
    };
    return scripts.map((s, i) => {
      const p = PLATFORMS.find(x => x.key === s.platform);
      const status = pick();
      const live = status === '已发布';
      const views = live ? Math.floor(Math.random() * 480000) + 8000 : 0;
      return {
        id: uid('v'), scriptId: s.id, title: s.title, caption: s.hook.slice(0, 26) + '…',
        platform: s.platform, platformName: p.name, color: p.color, ratio: p.ratio,
        angle: s.angleName, duration: s.duration, cover: COVERS[i % COVERS.length],
        status,
        demo: true,          // 这是演示数据，介面必须标示出来
        views,
        watch: live ? 28 + Math.floor(Math.random() * 55) : 0,
        like: live ? Math.floor(views * (0.02 + Math.random() * 0.06)) : 0,
        share: live ? Math.floor(views * (0.004 + Math.random() * 0.02)) : 0,
        click: live ? Math.floor(views * (0.002 + Math.random() * 0.012)) : 0,
        day: Math.floor(Math.random() * 28) + 1
      };
    });
  }

  /* 数据分析（7 日 / 平台 / 漏斗）。统计范围只含已发布的影片 */
  function genAnalytics(all) {
    const videos = (all || []).filter(v => v.status === '已发布');
    const days = [];
    for (let i = 6; i >= 0; i--) {
      days.push({ label: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'][6 - i],
        view: 40000 + Math.floor(Math.random() * 90000), inter: 2000 + Math.floor(Math.random() * 7000) });
    }
    const byPlat = PLATFORMS.map(p => {
      const vs = videos.filter(v => v.platform === p.key);
      return { name: p.name, color: p.color, value: vs.reduce((a, v) => a + v.views, 0), count: vs.length };
    }).filter(x => x.count).sort((a, b) => b.value - a.value);
    const total = videos.reduce((a, v) => a + v.views, 0) || 1;
    const funnel = [
      { k: '曝光', v: Math.round(total * 3.4) }, { k: '播放', v: total },
      { k: '看完 50%', v: Math.round(total * 0.42) }, { k: '互动', v: Math.round(total * 0.061) },
      { k: '点击书链', v: Math.round(total * 0.0093) }, { k: '下单', v: Math.round(total * 0.0011) }
    ];
    return { days, byPlat, funnel, total, liveCount: videos.length, allCount: (all || []).length };
  }

  /* 构建一个完整项目 */
  function buildProject(seed, full) {
    const b = Object.assign({ id: uid('bk'), createdAt: Date.now(), materials: [] }, seed);
    if (full) {
      // 只有内建的示范项目（工作台上那几本already-done的书）才假装「本来就有资料」；
      // 使用者自己新建的项目必须从空列表开始，不然会跟真的上传结果混在一起，分不清哪些是自己传的。
      b.materials = [
        { name: `${b.title}_内文.pdf`, type: 'PDF', size: '8.4 MB', status: '已解析' },
        { name: `${b.title}_书封.jpg`, type: '图片', size: '1.2 MB', status: '已解析' },
        { name: '作者介绍与推荐序.docx', type: '文档', size: '286 KB', status: '已解析' },
        { name: '出版社宣传资料.pptx', type: '文档', size: '4.1 MB', status: '已解析' }
      ];
      b.titles = genTitles(b, 20);
      b.hooks = genHooks(b, 20);
      b.opens = genOpens(b);
      b.scripts = genScripts(b, 14).map(s => (b.status === 'done' || b.status === 'ready') ? applyPersona(s) : s);
      b.videos = genVideos(b, b.scripts).concat(genVideos(b, genScripts(b, 16)));
      b.stages = STAGES.map(s => ({ key: s.key, state: 'done' }));
    } else {
      b.titles = []; b.hooks = []; b.opens = []; b.scripts = []; b.videos = [];
      b.stages = STAGES.map(s => ({ key: s.key, state: 'todo' }));
    }
    return b;
  }

  function seedAll() {
    const list = [buildProject(SEED_BOOKS[0], true), buildProject(SEED_BOOKS[1], true), buildProject(SEED_BOOKS[2], true)];
    list[1].stages = STAGES.map((s, i) => ({ key: s.key, state: i < 4 ? 'done' : i === 4 ? 'run' : 'todo' }));
    list[1].videos = list[1].videos.slice(0, 9);
    return list;
  }

  /* 书籍档案（JSON）→ 专案资料。支援中文与英文栏位名。 */
  function importProfile(json, p) {
    const g = (...keys) => { for (const k of keys) if (json[k] != null) return json[k]; };
    const title = g('书名', 'title');
    if (!title) return { ok: false, msg: '档案里找不到「书名」栏位，请确认格式' };

    p.title = title;
    p.subtitle = g('副标题', 'subtitle') || '';
    p.author = g('作者', 'author') || '佚名';
    p.publisher = g('出版社', 'publisher') || '未填写';
    p.category = g('分类', 'category') || '';
    p.tags = g('标签', 'tags') || [];
    p.summary = g('全书摘要', 'summary') || '';
    p.themes = g('核心论点', 'themes') || [];
    p.pains = g('读者痛点', 'pains') || [];
    p.hots = g('热点话题', 'hots') || [];
    p.toc = (g('目录', 'toc') || []).map(t => (typeof t === 'string' ? t : `第 ${t['章'] || t.no} 章　${t['标题'] || t.title}`));
    p.words = g('字数', 'words') || 0;
    p.chapterCount = g('章节数', 'chapters') || p.toc.length;
    p.authorBio = g('作者简介', 'authorBio') || '';
    p.publisherBio = g('出版社简介', 'publisherBio') || '';

    const qs = g('金句', 'quotes') || [];
    p.quoteSrc = qs.map(q => (typeof q === 'string'
      ? { text: q, chapter: null, page: null }
      : { text: q['文字'] || q.text, chapter: q['章节'] || q.chapter, page: q['页码'] || q.page }))
      .filter(q => q.text);
    p.quotes = p.quoteSrc.map(q => q.text);

    const au = g('读者画像', 'audiences') || [];
    p.audiences = au.map(a => (typeof a === 'string'
      ? { name: a, size: Math.round(100 / au.length), note: '' }
      : { name: a['名称'] || a.name, size: a['占比'] || a.size || 0, note: a['特征'] || a.note || '' }));

    const ci = g('封面配色', 'cover');
    if (typeof ci === 'number' && COVERS[ci]) p.cover = COVERS[ci];

    p.source = { kind: 'profile', label: '完整书籍档案' };
    return {
      ok: true,
      stat: { 论点: p.themes.length, 金句: p.quoteSrc.length, 画像: p.audiences.length, 痛点: p.pains.length, 目录: p.toc.length }
    };
  }

  /* 内文（TXT / MD）→ 本地启发式解析（非 AI，纯规则） */
  function parseText(text) {
    const chars = (text.match(/[一-鿿]/g) || []).length;
    const heads = (text.match(/^(#{1,3}\s*.+|第\s*[0-9一二三四五六七八九十]+\s*章.*)$/gm) || [])
      .map(s => s.replace(/^#+\s*/, '').trim());
    const seen = {};
    const quotes = text
      .split(/[。！？\n]/).map(s => s.replace(/^[#\s>*\-]+/, '').trim())
      .filter(s => {
        if (s.length < 12 || s.length > 40) return false;
        if (/[0-9A-Za-z（）()《》]/.test(s)) return false;
        if (seen[s]) return false;
        seen[s] = 1; return true;
      });
    // raw 保留一段原始内文，给「真的用 AI 读这本书」用；
    // 只留前 20000 字，避免整本书塞进 localStorage 撑爆容量
    return { chars, chapters: heads, quotes: quotes.slice(0, 24), raw: text.slice(0, 20000) };
  }

/* ============================================================
 * store.js — 全局状态与本地持久化
 * ========================================================== */
window.STORE = (function () {
  const KEY = 'zd_ai_book_video_v1';

  const def = () => ({
    projects: DATA.seedAll(),
    currentId: null,
    /* 登录帐户：每个使用者有自己的名称与专属数字人、声音。
       演示环境用中性预设，实际使用时在系统设定改成本人名字。 */
    account: { name: '主理人', title: '超级管理员', initial: '主' },
    /* 人物档案：一个平台可以服务多个人，各自有专属风格包（合并自同事版本） */
    people: null,
    persona: JSON.parse(JSON.stringify(DATA.PERSONA)),
    settings: {
      theme: 'dark',
      llm: 'claude-opus-5',
      tts: 'zhao-voice-v3',
      avatarEngine: 'ZD-Avatar 2.0 (口型+表情+手势)',
      autoPersona: true, autoSubtitle: true, autoBroll: true, autoBgm: true,
      videoDuration: 60,
      realAI: true,   // STEP 2/4 用真实模型（约 US$0.6/本）；关掉就走模板
      /* 每个会花钱的 AI 步骤开跑前，先弹窗让人挑模型。
       * 勾了「不用再问」就变 false，之后直接用 modelPicks 里记住的。 */
      askModel: true,
      /* 各步骤记住的模型：{ read/script/rewrite/prompts/image: '模型 id 或策略' }。
       * 空的时候各步骤用自己的预设（文字 auto、图像 fast）。 */
      modelPicks: {},
      compliance: true, watermark: true, autoPublish: false,
      quotaUsed: 186, quotaTotal: 500
    },
    schedule: [],
    activity: []
  });

  let state;
  try {
    const raw = localStorage.getItem(KEY);
    state = raw ? JSON.parse(raw) : def();
    if (!state.projects || !state.projects.length) state = def();
  } catch (e) { state = def(); }

  /* 资料迁移：浏览器里可能存着旧版本的资料，缺少新版新增的栏位。
     不补齐的话，新功能一读到 undefined 就会整页崩掉。 */
  (function migrate() {
    const d = def();
    state.persona = Object.assign({}, d.persona, state.persona || {});
    state.settings = Object.assign({}, d.settings, state.settings || {});
    // 旧资料没有这个物件，不补齐的话选模型窗口一存就崩
    if (!state.settings.modelPicks || typeof state.settings.modelPicks !== 'object') state.settings.modelPicks = {};
    state.account = Object.assign({}, d.account, state.account || {});
    if (!state.account.name) state.account = d.account;
    if (!Array.isArray(state.persona.cloneSamples)) state.persona.cloneSamples = d.persona.cloneSamples;
    /* 访谈式对谈：旧资料只有一个笼统的「来宾」，没有「对面坐的是谁」这件事。
       补成预设的 AI 提问者，旧的固定模板 ID 也一并放掉，改由形式自己决定。 */
    if (!DATA.INTERVIEW_FORMATS.some(f => f.id === state.persona.interviewFormat)) {
      state.persona.interviewFormat = d.persona.interviewFormat;
    }
    if (state.persona.conversationTemplateId === 'bookreel_fixed_interview_v1') state.persona.conversationTemplateId = '';
    if (state.persona.guestName === '来宾') state.persona.guestName = '';
    if (!Array.isArray(state.persona.habits)) state.persona.habits = d.persona.habits;
    if (!Array.isArray(state.people) || !state.people.length) state.people = null;
    if (!Array.isArray(state.schedule)) state.schedule = [];
    if (!Array.isArray(state.activity)) state.activity = [];
    state.projects.forEach(p => {
      if (!Array.isArray(p.materials)) p.materials = [];
      // 书中角色：旧资料没有这个栏位，不补齐的话「让主角走进影片」一读就崩
      if (!Array.isArray(p.characters)) p.characters = [];
      /* 「书影（书中人物）」用同一份人物名单，但多两个栏位：
         id 是生成影片时跨页、跨重整追踪那一支的依据（光靠阵列索引不行——
         中间删掉一个人，索引就对到别人身上）；intro 是自述稿的六段。 */
      p.characters.forEach(c => {
        if (!c) return;
        if (!c.id) c.id = DATA.uid('ch');
        if (!c.intro || typeof c.intro !== 'object') c.intro = {};
      });
      if (!Array.isArray(p.videoPrompts)) p.videoPrompts = [];
      ['titles', 'hooks', 'opens', 'scripts', 'videos'].forEach(k => { if (!Array.isArray(p[k])) p[k] = []; });
      /* 旧版影片全是凭空造的假数据（随机播放量、随机「已发布」状态），
       * 但没有 demo 标记，介面会把它们当成真影片显示。
       * 凡是带旧状态值又没有真影片档的，一律补上 demo 标记，
       * 介面才能明确标示「这是演示假数据」，不再让人误会。 */
      p.videos.forEach(v => {
        if (v.demo === undefined && !v.videoUrl &&
            ['已发布', '待审核', '排程中', '草稿'].indexOf(v.status) >= 0) v.demo = true;
        if (!v.format) v.format = state.persona.videoMode || d.persona.videoMode;
      });
      /* 步骤表会变（例如 STEP 3「定营销策略」被删掉），但浏览器里存着的
       * 旧资料还留着那一格。流水线画面是按 DATA.STAGES 的顺序取 stages[i]，
       * 多出来的那一格会让后面每一步的状态整个错位一格——写稿那一步会显示
       * 成别人的状态。所以一律按 key 重新对齐，认得的保留原状态，
       * 不认得的（已删掉的步骤）直接丢掉。 */
      const stateByKey = {};
      (Array.isArray(p.stages) ? p.stages : []).forEach(s => { if (s && s.key) stateByKey[s.key] = s.state; });
      p.stages = DATA.STAGES.map(s => ({ key: s.key, state: stateByKey[s.key] || 'todo' }));
      // 营销策略那一步的产出也一起清掉，留着只会占地方
      if (p.strategy) delete p.strategy;
      /* 旧版稿子是「主持人＋作者」双人对谈，但数字人一次只能一个形象一个声音，
       * 那种稿子永远拍不出来。凡是还带双人台词的，一律重新产生成单人口播稿，
       * 否则使用者拿旧稿去生成，出来的东西还是跟稿子对不上。
       * 判断依据：dialogue 里出现两个以上不同的 speaker。 */
      const isTwoPerson = s => new Set((s.dialogue || []).map(x => x.speaker)).size > 1;
      if (p.scripts.length && p.scripts.some(isTwoPerson)) {
        const fresh = DATA.genScripts(p, p.scripts.length);
        p.scripts = p.scripts.map((s, i) => Object.assign({}, s, {
          sceneMode: fresh[i].sceneMode,
          rhythm: fresh[i].rhythm,
          voicePlan: fresh[i].voicePlan,
          dialogue: fresh[i].dialogue,
          aiWritten: false        // 重新产生过，不能再挂着「AI 写的」标记
        }));
      }
      // 旧版脚本没有场景对谈栏位（scenePlan / dialogue / voicePlan），补生成一份，
      // 否则「创意分镜」与脚本详情弹窗读到 undefined 会直接崩掉
      if (p.scripts.length && p.scripts.some(s => !s.scenePlan || !s.dialogue || !s.voicePlan)) {
        const fresh = DATA.genScripts(p, p.scripts.length);
        p.scripts = p.scripts.map((s, i) => Object.assign({}, s, {
          duration: defaultVideoDuration(),
          sceneMode: fresh[i].sceneMode,
          sceneStyle: fresh[i].sceneStyle,
          rhythm: fresh[i].rhythm,
          scenePlan: fresh[i].scenePlan,
          voicePlan: fresh[i].voicePlan,
          dialogue: fresh[i].dialogue
        }));
      }
    });
  })();

  if (!state.currentId) state.currentId = state.projects[0].id;

  const subs = [];
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function emit() { save(); subs.forEach(f => f(state)); }

  /* 首次生成排程 */
  function ensureSchedule() {
    if (state.schedule.length) return;
    const all = [];
    state.projects.forEach(p => (p.videos || []).slice(0, 12).forEach(v => {
      all.push({ id: DATA.uid('sc'), projectId: p.id, bookTitle: p.title, videoId: v.id,
        title: v.title, platform: v.platformName, color: v.color, day: v.day,
        hour: [8, 12, 18, 20, 21][Math.floor(Math.random() * 5)],
        status: v.status === '已发布' ? '已发布' : '待发布' });
    }));
    state.schedule = all;
  }

  function log(type, text) {
    state.activity.unshift({ id: DATA.uid('a'), type, text, at: Date.now() });
    state.activity = state.activity.slice(0, 40);
  }

  if (!state.activity.length) {
    ['《认知杠杆》30 支短视频已全部渲染完成', '主理人人格模型 v3.2 校验通过（一致性 96.4%）',
     '《慢决策》进入「套用主理人人格」阶段', '本周抖音总播放突破 120 万', '《第二曲线的起点》已写完 14 篇口播稿'
    ].forEach((t, i) => state.activity.push({ id: DATA.uid('a'), type: ['ok', 'ok', 'run', 'info', 'ok'][i], text: t, at: Date.now() - i * 3600e3 }));
  }
  ensureSchedule();
  save();

  return {
    get s() { return state; },
    get current() { return state.projects.find(p => p.id === state.currentId) || state.projects[0]; },
    setCurrent(id) { state.currentId = id; emit(); },
    addProject(p) { state.projects.unshift(p); state.currentId = p.id; log('ok', `新建书籍项目《${p.title}》`); emit(); },
    removeProject(id) {
      state.projects = state.projects.filter(p => p.id !== id);
      state.schedule = state.schedule.filter(s => s.projectId !== id);
      try { localStorage.removeItem(KEY + '_text_' + id); } catch (e) {}   // 内文另存一个 key，删专案时一起清掉
      if (!state.projects.length) state.projects = DATA.seedAll();
      if (!state.projects.find(p => p.id === state.currentId)) state.currentId = state.projects[0].id;
      emit();
    },
    update() { emit(); },

    /* ---- 整本书的内文 ----
     * 不放进主状态：主状态每改一个栏位就整包重写一次 localStorage，
     * 一本书十几万字塞在里面，每次储存都要搬一次，很快就会撞到容量上限。
     * 所以一本书一个独立的 key，只有上传与阅读时才碰。 */
    bookTextKey: id => KEY + '_text_' + id,
    getBookText(id) {
      try { return localStorage.getItem(KEY + '_text_' + id) || ''; } catch (e) { return ''; }
    },
    setBookText(id, text) {
      try { localStorage.setItem(KEY + '_text_' + id, text); return true; }
      catch (e) {
        /* 容量满了要说实话：截短存一半，并让呼叫端知道只留住了多少，
         * 不能默默存失败，否则「AI 读完整本书」会读到空的。 */
        try {
          const half = text.slice(0, 60000);
          localStorage.setItem(KEY + '_text_' + id, half);
          return half.length;
        } catch (e2) { return false; }
      }
    },
    dropBookText(id) { try { localStorage.removeItem(KEY + '_text_' + id); } catch (e) {} },
    log(t, x) { log(t, x); emit(); },
    reset() { state = def(); ensureSchedule(); emit(); },
    on(f) { subs.push(f); }
  };
})();

/* ============================================================
 * ui.js — 通用 UI 工具
 * ========================================================== */
window.UI = (function () {

  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nf = n => n >= 100000000 ? (n / 100000000).toFixed(1) + '亿'
    : n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  function toast(msg, type) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.innerHTML = esc(msg);
    box.appendChild(el);
    if (window.I18N) I18N.apply(el);
    setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = '0'; el.style.transform = 'translateX(24px)'; setTimeout(() => el.remove(), 300); }, 2800);
  }

  /* 弹窗关闭钩子：任何开启或关闭都会触发，用于停掉弹窗内的计时器等资源 */
  const closeHooks = [];
  const onClose = f => closeHooks.push(f);
  const runHooks = () => closeHooks.forEach(f => { try { f(); } catch (e) {} });

  function modal(title, body, foot, wide) {
    runHooks();
    $('#modal-title').innerHTML = title;
    $('#modal-body').innerHTML = body;
    $('#modal-foot').innerHTML = foot || '';
    $('#modal').classList.toggle('wide', !!wide);
    $('#modal-mask').classList.add('show');
    if (window.I18N) I18N.apply($('#modal'));
  }
  function closeModal() { runHooks(); $('#modal-mask').classList.remove('show'); }

  function copy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板', 'ok'); } catch (e) { toast('复制失败，请手动选择', 'warn'); }
    ta.remove();
  }

  function download(name, content) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已导出：' + name, 'ok');
  }

  const statusTag = s => {
    const m = { 'done': ['g', '已完成'], 'ready': ['c', '待生产'], 'producing': ['a', '生产中'], 'draft': ['', '草稿'],
      '已发布': ['g', '已发布'], '待审核': ['a', '待审核'], '排程中': ['c', '排程中'], '草稿': ['', '草稿'], '待发布': ['v', '待发布'],
      // 影片按需生成的四个状态：稿子写好了但还没做成影片 → 正在做 → 做好了 → 做失败
      '待生成': ['', '待生成'], '生成中': ['a', '生成中'], '已生成': ['g', '已生成'], '生成失败': ['r', '生成失败'] };
    const x = m[s] || ['', s];
    return `<span class="tag ${x[0]}"><i class="dot ${x[0]}"></i>${x[1]}</span>`;
  };

  const scoreBar = v => `<div style="display:flex;align-items:center;gap:8px">
      <div class="bar" style="width:56px"><i style="width:${v}%"></i></div>
      <span style="font-size:13px;color:var(--txt-3);font-weight:600">${v}</span></div>`;

  return { $, $$, esc, nf, toast, modal, closeModal, onClose, copy, download, statusTag, scoreBar };
})();

/* ============================================================
 * charts.js — 纯 SVG 图表（无第三方依赖）
 * ========================================================== */
window.CHART = (function () {
  const nf = n => window.UI ? UI.nf(n) : n;

  /* 折线 + 面积图（双系列） */
  function line(data, opt) {
    opt = opt || {};
    const W = 720, H = 230, PL = 46, PR = 14, PT = 16, PB = 28;
    const max = Math.max.apply(null, data.map(d => d.view)) * 1.18 || 1;
    const iw = W - PL - PR, ih = H - PT - PB;
    const x = i => PL + (iw / (data.length - 1 || 1)) * i;
    const y = v => PT + ih - (v / max) * ih;

    const p1 = data.map((d, i) => `${i ? 'L' : 'M'}${x(i)},${y(d.view)}`).join(' ');
    const area = p1 + ` L${x(data.length - 1)},${PT + ih} L${PL},${PT + ih} Z`;
    const p2 = data.map((d, i) => `${i ? 'L' : 'M'}${x(i)},${y(d.inter * 8)}`).join(' ');

    let grid = '', ylab = '';
    for (let g = 0; g <= 4; g++) {
      const gy = PT + (ih / 4) * g;
      grid += `<line x1="${PL}" y1="${gy}" x2="${W - PR}" y2="${gy}" stroke="var(--line)" stroke-dasharray="3 5"/>`;
      ylab += `<text x="${PL - 9}" y="${gy + 4}" text-anchor="end" font-size="10" fill="var(--txt-3)">${nf(Math.round(max - (max / 4) * g))}</text>`;
    }
    const xlab = data.map((d, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--txt-3)">${d.label}</text>`).join('');
    const dots = data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.view)}" r="3.6" fill="var(--bg)" stroke="#7c6cff" stroke-width="2"><title>${d.label} 播放 ${nf(d.view)} · 互动 ${nf(d.inter)}</title></circle>`).join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7c6cff" stop-opacity=".38"/><stop offset="100%" stop-color="#7c6cff" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}${ylab}
      <path d="${area}" fill="url(#ga)"/>
      <path d="${p1}" fill="none" stroke="#7c6cff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="${p2}" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
      ${dots}${xlab}
    </svg>`;
  }

  /* 横向条形图 */
  function bars(items) {
    const max = Math.max.apply(null, items.map(i => i.value)) || 1;
    return `<div style="display:flex;flex-direction:column;gap:13px">` + items.map(i => `
      <div>
        <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px">
          <span style="display:flex;align-items:center;gap:7px"><i style="width:8px;height:8px;border-radius:2px;background:${i.color};display:inline-block"></i>${UI.esc(i.name)}
            <span style="color:var(--txt-3);font-size:13px">${i.count ? i.count + ' 支' : ''}</span></span>
          <b style="font-weight:650">${nf(i.value)}</b>
        </div>
        <div class="bar" style="height:7px"><i style="width:${(i.value / max * 100).toFixed(1)}%;background:${i.color}"></i></div>
      </div>`).join('') + `</div>`;
  }

  /* 环形图 */
  function donut(items, center) {
    const total = items.reduce((a, i) => a + i.value, 0) || 1;
    const R = 62, C = 2 * Math.PI * R;
    let off = 0;
    const segs = items.map(i => {
      const len = (i.value / total) * C;
      const s = `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${i.color}" stroke-width="17"
        stroke-dasharray="${len - 2.5} ${C - len + 2.5}" stroke-dashoffset="${-off}" stroke-linecap="round"
        transform="rotate(-90 80 80)"><title>${UI.esc(i.name)} ${((i.value / total) * 100).toFixed(1)}%</title></circle>`;
      off += len; return s;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <div style="position:relative;width:160px;height:160px;flex:0 0 160px">
        <svg viewBox="0 0 160 160" style="width:160px;height:160px">
          <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="17"/>${segs}</svg>
        <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
          <div><div style="font-size:21.5px;font-weight:750">${center || nf(total)}</div>
          <div style="font-size:12.5px;color:var(--txt-3)">总播放</div></div></div>
      </div>
      <div style="flex:1;min-width:170px;display:flex;flex-direction:column;gap:9px">
        ${items.map(i => `<div style="display:flex;align-items:center;gap:9px;font-size:14.5px">
          <i style="width:9px;height:9px;border-radius:3px;background:${i.color}"></i>
          <span style="flex:1">${UI.esc(i.name)}</span>
          <b>${((i.value / total) * 100).toFixed(1)}%</b></div>`).join('')}
      </div></div>`;
  }

  /* 漏斗 */
  function funnel(items) {
    const max = items[0].v || 1;
    const cols = ['#7c6cff', '#8b5cf6', '#a855f7', '#22d3ee', '#2ee6a8', '#ffb020'];
    return `<div style="display:flex;flex-direction:column;gap:9px">` + items.map((it, i) => {
      const w = Math.max(12, (it.v / max) * 100);
      const rate = i ? ((it.v / items[i - 1].v) * 100).toFixed(1) + '%' : '—';
      return `<div style="display:flex;align-items:center;gap:12px">
        <div style="width:66px;font-size:14px;color:var(--txt-2)">${it.k}</div>
        <div style="flex:1;background:var(--panel-2);border-radius:8px;overflow:hidden;height:32px;position:relative">
          <div style="width:${w}%;height:100%;background:linear-gradient(90deg,${cols[i]},${cols[i]}aa);border-radius:8px;
            display:flex;align-items:center;padding-left:11px;font-size:14px;font-weight:650;color:#fff">${nf(it.v)}</div>
        </div>
        <div style="width:52px;text-align:right;font-size:13.5px;color:var(--txt-3)">${rate}</div>
      </div>`;
    }).join('') + `</div>`;
  }

  /* 进度环 */
  function ring(pct, label) {
    const R = 56, C = 2 * Math.PI * R;
    return `<div class="ring"><svg viewBox="0 0 132 132" width="132" height="132">
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="10"/>
      <defs><linearGradient id="rg"><stop offset="0%" stop-color="#7c6cff"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${C}" stroke-dashoffset="${C - C * pct / 100}" style="transition:stroke-dashoffset .5s"/>
      </svg><div class="rv">${label != null ? label : Math.round(pct) + '%'}</div></div>`;
  }

  /* 雷达图（人格特征） */
  function radar(items) {
    const cx = 110, cy = 105, R = 78, n = items.length;
    const pt = (i, r) => {
      const a = (Math.PI * 2 / n) * i - Math.PI / 2;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    };
    let webs = '';
    [.25, .5, .75, 1].forEach(f => {
      webs += `<polygon points="${items.map((_, i) => pt(i, R * f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
    });
    const axes = items.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, R)[0]}" y2="${pt(i, R)[1]}" stroke="var(--line)"/>`).join('');
    const poly = items.map((it, i) => pt(i, R * it.v / 100).join(',')).join(' ');
    const labs = items.map((it, i) => {
      const [x, y] = pt(i, R + 18);
      return `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10.5" fill="var(--txt-3)">${it.k}</text>`;
    }).join('');
    return `<svg viewBox="0 0 220 215" style="width:100%;max-width:250px;height:auto">
      ${webs}${axes}
      <polygon points="${poly}" fill="rgba(124,108,255,.28)" stroke="#7c6cff" stroke-width="2"/>
      ${items.map((it, i) => { const p = pt(i, R * it.v / 100); return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#22d3ee"/>`; }).join('')}
      ${labs}</svg>`;
  }

  /* 迷你走势 */
  function spark(vals, color) {
    const W = 100, H = 28, max = Math.max.apply(null, vals) || 1, min = Math.min.apply(null, vals);
    const p = vals.map((v, i) => `${i ? 'L' : 'M'}${(W / (vals.length - 1)) * i},${H - ((v - min) / (max - min || 1)) * (H - 4) - 2}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:28px">
      <path d="${p}" fill="none" stroke="${color || '#7c6cff'}" stroke-width="2" stroke-linecap="round"/></svg>`;
  }

  return { line, bars, donut, funnel, ring, radar, spark };
})();


/* ===== engine.js ===== */
/* ============================================================
 * engine.js — 生产流水线执行引擎（模拟异步任务编排）
 * 真实接入：把 runTask 换成轮询后端任务状态即可。
 * ========================================================== */
window.ENGINE = (function () {

  let running = null;   // { projectId, stageIndex, taskIndex, timer }
  let paused = false;   // 停在某个阶段之前，等使用者确认
  const listeners = [];
  const logs = [];

  /* 在「数字人开口说话」之前停下来。理由：这一步之后产出的就是成片，
   * 用什么形象、什么声音、什么场景都定死了，改就得整批重跑。
   * 停在这里成本最低，也是使用者真正想介入的点。 */
  const PAUSE_BEFORE = 'avatar';

  function on(f) { listeners.push(f); }
  function emit(evt) { listeners.forEach(f => f(evt, snapshot())); }
  function snapshot() {
    return { running: !!running, projectId: running && running.projectId,
      stageIndex: running ? running.stageIndex : -1, taskIndex: running ? running.taskIndex : -1, logs: logs.slice(0, 200) };
  }
  function addLog(cls, text) {
    const t = new Date();
    const ts = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
    logs.unshift({ cls, text, ts });
    if (logs.length > 300) logs.pop();
  }

  /* 启动全流程 */
  function start(project, fromIndex) {
    if (running) { UI.toast('已有任务在执行中', 'warn'); return; }
    logs.length = 0;
    addLog('l-info', `任务队列已创建 · 项目《${project.title}》`);
    /* 以前这行报的是设定页里那个写死的下拉选单值，跟真正送出去的模型
     * 无关。现在读「选模型」记住的实际选择；每一步开跑前还会再问一次，
     * 所以这里只写目前的预设，不把它讲成定局。 */
    const mp = window.MODELPICK;
    if (mp) {
      addLog('l-info', `预设模型 — 读书：${mp.label('read')} · 写稿：${mp.label('script')}`
        + (STORE.s.settings.askModel === false ? '（已设为不再询问，直接用这个）' : '（每一步开跑前会再问一次，可当场换）'));
    }
    addLog('l-info', `声音模型：${STORE.s.settings.tts}`);
    project.status = 'producing';
    running = { projectId: project.id, stageIndex: fromIndex || 0, taskIndex: -1, timer: null };
    project.stages = DATA.STAGES.map((s, i) => ({ key: s.key, state: i < (fromIndex || 0) ? 'done' : 'todo' }));
    STORE.update();
    step();
  }

  function stop() {
    if (running && running.timer) clearTimeout(running.timer);
    if (running) {
      const p = STORE.s.projects.find(x => x.id === running.projectId);
      if (p) { p.stages.forEach(s => { if (s.state === 'run') s.state = 'todo'; }); p.status = 'ready'; }
      addLog('l-warn', '任务已被用户中止');
    }
    running = null; paused = false; STORE.update(); emit('stop');
  }

  /* 确认之后继续跑完剩下的阶段 */
  function resume() {
    if (!running || !paused) return;
    paused = false; running.confirmed = true;
    addLog('l-ok', '▶ 已确认设定，继续生成影片');
    STORE.update(); emit('resume');
    step();
  }

  function step() {
    if (!running) return;
    const p = STORE.s.projects.find(x => x.id === running.projectId);
    if (!p) { running = null; return; }
    const stage = DATA.STAGES[running.stageIndex];
    if (!stage) return finish(p);

    // 进入「生成影片」这一步之前先停下来，让使用者确认形象/声音/场景
    if (stage.key === PAUSE_BEFORE && running.taskIndex === -1 && !paused && !running.confirmed) {
      paused = true;
      addLog('l-warn', '⏸ 已暂停：请确认要用的数字人形象、声音与场景，确认后再继续生成影片');
      STORE.update(); emit('pause');
      return;
    }

    running.taskIndex++;
    p.stages[running.stageIndex].state = 'run';

    if (running.taskIndex >= stage.tasks.length) {
      /* 小任务跑完了，但真正产出内容的是 applyStageResult——而且 read / script
       * 这两个阶段会真的呼叫大模型，要等几十秒。
       *
       * 以前是「先标完成、再去呼叫 AI」，所以介面会在稿子还没写出来的时候
       * 就显示「已完成」，产出却是 0 篇。必须等 applyStageResult 真的结束
       * 才能标完成、才能打完成日志。 */
      const stageIdx = running.stageIndex;
      /* failed=true 时标成 error 而不是 done：这一步没真的做出东西，
       * 标「完成」就是骗人（使用者会看到「已完成」但产出 0 篇）。 */
      const advance = (failed) => {
        if (!running) return;             // 中途被中止了
        p.stages[stageIdx].state = failed ? 'error' : 'done';
        addLog(failed ? 'l-warn' : 'l-ok',
          failed ? `✘ ${stage.n} ${stage.t} — 没能完成（产出可能是空的）` : `✔ ${stage.n} ${stage.t} — 完成`);
        running.stageIndex = stageIdx + 1; running.taskIndex = -1;
        p.progress = Math.round((running.stageIndex / DATA.STAGES.length) * 100);
        STORE.update(); emit('stage');
        running.timer = setTimeout(step, 420);
      };
      /* 一定要包 try/catch：applyStageResult 里任何一个没预期到的错
       * （例如某个栏位是空阵列）都会往上抛，而这里是 setTimeout 的回调，
       * 抛出去没有人接——整条流水线会就此停住，画面却还显示「运行中」，
       * 使用者只看到进度卡着不动，也不知道发生什么事。
       * 出错就记进日志、当作这一步做完，让后面的步骤继续跑。 */
      let r;
      try {
        r = applyStageResult(p, stage.key);
      } catch (e) {
        addLog('l-warn', `  └ ${stage.t} 出错：${e.message}（流程继续，但这一步没有产出）`);
        advance(true);
        return;
      }
      if (r && typeof r.then === 'function') {
        // 还在等 AI：这一步维持「运行中」，别让人以为已经好了
        p.stages[stageIdx].state = 'run';
        STORE.update(); emit('task');
        r.then(() => advance(false), e => {
          addLog('l-warn', `  └ ${stage.t} 出错：${(e && e.message) || e}（流程继续，但这一步没有产出）`);
          advance(true);
        });
      } else advance(false);
      return;
    }

    const task = stage.tasks[running.taskIndex];
    addLog('l-run', `▶ ${stage.t} · ${task}`);
    STORE.update(); emit('task');
    running.timer = setTimeout(() => {
      addLog('l-ok', `  └ ${task} ✓ ${extra(stage.key, running.taskIndex)}`);
      emit('task');
      step();
    }, 320 + Math.random() * 460);
  }

  function extra(key, i) {
    const m = {
      /* 这些是每个小任务跑完后附带的一句话。以前写死了「抽取 86,420 字」
       * 「一致性 96.4%」这类数字，不管实际情况如何都照报，等于骗人。
       * 改成不带数字的中性描述——真正的数字由各阶段自己的真实日志输出。 */
      /* 上传是使用者自己拖档案完成的，这几个小任务只是把已经做过的事复述一遍，
       * 不能讲成系统又跑了一次 OCR 或建了向量索引——那两件事目前都没有。 */
      upload: ['已读取', '已抽出内文', '已合并成整本原文', '字数与章节已统计', '已存进这个专案'],
      read: ['', '', '', '', '', ''],
      script: ['', '', '', '', '', '', ''],
      /* 这几句以前不管有没有真的做，都照报「台词已改写」。真正的改写是在
       * applyStageResult 里做的，会自己打日志——这里只写中性的准备动作。 */
      persona: ['', '', ''],
      // avatar 这一步是真的在做事（建清单），但绝不能写得像已经渲染出影片了
      avatar: ['读到已写好的稿子', '平台与尺寸已对应', '清单已建立，全部标为「待生成」'],
      // package / export 目前没有实作，日志必须说实话，不能再报「字幕 1,860 行」这种假数字
      package: ['尚未实作，本步未做任何事', '尚未实作，本步未做任何事', '尚未实作，本步未做任何事', '尚未实作，本步未做任何事'],
      export: ['尚未实作，本步未做任何事', '尚未实作，本步未做任何事', '尚未实作，本步未做任何事']
    };
    return (m[key] && m[key][i]) ? '（' + m[key][i] + '）' : '';
  }

  /* 每个阶段产出实际数据。
   * read / script 两个阶段会尽量走真实 AI，接不上就自动退回模板，
   * 并在日志里明确写出这一步到底是真的还是模板——不让人误会。 */
  function applyStageResult(p, key) {
    if (key === 'read') {
      // 真的把上传的内文送进模型读一遍
      if (window.AIREAL && AIREAL.canUse() && p.parsed && p.parsed.raw) {
        addLog('l-run', '  └ 正在用真实 AI 阅读上传的内文…');
        /* 整本书是切成十几段逐段读的，会跑好几分钟。不把进度打出来的话，
         * 画面就只有一行「正在阅读」不动，使用者分不出是在跑还是卡死了。 */
        return AIREAL.readBook(p, msg => { addLog('l-run', '  └ ' + msg); emit('log'); }).then(r => {
          if (!r) throw new Error('没有可读的内文');
          const d = r.data;
          p.summary = d.summary || p.summary;
          if (d.themes && d.themes.length) p.themes = d.themes;
          if (d.quotes && d.quotes.length) {
            p.quotes = d.quotes;
            p.quoteSrc = d.quotes.map(t => ({ text: t, chapter: null, page: null }));
          }
          if (d.audiences && d.audiences.length) p.audiences = d.audiences;
          if (d.pains && d.pains.length) p.pains = d.pains;
          if (d.hots && d.hots.length) p.hots = d.hots;
          p.readByAI = true;
          const rd = r.read || {};
          addLog('l-ok', `  └ ✨ 真实 AI 阅读完成（模型：${r.model || '未知'}）：`
            + `读了 ${(rd.chars || 0).toLocaleString()} 字 / ${rd.ok || 0} 段`
            + `，论点 ${(d.themes || []).length} 条 / 金句 ${(d.quotes || []).length} 条`);
          // 有段落读失败、或内文长到超过单轮上限，都要讲出来，不能只报好消息
          if (rd.ok < rd.chunks) addLog('l-warn', `  └ 有 ${rd.chunks - rd.ok} 段没读成功，这几段的内容没有进到分析里`);
          if (rd.clipped) addLog('l-warn', '  └ 这本书超过单轮阅读上限，后面的内容这一轮没读到');
          // 平台没照你挑的模型跑就要讲出来，不能让日志看起来一切正常
          if (r.note) addLog('l-warn', '  └ ' + r.note);
          STORE.update();
        }).catch(e => {
          addLog('l-warn', `  └ 真实 AI 阅读失败（${e.message}），改用本地规则抽取`);
          applyReadFallback(p);
        });
      }
      applyReadFallback(p);
    }
    if (key === 'script') {
      // 真的让模型写标题 / Hook / 开场白 与几篇完整口播稿
      if (window.AIREAL && AIREAL.canUse()) {
        addLog('l-run', '  └ 正在用真实 AI 写稿…');
        // 14 篇是分批写的，同样要把进度打出来，否则看起来像卡住
        return AIREAL.writeScripts(p, msg => { addLog('l-run', '  └ ' + msg); emit('log'); }).then(r => {
          const d = r.data;
          p.titles = (d.titles && d.titles.length) ? d.titles : DATA.genTitles(p, 20);
          p.hooks = (d.hooks && d.hooks.length) ? d.hooks : DATA.genHooks(p, 20);
          p.opens = (d.opens && d.opens.length) ? d.opens : DATA.genOpens(p);
          /* 模板先产生 14 篇骨架（场地、镜头表、声音配置都在里面），
           * 再把 AI 真的写好的口播稿盖上去。正常情况下 14 篇全部会被盖掉；
           * 只有某一批失败时，那几篇才会留着模板骨架。 */
          p.scripts = DATA.genScripts(p, 14);
          const real = (d.scripts || []).filter(x => x && x.dialogue && x.dialogue.length);
          real.forEach((rs, i) => {
            if (!p.scripts[i]) return;
            p.scripts[i] = Object.assign({}, p.scripts[i], {
              title: rs.title || p.scripts[i].title,
              hook: rs.hook || p.scripts[i].hook,
              dialogue: rs.dialogue,
              cta: rs.cta || p.scripts[i].cta,
              duration: defaultVideoDuration(),
              aiWritten: true, aiModel: r.model || null
            });
          });
          addLog('l-ok', `  └ ✨ 真实 AI 写稿完成（模型：${r.model || '未知'}）：${p.titles.length} 标题 / ${p.hooks.length} Hook / ${real.length} 篇完整口播稿`);
          if (r.note) addLog('l-warn', '  └ ' + r.note);
          if (real.length < p.scripts.length) {
            addLog('l-warn', `  └ 有 ${p.scripts.length - real.length} 篇没写成，仍是模板骨架（排在最后面那几篇），`
              + '可在脚本详情里逐篇按「用真实 AI 重写」补回来');
          }
          STORE.update();
        }).catch(e => {
          addLog('l-warn', `  └ 真实 AI 写稿失败（${e.message}），改用模板产生`);
          applyScriptFallback(p);
        });
      }
      applyScriptFallback(p);
    }
    if (key === 'persona' && STORE.s.settings.autoPersona) {
      /* 真的让模型按本人口吻重写。接不上或使用者关掉真实 AI 时，退回原本
       * 那套参数化替换——但日志一定要讲明白那只是规则替换，不是模型改写，
       * 不能再让人以为「台词已改写」。 */
      if (window.AIREAL && AIREAL.canUse() && (p.scripts || []).length) {
        addLog('l-run', '  └ 正在用真实 AI 按本人口吻改写…');
        return AIREAL.rewritePersona(p, m => addLog('l-info', '  └ ' + m)).then(r => {
          addLog('l-ok', `  └ ✨ 真实 AI 改写完成（模型：${r.model || '未知'}）：${r.applied}/${r.total} 篇已换成本人口吻`);
          if (r.applied < r.total) {
            addLog('l-warn', `  └ 其余 ${r.total - r.applied} 篇维持原样（改写失败或句数对不上，没有硬套）`);
          }
          if (r.note) addLog('l-warn', '  └ ' + r.note);
          STORE.update();
        }).catch(e => {
          addLog('l-warn', `  └ 真实 AI 改写失败（${e.message}），改用本地规则替换（只是加口头禅，不是真的改写）`);
          p.scripts = p.scripts.map(DATA.applyPersona);
        });
      }
      addLog('l-warn', '  └ 未启用真实 AI，本步只做本地规则替换（加口头禅，不是真的改写）');
      p.scripts = p.scripts.map(DATA.applyPersona);
    }
    /* 一篇稿子对应一支影片，状态一律是「待生成」。
     * 这里绝对不能凭空造影片：影片要真的送去数字人服务、真的花钱、真的等几分钟
     * 才会有，一支约 US$1-3。所以流水线只负责把稿子准备好，做不做成影片、做哪几支，
     * 由使用者在资产库里逐支决定。 */
    if (key === 'avatar') {
      // 没有稿子就建不出影片待办——这不是「完成」，要让它标成出错，
      // 否则又会变成「显示已完成、产出却是 0」
      if (!(p.scripts || []).length) throw new Error('前面没有产出任何稿子，建不了影片待办');
      p.videos = DATA.genPendingVideos(p, p.scripts);
      addLog('l-info', `  └ 已按稿子建立 ${p.videos.length} 支影片待办，尚未真的生成`);
      addLog('l-info', '  └ 影片要逐支送去数字人服务才会产生（会花钱），到「内容资产库」点想做的那一支');
    }
    /* export 阶段以前会再凭空造 16 支影片、还顺手塞进发布排程——那 16 支的稿子
     * 是当场临时编的，跟前面 AI 写的 14 篇毫无关系。整段移除。
     * 排程也不该自动排：影片都还没做出来，没有东西可发。 */
  }

  function applyScriptFallback(p) {
    p.titles = DATA.genTitles(p, 20); p.hooks = DATA.genHooks(p, 20);
    p.opens = DATA.genOpens(p); p.scripts = DATA.genScripts(p, 14);
  }

  function applyReadFallback(p) {
    {
      if (p.source && p.source.kind === 'profile') {
        // 已汇入完整书籍档案：直接采用，不覆写
        addLog('l-ok', `  └ 使用上传的书籍档案：论点 ${p.themes.length} 条 / 金句 ${p.quoteSrc.length} 条（含出处）`);
      } else if (p.parsed && p.parsed.quotes.length) {

      }

# 常见问题

## 使用

**跑完一本书要多久？**
演示环境约 15 秒。真实环境从上传到 30 支成片，预计 2–4 小时（多支视频并发渲染）。

**生成的稿子能改吗？**
能。每条标题、Hook、脚本都可以人工编辑、锁定、或者只重生成这一条，不影响其他内容。

**一本书能出多少条？**
一次跑完是 30 支视频 + 20 标题 + 20 Hook + 14 篇脚本。不够可以再跑，每次角度和措辞都不一样。

**换一本新书，人格要重新设置吗？**
不用。人格模型是跟人走的，不是跟书走的。设一次，之后所有书都用同一套。

## 内容质量

**AI 会不会写错书里的内容、或者编造？**
系统强制要求每条金句必须能回溯到原文的具体页码，点开就能看出处。做不到溯源的内容不会被采用。

**生成的内容会不会跟别人撞车？**
每次生成都会换角度和措辞。但同类书的通用观点难免相似，所以数据分析里有「角度表现排行」——表现差的角度会自动降低下一轮的生成比重。

**为什么有的稿子被退回了？**
两种情况：一是「像不像本人」评分低于 90 分；二是命中了合规检查（绝对化用语、未证实的数据、医疗或投资承诺）。两种都会显示具体是哪一段有问题。

## 发布

**生成完会自动发出去吗？**
**不会。** 所有内容默认需要人工确认才发布。系统设置里有「生成后自动发布」开关，建议一直保持关闭——发布是收不回来的动作。

**现在按「发布」是真的发出去了吗？**
**不是。** 目前只是把状态改成已发布，方便你验证流程。要真的送到平台，每个平台都要申请开发者帐号、通过应用审核、完成帐号授权，而且必须由服务端呼叫接口——浏览器做不到。
另外要有心理准备：**不是每个平台都能一键发布**。YouTube Shorts 门槛最低；抖音、TikTok、Meta 系需要审核；**小红书目前没有公开的发布接口**，只能人工上传。


**日历上怎么分辨发了没发？**
实心色块＝待发布，虚线外框加 ✓＝已发布；每格右上角还有「已发布/总数」。点任一条目可以预览、改标题、改平台与时间、立即发布或移出排程。

**平台会不会因为是 AI 生成而限流？**
有这个风险。所以系统默认在成片里加 AI 生成标识（很多平台和地区也强制要求），并且建议提高原创解读的比重、多平台分散发布。

**数据有什么用？**

**忘了怎么用怎么办？**

演示版本存在你自己的浏览器里，换电脑就没了。系统设置里可以「重置演示数据」恢复初始状态。

# 名词解释

短视频行业的黑话不少，这里只解释系统里会出现的。

## 内容相关

**Hook（钩子）**
视频前 3 秒说的那句话。决定观众是继续看还是划走，是整支视频最关键的部分。所以系统一次生成 20 个备选。

**CTA**
Call To Action，行动引导。就是结尾那句「点击左下角购书链接」「评论区扣书单」。

**开场白**
Hook 之后的第一句自我介绍或场景引入，比如「我是⋯⋯，今天聊一本刚拿到的新书」。

**金句**
书里最适合单独拎出来传播的句子。通常短、有张力、能引起共鸣。

**脚本角度**
同一本书的七种讲法：故事版、痛点版、金句版、商业版、知识版、书摘版、作者故事版。**同一个观点换角度讲，能覆盖不同的人群。**

**分镜表**
一支视频拆成几个镜头，每个镜头讲什么、怎么运镜、画面上出现什么、持续几秒。点开任意脚本就能看到。

## 制作相关

**口型同步（Lip-sync）**
数字人说话时嘴型和声音对得上。误差超过 60 毫秒人眼就能看出「假」，系统控制在 40 毫秒以内。

**B-roll**
穿插在人物画面之间的辅助镜头（空镜、素材画面）。作用是让视频不那么单调，也方便遮掉剪辑点。

**人格一致性评分**
系统给改写后的稿子打分，衡量「像不像本人说的」。低于 90 分会被退回重写。

## 数据相关

**完播率**
看完整支视频的人占播放量的比例。短视频最重要的指标，直接影响平台推不推你。

**转化漏斗**
从曝光 → 播放 → 看完一半 → 互动 → 点击书链 → 下单，每一层会掉多少人。看哪一层掉得最狠，就知道该优化哪里。

**适配度评分**
系统判断这本书的内容在某个平台上表现会有多好，0–100 分。分数低的平台可以少做或不做。

**响度平衡（LUFS）**
让所有视频的音量听起来一样大，不会这支很吵下一支听不见。行业标准是 -14 LUFS。

  /* ---- 极简 Markdown 渲染 ---- */
  function render(md) {
    const lines = md.trim().split('\n');
    let out = '', inList = false, inOl = false, inCode = false, inTable = false;
    const inline = s => UI.esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');

    const closeList = () => { if (inList) { out += '</ul>'; inList = false; } if (inOl) { out += '</ol>'; inOl = false; } };
    const closeTable = () => { if (inTable) { out += '</tbody></table>'; inTable = false; } };

    for (let i = 0; i < lines.length; i++) {
      const L = lines[i];
      if (/^```/.test(L)) {
        if (!inCode) { closeList(); closeTable(); out += '<pre style="background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;margin:12px 0"><code style="background:none;color:var(--txt-2);font-size:14px;line-height:1.7;white-space:pre">'; inCode = true; }
        else { out += '</code></pre>'; inCode = false; }
        continue;
      }
      if (inCode) { out += UI.esc(L) + '\n'; continue; }

      if (/^\|/.test(L)) {
        const cells = L.split('|').slice(1, -1).map(c => c.trim());
        if (/^\|[\s:\-|]+\|$/.test(L)) continue;
        if (!inTable) { closeList(); out += '<table><thead><tr>' + cells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'; inTable = true; }
        else out += '<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
        continue;
      } else closeTable();

      if (/^### /.test(L)) { closeList(); out += `<h3>${inline(L.slice(4))}</h3>`; }
      else if (/^## /.test(L)) { closeList(); out += `<h2>${inline(L.slice(3))}</h2>`; }
      else if (/^# /.test(L)) { closeList(); out += `<h1>${inline(L.slice(2))}</h1>`; }
      else if (/^> /.test(L)) { closeList(); out += `<blockquote>${inline(L.slice(2))}</blockquote>`; }
      else if (/^---+$/.test(L)) { closeList(); out += '<hr>'; }
      else if (/^[-*] /.test(L)) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(L.slice(2))}</li>`; }
      else if (/^\d+\. /.test(L)) { if (!inOl) { out += '<ol>'; inOl = true; } out += `<li>${inline(L.replace(/^\d+\.\s/, ''))}</li>`; }
      else if (L.trim() === '') closeList();
      else { closeList(); out += `<p>${inline(L)}</p>`; }
    }
    closeList(); closeTable();
    return out;
  }

  return {
    render,
    groups: [
      { key: 'use', name: '使用手册', sub: '给使用这套系统的人' },
      { key: 'project', name: '项目文档', sub: '给决策、开发与合作方' }

      { key: 'guide', group: 'use', name: '七个步骤详解', icon: '⚙', desc: '每一步在做什么、你要做什么', md: GUIDE },
      { key: 'faq', group: 'use', name: '常见问题', icon: '？', desc: '使用、质量、发布、数据', md: FAQ },
      { key: 'glossary', group: 'use', name: '名词解释', icon: '▤', desc: 'Hook、CTA、完播率、B-roll…', md: GLOSSARY },
      
    ]
  };

      <b style="cursor:pointer;color:var(--violet-2)" data-act="goto" data-route="projects">② 上传一本新书</b> →
      <b style="cursor:pointer;color:var(--violet-2)" data-act="goto" data-route="pipeline">③ 一键生成短视频</b>
      —— 数字人/声音是帐号级设定，做一次之后每本书都会沿用，不用重设。
    </div>

    ${live.length && live.every(v => v.demo)
      ? `<div class="hint" style="margin-bottom:14px;padding:11px 14px;background:rgba(245,158,11,.1);border:1px solid var(--amber);border-radius:10px;color:var(--txt-2)">
           ⚠ <b>下面的播放数据是假的</b>——目前「已发布」的影片全部来自内建示范书，播放量、完播率、图表都是随机造出来给你看介面长相的，不是真实表现。自己建一本书跑完流程、生成并发布影片后，这里才会显示真数据。</div>`
      : ''}

    <div class="grid g4" style="margin-bottom:16px">
      ${kpi('在库书籍项目', ps.length, '本', `+${ps.filter(p => Date.now() - p.createdAt < 30 * 864e5).length} 本 本月新增`)}
      ${/* 「已生成」以前把待生成的也算进去，等于虚报。这里只算真的做出影片档的那些。 */''}
      ${kpi('真的生成的影片', allVideos.filter(v => v.videoUrl).length, '支',
        `待生成 ${allVideos.filter(v => v.status === '待生成').length} 支 · 示范假数据 ${allVideos.filter(v => v.demo).length} 支`)}
      ${kpi('内容资产条目', totalScripts + ps.reduce((a, p) => a + (p.titles || []).length + (p.hooks || []).length, 0), '条', '标题 / Hook / 脚本')}
      ${kpi('平均完播率', avgWatch, '%', published ? (live.every(v => v.demo) ? '⚠ 来自示范书的假数据' : `统计自已发布的 ${published} 支`) : '尚无已发布影片', avgWatch < 30)}
    </div>

    <div class="grid g-2-1" style="margin-bottom:16px">
      <div class="card">
        <div class="card-h"><div><div class="card-t">近 7 日内容表现</div><div class="card-s">播放量（实线） · 互动量（虚线，已放大 8 倍便于对比）</div></div>
          <div class="right"><span class="tag v">播放</span><span class="tag c">互动</span></div></div>
        ${CHART.line(an.days)}
      </div>
      <div class="card">
        <div class="card-h"><div class="card-t">平台播放分布</div></div>
        ${CHART.donut(an.byPlat, nf(an.total))}
      </div>
    </div>

    <div class="grid g-2-1">
      <div class="card">
        <div class="card-h"><div><div class="card-t">生产中的项目</div><div class="card-s">点击进入流水线查看详情</div></div>
          <div class="right"><button class="btn btn-sm" data-act="goto" data-route="projects">全部项目</button></div></div>
        ${producing.length ? producing.map(p => projRow(p)).join('') : ps.slice(0, 3).map(p => projRow(p)).join('')}
      </div>
      <div class="card">
        <div class="card-h"><div class="card-t">最新动态</div></div>
        <div class="tl">${s.activity.slice(0, 7).map(a => `
          <div class="tl-i"><div class="tl-t">${esc(a.text)}</div>
            <div class="tl-s">${timeAgo(a.at)}</div></div>`).join('')}</div>
      </div>
    </div>`;
  };

  function kpi(l, v, u, d, down) {
    return `<div class="kpi"><div class="kpi-l">${l}</div>
      <div class="kpi-v">${nf(v)}<small>${u}</small></div>
      <div class="kpi-d ${down ? 'down' : ''}">${d}</div></div>`;
  }

  function projRow(p) {
    return `<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer" data-act="open-proj" data-id="${p.id}">
      <div style="width:42px;height:56px;border-radius:8px;background:${p.cover};flex:0 0 42px"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:650;font-size:15.5px">《${esc(p.title)}》</div>
        <div style="font-size:13.5px;color:var(--txt-3)">${esc(p.author)} · ${esc(p.publisher)} · ${(p.videos || []).length} 支视频</div>
        <div class="bar" style="margin-top:7px"><i style="width:${p.progress}%"></i></div>
      </div>
      <div style="text-align:right">${statusTag(p.status)}<div style="font-size:13px;color:var(--txt-3);margin-top:5px">${p.progress}%</div></div>
    </div>`;
  }

  function timeAgo(t) {
    const d = Date.now() - t, h = Math.floor(d / 3600e3);
    if (h < 1) return Math.max(1, Math.floor(d / 60e3)) + ' 分钟前';
    if (h < 24) return h + ' 小时前';
    return Math.floor(h / 24) + ' 天前';
  }

  /* =======================================================
   * 书籍项目
   * ===================================================== */
  VIEWS.projects = function (q) {
    const filter = (q && q.f) || 'all';
    let list = STORE.s.projects;
    if (filter !== 'all') list = list.filter(p => p.status === filter);
    const kw = (UI.$('#global-search') || {}).value || '';
    if (kw) list = list.filter(p => (p.title + p.author + p.publisher).indexOf(kw) >= 0);

    return `
    <div class="page-h">
      <div><div class="page-t">书籍项目</div><div class="page-d">每一本书都是一条独立的内容生产线</div></div>
      <div class="right">
        <div class="seg" data-seg="proj-filter">
          ${[['all', '全部'], ['producing', '生产中'], ['ready', '待生产'], ['done', '已完成'], ['draft', '草稿']]
            .map(x => `<button data-v="${x[0]}" class="${filter === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}
        </div>
        <button class="btn btn-primary" data-act="new-proj">＋ 新建项目</button>
      </div>
    </div>

    ${list.length ? `<div class="grid g3">${list.map(p => `
      <div class="book-card" data-act="open-proj" data-id="${p.id}">
        <div class="book-cover" style="background:${p.cover}">
          <div class="st">${statusTag(p.status)}</div>
          ${/* 删除钮放左上、跟状态标签分开，避免手滑点错。
                不加 stopPropagation：事件分发走 document 层的 closest('[data-act]')，
                内层按钮本来就会优先命中。 */''}
          <button class="book-del" data-act="del-proj" data-id="${p.id}" title="删除这本书">✕</button>
          <div class="bt">《${esc(p.title)}》</div>
        </div>
        <div class="book-b">
          <div class="book-meta">${esc(p.author)} 著 · ${esc(p.publisher)}</div>
          <div class="chip-list">${(p.tags || []).slice(0, 3).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
          <div style="font-size:14px;color:var(--txt-3);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.summary || '尚未进行 AI 阅读，上传资料后即可自动生成解读。')}</div>
          <div class="book-stats">
            <div class="bs"><b>${(p.videos || []).length}</b>视频</div>
            <div class="bs"><b>${(p.scripts || []).length}</b>脚本</div>
            <div class="bs"><b>${(p.titles || []).length}</b>标题</div>
            <div class="bs" style="margin-left:auto"><b>${p.progress}%</b>进度</div>
          </div>
        </div>
      </div>`).join('')}</div>`
      : `<div class="card empty"><div class="big">▤</div><div>暂无符合条件的项目</div>
         <div style="margin-top:14px"><button class="btn btn-primary" data-act="new-proj">＋ 新建书籍项目</button></div></div>`}`;
  };

  /* 「接下来该做什么」。
   * 使用者最常卡住的地方是：七个步骤平铺在上面，跑完了也不知道该看哪、该去哪。
   * 这里按专案的实际状态，只给一个明确的下一步和一颗按钮，不给选择题。 */
  function nextStepCard(p) {
    const vs = p.videos || [];
    const pa = STORE.s.persona;
    const hasMaterial = (p.materials || []).length > 0;
    const hasScript = (p.scripts || []).length > 0;
    const pending = vs.filter(v => !v.demo && v.status === '待生成').length;
    const making = vs.filter(v => v.status === '生成中').length;
    const made = vs.filter(v => v.videoUrl).length;
    const avatarOk = pa.realAvatarMode === 'image' ? !!pa.realPhotoAssetId : !!pa.realAvatarId;
    const voiceOk = !!pa.realVoiceId;

    let s;
    if (ENGINE.isRunning) return '';                    // 正在跑，日志区已经在讲话了
    if (!hasMaterial) {
      s = { t: '先把书的资料传进来', d: '在下面 STEP 1 把书籍档案、内文档拖进上传区。不传也能跑，但产出的会是内建演示内容，不是你这本书的。',
        b: '去 STEP 1 上传', act: 'sel-stage', k: 'upload' };
    } else if (!hasScript) {
      s = { t: '可以开始跑了', d: '资料已经在了。点「一键跑完整流程」，AI 会真的读这本书、真的写稿，大约几十秒。',
        b: '▶ 一键跑完整流程', act: 'run-all' };
    } else if (!avatarOk || !voiceOk) {
      s = { t: '选一个数字人和声音', d: `稿子已经写好 ${(p.scripts || []).length} 篇了。影片里出现的那张脸和那个声音要先选好，才做得出影片。目前${!avatarOk ? '形象' : '声音'}还没选。`,
        b: '去选形象和声音', act: 'goto', k: 'persona' };
    } else if (making) {
      s = { t: `有 ${making} 支正在生成中`, d: '通常 1-3 分钟。可以先去做别的，好了会自己更新，不用守着。',
        b: '去内容资产库看进度', act: 'goto', k: 'library' };
    } else if (pending) {
      s = { t: `${pending} 支影片等你决定要不要做`, d: `稿子都写好了，但影片还没做——真的做要送去数字人服务，一支约 US$1-3、等 1-3 分钟，所以由你挑。到资产库点想做的那一支。`,
        b: '去内容资产库生成影片', act: 'goto', k: 'library' };
    } else if (made) {
      s = { t: `已经做好 ${made} 支真影片`, d: '可以下载，或排进发布排程。发布之后平台回传的数据才会出现在「数据分析」。',
        b: '去内容资产库看影片', act: 'goto', k: 'library' };
    } else {
      s = { t: '这本书的流程走完了', d: '产出的文案素材都在内容资产库里。',
        b: '去内容资产库', act: 'goto', k: 'library' };
    }

    const attr = s.act === 'sel-stage' ? `data-act="sel-stage" data-k="${s.k}"`
      : s.act === 'goto' ? `data-act="goto" data-route="${s.k}"` : `data-act="${s.act}"`;
    return `
      <div class="card" style="margin-bottom:16px;border-color:var(--violet);background:linear-gradient(180deg,rgba(124,108,255,.09),transparent)">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div style="flex:1;min-width:240px">
            <div style="font-size:13px;color:var(--violet-2);font-weight:700;letter-spacing:1px">接下来该做什么</div>
            <div style="font-size:19px;font-weight:750;margin:5px 0 6px">${esc(s.t)}</div>
            <div style="font-size:15px;color:var(--txt-2);line-height:1.75">${s.d}</div>
          </div>
          <button class="btn btn-primary" style="font-size:15px;padding:11px 20px" ${attr}>${esc(s.b)}</button>
        </div>
      </div>`;
  }

  /* =======================================================
   * 生产流水线
   * ===================================================== */
  VIEWS.pipeline = function (q) {
    const p = STORE.current;
    if (!p) return '<div class="card empty">请先创建书籍项目</div>';
    const stages = p.stages || DATA.STAGES.map(s => ({ key: s.key, state: 'todo' }));
    const activeKey = (q && q.s) || (stages.find(s => s.state === 'run') || {}).key ||
      (stages.filter(s => s.state === 'done').slice(-1)[0] || {}).key || 'upload';
    const doneCount = stages.filter(s => s.state === 'done').length;
    const pct = Math.round(doneCount / DATA.STAGES.length * 100);

    return `
    <div class="page-h">
      <div><div class="page-t">生产流水线</div>
        <div class="page-d">当前项目：《${esc(p.title)}》 · ${esc(p.author)} 著 · ${esc(p.publisher)}</div></div>
      <div class="right">
        <select class="input" style="width:190px" data-act="switch-proj">
          ${STORE.s.projects.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>《${esc(x.title)}》</option>`).join('')}
        </select>
        <button class="btn" data-act="goto" data-route="creative">✦ 设计创意分镜</button>
        <span class="tag ${(window.AIREAL && AIREAL.canUse()) ? 'g' : 'a'}" title="STEP 2 读书与 STEP 4 写稿是否真的呼叫大模型">
          ${(window.AIREAL && AIREAL.canUse()) ? '真实 AI 已开' : '模板模式'}
        </span>
        ${ENGINE.isRunning
          ? `<button class="btn" data-act="stop-run">■ 中止任务</button>`
          : `<button class="btn btn-primary" data-act="run-all">▶ 一键跑完整流程</button>`}
      </div>
    </div>

    ${nextStepCard(p)}

    ${ENGINE.isPaused ? (() => {
      const pa = STORE.s.persona;
      const pool = DATA.sceneTemplateLibrary ? DATA.sceneTemplateLibrary() : [];
      const sceneNames = (p.sceneIds || []).map(id => (pool.find(x => x.id === id) || {}).name).filter(Boolean);
      /* 形象与声音是不是「真的」设好了——看有没有实际的凭据，不要看模式。
       * 以前这里只看 realAvatarMode 是不是 'image' 就写「你上传的照片」，
       * 结果没传过照片的人也看到这句，以为已经设好，直接按确认，闸门等于没拦到。 */
      const avatarSet = pa.realAvatarMode === 'image' ? !!pa.realPhotoAssetId : !!pa.realAvatarId;
      const voiceSet = !!pa.realVoiceId;
      const libHit = (pa.avatarLib || []).find(x => x.assetId === pa.realPhotoAssetId);
      const avatarLabel = !avatarSet ? '尚未设定'
        : pa.realAvatarMode === 'image' ? (libHit ? libHit.name : '你上传的照片')
          : (pa.realAvatarName || '已选择');
      const ready = avatarSet && voiceSet;
      const stat = (ok, txt) => `<div style="font-size:16px;font-weight:700;margin:4px 0 0;color:${ok ? 'var(--txt)' : 'var(--red)'}">${esc(txt)}</div>`;

      return `
      <div class="card" style="margin-bottom:16px;border-color:${ready ? 'var(--violet-2)' : 'var(--red)'}">
        <div class="card-h"><div><div class="card-t">⏸ 已暂停 —— 请确认这批影片要怎么生成</div>
            <div class="card-s">${ready
              ? '下一步就会产出成片，形象、声音到时候改就得整批重跑，先在这里确认'
              : '还差设定才能往下走。下面直接选就好，不用离开这一页。'}</div></div></div>

        <div class="grid g3" style="margin-bottom:14px">
          <div style="background:var(--panel-2);border:1px solid ${avatarSet ? 'var(--line)' : 'var(--red)'};border-radius:12px;padding:13px">
            <div style="font-size:13.5px;color:var(--txt-3)">数字人形象</div>${stat(avatarSet, avatarLabel)}
          </div>
          <div style="background:var(--panel-2);border:1px solid ${voiceSet ? 'var(--line)' : 'var(--red)'};border-radius:12px;padding:13px">
            <div style="font-size:13.5px;color:var(--txt-3)">声音</div>${stat(voiceSet, pa.realVoiceName || '尚未设定')}
          </div>
          <div style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px">
            <div style="font-size:13.5px;color:var(--txt-3)">拍摄场景</div>
            <div style="font-size:16px;font-weight:700;margin:4px 0 8px">${esc(sceneNames.length ? sceneNames.join('、') : '（未选，系统自动配）')}</div>
            <button class="btn btn-sm" data-act="goto" data-route="creative">去修改</button>
          </div>
        </div>

        ${/* 就地设定：需要什么设定，就在需要的那一刻当场问，不要要求使用者
             预先记得，也不要把人赶去另一页再自己走回来。
             这两个挂载点的 id 跟「数字人 · 声音」页一样，所以 hgRenderAvatars()
             与 hgRenderVoices() 会自动把内容填进来，不必再写一套。 */''}
        <details class="adv" ${ready ? '' : 'open'} style="margin-bottom:14px">
          <summary>${ready ? '要换形象或声音的话，点这里' : '① 选形象　② 选声音（都在这里选，选完下面按钮就会亮）'}</summary>
          <div class="adv-b">
            <div class="label">① 数字人形象</div>
            <div id="hg-status" style="margin-bottom:8px"><div class="hint">连线中…</div></div>
            <div id="hg-avatar-panel" style="margin-bottom:18px"><div class="hint">读取中…</div></div>
            <div class="label">② 声音</div>
            <div id="hg-voice-panel"><div class="hint">读取中…</div></div>
          </div>
        </details>

        <div style="display:flex;gap:9px;align-items:center">
          <button class="btn btn-primary" data-act="resume-run" ${ready ? '' : 'disabled style="opacity:.45;pointer-events:none"'}>✓ 确认，继续生成</button>
          <button class="btn" data-act="stop-run">■ 中止</button>
          ${ready ? '' : '<span class="hint" style="color:var(--red)">形象和声音都设好才能继续</span>'}
        </div>
        <div class="hint" style="margin-top:10px">这一页会一直等你，不会自己跑掉。</div>
      </div>`;
    })() : ''}

    <div class="pipe">${DATA.STAGES.map((st, i) => {
      const s = stages[i] || { state: 'todo' };
      /* 出错的那一步必须看得出来。以前只有 done/run/todo 三种，
       * 一旦某步出错也照样显示「已完成」，产出却是空的——状态跟事实对不上。 */
      const ico = s.state === 'done' ? '<i class="dot g"></i>已完成'
        : s.state === 'run' ? '<i class="dot v"></i>执行中'
          : s.state === 'error' ? '<i class="dot r"></i>出错了'
            : '<i class="dot"></i>待执行';
      return `<div class="pstep ${s.state} ${activeKey === st.key ? 'on' : ''}" data-act="sel-stage" data-k="${st.key}">
        <div class="pn">${st.n}</div><div class="pt">${st.t}</div><div class="ps">${ico}</div></div>`;
    }).join('')}</div>

    <div class="grid g-2-1" style="margin-top:16px">
      <div>${stagePanel(p, activeKey)}</div>
      <div class="card">
        <div class="card-h"><div class="card-t">总体进度</div></div>
        <div style="display:flex;gap:18px;align-items:center">
          ${CHART.ring(pct)}
          <div style="flex:1;font-size:14.5px;line-height:2">
            <div>已完成阶段 <b>${doneCount}/8</b></div>
            <div>产出脚本 <b>${(p.scripts || []).length}</b> 篇</div>
            <div>产出视频 <b>${(p.videos || []).length}</b> 支</div>
            <div>预计剩余 <b>${ENGINE.isRunning ? Math.max(1, (8 - doneCount) * 3) + ' 分钟' : '—'}</b></div>
          </div>
        </div>
        <div class="card-h" style="margin:20px 0 12px"><div class="card-t">实时执行日志</div>
          <div class="right"><span class="tag ${ENGINE.isRunning ? 'g' : ''}"><i class="dot ${ENGINE.isRunning ? 'g' : ''}"></i>${ENGINE.isRunning ? '运行中' : '空闲'}</span></div></div>
        <div class="log" id="run-log">${ENGINE.logs.length
          ? ENGINE.logs.map(l => `<div class="${l.cls}">[${l.ts}] ${esc(l.text)}</div>`).join('')
          : '<div class="l-info">等待任务启动…<br>点击右上角「一键跑完整流程」开始。</div>'}</div>
      </div>
    </div>`;
  };

  function stagePanel(p, key) {
    const st = DATA.STAGES.find(s => s.key === key) || DATA.STAGES[0];
    const head = `<div class="card-h"><div><div class="card-t">${st.n} · ${st.t}</div><div class="card-s">${st.d}</div></div>
      <div class="right"><button class="btn btn-sm" data-act="run-stage" data-k="${st.key}">▶ 单独执行此阶段</button></div></div>
      <div class="explain">
        <div class="ex-r"><span class="ex-k">这一步在做什么</span><span>${st.why}</span></div>
        <div class="ex-r"><span class="ex-k">你需要做什么</span><span>${st.you}</span></div>
        <div class="ex-r"><span class="ex-k">这一步产出</span><span>${st.out}</span></div>
      </div>`;
    const body = {
      upload: () => {
        const ms = p.materials || [];

      let idx = p.bookIndex;

      const markable = tab === 'hook' || tab === 'open';

      body = items.length ? `
        ${markable ? `<div class="hint" style="margin-bottom:12px">

          ${window.HOOKS ? `已记住 <b>${HOOKS.count().good}</b> 个要的、<b>${HOOKS.count().bad}</b> 个不要的。` : ''}</div>` : ''}
        <div class="grid g2">${items.map(it => {
        const v = lib ? lib(it.text) : null;
        return `
        <div class="copy-item">
          <div class="ci-h"><span class="ci-n">${String(it.n).padStart(2, '0')}</span>
            <span class="tag v">${it.tag}</span>${scoreBar(it.score)}
            <span class="ci-a">
              ${markable ? `
              <button class="btn btn-sm ${v === 'good' ? 'btn-primary' : ''}" title="这种开头我要"
                data-act="hook-mark" data-v="${v === 'good' ? 'none' : 'good'}" data-t="${esc(it.text)}">👍</button>
              <button class="btn btn-sm ${v === 'bad' ? 'btn-primary' : ''}" title="这种不要"
                data-act="hook-mark" data-v="${v === 'bad' ? 'none' : 'bad'}" data-t="${esc(it.text)}">👎</button>` : ''}
              <button class="btn btn-sm" data-act="copy" data-t="${esc(it.text)}">复制</button></span></div>
          <div class="copy-txt">${esc(it.text)}</div>
        </div>`; }).join('')}</div>` : `<div class="empty"><div class="big">▩</div>暂无内容</div>`;
    }

    return `
    <div class="page-h">
      <div><div class="page-t">内容资产库</div>
        <div class="page-d">《${esc(p.title)}》 · 一本书沉淀下来的全部可复用素材</div></div>
      <div class="right">
        <select class="input" style="width:180px" data-act="switch-proj">

        </select>
        ${(() => {
          const pend = (p.videos || []).filter(v => v.status === '待生成' || v.status === '生成失败').length;
          return pend
            ? `<button class="btn btn-primary" data-act="batch-gen">▶ 批量生成（待生成 ${pend} 支）</button>`
            : '';
        })()}
        <button class="btn" data-act="export-all">⬇ 导出全部文案</button>
      </div>
    </div>
    <div class="seg" data-seg="lib-tab" style="margin-bottom:16px">
      ${tabs.map(t => `<button data-v="${t[0]}" class="${tab === t[0] ? 'on' : ''}">${t[1]} <b style="opacity:.6">${t[2]}</b></button>`).join('')}
    </div>
    ${body}`;
  };

})();

  /* =======================================================

  VIEWS.publish = function (q) {

    const y = now.getFullYear(), m = now.getMonth();
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    const filter = (q && q.p) || 'all';
    let sc = STORE.s.schedule;
    if (filter !== 'all') sc = sc.filter(x => x.platform === filter);

    let cells = '';
    for (let i = 0; i < first; i++) cells += `<div class="cal-d out"></div>`;
    for (let d = 1; d <= days; d++) {
      const all = sc.filter(x => x.day === d);
      const evs = all.slice(0, 3);
      const more = all.length - evs.length;
      const doneN = all.filter(x => x.status === '已发布').length;
      cells += `<div class="cal-d ${d === now.getDate() ? 'today' : ''}" data-act="day-detail" data-d="${d}">
        <div class="cal-n">${d}${all.length ? `<span style="float:right;font-weight:400">${doneN}/${all.length}</span>` : ''}</div>
        ${evs.map(e => `<div class="cal-e ${e.status === '已发布' ? 'done' : ''}" style="--ec:${e.color}dd"
            data-act="open-sched" data-id="${e.id}"

      </div>`;
    }

    const upcoming = STORE.s.schedule.filter(x => x.status === '待发布').slice(0, 8);
    const plats = ['all'].concat(DATA.PLATFORMS.map(p => p.name));
    /* 已完成授权的平台（演示值）。抖音与视频号需企业主体审核，故留待授权 */
    const AUTHED = { tiktok: 1, reels: 1, shorts: 1, fb: 1, threads: 1, xhs: 1 };

    return `
    <div class="page-h">
      <div><div class="page-t">发布排程</div>
        <div class="page-d">${y} 年 ${m + 1} 月 · 共 ${STORE.s.schedule.length} 条排期，其中待发布 ${STORE.s.schedule.filter(x => x.status === '待发布').length} 条</div></div>

            <td style="padding:6px 8px" class="mono">${esc(r.at)}</td>
            ${['views', 'likes', 'comments'].map(k => `
            <td style="padding:6px 8px"><input class="input" type="number" min="0" placeholder="—"

      <div class="hint" style="margin-top:10px">已填数据 ${filled}/${log.length} 支。

        还没有登记过。<br>做好的影片可以去「内容资产库 → 成片影片」按「登记发布」；
        在别处剪好、已经发出去的，按右上角「手动登记一笔」。</div>`}

      ${byType.length ? `
      <div class="label" style="margin-top:18px">按选题类型的平均表现
        <span class="hint" style="margin-left:8px;font-weight:400">只算已经填了播放量的那几支</span></div>

        <tbody>${byType.map(t => `<tr style="border-top:1px solid var(--line)">
          <td style="padding:6px 8px">${esc(t.name)}</td>
          <td style="padding:6px 8px">${t.n}</td>
          <td style="padding:6px 8px"><b>${nf(t.avg)}</b></td>
          <td style="padding:6px 8px">${nf(t.like)}</td></tr>`).join('')}</tbody>
      </table>
      <div class="hint" style="margin-top:8px">这张表就是五类选题框架的成绩单。哪一类真的有人看，之后就多写哪一类。</div>` : ''}

    <div class="grid g-2-1">
      <div class="card">
        <div class="card-h"><div><div class="card-t">发布日历</div>
            <div class="card-s">点任一条目可预览与编辑，点空白处看整天清单</div></div>
          <div class="right cal-legend"><span><i class="lg-p"></i>待发布</span><span><i class="lg-d"></i>✓ 已发布</span></div></div>
        <div class="cal" style="margin-bottom:8px">${['日', '一', '二', '三', '四', '五', '六'].map(d => `<div class="cal-h">${d}</div>`).join('')}</div>
        <div class="cal">${cells}</div>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px">
          <div class="card-h"><div class="card-t">平台账号</div></div>

            <i style="width:9px;height:9px;border-radius:3px;background:${p.color}"></i>
            <span style="flex:1;font-size:15px">${p.name}</span>
            ${AUTHED[p.key] ? '<span class="tag g"><i class="dot g"></i>已授权</span>' : '<button class="btn btn-sm" data-act="auth-plat" data-n="' + p.name + '">去授权</button>'}
          </div>`).join('')}
        </div>
        <div class="card">
          <div class="card-h"><div class="card-t">即将发布</div></div>
          ${upcoming.length ? upcoming.map(x => `
            <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer"
                 data-act="open-sched" data-id="${x.id}">
              <div style="width:3px;height:32px;border-radius:3px;background:${x.color}"></div>
              <div style="flex:1;min-width:0">
                <div style="font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(x.title)}</div>
                <div style="font-size:13px;color:var(--txt-3)">《${esc(x.bookTitle)}》 · ${x.platform} · ${x.day} 日 ${x.hour}:00</div>
              </div>
              ${x.platform === 'Instagram Reels'
                ? `<button class="btn btn-sm btn-primary" data-act="ig-publish" data-id="${x.id}" title="真实发布到 Instagram">真实发布</button>`
                : x.platform === 'YouTube Shorts'
                  ? `<button class="btn btn-sm btn-primary" data-act="yt-publish" data-id="${x.id}" title="真实上传到 YouTube">真实上传</button>`
                  : `<button class="btn btn-sm" data-act="pub-one" data-id="${x.id}">发布</button>`}

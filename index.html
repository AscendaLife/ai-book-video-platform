  async function hgCheck() {
    const status = $('#hg-status');
    if (!status) return;
    status.innerHTML = '<div class="hint">连线中…（最多等 15 秒）</div>';
    // 就算连不上，也要先让「上传自己的照片」这条路可以走——那条路不依赖形象清单
    hgRenderAvatars(); hgRenderVoices();
    try {
      const cfg = (await hgFetch('/api/config')).heygen;
      if (!cfg.configured) {
        hgTried = false;
        status.innerHTML = `<div class="hint" style="color:var(--amber)">服务还没设定好（管理员需要在 Vercel 项目设置 HEYGEN_API_KEY）。
          你仍然可以<b>上传自己的照片</b>当数字人。</div>`;
        return;
      }
      const [av, vo] = await Promise.all([hgFetch('/api/heygen/avatars'), hgFetch('/api/heygen/voices')]);
      HG.avatars = (av.avatars || []).map(a => Object.assign({ own: true }, a));
      HG.voices = vo.voices || [];
      hgRestoreChoice();   // 先放回上次存的选择，再决定要不要给预设值
      if (!HG.avatarId && HG.avatars[0]) HG.avatarId = HG.avatars[0].id;
      if (!HG.voiceId && HG.voices[0]) HG.voiceId = HG.voices[0].id;
      hgSaveChoice();
      // 先把自己建的画出来，不要被下面拉公版的请求拖慢
      status.innerHTML = `<div class="hint" style="color:var(--green)">已连接</div>`;
      hgRenderAvatars(); hgRenderVoices(); hgRenderGenerate(); hgRenderChoiceSummary();

      /* 再补上官方公版里的亚洲脸。这是额外的，拿不到也不影响上面已经能用的东西，
       * 所以独立 try 住、失败静默。 */
      try {
        const pub = await hgFetch('/api/heygen/avatars?scope=public', null, 20000);
        const have = new Set(HG.avatars.map(a => a.id));
        const extra = pickAsian(pub.avatars || []).filter(a => !have.has(a.id));
        if (extra.length) {
          HG.avatars = HG.avatars.concat(extra);
          hgRenderAvatars();
        }
      } catch (e) { /* 公版是加分项，没有就算了 */ }
      const st = $('#hg-status');
      if (st) st.innerHTML = `<div class="hint" style="color:var(--green)">已连接 · ${HG.avatars.length} 个形象 / ${HG.voices.length} 个声音可选</div>`;
    } catch (e) {
      hgTried = false; // 失败了，下次进这一页还可以再自动试一次
      status.innerHTML = `<div class="hint" style="color:var(--amber)">连不上数字人服务：${esc(e.message)}
          <br>现成的形象与声音清单读不到，但<b>上传自己的照片</b>这条路不受影响，还是可以用。</div>
        <button class="btn btn-sm" style="margin-top:8px" data-act="hg-check">重新连线</button>`;
      hgRenderAvatars(); hgRenderVoices();
    }
  }

  /* 从官方公版清单里挑亚洲脸。
   * 供应商各版本的字段名不一致（ethnicity / race / tags / description…），
   * 与其猜字段名，不如把整笔资料转成字串比对关键字，来得可靠。
   * 一个都没命中时退回前 8 个——有得选总比空的好，但不假装它们是亚洲脸。 */
  function pickAsian(list) {
    const RE = /asian|chinese|japanese|korean|taiwan|东亚|亞洲|亚洲|中文|华|華/i;
    const hit = list.filter(a => RE.test(JSON.stringify(a)));
    return (hit.length ? hit : list).slice(0, 8).map(a => Object.assign({}, a, { own: false, asian: !!hit.length }));
  }

          ${a.preview ? `<img src="${esc(a.preview)}" style="width:100%;height:112px;object-fit:cover;border-radius:10px;margin-bottom:6px">` : ''}
          <div style="font-size:14px;font-weight:600">${esc(a.name || a.id)}</div>
          <div style="font-size:12.5px;color:var(--txt-3)">${a.own ? '你帐号里的' : '官方形象'}${a.gender ? ' · ' + esc(a.gender) : ''}</div>

  /* ============================================================
   * 用提示词生成形象
   *
   * 为什么要有这个：以前要有专属数字人，只能上传自己的照片。想要一个
   * 「不是真人、但长这样」的主持人就没辙。这里把已经在跑的文生图接上，
   * 让人用一句话描述就能造一个形象出来。
   *
   * 生成的图会先送去数字人服务当素材（走 ?url= 由服务端代取，避开跨域），
   * 拿到 assetId 之后，跟上传照片走的是同一条路——所以后面的口播生成
   * 完全不用改，嘴型一样会对上稿子。
   * ========================================================== */
  const GA = { url: null, busy: false };

  /* ---- 形象库 ----
   * 生成或上传过的形象存下来，之后可以直接点回去用，不用每次重做。
   * 存的是素材编号（assetId）与预览网址——素材编号是数字人服务那边的
   * 长期凭据，只要它还在，随时可以拿来生成新影片。
   * 存在 persona 底下，跟「目前选了谁」是分开的两件事。 */
  const LIB_MAX = 12;

  function hgLib() {
    const p = STORE.s.persona;
    if (!Array.isArray(p.avatarLib)) p.avatarLib = [];
    return p.avatarLib;
  }

  function hgLibAdd(item) {
    if (!item || !item.assetId) return;
    const lib = hgLib();
    // 同一个素材只留一份，重复加就把它挪到最前面
    const i = lib.findIndex(x => x.assetId === item.assetId);
    if (i >= 0) lib.splice(i, 1);
    lib.unshift({
      id: 'av' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      assetId: item.assetId,
      url: item.url || '',
      name: item.name || (item.source === 'prompt' ? '生成的形象' : '我的照片'),
      source: item.source || 'upload',
      at: new Date().toISOString()
    });
    if (lib.length > LIB_MAX) lib.length = LIB_MAX;
    STORE.update();
  }

  function hgLibUse(id) {
    const it = hgLib().find(x => x.id === id);
    if (!it) return;
    HG.mode = 'image'; HG.assetId = it.assetId; HG.avatarId = null;
    HG.assetPreview = it.url || HG.assetPreview;
    hgSaveChoice();
    toast('已切换成「' + it.name + '」', 'ok');
    hgRenderAvatars(); hgRenderGenerate(); hgRenderChoiceSummary();
  }

  function hgLibDel(id) {
    const lib = hgLib();
    const i = lib.findIndex(x => x.id === id);
    if (i < 0) return;
    const wasUsing = HG.mode === 'image' && HG.assetId === lib[i].assetId;
    lib.splice(i, 1);
    STORE.update();
    // 删掉的正好是目前在用的，就退回「还没选」，不要留一个指向已删项目的状态
    if (wasUsing) { HG.assetId = null; HG.assetPreview = null; HG.mode = 'avatar'; hgSaveChoice(); }
    hgRenderAvatars(); hgRenderGenerate(); hgRenderChoiceSummary();
  }

  /* 数字人服务会对素材做人脸侦测，侧脸、半身太远、脸被遮住都会被打回。
   * 所以不管使用者怎么描述，都强制补上这几个硬条件。 */
  function gaPrompt(desc) {
    return `${desc.trim()}。`
      + '正面半身人像摄影，脸部正对镜头、五官完整清晰不被遮挡，'
      + '光线均匀柔和，背景干净简单，真实人像摄影风格，高解析度，'
      + '不要侧脸、不要背影、不要墨镜口罩、不要多个人、不要文字浮水印。';
  }

  const GA_PRESETS = [
    ['知性女主持', '三十多岁亚洲女性，气质知性沉稳，深色西装外套，短发'],

      // 少了这个标头服务端一律回「凭证不正确」。
      const j = await hgFetch(
        `/api/heygen/upload?mime=${encodeURIComponent(file.type || 'image/jpeg')}&name=${encodeURIComponent(file.name || 'photo')}`,
        { method: 'POST', body: buf });
      HG.assetId = j.assetId; HG.avatarId = null;
      // 上传成功才存——服务端回传的网址才是长期有效的，本机预览网址

      HG.assetPreview = j.url || HG.assetPreview;

                 name: (file.name || '我的照片').replace(/\.[^.]+$/, '').slice(0, 12) });

  function hgPoll(videoId, result) {
    const tick = async () => {
      if (!document.body.contains(result)) return; // 使用者已离开这一页，停止轮询
      try {
        const s = await hgFetch('/api/status?service=heygen-video&id=' + encodeURIComponent(videoId));
        if (s.status === 'completed' && s.videoUrl) {
          result.innerHTML = `<video src="${esc(s.videoUrl)}" controls style="width:100%;max-width:280px;border-radius:12px"></video>
            <div class="hint" style="margin-top:8px">影片网址约 7 天后失效，要保留请自行下载存档。</div>`;
          return;
        }
        if (s.status === 'failed') {
          result.innerHTML = `<div class="hint" style="color:var(--red)">生成失败：${esc(s.error || '未知原因')}</div>`;
          return;
        }
        result.innerHTML = `<div class="hint">生成中…（${esc(s.status || 'processing')}）</div>`;
        setTimeout(tick, 5000);
      } catch (e) {
        result.innerHTML = `<div class="hint" style="color:var(--amber)">查询失败：${esc(e.message)}</div>`;
      }
    };
    tick();

  /* ============================================================
   * 影片按需生成：把某一支的稿子，用你选好的数字人与声音真的做成影片
   *
   * 为什么是「一支一支做」而不是跑完流程就有 30 支：
   *   真的生成要送去外部数字人服务，一支约 US$1-3、要等 1-3 分钟。
   *   一本书 30 支就是 US$30-90，不该在使用者没同意的情况下自动花掉。
   *
   * 轮询刻意放在模块层级、不绑在弹窗上：使用者关掉弹窗或切到别页，
   * 生成仍会继续，完成后结果写回 STORE，回来就看得到。
   * ========================================================== */
  const videoJobs = {};   // videoId -> true，挡住同一支被重复送出

  function findVideo(id) {
    let hit = null;
    STORE.s.projects.forEach(p => (p.videos || []).forEach(v => { if (v.id === id) hit = { v, p }; }));
    return hit;
  }

  /* 取出这支影片要念的台词。
   * 稿子本身就是单人口播（一个人从头讲到尾），所以直接把每句接起来就是
   * 完整台词——念的人、稿子、成品三者一致，不需要任何取舍或说明。 */
  function scriptToSpeech(v, p) {
    const s = (p.scripts || []).find(x => x.id === v.scriptId);
    if (!s || !(s.dialogue || []).length) return v.title || '';
    return s.dialogue.map(l => l.text).join('  ');
  }

  /* ---------- 访谈式对谈影片 ----------
   * 三种形式（AI 提问者 / 作者 / 书中主角）差别只有「谁问谁答」。
   * 稿子一律用固定 5 段：提问方开场 → 回答方回答 → 提问方追问 →
   * 回答方补充 → 提问方收尾 CTA；再按形式把这 5 段分配给主理人与对方。 */

  function currentFormat() {
    return DATA.interviewFormat(STORE.s.persona.interviewFormat);
  }

  /* 对面坐的那个人叫什么。书中主角要读这本书自己的角色表。 */
  function guestNameOf(p) {
    const pa = STORE.s.persona;
    const fmt = currentFormat();
    if (fmt.id === 'character') {
      const list = (p && p.characters) || [];
      const bound = list.find(c => c.name && c.name === pa.guestCharacterName);
      return (bound && bound.name) || (list[0] && list[0].name) || fmt.guestName;
    }
    if (fmt.id === 'author') return pa.guestName || p.author || fmt.guestName;
    return pa.guestName || fmt.guestName;
  }

  /* 书中主角形式：把角色的定妆照与外貌描述带给 Model Router，
   * 不然生出来的脸跟「书中角色」那一段做好的角色对不上。 */
  function guestCharacterOf(p) {
    if (currentFormat().id !== 'character') return null;
    const list = (p && p.characters) || [];
    const pa = STORE.s.persona;
    return list.find(c => c.name && c.name === pa.guestCharacterName) || list[0] || null;
  }

  /* 提问方 / 回答方各是谁（host = 主理人自己的形象与声音） */
  function interviewRoles(p) {
    const fmt = currentFormat();
    const hostName = STORE.s.account.name || '主理人';
    const guestName = guestNameOf(p);
    return fmt.hostAsks
      ? { fmt, asker: 'host', answerer: 'guest', askerName: hostName, answererName: guestName, hostName, guestName }
      : { fmt, asker: 'guest', answerer: 'host', askerName: guestName, answererName: hostName, hostName, guestName };
  }

  function scriptToConversation(v, p) {
    const s = (p.scripts || []).find(x => x.id === v.scriptId);
    const R = interviewRoles(p);
    const lines = (s && Array.isArray(s.dialogue) ? s.dialogue : []).filter(x => x && x.text);
    const seed = lines.length ? lines : [{ text: v.title || p.title || '这本书值得聊一聊', cue: '开场' }];
    const take = i => (seed[i] || seed[seed.length - 1] || {}).text || '';
    const out = [
      {
        role: 'ask',
        cue: '提问方开场，5-8 秒，直接抛出主题',
        text: `我们今天聊《${p.title}》。这本书最值得先讲的，是它怎么回应「${(p.pains || [])[0] || '很多人很努力却没有结果'}」这个问题。`
      },
      { role: 'answer', cue: '回答方回答，10-15 秒，讲核心观点', text: take(0) },
      { role: 'ask', cue: '提问方追问或插嘴，5-8 秒，像真人交流', text: '等一下，这里我想插一句。这个观点听起来很对，但普通人最容易误会的地方是什么？' },
      { role: 'answer', cue: '回答方补充，10-15 秒，给一个具体动作或书中金句', text: take(1) || take(0) },
      { role: 'ask', cue: '提问方总结 CTA，5-8 秒，自然收尾', text: `所以这本书不是叫你更忙，而是让你做对更少的事。想看《${p.title}》更完整的拆解，留言「书摘」。` }
    ].map(x => assignSpeaker(x, R));
    return scaleConversation(out, Number(v.duration) || defaultVideoDuration());
  }

  function assignSpeaker(line, R) {
    const speaker = line.role === 'ask' ? R.asker : R.answerer;
    return Object.assign({}, line, {
      speaker,
      speakerName: speaker === 'host' ? R.hostName : R.guestName
    });
  }

  function scaleConversation(lines, duration) {
    const list = Array.isArray(lines) ? lines : [];
    const D = clampDuration(duration);
    return list.map((line, i) => {
      const t0 = +(i * D / list.length).toFixed(1);
      const t1 = +((i + 1) * D / list.length).toFixed(1);
      return Object.assign({}, line, { t: `${t0.toFixed(1)}-${t1.toFixed(1)}s` });
    });
  }

  /* 文字框里用真实名字当前缀，使用者才知道哪一句是谁讲的 */
  function conversationToText(lines, R) {
    return (lines || []).map(l => {
      const name = l.speaker === 'host' ? R.hostName : R.guestName;
      return `${name}：${l.text}`;
    }).join('\n');
  }

  function parseConversationText(text, R) {
    /* 介面切到繁体时，文字框里的名字也会被转成繁体（林致远 → 林致遠），
     * 但资料里存的是简体。两边都先转成繁体再比，否则整段会被误判成同一个人讲的。 */
    const norm = x => {
      const t = String(x || '').trim().toLowerCase();
      return (window.I18N && I18N.toTrad) ? I18N.toTrad(t) : t;
    };
    const hostAlias = [R.hostName, '主持人', '主理人', 'host'].filter(Boolean).map(norm);
    const guestAlias = [R.guestName, '来宾', '嘉宾', 'guest', '作者', '主角'].filter(Boolean).map(norm);
    return String(text || '').split(/\n+/).map(line => line.trim()).filter(Boolean).map(line => {
      const m = line.match(/^([^：:]{1,12})\s*[：:]\s*(.+)$/);
      if (!m) return { speaker: R.answerer, text: line };
      const who = norm(m[1]);
      if (hostAlias.indexOf(who) >= 0) return { speaker: 'host', text: m[2].trim() };
      if (guestAlias.indexOf(who) >= 0) return { speaker: 'guest', text: m[2].trim() };
      return { speaker: R.answerer, text: line };   // 认不出前缀就整句当台词，不吃掉内容
    }).filter(x => x.text);
  }

  /* 不管使用者怎么改，最后一定补回固定 5 段，缺的用预设句顶上 */
  function fixedConversation(lines, p) {
    const R = interviewRoles(p);
    const list = (Array.isArray(lines) ? lines : []).filter(x => x && x.text);
    const asks = list.filter(x => x.speaker === R.asker);
    const answers = list.filter(x => x.speaker === R.answerer);
    const pick = (arr, i, fallback) => (arr[i] && arr[i].text) || fallback;
    return [
      { role: 'ask', text: pick(asks, 0, `我们今天聊《${p.title}》，先讲它最值得注意的一点。`) },
      { role: 'answer', text: pick(answers, 0, '这本书真正有价值的地方，是它把一个复杂问题讲得很具体。') },
      { role: 'ask', text: pick(asks, 1, '我插一句，普通读者听到这里，最容易误会的地方是什么？') },
      { role: 'answer', text: pick(answers, 1, '不要只把它当成道理，要回到自己今天能改变的一个动作。') },
      { role: 'ask', text: pick(asks, 2, `想看《${p.title}》更完整的拆解，留言「书摘」。`) }
    ].map(x => assignSpeaker(x, R));
  }

  /* 送给 Model Router 的模板变数。
   * line_1..line_5 按固定结构顺序，speaker 明写是谁，避免形式一（主理人回答）
   * 被后端按「host 一定先讲」的旧假设念反。host_line_* / guest_line_* 保留给
   * 既有的固定访谈模板，只有在主理人负责提问时才对得上，因此按形式给。 */
  function conversationVariables(lines, p) {
    const fixed = fixedConversation(lines, p);
    const R = interviewRoles(p);
    const vars = {
      book_title: p.title || '',
      book_author: p.author || '',
      interview_format: R.fmt.id,
      asker: R.asker,
      asker_name: R.askerName,
      answerer: R.answerer,
      answerer_name: R.answererName
    };
    fixed.forEach((l, i) => {
      vars[`line_${i + 1}`] = l.text;
      vars[`line_${i + 1}_speaker`] = l.speaker;
    });
    const asks = fixed.filter(l => l.role === 'ask').map(l => l.text);
    const answers = fixed.filter(l => l.role === 'answer').map(l => l.text);
    if (R.fmt.hostAsks) {
      Object.assign(vars, {
        host_line_1: asks[0], guest_line_1: answers[0],
        host_line_2: asks[1], guest_line_2: answers[1], host_line_3: asks[2]
      });
    } else {
      Object.assign(vars, {
        guest_line_1: asks[0], host_line_1: answers[0],
        guest_line_2: asks[1], host_line_2: answers[1], guest_line_3: asks[2]
      });
    }
    return vars;
  }

  function currentAvatarLabel() {

  /* 送出一支影片并开始轮询。逐支生成与批量生成共用这一段——
   * 只有一条送出路径，之后要改重试或计费才不会漏改其中一边。
   * 失败时把状态写成「生成失败」并往外抛，让呼叫端决定要不要继续。 */
  async function submitVideo(id, text) {
    const hit = findVideo(id);
    if (!hit) throw new Error('找不到这一支影片');
    const { v } = hit;
    // 额度是花钱的闸门。以前只是显示，用满了照样能一直生成，账单会失控。
    if (quotaLeft() <= 0) throw new Error('本月额度已用完（可到「系统设置 → 用量与额度」调高上限）');
    const pa = STORE.s.persona;
    videoJobs[id] = true;
    v.status = '生成中'; v.error = null;
    v.avatarName = currentAvatarLabel();
    v.voiceName = pa.realVoiceName || '';
    STORE.update(); render();
    try {
      const r = await hgFetch('/api/heygen/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          mode: pa.realAvatarMode || 'avatar',
          avatarId: pa.realAvatarId, assetId: pa.realPhotoAssetId,
          voiceId: pa.realVoiceId, text
        })
      });
      v.heygenId = r.videoId;
      STORE.update();
      STORE.log('ok', `送出生成：${v.title}`);
      pollVideo(id);
    } catch (e) {
      delete videoJobs[id];
      v.status = '生成失败'; v.error = e.message;
      STORE.update(); render();
      throw e;
    }
  }


  /* ============================================================
   * 批量生成
   *
   * 一本书通常有十几支待生成，一支一支点太累。但也不能按一下就
   * 全部送出去——这是真的花钱，而且一次送太多会撞到服务端限流。
   * 所以：预设只跑前 5 支、同时最多 2 支在跑、每一支都看得到结果，
   * 中途可以停。
   * ========================================================== */
  function quotaLeft() {
    const st = STORE.s.settings;
    return Math.max(0, (st.quotaTotal || 0) - (st.quotaUsed || 0));
  }

  const BATCH = { running: false, stop: false };
  const BATCH_CONCURRENCY = 2;

  function batchPending() {
    const p = STORE.current;
    return (p.videos || []).filter(v => (v.status === '待生成' || v.status === '生成失败') && !videoJobs[v.id]);
  }

  function batchGenModal() {
    if (BATCH.running) return toast('已经有一批在跑了', 'warn');
    if (!hgCanWrite()) return hgDemoNotice();
    const pa = STORE.s.persona;
    if (!pa.realVoiceId) return toast('还没选声音，先去「数字人 · 声音」选一个', 'err');
    if (pa.realAvatarMode === 'image' ? !pa.realPhotoAssetId : !pa.realAvatarId) {
      return toast('还没选形象，先去「数字人 · 声音」选一个', 'err');
    }
    const list = batchPending();
    if (!list.length) return toast('没有待生成的影片', 'warn');

    const left = quotaLeft();
    if (left <= 0) return toast('本月额度已用完，可到「系统设置 → 用量与额度」调高上限', 'err');

    const failed = list.filter(v => v.status === '生成失败').length;
    const fresh = list.length - failed;
    // 能跑几支同时受「待处理数量」与「剩余额度」两个上限夹制
    const cap = Math.min(list.length, left);
    const def = Math.min(5, cap);
    modal('批量生成影片', `
      <div class="explain" style="margin:0 0 14px">
        <div class="ex-r"><span class="ex-k">会用谁</span><span>形象 <b>${esc(currentAvatarLabel())}</b>　声音 <b>${esc(pa.realVoiceName || '')}</b></span></div>
        <div class="ex-r"><span class="ex-k">会花多少</span><span><b style="color:var(--amber)">真的会扣钱</b>，一支约 US$1-3。跑 <b id="bg-n-echo">${def}</b> 支大约 <b id="bg-cost">US$${def}-${def * 3}</b>。</span></div>
        <div class="ex-r"><span class="ex-k">怎么跑</span><span>一次最多 ${BATCH_CONCURRENCY} 支同时进行，跑完一支接一支。中途可以按「停止」，已经送出去的那几支不会取消。</span></div>
      </div>
      <div class="field">
        <div class="label">这一批要跑几支<span class="hint" style="margin-left:8px;font-weight:400">待处理 ${list.length} 支${failed ? `（其中 ${failed} 支是上次失败要重试的）` : ''}　剩余额度 ${left} 支</span></div>
        <input class="input" type="number" id="bg-n" min="1" max="${cap}" value="${def}"
          oninput="(function(el){var n=Math.max(1,Math.min(${cap},+el.value||1));
            document.getElementById('bg-n-echo').textContent=n;
            document.getElementById('bg-cost').textContent='US$'+n+'-'+(n*3);})(this)">
      </div>
      <div class="hint">建议先跑 3-5 支看效果，满意再跑剩下的。稿子有问题的话，跑完整批才发现会很浪费。</div>
      <div id="bg-log" style="margin-top:14px"></div>`,
      `<button class="btn" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-primary" data-modal-act="bg-run">开始生成（会扣钱）</button>`);
  }

  async function batchGenRun() {
    const input = $('#bg-n');
    const list = batchPending();
    const n = Math.max(1, Math.min(list.length, quotaLeft(), +(input && input.value) || 1));
    const targets = list.slice(0, n);
    closeModal();

    BATCH.running = true; BATCH.stop = false;
    toast(`开始批量生成 ${targets.length} 支`, 'ok');
    STORE.log('run', `批量生成开始：${targets.length} 支`);

    let ok = 0, fail = 0, queue = targets.slice();
    const worker = async () => {
      while (queue.length && !BATCH.stop) {
        const v = queue.shift();
        const text = scriptToSpeech(v, STORE.current);
        if (!text || !text.trim()) { fail++; STORE.log('warn', `跳过（没有台词）：${v.title}`); continue; }
        try { await submitVideo(v.id, text); ok++; }
        catch (e) {
          fail++; STORE.log('err', `送出失败：${v.title} — ${e.message}`);
          // 额度用完就整批停住，继续送只会一支一支全部失败
          if (/额度/.test(e.message || '')) { BATCH.stop = true; }
        }
      }
    };
    await Promise.all(Array.from({ length: Math.min(BATCH_CONCURRENCY, targets.length) }, worker));

    BATCH.running = false;
    const stopped = BATCH.stop ? '（中途停止）' : '';
    STORE.log(fail ? 'warn' : 'ok', `批量生成送出完毕${stopped}：成功 ${ok} 支、失败 ${fail} 支`);
    toast(`送出完毕${stopped}：成功 ${ok}、失败 ${fail}。影片还在生成，好了会自己更新`, fail ? 'warn' : 'ok');
    render();
  }

  async function aipStatus(taskId) {
    return hgFetch('/api/ai-platform/tasks/' + encodeURIComponent(taskId), null, 20000);
  }

  function taskResult(body) {
    return body && (body.result || body.data || body.task || body);
  }

  function taskIdOf(body) {
    const r = taskResult(body) || {};
    return r.id || r.task_id || r.taskId || r.job_id || body?.id || body?.task_id || body?.taskId;
  }

  function taskStatusOf(body) {
    const r = taskResult(body) || {};
    return String(r.status || body?.status || '').toLowerCase();
  }

  function taskErrorOf(body) {
    const r = taskResult(body) || {};
    return r.error || r.message || body?.error || body?.message || '';
  }

  function taskVideoUrlOf(body) {
    const r = taskResult(body) || {};
    const a = r.completed_assets || r.completedAssets || r.assets || r.output || body?.completed_assets || {};
    return a.final_video_url || a.conversation_video_url || a.avatar_video_url || a.video_url ||
      r.final_video_url || r.conversation_video_url || r.avatar_video_url || r.video_url || r.url || body?.videoUrl;
  }

  function isTaskDone(status) {
    return ['completed', 'complete', 'succeeded', 'success', 'done'].includes(status);
  }

  function isTaskFailed(status) {
    return ['failed', 'error', 'canceled', 'cancelled'].includes(status);
  }

          name: R.guestName, avatar: guestAvatar, avatar_id: (chr && chr.portraitUrl) ? undefined : (pa.guestAvatarId || 'auto'), voice_id: pa.guestVoiceId || 'auto' }
      ],
      dialogue,
      output: {
        format: 'mp4',
        store: true,
        completed_assets: ['final_video_url', 'conversation_video_url']
      }
    };

    videoJobs[id] = true;
    v.status = '生成中'; v.error = null; v.format = 'conversation'; v.duration = duration;
    v.interviewFormat = fmt.id;
    v.avatarName = `${STORE.s.account.name || '主理人'} + ${R.guestName}`;

    toast(`${fmt.name} 对谈影片已送出，等待 Model Router 生成`, 'ok');

    try {
      const created = await aipTask(payload);
      const url = taskVideoUrlOf(created);
      if (url) {
        delete videoJobs[id];
        v.status = '已生成'; v.videoUrl = url; v.aiPlatformTaskId = taskIdOf(created) || '';
        STORE.update(); render();
        toast('对谈影片已生成', 'ok');
        return;
      }
      const taskId = taskIdOf(created);
      if (!taskId) throw new Error('Model Router 没有回传 result.id / task_id，无法轮询');
      v.aiPlatformTaskId = taskId;
      STORE.update();
      STORE.log('ok', `送出对谈影片（${fmt.name}）：${v.title}`);
      pollAiPlatformVideo(id);
    } catch (e) {
      delete videoJobs[id];
      v.status = '生成失败'; v.error = e.message;
      STORE.update(); render();
      toast('对谈影片送出失败：' + e.message, 'err');

  function pollAiPlatformVideo(id) {
    const tick = async () => {
      const hit = findVideo(id);
      if (!hit) { delete videoJobs[id]; return; }
      const { v } = hit;
      if (!v.aiPlatformTaskId) { delete videoJobs[id]; return; }
      try {
        const s = await aipStatus(v.aiPlatformTaskId);
        const status = taskStatusOf(s);
        const url = taskVideoUrlOf(s);
        if ((isTaskDone(status) && url) || url) {
          delete videoJobs[id];
          v.status = '已生成'; v.videoUrl = url;
          const st = STORE.s.settings;
          st.quotaUsed = Math.min(st.quotaTotal, st.quotaUsed + 1);
          STORE.update(); render();
          STORE.log('ok', `对谈影片已生成：${v.title}`);
          toast(`《${v.title}》对谈影片已生成好了`, 'ok');
          return;
        }
        if (isTaskFailed(status)) {
          delete videoJobs[id];
          v.status = '生成失败'; v.error = taskErrorOf(s) || 'Model Router 回报失败';
          STORE.update(); render();
          toast('对谈影片生成失败：' + v.error, 'err');
          return;
        }
        setTimeout(tick, 6000);
      } catch (e) {
        setTimeout(tick, 9000);
      }
    };
    tick();
  }

  function pollVideo(id) {
    const tick = async () => {
      const hit = findVideo(id);
      if (!hit) { delete videoJobs[id]; return; }   // 项目被删了
      const { v } = hit;
      if (!v.heygenId) { delete videoJobs[id]; return; }
      try {
        const s = await hgFetch('/api/status?service=heygen-video&id=' + encodeURIComponent(v.heygenId));
        if (s.status === 'completed' && s.videoUrl) {
          delete videoJobs[id];
          v.status = '已生成'; v.videoUrl = s.videoUrl;
          // 额度只在这里扣：影片真的做出来了才算用掉一支
          const st = STORE.s.settings;
          st.quotaUsed = Math.min(st.quotaTotal, st.quotaUsed + 1);
          STORE.update(); render();
          STORE.log('ok', `影片已生成：${v.title}`);
          toast(`《${v.title}》已生成好了`, 'ok');
          return;
        }
        if (s.status === 'failed') {
          delete videoJobs[id];
          v.status = '生成失败'; v.error = s.error || '未知原因';
          STORE.update(); render();
          toast('生成失败：' + v.error, 'err');
          return;
        }
        setTimeout(tick, 5000);
      } catch (e) {
        // 查询失败通常是暂时的（网络断一下），继续再试，不要直接判死
        setTimeout(tick, 8000);
      }
    };
    tick();
  }

  /* ---------------- 真实档案上传 ---------------- */
  const KB = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

  function readAsText(file) {
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = () => rej(new Error('读取失败'));
      r.readAsText(file, 'UTF-8');
    });
  }

  async function handleFiles(files) {
    const p = STORE.current;
    if (!p) return;
    let imported = 0, parsed = 0;

    for (const f of Array.from(files)) {
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      const item = { name: f.name, size: KB(f.size), bytes: f.size, ext };

      if (f.size > 200 * 1024 * 1024) {
        item.type = '过大'; item.status = '未处理'; item.note = '超过 200MB 上限';
        p.materials.push(item); continue;
      }

      try {
        if (ext === 'json') {
          const text = await readAsText(f);
          const json = JSON.parse(text);
          const r = DATA.importProfile(json, p);
          if (!r.ok) { item.type = 'JSON'; item.status = '格式错误'; item.note = r.msg; }
          else {
            item.type = '书籍档案'; item.status = '已汇入';
            item.note = Object.keys(r.stat).map(k => `${k} ${r.stat[k]}`).join(' · ');
            imported++;
          }
        } else if (ext === 'txt' || ext === 'md') {
          const text = await readAsText(f);
          const r = DATA.parseText(text);
          p.parsed = r;
          item.type = '内文'; item.status = '已解析';
          item.note = `${r.chars.toLocaleString()} 字 · ${r.chapters.length} 个章节标题 · 候选金句 ${r.quotes.length} 条`;
          if (!p.source) p.source = { kind: 'text', label: '内文本地解析' };
          parsed++;
        } else {
          item.type = { pdf: 'PDF', docx: '文档', epub: '电子书', pptx: '简报', jpg: '图片', jpeg: '图片', png: '图片', svg: '图片' }[ext] || '其他';
          item.status = '待服务端解析';
          item.note = '演示版不含 PDF / OCR 解析，接入后端后由解析服务处理';
        }
      } catch (e) {
        item.type = ext.toUpperCase(); item.status = '读取失败'; item.note = e.message;
      }
      p.materials.push(item);
    }

    if (imported) p.progress = Math.max(p.progress, 12);
    STORE.update(); render();
    const msg = imported ? `已汇入书籍档案：《${p.title}》`
      : parsed ? '内文已完成本地解析'
        : `已加入 ${files.length} 个档案`;
    toast(msg, 'ok');
    if (imported) STORE.log('ok', `汇入书籍档案《${p.title}》`);
  }

        <div class="ex-r"><span class="ex-k">拿得回来吗</span><span><b>拿不回来</b>。资料存在这台电脑的浏览器里，删了就没了。</span></div>
        ${made ? `<div class="ex-r"><span class="ex-k" style="color:var(--amber)">⚠ 花过钱的</span><span>其中 <b>${made} 支影片是真的生成过的</b>（花过钱）。影片网址会一起消失，要留请<b>先去下载</b>再回来删。</span></div>` : ''}
      </div>`,
      `<button class="btn" onclick="UI.closeModal()">取消</button>
       ${made ? `<button class="btn" data-modal-act="goto-lib-before-del" data-id="${esc(id)}">先去下载影片</button>` : ''}

  /* ============================================================
   * 真实 AI 写稿（接 Model Router 的 chat）
   *
   * 现况：STEP 4 产出的对谈稿是模板拼出来的，句型固定、换本书也
   * 只有书名变。这里让它真的送进大模型重写一遍，成本约 US$0.01-0.05
   * 一篇，所以做成「单篇触发」而不是整批自动跑。
   * 接不上或没设定金钥时，维持原本的模板稿，不会把页面弄坏。
   * ========================================================== */
  async function aiRewriteScript(id) {
    let p = null, s = null;
    STORE.s.projects.forEach(x => (x.scripts || []).forEach(y => { if (y.id === id) { s = y; p = x; } }));
    if (!s) return;
    if (!hgCanWrite()) return hgDemoNotice();

    const pa = STORE.s.persona;
    const scenes = (s.scenePlan || []).map(x => `${x.name}（${x.visual}）`).join('、') || '棚内访谈';
    /* 必须是单人口播：数字人服务一次只能一个形象、一个声音。
     * 写成双人对谈的话，生成时只能由同一个人念完两边台词，稿子会对不上成品。 */
    const speaker = STORE.s.account.name || '主讲人';
    const system = '你是短视频编剧，专写中文单人口播短片脚本。只输出 JSON，不要任何解释文字。';
    const duration = clampDuration(s.duration || defaultVideoDuration());
    const minWords = Math.max(80, Math.round(duration * 4.1));
    const maxWords = Math.max(minWords + 30, Math.round(duration * 5.3));
    const prompt = `帮我写一支 ${duration} 秒的单人口播短视频脚本，用来推荐这本书。

【书籍】《${p.title}》${p.author ? '，作者' + p.author : ''}
【全书摘要】${p.summary || '（未提供）'}
【核心论点】${(p.themes || []).slice(0, 5).join('；') || '（未提供）'}
【书中金句】${(p.quotes || []).slice(0, 6).join('；') || '（未提供）'}
【读者痛点】${(p.pains || []).slice(0, 4).join('；') || '（未提供）'}

【形式】**一个人对着镜头讲**，全程只有一个说话的人，不要写成两个人对谈、不要有问答角色。
这个人叫「${speaker}」，所有台词的 speaker 都填「${speaker}」。
【画面场地】依序是：${scenes}（只是背景变化，人物始终是同一个）
【口吻要求】语速 ${pa.speed}/100、亲和 ${pa.warmth}/100、正式度 ${pa.formal}/100（数字越高越正式）
${(pa.habits || []).length ? '【口头禅】自然植入其中 1-2 句，不要每句都用：' + pa.habits.join('、') : ''}

要求：
- 开头 3 秒就要让人停下来，别铺陈、别说「大家好」
- 讲人话、短句，像跟朋友说话，不要书面语和排比句
- 中间要有一次自问自答（先讲出观众可能的反驳，再回应）
- 引用书里的一句原话，前后留停顿
- 讲书里真正的观点，不要空泛的「这本书很好看」
- 8-10 句，每句给时间区间，总长不超过 ${duration} 秒，全篇 ${minWords}-${maxWords} 字
- 最后给一个今天就能做的具体动作，再带出引导留言或试读的 CTA

只输出这个 JSON 结构：
{"title":"一句吸引人的标题","hook":"前3秒开场白","dialogue":[{"t":"0.0-4.0s","speaker":"${speaker}","cue":"语气与节奏提示","text":"台词"}],"cta":"结尾引导语"}`;

    /* 先问要用哪个模型。这一步是真的花钱，选贵选便宜差很多，
     * 不该由程式码替使用者决定。取消就什么都不做，原稿保持不变。 */
    const pick = await askModel('rewrite');
    if (!pick) return toast('已取消，这一篇没有被改动', 'warn');
    scriptModal(id);           // 选模型的窗口盖掉了稿子详情，选完把它开回来

    const body = $('#modal-body');
    if (body) body.insertAdjacentHTML('afterbegin',
      '<div id="ai-rw" class="hint" style="margin-bottom:12px;color:var(--violet-2)">✨ 真实 AI 重写中，约 10-30 秒…</div>');
    const setMsg = (t, color) => { const el = $('#ai-rw'); if (el) { el.textContent = t; el.style.color = color || 'var(--violet-2)'; } };

    try {
      const r = await hgFetch('/api/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ prompt, system, maxTokens: 2000, wantJson: true }, pick))
      });
      let out;
      try { out = JSON.parse(r.content); }
      catch (e) {
        // 模型偶尔会在 JSON 外面包一层 ```json，取出中间那段再试一次
        const m = (r.content || '').match(/\{[\s\S]*\}/);
        if (!m) throw new Error('模型没有回传可解析的 JSON');
        out = JSON.parse(m[0]);
      }
      if (!out.dialogue || !out.dialogue.length) throw new Error('模型回传的内容里没有对谈台词');

      s.title = out.title || s.title;
      s.hook = out.hook || s.hook;
      s.dialogue = out.dialogue;
      s.cta = out.cta || s.cta;
      s.duration = duration;
      s.aiWritten = true;
      s.aiModel = r.model || null;
      STORE.update();
      toast('已用真实 AI 重写（模型：' + (r.model || '未知') + '）', 'ok');
      const note = mpServedNote(pick, r.model);
      if (note) toast(note, 'warn');
      render(); scriptModal(id);
    } catch (e) {
      setMsg('AI 重写失败：' + e.message + '（原本的稿子没有被改动）', 'var(--red)');
    }
  }

  /* ---- 真实场景示意图（Model Router 的 image 任务）----
   * $0.03-0.07 一张，所以一次只生一张、按一次生一次，不做批次。 */
  async function aiSceneImage(templateId) {
    const t = (DATA.sceneTemplateLibrary ? DATA.sceneTemplateLibrary() : []).find(x => x.id === templateId);
    const slot = $(`.ai-scene-img[data-for="${templateId}"]`);
    if (!t || !slot) return;
    if (!hgCanWrite()) return hgDemoNotice();

    const pick = await askModel('image');
    if (!pick) return toast('已取消，没有生成图片', 'warn');

    const p = STORE.current;
    slot.innerHTML = '<div class="hint" style="margin-top:8px;color:var(--violet-2)">✨ 生成中，约 10-20 秒…</div>';
    const prompt = `短视频场景示意图，直式 9:16 构图。场景：${t.name}——${t.setting}。`
      + `画面里有 ${t.roles}，气氛${t.tone}。`
      + (p ? `内容主题与《${p.title}》这本书有关。` : '')
      + '电影感打光、真实摄影风格、不要出现文字或字幕。';

    try {
      const r = await hgFetch('/api/ai/image', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ prompt }, pick))
      });
      if (!r.url) throw new Error('平台没有回传图片网址');
      slot.innerHTML = `<img src="${esc(r.url)}" style="width:100%;border-radius:10px;margin-top:10px">
        <div class="hint" style="margin-top:6px">AI 生成的场景示意图，仅供沟通画面用</div>`;
    } catch (e) {
      slot.innerHTML = `<div class="hint" style="margin-top:8px;color:var(--amber)">生成失败：${esc(e.message)}</div>`;
    }
  }

  /* ============================================================
   * 用提示词直接生成短片
   *
   * 原本是「从 30 个固定场景挑一个」，但文字转影片本来就不受场景限制——
   * 提示词写什么就生成什么。所以改成：AI 读这本书写出提示词 → 使用者
   * 随便改 → 直接生成。30 个模板退成灵感参考，点一下变成可编辑的提示词。
   * ========================================================== */

  /* AI 根据书的内容写几组影片提示词（花钱很少，约 US$0.01-0.05） */
  /* ============================================================
   * 给生产流水线用的「真实 AI」接口
   *
   * STEP 2「AI 读完整本书」与 STEP 4「AI 批量写稿」以前都是模板产生的，
   * 名字叫 AI 但没有 AI。这里把它们接上真实模型。engine.js 透过
   * window.AIREAL 呼叫，接不上或关闭时会自动退回原本的模板逻辑，
   * 不会把流程弄坏。
   * ========================================================== */
  function aiJson(content) {
    try { return JSON.parse(content); }
    catch (e) {
      const m = (content || '').match(/\{[\s\S]*\}/);
      if (!m) throw new Error('模型没有回传可解析的 JSON');
      return JSON.parse(m[0]);
    }
  }

  /* ============================================================
   * 每一步开跑前先选模型
   *
   * Model Router 后面挂着几十个模型，价钱差到上百倍（最便宜的每百万
   * token 不到 $0.04，最贵的 $216）。以前程式码里写死 quality:'auto'，
   * 等于每一步都让平台自己挑，使用者完全没得选、也不知道花了多少钱。
   *
   * 现在每个会花钱的 AI 步骤按下去，先弹一个窗：列出目前真的可用的
   * 模型（清单是即时跟服务要的，不是写死的）、各自价钱、还有这一步
   * 大概会花多少。选完才真的送出去。
   *
   * 选择会记住（settings.modelPicks），也可以勾「以后不用再问」变成
   * 静默模式（settings.askModel = false），之后直接用记住的那个。
   * 系统设置页可以随时改回来。
   * ========================================================== */

  /* 每个步骤：给什么用、预设挑什么、大概吃多少 token（用来估这一步的花费）。
   * est 的数字是从各步骤真正送出去的 prompt 长度与 maxTokens 抓的概数，
   * 不是精确值——目的是让人在选贵模型前有个量级概念。 */
  const AI_STEPS = {
    read:    { t: 'AI 读完整本书', kind: 'text', def: 'auto', est: { in: 13000, out: 2500 },
               note: '把上传的内文整本送进模型读一遍，产出摘要、核心论点、金句与读者画像。内文很长，便宜的模型通常也够用。' },
    script:  { t: 'AI 批量写稿', kind: 'text', def: 'auto', est: { in: 3000, out: 6000 },
               note: '写标题、Hook 与完整口播稿。这一步最影响影片好不好看，值得用好一点的模型。' },
    rewrite: { t: '重写这一篇口播稿', kind: 'text', def: 'auto', est: { in: 1500, out: 2000 },
               note: '只重写你现在打开的这一篇，其他稿子不受影响。' },
    prompts: { t: 'AI 写影片提示词', kind: 'text', def: 'auto', est: { in: 1200, out: 1200 },
               note: '读这本书写几组「文字转影片」提示词，输出很短，很便宜。' },
    image:   { t: '生成场景示意图', kind: 'image', def: 'fast', est: null,
               note: '一次只生一张，价钱看档位与模型，大约 US$0.03-0.15。' },
    chars:   { t: 'AI 读出书里的角色', kind: 'text', def: 'auto', est: { in: 1500, out: 1500 },
               note: '读这本书抽出几个可以「演出来」的角色，输出很短，很便宜。' },
    portrait: { t: '生成角色定妆照', kind: 'image', def: 'fast', est: null,
               note: '一次只生一张，价钱看档位与模型，大约 US$0.03-0.15。' }
  };

  /* 「策略」不是模型，是「让平台自己挑」。文字与图像两边的可选档位不一样：
   * 文字走 /v1/chat/completions 的 auto/cheap/smart/fast；
   * 图像走 /v1/tasks 的 fast/balanced/premium 品质档。 */
  const MP_TEXT_STRATEGY = ['auto', 'cheap', 'smart', 'fast'];
  const MP_IMAGE_STRATEGY = [
    { id: 'fast', name: '快速档（平台自己挑）', desc: '最省，约 $0.03 一张' },
    { id: 'balanced', name: '平衡档（平台自己挑）', desc: '约 $0.05 一张' },
    { id: 'premium', name: '高品质档（平台自己挑）', desc: '约 $0.07 一张' }
  ];

  let mpCache = null;          // 模型清单只抓一次，之后重复用
  let mpPending = null;        // 目前有人在等这个窗口的结果

  async function mpModels() {
    if (mpCache) return mpCache;
    const r = await hgFetch('/api/ai/models', {}, 12000);
    mpCache = (r.models || []).filter(m => m.kind === 'model');
    return mpCache;
  }

  const mpMoney = n => n == null ? '—'
    : (n >= 1 ? '$' + n.toFixed(2) : '$' + n.toFixed(n >= 0.1 ? 3 : 4).replace(/0+$/, '').replace(/\.$/, ''));

  function mpPriceText(m) {
    if (m.unit === 'image') return `约 ${mpMoney(m.inPrice)} / 张`;
    if (m.unit === 'character') return `约 ${mpMoney(m.inPrice)} / 百万字符`;
    if (m.unit === 'audio-minute') return `约 ${mpMoney(m.inPrice)} / 分钟`;
    if (m.inPrice == null) return '价钱未公布';
    return `每百万 token：输入 ${mpMoney(m.inPrice)} · 输出 ${mpMoney(m.outPrice)}`;
  }

  /* 这一步用这个模型大概花多少。估得出来才显示——估不出来宁可不写，
   * 也不要编一个数字给人当真。 */
  function mpStepCost(step, m) {
    const est = AI_STEPS[step] && AI_STEPS[step].est;
    if (!est || !m || m.unit !== 'tokens' || m.inPrice == null) return '';
    const c = m.inPrice * est.in / 1e6 + (m.outPrice || 0) * est.out / 1e6;
    return `这一步约 ${c < 0.001 ? '<$0.001' : mpMoney(c)}`;
  }

  function mpCandidates(step, models) {
    const kind = AI_STEPS[step].kind;
    const want = kind === 'image' ? ['image-gen'] : ['text-chat', 'reasoning', 'multimodal'];
    const list = (models || []).filter(m => want.indexOf(m.modality) >= 0);
    // 便宜的排前面：绝大多数步骤便宜的就够用，把贵的摆后面比较不会误按
    const w = m => (m.inPrice == null ? 1e9 : m.inPrice * 3 + (m.outPrice || 0));
    return list.sort((a, b) => w(a) - w(b));
  }

  /* 把选到的 id 换成真正要送给后端的欄位。
   * 策略字串走 quality，具体模型走 model——后端两个都收。 */
  function mpPayload(step, id) {
    const kind = AI_STEPS[step].kind;
    if (kind === 'image') {
      return MP_IMAGE_STRATEGY.some(x => x.id === id) ? { quality: id } : { model: id, quality: 'fast' };
    }
    return MP_TEXT_STRATEGY.indexOf(id) >= 0 ? { quality: id } : { model: id };
  }

  function mpLabel(step, id) {
    const cfg = AI_STEPS[step];
    if (!cfg) return id;
    if (cfg.kind === 'image') {
      const s = MP_IMAGE_STRATEGY.find(x => x.id === id);
      if (s) return s.name;
    } else if (MP_TEXT_STRATEGY.indexOf(id) >= 0) {
      return { auto: '智能路由（平台自己挑）', cheap: '最省钱', smart: '最聪明', fast: '最快' }[id] || id;
    }
    const m = (mpCache || []).find(x => x.id === id);
    return m ? m.name : id;
  }

  /* 平台说话不算话时，要当场讲出来。
   *
   * 2026-08-14 实测：Model Router 的 /v1/chat/completions 只认
   * auto/cheap/smart/fast 这四个策略词，送任何一个具体模型 id（包括
   * 瞎编的名字）它都照收不误，然后一律退回最便宜的 mistral-nemo。
   * 也就是说「指定模型」这件事服务方还没实作。
   *
   * 我们不能因此假装没事——使用者挑了 Claude Opus 5，实际跑的却是
   * 别的模型，这必须让他知道。回应里的 model 欄位是平台自己报的
   * 「真的用了谁」，拿它跟使用者挑的比对，不一样就明讲。
   * 等服务方补上指定模型的支援，这个提示自然就不会再出现。 */
  function mpServedNote(pick, served) {
    if (!pick || !pick.model || !served) return '';
    if (served === pick.model) return '';
    return `注意：你挑的是「${mpLabel('script', pick.model)}」，但平台实际用的是「${served}」`
      + '——这个路由服务目前还不支援指定模型，只认「让平台自己挑」那四个档位。';
  }

  function mpSaved(step) {
    const picks = STORE.s.settings.modelPicks || {};
    return picks[step] || AI_STEPS[step].def;
  }

  function mpRow(id, name, desc, price, checked) {
    return `<label style="display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);
        border-radius:10px;margin-bottom:8px;cursor:pointer">
      <input type="radio" name="mp-choice" value="${esc(id)}" ${checked ? 'checked' : ''} style="margin-top:3px">
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:600">${esc(name)}</div>
        ${desc ? `<div class="hint" style="margin-top:2px">${esc(desc)}</div>` : ''}
        ${price ? `<div class="hint" style="margin-top:2px">${esc(price)}</div>` : ''}
      </div>
    </label>`;
  }

  function mpRender(step, models, err) {
    const cfg = AI_STEPS[step];
    const sel = mpSaved(step);
    const strat = cfg.kind === 'image'
      ? MP_IMAGE_STRATEGY.map(x => mpRow(x.id, x.name, x.desc, '', sel === x.id)).join('')
      : [['auto', '智能路由（平台自己挑）', '按这段内容的难度自动挑一个划算的模型。不确定时选这个。'],
         ['cheap', '最省钱', '永远挑最便宜的可用模型。'],
         ['smart', '最聪明', '永远挑当下最强的旗舰模型，最贵。'],
         ['fast', '最快', '永远挑反应最快的那一档。']]
        .map(x => mpRow(x[0], x[1], x[2], '', sel === x[0])).join('');

    const list = mpCandidates(step, models);
    const modelRows = list.map(m => mpRow(m.id, m.name,
      [m.vendor, m.context ? '上下文 ' + Math.round(m.context / 1000) + 'K' : '', m.openWeight ? '开源权重' : '']
        .filter(Boolean).join(' · '),
      [mpPriceText(m), mpStepCost(step, m)].filter(Boolean).join(' · '),
      sel === m.id)).join('');

    modal(`选择这一步用的模型 · ${esc(cfg.t)}`, `
      <div class="explain" style="margin:0 0 16px;border-left-color:var(--violet)">
        <div class="ex-r"><span class="ex-k">这一步在做什么</span><span>${esc(cfg.note)}</span></div>
        <div class="ex-r"><span class="ex-k">怎么选</span><span>不确定就用第一个「智能路由」。清单里的价钱是服务方即时回报的，不是写死的。</span></div>
      </div>
      ${err ? `<div class="hint" style="color:var(--amber);margin-bottom:12px">拿不到完整模型清单（${esc(err)}），
        只能先用下面这几个档位；网络恢复后重开这个窗口就会有完整清单。</div>` : ''}
      <div class="label" style="margin-bottom:8px">让平台自己挑</div>
      ${strat}
      ${modelRows ? `<div class="label" style="margin:16px 0 8px">指定一个模型（共 ${list.length} 个）</div>
        <div class="hint" style="color:var(--amber);margin:-2px 0 10px">
          先说清楚：这个路由服务目前<b>还不支援指定模型</b>（2026-08-14 实测，连不存在的模型名它都照收，
          然后一律退回最便宜的那个）。所以下面这些现在挑了不一定算数——真的跑完之后，
          我们会把平台实际用了哪个模型如实告诉你。想稳的话请用上面那四个档位。
        </div>${modelRows}` : ''}
      <label style="display:flex;gap:10px;align-items:center;margin-top:14px;cursor:pointer">
        <input type="checkbox" id="mp-remember">
        <span style="font-size:14px">以后每一步都直接用记住的模型，不用再问我
          <span class="hint">（系统设置里可以随时改回来）</span></span>
      </label>`,
      `<button class="btn" data-modal-act="mp-cancel">取消，这一步不跑</button>
       <button class="btn btn-primary" data-modal-act="mp-ok" data-step="${esc(step)}">用这个模型开始</button>`, true);
  }

  /* 开窗口问，回传要送给后端的欄位；使用者取消就回传 null。
   * 静默模式（askModel === false）直接用记住的那个，不打断。 */
  async function askModel(step) {
    if (!AI_STEPS[step]) return {};
    if (STORE.s.settings.askModel === false) return mpPayload(step, mpSaved(step));
    let models = null, err = '';
    try { models = await mpModels(); } catch (e) { err = e.message; }
    return new Promise(resolve => {
      /* 顺序不能反：modal() 一开始就会跑一遍「关闭钩子」，而下面那个钩子
       * 会把 mpPending 当成使用者取消收掉。先画窗口、再挂上等待中的
       * Promise，才不会自己把自己取消掉（一开窗就直接回 null）。 */
      mpRender(step, models, err);
      mpPending = { step, resolve };
    });
  }

  function mpFinish(step, ok) {
    const pend = mpPending;
    mpPending = null;
    if (!pend) return;
    if (!ok) { closeModal(); return pend.resolve(null); }
    const r = document.querySelector('input[name="mp-choice"]:checked');
    const id = (r && r.value) || mpSaved(step);
    const picks = STORE.s.settings.modelPicks || (STORE.s.settings.modelPicks = {});
    picks[step] = id;
    if (($('#mp-remember') || {}).checked) STORE.s.settings.askModel = false;
    STORE.update();
    closeModal();
    pend.resolve(mpPayload(step, id));
  }

  /* 使用者按右上角叉叉或 Esc 关掉窗口，等于取消这一步——一定要把那个
   * Promise 收掉，否则呼叫端会永远卡在 await，画面停在「生成中」不动。 */
  UI.onClose(() => {
    if (!mpPending) return;
    const pend = mpPending; mpPending = null;
    pend.resolve(null);
  });

  /* 系统设置页要显示「这一步现在预设用哪个模型」，也要能直接改。 */
  window.MODELPICK = {
    steps: () => AI_STEPS,
    savedId: mpSaved,
    label: step => mpLabel(step, mpSaved(step)),
    async change(step) {
      const was = STORE.s.settings.askModel;
      STORE.s.settings.askModel = true;      // 设置页点「更改」当然要弹窗
      const r = await askModel(step);
      if (!r) STORE.s.settings.askModel = was;   // 取消就什么都别动
      STORE.update();
      if (window.render) render();
      if (r) toast('已设为：' + mpLabel(step, mpSaved(step)), 'ok');
    }
  };

  window.AIREAL = {
    /* 公开展示版没有写入凭证，一律走模板；使用者也可以在系统设置关掉 */
    canUse: () => hgCanWrite() && STORE.s.settings.realAI !== false,

    /* STEP 2：真的把上传的内文送进模型读一遍 */
    async readBook(p) {
      const text = (p.parsed && p.parsed.raw) || '';
      if (!text.trim()) return null;          // 没有原始内文就没得读，交回模板逻辑
      const pick = await askModel('read');
      // 取消选模型＝这一步不要真的花钱跑。丢出去让 engine 退回本地规则抽取。
      if (!pick) throw new Error('已取消选择模型');
      const r = await hgFetch('/api/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({
          system: '你是出版社的内容编辑，只输出 JSON，不要任何解释文字。',
          maxTokens: 2500, wantJson: true,
          prompt: `读完下面这本书的内文，做一份分析。

【书名】《${p.title}》${p.author ? '，作者' + p.author : ''}
【内文】
${text.slice(0, 12000)}

只输出这个 JSON：
{"summary":"全书摘要 200-300 字",
 "themes":["核心论点，5 条"],
 "quotes":["书中金句，8-12 条，要从内文原句里挑，不要自己编"],
 "audiences":[{"name":"读者画像名称","size":30,"note":"特征"}],
 "pains":["这些读者的痛点，4 条"],
 "hots":["可搭配的热点话题标签，5 个，带 # 号"]}`
        }, pick))
      });
      const j = aiJson(r.content);
      if (!j.summary) throw new Error('模型没有回传摘要');
      return { data: j, model: r.model, note: mpServedNote(pick, r.model) };
    },

    /* STEP 4：真的写标题、Hook、开场白与几篇完整对谈稿。
     * 拆成两次呼叫——一次要模型同时产出这么多内容会跑超过 30 秒，
     * 容易撞到闸道器的执行时间上限（实测过一次 502）。分开跑各自都很快，
     * 而且其中一段失败还能保住另一段。 */
    async writeScripts(p) {
      // 标题与口播稿是同一步的两次呼叫，只问一次模型，两次都用它
      const pick = await askModel('script');
      if (!pick) throw new Error('已取消选择模型');
      const ctx = `【书名】《${p.title}》${p.author ? '，作者' + p.author : ''}
【摘要】${(p.summary || '（未提供）').slice(0, 600)}
【核心论点】${(p.themes || []).slice(0, 5).join('；') || '（未提供）'}
【金句】${(p.quotes || []).slice(0, 6).join('；') || '（未提供）'}
【读者痛点】${(p.pains || []).slice(0, 4).join('；') || '（未提供）'}`;

      const call = (prompt, maxTokens) => hgFetch('/api/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({
          system: '你是短视频编剧，只输出 JSON，不要任何解释文字。',
          maxTokens, wantJson: true, prompt
        }, pick))
      });

      // 第一段：标题 / Hook / 开场白（输出短，很快）
      const r1 = await call(`帮这本书写短视频文案。

${ctx}

要求：标题要有具体信息或反差，不要「这本书改变了我」这种空话；Hook 是前 3 秒的第一句，要让人停下来。

只输出：{"titles":["20 个标题"],"hooks":["20 个 Hook"],"opens":["10 个开场白，比 Hook 长一点"]}`, 2500);
      const d1 = aiJson(r1.content);
      if (!d1.titles || !d1.titles.length) throw new Error('模型没有回传标题');

      /* 第二段：完整口播稿（输出较大，单独跑）
       *
       * 一定要写「单人口播」而不是双人对谈：数字人服务一次只能让一个形象、
       * 一个声音念一段话。写成对谈的话，生成时只能由同一个人把两边台词都念完，
       * 稿子和做得出来的影片对不上。 */
      const speaker = (window.STORE && STORE.s.account && STORE.s.account.name) || '主讲人';
      const duration = defaultVideoDuration();
      const minWords = Math.max(80, Math.round(duration * 4.1));
      const maxWords = Math.max(minWords + 30, Math.round(duration * 5.3));
      let scripts = [];
      try {
        const r2 = await call(`帮这本书写 3 篇 ${duration} 秒短视频口播稿。

${ctx}

形式：**一个人对着镜头讲**，全程只有一个说话的人，不要写成两个人对谈、不要有主持人问答。
这个人叫「${speaker}」，所有台词的 speaker 都填「${speaker}」。

写法要求：
- 开头 3 秒就要让人停下来，别铺陈、别说「大家好」
- 讲人话，短句，像跟朋友说话，不要书面语和排比句
- 中间要有一次自问自答（预设观众的反驳，然后回应）
- 要引用书里的一句原话，并留一个停顿
- 结尾给一个今天就能做的具体动作，再自然带出引导语
- 每篇 8-10 句，全篇加起来 ${minWords}-${maxWords} 字（${duration} 秒念得完）

只输出：{"scripts":[{"title":"标题","hook":"前3秒开场","dialogue":[{"t":"0.0-4.0s","speaker":"${speaker}","cue":"语气与节奏提示","text":"台词"}],"cta":"结尾引导语"}]}`, 3500);
        scripts = (aiJson(r2.content).scripts || []);
      } catch (e) {
        // 口播稿失败不影响标题/Hook，照样把第一段的结果交回去
        scripts = [];
      }

      return { data: Object.assign({}, d1, { scripts }), model: r1.model, note: mpServedNote(pick, r1.model) };
    }
  };

  /* ============================================================
   * 书中角色 —— 让书里的主角走进影片
   *
   * 其他影片都是「一个人对着镜头讲」，这一条路径不一样：先把书里的人物
   * 读出来，生成这个角色长什么样，再让他自己出现在画面里。
   *
   *   aiReadCharacters()  文字模型读书 → 抽出角色（几乎不花钱，约 US$0.01-0.05）
   *   aiCharPortrait(i)   image 任务 → 定妆照（一张约 US$0.03-0.07）
   *   charToPrompt(i)     角色写成影片提示词 → 落到既有的提示词生成流程
   *
   * 刻意不另外开一条生成影片的新路径：影片一律走下面那张卡的
   * 「生成这支短片」，扣额度的地方只有一个，使用者才不会不小心花钱。
   * ========================================================== */
  async function aiReadCharacters() {
    const p = STORE.current;
    if (!p) return;
    if (!hgCanWrite()) return hgDemoNotice();

    const box = $('#ai-char-status');
    const setMsg = (t, color) => {
      if (box) box.innerHTML = `<div class="hint" style="color:${color || 'var(--violet-2)'};margin-bottom:12px">${esc(t)}</div>`;
    };
    const pick = await askModel('chars');
    if (!pick) return toast('已取消，没有去读角色', 'warn');
    setMsg('✨ AI 正在读这本书找角色，约 10-30 秒…');

    const prompt = `读这本书，抽出 3-4 个可以「演出来」的角色，让他们出现在推荐这本书的短视频画面里。

【书籍】《${p.title}》${p.author ? '，作者' + p.author : ''}
【摘要】${p.summary || '（未提供）'}
【核心论点】${(p.themes || []).slice(0, 5).join('；') || '（未提供）'}
【金句】${(p.quotes || []).slice(0, 5).join('；') || '（未提供）'}
【读者痛点】${(p.pains || []).slice(0, 4).join('；') || '（未提供）'}

要求：
- 小说、传记、历史这类书，就抽书里真正的人物，名字用书里的名字
- 非虚构、商管、知识类的书如果没有故事人物，就抽书里出现的真实人物、案例主角，
  或是一个能代表读者的具体化身（要给他一个具体的名字与身份，不要写成「读者A」）
- look 要具体到画得出来：年龄、性别、脸型、发型、穿着、神情、时代与地域感，60-100 字
- scene 是这个角色在书里最有代表性的一幕：他在哪里、在做什么、气氛如何，40-80 字
- 只写书里真的有依据的角色，不要凭空发明与全书无关的人

只输出这个 JSON：
{"characters":[{"name":"角色名字","role":"他在书里是谁","look":"外貌描述","scene":"代表场景"}]}`;

    try {
      const r = await hgFetch('/api/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({
          prompt, system: '你是选角导演，只输出 JSON，不要任何解释文字。',
          maxTokens: 2000, wantJson: true
        }, pick))
      }, 60000);
      const out = aiJson(r.content);
      const list = (out.characters || [])
        .filter(x => x && (x.name || x.look))
        .map(x => ({
          name: x.name || '', role: x.role || '',
          look: x.look || '', scene: x.scene || ''
        }));
      if (!list.length) throw new Error('模型没有读出角色');
      p.characters = (p.characters || []).concat(list);
      STORE.update(); render();
      toast(`AI 从书里读出 ${list.length} 个角色，可以直接改`, 'ok');
      const note = mpServedNote(pick, r.model);
      if (note) toast(note, 'warn');

  function pollPromptVideo(taskId, slot, i) {
    const tick = async () => {
      if (!document.body.contains(slot)) return; // 已离开这一页，停止轮询
      try {
        const s = await hgFetch('/api/status?service=deevid-video&id=' + encodeURIComponent(taskId));

          // 存起来，之后回到这一页还看得到，不用重生成

          if (p && p.videoPrompts && p.videoPrompts[i]) { p.videoPrompts[i].videoUrl = s.videoUrl; STORE.update(); }

  /* ============================================================
   * 模拟成片播放器：真的有声音、有人物、有画面
   *   - 声音：浏览器语音合成（正式版换成主理人声音模型）
   *   - 人物：SVG 数字人，会眨眼、说话时对口型
   *   - 画面：书封入场 / 关键词大字 / B-roll / 字幕 / 片尾 CTA
   * ========================================================== */
  let pv = null;                       // 播放状态
  const mmss = s => Math.floor(s / 60) + ':' + ('0' + Math.floor(s % 60)).slice(-2);
  const T = x => (window.I18N ? I18N.toTrad(x) : x);

  function stopPreview() {
    if (pv && pv.timer) clearInterval(pv.timer);
    try { speechSynthesis.cancel(); } catch (e) {}
    pv = null;
  }
  UI.onClose(stopPreview);

  /* 挑一个「台湾口音的国语」语音。
     注意 zh-HK 是香港粤语，绝对不能选——之前误把它跟 zh-TW 并列，
     导致系统语音清单里粤语排前面时就被选中。
     语音清单是非同步载入的，要等 voiceschanged。 */
  const CANTONESE = /zh[-_]HK|yue|cantonese|粤|粵/i;
  function pickVoice() {
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { return null; }
    const ok = vs.filter(v => !CANTONESE.test(v.lang) && !CANTONESE.test(v.name));
    return ok.find(v => /zh[-_]TW/i.test(v.lang))                    // 台湾国语，最优先
      || ok.find(v => /台灣|臺灣|Taiwan/i.test(v.name))
      || ok.find(v => /zh[-_]CN|zh[-_]Hans/i.test(v.lang))           // 退而求其次：普通话
      || ok.find(v => /^zh/i.test(v.lang))
      || ok.find(v => /Chinese|中文|國語|国语|普通话/i.test(v.name))
      || null;
  }

  /* ---- 依性别把可用的中文语音分池 ----
     六个配音员如果共用同一个语音，只靠音高语速区分，听起来就是同一个人。
     微软语音命名有规律：曉/晓/Xiao 多为女声，雲/云/Yun 多为男声。 */
  const FEMALE = /曉|晓|Xiao|Hsiao|雅婷|Yating|涵涵|HanHan|慧慧|Huihui|瑤瑤|瑶瑶|Yaoyao|Tracy|Zhiyu|Female|女/i;
  const MALE = /雲|云|Yun|志威|Zhiwei|康康|Kangkang|Danny|Male|男/i;

  function voicePool() {
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { return { male: [], female: [], all: [] }; }
    const zh = vs.filter(v => !CANTONESE.test(v.lang) && !CANTONESE.test(v.name) && /^zh/i.test(v.lang));
    // 台湾国语排最前面，其余中文次之
    const rank = v => (/zh[-_]TW/i.test(v.lang) ? 0 : 1);
    zh.sort((a, b) => rank(a) - rank(b));
    return {
      all: zh,
      male: zh.filter(v => MALE.test(v.name) && !FEMALE.test(v.name)),
      female: zh.filter(v => FEMALE.test(v.name) && !MALE.test(v.name))
    };
  }

  /* 给某个配音员指派一个实际语音：同性别的池子里依序取，尽量各不相同 */
  function voiceForActor(id) {
    const pool = voicePool();
    const list = DATA.VOICES;
    const a = list.find(v => v.id === id);
    if (!a) return pickVoice();
    const same = list.filter(v => v.gender === a.gender);
    const idx = Math.max(0, same.findIndex(v => v.id === id));
    const src = a.gender === '男' ? pool.male : pool.female;
    if (src.length) return src[idx % src.length];
    // 该性别没有对应语音，退回任何中文语音（页面会提示）
    return pool.all[idx % Math.max(1, pool.all.length)] || pickVoice();
  }

  /* 声库诊断：告诉使用者这台电脑能不能真的区分不同声音 */
  function libraryDiag() {
    const pool = voicePool();
    return {
      total: pool.all.length, male: pool.male.length, female: pool.female.length,
      assigned: DATA.VOICES.map(a => {
        const v = voiceForActor(a.id);
        return { id: a.id, name: a.name, gender: a.gender, voice: v ? v.name : null, lang: v ? v.lang : null };
      })
    };
  }
  window.__libraryDiag = libraryDiag;

  /* 目前实际用到的系统语音，供人格页显示（各台电脑装的语音不同） */
  function voiceInfo() {
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { return null; }
    const v = pickVoice();
    if (!v) return { none: true, total: vs.length };
    return {
      name: v.name, lang: v.lang,
      isTW: /zh[-_]TW/i.test(v.lang) || /台灣|臺灣|Taiwan/i.test(v.name),
      total: vs.length
    };
  }
  window.__voiceInfo = voiceInfo;

  /* 把实际用到的系统语音显示在人格页，方便判断是不是台湾国语 */
  function showVoiceInfo() {
    // 每张配音员卡显示实际指派到的语音
    const cards = document.querySelectorAll('.vc-sys');
    if (cards.length) {
      const d = libraryDiag();
      cards.forEach(c => {
        const a = d.assigned.find(x => x.id === c.dataset.vid);
        c.textContent = a && a.voice ? '系统语音：' + a.voice.replace(/^Microsoft\s*/, '') : '此机无可用语音';
      });
      const box = document.getElementById('voice-sys');
      if (box) {
        if (d.total <= 1) {
          box.innerHTML = `⚠ 这台电脑只有 <b>${d.total}</b> 个中文语音，六位配音员会听起来一模一样。<br>
            装多几个语音才分得出来（Windows 设定 → 时间与语言 → 语言与地区 → 中文（繁体，台湾）→ 语音）。`;
          box.style.color = 'var(--amber)'; return;
        }
        if (!d.male || !d.female) {
          box.innerHTML = `⚠ 这台电脑的中文语音里${!d.male ? '没有男声' : '没有女声'}（共 ${d.total} 个），
            ${!d.male ? '男声' : '女声'}配音员只能用现有语音代替，性别听起来会不对。`;
          box.style.color = 'var(--amber)'; return;
        }
        box.innerHTML = `此机可用中文语音 <b>${d.total}</b> 个（男 ${d.male} / 女 ${d.female}），已分别指派给各配音员。`;
        box.style.color = 'var(--txt-3)'; return;
      }
    }
    const el = document.getElementById('voice-sys');
    if (!el) return;
    const v = voiceInfo();
    if (!v) { el.innerHTML = '这个浏览器不支援语音合成。'; return; }
    if (v.none) {
      el.innerHTML = v.total
        ? '⚠ 这台电脑没有可用的中文语音，试听不会有声音。'
        : '语音清单载入中…';
      el.style.color = 'var(--amber)'; return;
    }
    el.innerHTML = v.isTW
      ? `目前试听使用：<b>${esc(v.name)}</b>（${esc(v.lang)}）— 台湾国语 ✓`
      : `目前试听使用：<b>${esc(v.name)}</b>（${esc(v.lang)}）<br>
         ⚠ 这台电脑没装台湾国语语音，改用其他中文语音代替。<br>
         Windows 可到「设定 → 时间与语言 → 语言与地区 → 新增语言 → 中文（繁体，台湾）」并勾选语音套件。`;
    el.style.color = v.isTW ? 'var(--txt-3)' : 'var(--amber)';
  }
  try { speechSynthesis.addEventListener('voiceschanged', showVoiceInfo); } catch (e) {}
  try {
    speechSynthesis.addEventListener('voiceschanged', () => {
      if (!pv) return;
      pv.voice = pickVoice();
      const w = document.getElementById('pv-novoice');
      if (w) w.style.display = pv.voice ? 'none' : 'block';
    });
  } catch (e) {}

  /* 依「声音来源」设定语速与音高。系统音只能模拟差异，正式版由 TTS 服务产生 */
  function voiceParams() {
    const pa = STORE.s.persona;
    let rate = 0.75 + (pa.speed / 100) * 0.6, pitch = 1;
    if (pa.voiceMode === 'library') {
      const a = DATA.VOICES.find(v => v.id === pa.voiceActor);
      // 音色已由指派的实际语音决定，音高只做小幅微调，压太多会失真
      if (a) { rate *= a.rate; pitch = 1 + (a.pitch - 1) * 0.4; }
    } else if (pa.voiceMode === 'clone') {
      rate *= 0.97; pitch = 0.95;
    }
    return { rate: Math.max(0.5, Math.min(2, rate)), pitch: Math.max(0.5, Math.min(2, pitch)) };
  }

  function utter(text) {
    const u = new SpeechSynthesisUtterance(T(text).replace(/[【】]/g, ' '));
    const pa = STORE.s.persona;
    // 配音员声库：每位指派不同的实际语音，不能只靠音高假装
    const v = (pa.voiceMode === 'library' ? voiceForActor(pa.voiceActor) : null)
      || (pv && pv.voice) || pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
    const q = voiceParams();
    u.rate = q.rate; u.pitch = q.pitch;
    return u;
  }

  function speak(text) {
    if (!pv || pv.muted || !text) return;
    try {
      speechSynthesis.cancel();
      const u = utter(text);
      u.onboundary = () => { if (pv) pv.talkPulse = 1; };
      pv.utter = u;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* 声音试听（人格页） */
  const SAMPLE_LINE = '我讲得直白一点。你不是时间不够，你是把时间花在了不产生复利的事情上。说句实在话，这件事我自己也是很晚才想明白的。';
  function tryVoice(id) {
    const pa = STORE.s.persona;
    const prev = { mode: pa.voiceMode, actor: pa.voiceActor };
    if (id && id !== 'clone' && id !== 'system') { pa.voiceMode = 'library'; pa.voiceActor = id; }
    else if (id === 'system') pa.voiceMode = 'system';
    try {
      speechSynthesis.cancel();
      const u = utter(SAMPLE_LINE);
      u.onend = () => { pa.voiceMode = prev.mode; pa.voiceActor = prev.actor; };
      u.onerror = u.onend;
      speechSynthesis.speak(u);
      const v = DATA.VOICES.find(x => x.id === id);
      toast(v ? '试听：' + v.name : id === 'clone' ? '试听：' + STORE.s.account.name + '本人声音（演示以系统音代替）' : '试听：系统合成音', 'ok');
      if (!pickVoice()) toast('这个浏览器没有中文语音，听不到声音', 'warn');
    } catch (e) { toast('这个浏览器不支持语音合成', 'warn'); }
    finally { pa.voiceMode = prev.mode; pa.voiceActor = prev.actor; }
  }

  const SCENE = ['open', 'point', 'broll', 'quote', 'point', 'broll', 'cta'];

  function pvApplyShot(i) {
    const el = id => document.getElementById(id);
    if (!el('mv-sub')) return;
    const s = pv.shots[i];
    const kind = SCENE[Math.min(i, SCENE.length - 1)];
    el('mv-shot').textContent = T(`镜头 ${i + 1}/${pv.shots.length} · ${s.t}`);
    el('mv-sub').textContent = T(s.txt);
    el('mv-vis').textContent = T(`${s.cam}　|　${s.vis}`);
    el('mv-book').classList.toggle('show', kind === 'open' || kind === 'cta');
    el('mv-broll').classList.toggle('show', kind === 'broll');
    el('mv-kw').classList.toggle('show', kind === 'quote');
    el('mv-cta').classList.toggle('show', kind === 'cta');
    if (kind === 'quote') el('mv-kw').textContent = T(s.txt);
    el('mv-person').classList.toggle('far', kind === 'broll' || kind === 'quote');
    document.querySelectorAll('#pv-shots .shot').forEach((e, n) => e.classList.toggle('on', n === i));
    speak(s.txt);
  }

  function pvFrame() {
    if (!pv) return;
    const ts = performance.now();
    const el = id => document.getElementById(id);
    if (!el('mv-sub')) { stopPreview(); return; }

    if (pv.playing) {
      const dt = pv.last ? Math.min(0.5, (ts - pv.last) / 1000) : 0;   // 分页被节流时不要一次跳太多
      pv.last = ts;
      pv.t = Math.min(pv.dur, pv.t + dt);
      let i = pv.shots.findIndex(s => pv.t < s.t1);
      if (i < 0) i = pv.shots.length - 1;
      if (i !== pv.shot) { pv.shot = i; pvApplyShot(i); }
      el('pv-time').textContent = `${mmss(pv.t)} / ${mmss(pv.dur)}`;
      el('pv-bar').style.width = (pv.t / pv.dur * 100) + '%';
      if (pv.t >= pv.dur) {
        pv.playing = false;
        try { speechSynthesis.cancel(); } catch (e) {}
        const b = el('pv-play'); if (b) { b.textContent = '↻'; b.classList.remove('hide'); }
      }
    }

    /* 口型与眨眼 */
    let talking = false;
    try { talking = pv.playing && !pv.muted && speechSynthesis.speaking; } catch (e) {}
    if (pv.playing && pv.muted) talking = true;          // 静音时也让嘴动，画面才不呆
    pv.talkPulse = Math.max(0, (pv.talkPulse || 0) - 0.06);
    const mouth = el('mv-mouth');
    if (mouth) {
      const open = talking ? 1.6 + Math.sin(ts / 70) * 1.1 + pv.talkPulse * 2.2 : 0.6;
      mouth.setAttribute('ry', Math.max(0.6, open).toFixed(2));
    }
    if (!pv.blinkAt || ts > pv.blinkAt) { pv.blinkAt = ts + 2200 + Math.random() * 2600; pv.blinking = ts; }
    const lid = ts - (pv.blinking || 0) < 130;
    ['mv-eyeL', 'mv-eyeR'].forEach(k => { const e = el(k); if (e) e.setAttribute('ry', lid ? 0.4 : 2.6); });
    const body = el('mv-person');
    if (body) body.style.setProperty('--bob', (Math.sin(ts / 900) * 3).toFixed(2) + 'px');
  }

  function pvToggle() {
    if (!pv) return;
    const btn = document.getElementById('pv-play');
    if (pv.playing) {
      pv.playing = false; pv.last = 0;
      try { speechSynthesis.cancel(); } catch (e) {}
      btn.textContent = '▶'; btn.classList.remove('hide');
      return;
    }
    if (pv.t >= pv.dur) { pv.t = 0; pv.shot = -1; }
    pv.playing = true; pv.last = 0;
    btn.textContent = '❚❚'; btn.classList.add('hide');
    if (pv.shot < 0) { pv.shot = 0; pvApplyShot(0); }
  }

  function pvMute() {
    if (!pv) return;
    pv.muted = !pv.muted;
    const b = document.getElementById('pv-mute');
    if (b) b.textContent = pv.muted ? '🔇' : '🔊';
    if (pv.muted) { try { speechSynthesis.cancel(); } catch (e) {} }
    else if (pv.playing) speak(pv.shots[pv.shot].txt);
  }

  /* 建立播放器（在 modal 之后呼叫） */
  function pvInit(v, shots) {
    pv = { shots, dur: v.duration, t: 0, shot: -1, playing: false, muted: false, timer: 0, last: 0, voice: pickVoice() };
    const play = document.getElementById('pv-play');
    const mute = document.getElementById('pv-mute');
    if (play) play.addEventListener('click', e => { e.stopPropagation(); pvToggle(); });
    if (mute) mute.addEventListener('click', e => { e.stopPropagation(); pvMute(); });
    // 点画面任意处也能播放/暂停；但按钮自己已处理，别让它冒泡上来重复触发
    const stage = document.getElementById('mv-stage');
    if (stage) stage.addEventListener('click', e => {
      if (e.target.closest('#pv-play') || e.target.closest('#pv-mute')) return;
      pvToggle();
    });
    if (shots.length) { pv.shot = 0; pvApplyShot(0); try { speechSynthesis.cancel(); } catch (e) {} }
    const warn = document.getElementById('pv-novoice');
    if (warn && !pv.voice) warn.style.display = 'block';
    // 用计时器而不是 requestAnimationFrame：分页不在前台时 rAF 会整个停住
    pv.timer = setInterval(pvFrame, 50);
  }

    out += `【全书摘要】\n${p.summary || '（未生成）'}\n\n`;
    out += `【核心论点】\n${(p.themes || []).map((t, i) => `${i + 1}. ${t}`).join('\n')}\n\n`;
    out += `【金句】\n${(p.quotes || []).map((q, i) => `${i + 1}. ${q}`).join('\n')}\n\n`;
    out += `【标题 ${(p.titles || []).length} 个】\n${(p.titles || []).map(t => `${t.n}. ${t.text}  [${t.tag} · ${t.score}分]`).join('\n')}\n\n`;
    out += `【Hook ${(p.hooks || []).length} 个】\n${(p.hooks || []).map(t => `${t.n}. ${t.text}  [${t.tag} · ${t.score}分]`).join('\n')}\n\n`;
    out += `【开场白 ${(p.opens || []).length} 个】\n${(p.opens || []).map(t => `${t.n}. ${t.text}`).join('\n')}\n\n`;
    out += `【脚本 ${(p.scripts || []).length} 篇】\n`;
    (p.scripts || []).forEach(s => {
      out += `\n${'-'.repeat(56)}\n#${s.n} 【${s.angleName}】${s.platformName} · ${s.duration}s\n标题：${s.title}\nHook：${s.hook}\n正文：\n${s.body}\nCTA：${s.cta}\n`;
    });
    download(`${p.title}_内容资产包.txt`, out);
  }

  function exportReport() {
    const ps = STORE.s.projects;
    const videos = ps.reduce((a, p) => a.concat(p.videos || []), []);
    const an = DATA.genAnalytics(videos);
    let out = `AI 数字人短视频数据报告\n生成时间：${new Date().toLocaleString('zh-CN')}\n${'='.repeat(56)}\n\n`;
    out += `项目数：${ps.length}　视频数：${videos.length}　总播放：${an.total}\n\n【平台表现】\n`;
    an.byPlat.forEach(p => out += `${p.name}：${p.count} 支 · 播放 ${p.value}\n`);
    out += `\n【转化漏斗】\n`;
    an.funnel.forEach(f => out += `${f.k}：${f.v}\n`);
    out += `\n【单支明细】\n`;
    videos.forEach(v => out += `${v.platformName}\t${v.angle}\t播放${v.views}\t完播${v.watch}%\t${v.title}\n`);
    download('数据报告.txt', out);
  }

  /* ---------------- 引擎事件 ---------------- */
  let logTimer = null;
  ENGINE.on((evt) => {
    // 暂停时就算人在别页也要提示一声，否则会以为流程自己停住了
    if (evt === 'pause') toast('流程已暂停，请回「一键生成短视频」确认设定', 'warn');
    if (route !== 'pipeline') { if (evt === 'finish' || evt === 'stage' || evt === 'pause') render(); return; }
    // 只刷新日志与步骤条，避免整页重绘打断滚动
    const logEl = $('#run-log');
    if (logEl) {
      logEl.innerHTML = ENGINE.logs.map(l => `<div class="${l.cls}">[${l.ts}] ${esc(l.text)}</div>`).join('');
      if (window.I18N) I18N.apply(logEl);
    }
    if (evt === 'stage' || evt === 'finish' || evt === 'stop' || evt === 'pause' || evt === 'resume') {
      clearTimeout(logTimer);
      logTimer = setTimeout(render, 60);
    }
  });

  /* ---------------- 启动 ---------------- */
  // 未手动切换过时不写 data-theme，让页面跟随系统/查看者的浅色深色偏好
  if (STORE.s.settings.themeSet) document.documentElement.setAttribute('data-theme', STORE.s.settings.theme);
  render();
  I18N.set('hant');   // 全站固定台湾繁体中文，不提供切换
  resumePendingVideos();   // 接回上次没查完的影片生成，否则重整后会永远卡在「生成中」

  // 首次进入自动播放导览；看过之后只在点「导览」时出现
  if (!STORE.s.settings.tourDone) setTimeout(() => TOUR.start(0), 500);
  else setTimeout(() => toast('欢迎回来 · 需要重看用法请点顶栏「导览」', 'ok'), 700);
})();

function setVideoDuration(videoId, value, notify) {
  const duration = clampDuration(value);
  let hit = null;
  (STORE.s.projects || []).forEach(p => (p.videos || []).forEach(v => {
    if (v.id === videoId) hit = { p, v };
  }));
  if (!hit) return;
  hit.v.duration = duration;
  const script = (hit.p.scripts || []).find(s => s.id === hit.v.scriptId);
  if (script) script.duration = duration;
  STORE.update();
  if (notify) {
    render();
    UI.toast(`片长已设为 ${duration} 秒`, 'ok');
  }
}

function defaultVideoMode() {
  const mode = window.STORE && STORE.s && STORE.s.persona ? STORE.s.persona.videoMode : 'single';
  return mode === 'conversation' ? 'conversation' : 'single';
}

function setVideoFormat(videoId, value, notify) {
  const format = value === 'conversation' ? 'conversation' : 'single';
  let hit = null;
  (STORE.s.projects || []).forEach(p => (p.videos || []).forEach(v => {
    if (v.id === videoId) hit = { p, v };
  }));
  if (!hit) return;
  hit.v.format = format;
  STORE.update();
  if (notify) {
    render();
    UI.toast(format === 'conversation' ? '已改为访谈式对谈' : '已改为单人口播', 'ok');
  }
}

</script>
</body>

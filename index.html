      </svg><div class="rv">${label != null ? label : Math.round(pct) + '%'}</div></div>`;
  }

  /* 雷达图（人格特征） */
  function radar(items) {
    const cx = 110, cy = 105, R = 78, n = items.length;
    const pt = (i, r) => {
      const a = (Math.PI * 2 / n) * i - Math.PI / 2;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    };
    let webs = '';
    [.25, .5, .75, 1].forEach(f => {
      webs += `<polygon points="${items.map((_, i) => pt(i, R * f).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
    });
    const axes = items.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, R)[0]}" y2="${pt(i, R)[1]}" stroke="var(--line)"/>`).join('');
    const poly = items.map((it, i) => pt(i, R * it.v / 100).join(',')).join(' ');
    const labs = items.map((it, i) => {
      const [x, y] = pt(i, R + 18);
      return `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="10.5" fill="var(--txt-3)">${it.k}</text>`;
    }).join('');
    return `<svg viewBox="0 0 220 215" style="width:100%;max-width:250px;height:auto">
      ${webs}${axes}
      <polygon points="${poly}" fill="rgba(124,108,255,.28)" stroke="#7c6cff" stroke-width="2"/>
      ${items.map((it, i) => { const p = pt(i, R * it.v / 100); return `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#22d3ee"/>`; }).join('')}
      ${labs}</svg>`;
  }

  /* 迷你走势 */
  function spark(vals, color) {
    const W = 100, H = 28, max = Math.max.apply(null, vals) || 1, min = Math.min.apply(null, vals);
    const p = vals.map((v, i) => `${i ? 'L' : 'M'}${(W / (vals.length - 1)) * i},${H - ((v - min) / (max - min || 1)) * (H - 4) - 2}`).join(' ');
    return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:28px">
      <path d="${p}" fill="none" stroke="${color || '#7c6cff'}" stroke-width="2" stroke-linecap="round"/></svg>`;
  }

  return { line, bars, donut, funnel, ring, radar, spark };
})();


/* ===== engine.js ===== */
/* ============================================================
 * engine.js — 生产流水线执行引擎（模拟异步任务编排）
 * 真实接入：把 runTask 换成轮询后端任务状态即可。
 * ========================================================== */
window.ENGINE = (function () {

  let running = null;   // { projectId, stageIndex, taskIndex, timer }
  let paused = false;   // 停在某个阶段之前，等使用者确认
  const listeners = [];
  const logs = [];

  /* 在「数字人开口说话」之前停下来。理由：这一步之后产出的就是成片，
   * 用什么形象、什么声音、什么场景都定死了，改就得整批重跑。
   * 停在这里成本最低，也是使用者真正想介入的点。 */
  const PAUSE_BEFORE = 'avatar';

  function on(f) { listeners.push(f); }
  function emit(evt) { listeners.forEach(f => f(evt, snapshot())); }
  function snapshot() {
    return { running: !!running, projectId: running && running.projectId,
      stageIndex: running ? running.stageIndex : -1, taskIndex: running ? running.taskIndex : -1, logs: logs.slice(0, 200) };
  }
  function addLog(cls, text) {
    const t = new Date();
    const ts = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2) + ':' + ('0' + t.getSeconds()).slice(-2);
    logs.unshift({ cls, text, ts });
    if (logs.length > 300) logs.pop();
  }

  /* 启动全流程 */
  function start(project, fromIndex) {
    if (running) { UI.toast('已有任务在执行中', 'warn'); return; }
    logs.length = 0;
    addLog('l-info', `任务队列已创建 · 项目《${project.title}》`);
    /* 以前这行报的是设定页里那个写死的下拉选单值，跟真正送出去的模型
     * 无关。现在读「选模型」记住的实际选择；每一步开跑前还会再问一次，
     * 所以这里只写目前的预设，不把它讲成定局。 */
    const mp = window.MODELPICK;
    if (mp) {
      addLog('l-info', `预设模型 — 读书：${mp.label('read')} · 写稿：${mp.label('script')}`
        + (STORE.s.settings.askModel === false ? '（已设为不再询问，直接用这个）' : '（每一步开跑前会再问一次，可当场换）'));
    }
    addLog('l-info', `声音模型：${STORE.s.settings.tts}`);
    project.status = 'producing';
    running = { projectId: project.id, stageIndex: fromIndex || 0, taskIndex: -1, timer: null };
    project.stages = DATA.STAGES.map((s, i) => ({ key: s.key, state: i < (fromIndex || 0) ? 'done' : 'todo' }));
    STORE.update();
    step();
  }

  function stop() {
    if (running && running.timer) clearTimeout(running.timer);
    if (running) {
      const p = STORE.s.projects.find(x => x.id === running.projectId);
      if (p) { p.stages.forEach(s => { if (s.state === 'run') s.state = 'todo'; }); p.status = 'ready'; }
      addLog('l-warn', '任务已被用户中止');
    }
    running = null; paused = false; STORE.update(); emit('stop');
  }

  /* 确认之后继续跑完剩下的阶段 */
  function resume() {
    if (!running || !paused) return;
    paused = false; running.confirmed = true;
    addLog('l-ok', '▶ 已确认设定，继续生成影片');
    STORE.update(); emit('resume');
    step();
  }

  function step() {
    if (!running) return;
    const p = STORE.s.projects.find(x => x.id === running.projectId);
    if (!p) { running = null; return; }
    const stage = DATA.STAGES[running.stageIndex];
    if (!stage) return finish(p);

    // 进入「生成影片」这一步之前先停下来，让使用者确认形象/声音/场景
    if (stage.key === PAUSE_BEFORE && running.taskIndex === -1 && !paused && !running.confirmed) {
      paused = true;
      addLog('l-warn', '⏸ 已暂停：请确认要用的数字人形象、声音与场景，确认后再继续生成影片');
      STORE.update(); emit('pause');
      return;
    }

    running.taskIndex++;
    p.stages[running.stageIndex].state = 'run';

    if (running.taskIndex >= stage.tasks.length) {
      /* 小任务跑完了，但真正产出内容的是 applyStageResult——而且 read / script
       * 这两个阶段会真的呼叫大模型，要等几十秒。
       *
       * 以前是「先标完成、再去呼叫 AI」，所以介面会在稿子还没写出来的时候
       * 就显示「已完成」，产出却是 0 篇。必须等 applyStageResult 真的结束
       * 才能标完成、才能打完成日志。 */
      const stageIdx = running.stageIndex;
      /* failed=true 时标成 error 而不是 done：这一步没真的做出东西，
       * 标「完成」就是骗人（使用者会看到「已完成」但产出 0 篇）。 */
      const advance = (failed) => {
        if (!running) return;             // 中途被中止了
        p.stages[stageIdx].state = failed ? 'error' : 'done';
        addLog(failed ? 'l-warn' : 'l-ok',
          failed ? `✘ ${stage.n} ${stage.t} — 没能完成（产出可能是空的）` : `✔ ${stage.n} ${stage.t} — 完成`);
        running.stageIndex = stageIdx + 1; running.taskIndex = -1;
        p.progress = Math.round((running.stageIndex / DATA.STAGES.length) * 100);
        STORE.update(); emit('stage');
        running.timer = setTimeout(step, 420);
      };
      /* 一定要包 try/catch：applyStageResult 里任何一个没预期到的错
       * （例如某个栏位是空阵列）都会往上抛，而这里是 setTimeout 的回调，
       * 抛出去没有人接——整条流水线会就此停住，画面却还显示「运行中」，
       * 使用者只看到进度卡着不动，也不知道发生什么事。
       * 出错就记进日志、当作这一步做完，让后面的步骤继续跑。 */
      let r;
      try {
        r = applyStageResult(p, stage.key);
      } catch (e) {
        addLog('l-warn', `  └ ${stage.t} 出错：${e.message}（流程继续，但这一步没有产出）`);
        advance(true);
        return;
      }
      if (r && typeof r.then === 'function') {
        // 还在等 AI：这一步维持「运行中」，别让人以为已经好了
        p.stages[stageIdx].state = 'run';
        STORE.update(); emit('task');
        r.then(() => advance(false), e => {
          addLog('l-warn', `  └ ${stage.t} 出错：${(e && e.message) || e}（流程继续，但这一步没有产出）`);
          advance(true);
        });
      } else advance(false);
      return;
    }

    const task = stage.tasks[running.taskIndex];
    addLog('l-run', `▶ ${stage.t} · ${task}`);
    STORE.update(); emit('task');
    running.timer = setTimeout(() => {
      addLog('l-ok', `  └ ${task} ✓ ${extra(stage.key, running.taskIndex)}`);
      emit('task');
      step();
    }, 320 + Math.random() * 460);
  }

  function extra(key, i) {
    const m = {
      /* 这些是每个小任务跑完后附带的一句话。以前写死了「抽取 86,420 字」
       * 「一致性 96.4%」这类数字，不管实际情况如何都照报，等于骗人。
       * 改成不带数字的中性描述——真正的数字由各阶段自己的真实日志输出。 */
      upload: ['文件已校验', '文本已抽取', '图片文字识别（未实作，略过）', '章节已切分', '索引已建立'],
      read: ['', '', '', '', '', ''],
      strategy: ['平台评分完成', '内容矩阵已规划', '发布节奏已排布', 'CTA 方案已生成'],
      script: ['', '', '', '', '', '', ''],
      persona: ['人格参数已载入', '台词已改写', '语气与节奏已调整', '口头禅已植入', ''],
      // avatar 这一步是真的在做事（建清单），但绝不能写得像已经渲染出影片了
      avatar: ['读到已写好的稿子', '平台与尺寸已对应', '清单已建立，全部标为「待生成」'],
      // package / export 目前没有实作，日志必须说实话，不能再报「字幕 1,860 行」这种假数字
      package: ['尚未实作，本步未做任何事', '尚未实作，本步未做任何事', '尚未实作，本步未做任何事', '尚未实作，本步未做任何事'],
      export: ['尚未实作，本步未做任何事', '尚未实作，本步未做任何事', '尚未实作，本步未做任何事']
    };
    return (m[key] && m[key][i]) ? '（' + m[key][i] + '）' : '';
  }

  /* 每个阶段产出实际数据。
   * read / script 两个阶段会尽量走真实 AI，接不上就自动退回模板，
   * 并在日志里明确写出这一步到底是真的还是模板——不让人误会。 */
  function applyStageResult(p, key) {
    if (key === 'read') {
      // 真的把上传的内文送进模型读一遍
      if (window.AIREAL && AIREAL.canUse() && p.parsed && p.parsed.raw) {
        addLog('l-run', '  └ 正在用真实 AI 阅读上传的内文…');
        return AIREAL.readBook(p).then(r => {
          if (!r) throw new Error('没有可读的内文');
          const d = r.data;
          p.summary = d.summary || p.summary;
          if (d.themes && d.themes.length) p.themes = d.themes;
          if (d.quotes && d.quotes.length) {
            p.quotes = d.quotes;
            p.quoteSrc = d.quotes.map(t => ({ text: t, chapter: null, page: null }));
          }
          if (d.audiences && d.audiences.length) p.audiences = d.audiences;
          if (d.pains && d.pains.length) p.pains = d.pains;
          if (d.hots && d.hots.length) p.hots = d.hots;
          p.readByAI = true;
          addLog('l-ok', `  └ ✨ 真实 AI 阅读完成（模型：${r.model || '未知'}）：论点 ${(d.themes || []).length} 条 / 金句 ${(d.quotes || []).length} 条`);
          // 平台没照你挑的模型跑就要讲出来，不能让日志看起来一切正常
          if (r.note) addLog('l-warn', '  └ ' + r.note);
          STORE.update();
        }).catch(e => {
          addLog('l-warn', `  └ 真实 AI 阅读失败（${e.message}），改用本地规则抽取`);
          applyReadFallback(p);
        });
      }
      applyReadFallback(p);
    }
    if (key === 'strategy') p.strategy = DATA.genStrategy(p);
    if (key === 'script') {
      // 真的让模型写标题 / Hook / 开场白 与几篇完整口播稿
      if (window.AIREAL && AIREAL.canUse()) {
        addLog('l-run', '  └ 正在用真实 AI 写稿…');
        return AIREAL.writeScripts(p).then(r => {
          const d = r.data;
          p.titles = (d.titles && d.titles.length) ? d.titles : DATA.genTitles(p, 20);
          p.hooks = (d.hooks && d.hooks.length) ? d.hooks : DATA.genHooks(p, 20);
          p.opens = (d.opens && d.opens.length) ? d.opens : DATA.genOpens(p);
          // 先用模板产生 14 篇骨架（场地、镜头表、声音配置都在里面），
          // 再把 AI 真的写好的口播稿覆盖到前几篇上
          p.scripts = DATA.genScripts(p, 14);
          const real = (d.scripts || []).filter(x => x && x.dialogue && x.dialogue.length);
          real.forEach((rs, i) => {
            if (!p.scripts[i]) return;
            p.scripts[i] = Object.assign({}, p.scripts[i], {
              title: rs.title || p.scripts[i].title,
              hook: rs.hook || p.scripts[i].hook,
              dialogue: rs.dialogue,
              cta: rs.cta || p.scripts[i].cta,
              duration: defaultVideoDuration(),

            });
          });
          addLog('l-ok', `  └ ✨ 真实 AI 写稿完成（模型：${r.model || '未知'}）：${p.titles.length} 标题 / ${p.hooks.length} Hook / ${real.length} 篇完整口播稿`);
          if (r.note) addLog('l-warn', '  └ ' + r.note);
          if (real.length < p.scripts.length) {
            addLog('l-info', `  └ 其余 ${p.scripts.length - real.length} 篇仍为模板骨架，可在脚本详情里逐篇按「用真实 AI 重写」`);
          }

          addLog('l-warn', `  └ 真实 AI 写稿失败（${e.message}），改用模板产生`);

        });
      }

    }

     * 这里绝对不能凭空造影片：影片要真的送去数字人服务、真的花钱、真的等几分钟
     * 才会有，一支约 US$1-3。所以流水线只负责把稿子准备好，做不做成影片、做哪几支，

    if (key === 'avatar') {

      if (!(p.scripts || []).length) throw new Error('前面没有产出任何稿子，建不了影片待办');
      p.videos = DATA.genPendingVideos(p, p.scripts);
      addLog('l-info', `  └ 已按稿子建立 ${p.videos.length} 支影片待办，尚未真的生成`);
      addLog('l-info', '  └ 影片要逐支送去数字人服务才会产生（会花钱），到「内容资产库」点想做的那一支');
    }
    /* export 阶段以前会再凭空造 16 支影片、还顺手塞进发布排程——那 16 支的稿子
     * 是当场临时编的，跟前面 AI 写的 14 篇毫无关系。整段移除。
     * 排程也不该自动排：影片都还没做出来，没有东西可发。 */
  }

  function applyScriptFallback(p) {
    p.titles = DATA.genTitles(p, 20); p.hooks = DATA.genHooks(p, 20);
    p.opens = DATA.genOpens(p); p.scripts = DATA.genScripts(p, 14);
  }

  function applyReadFallback(p) {
    {
      if (p.source && p.source.kind === 'profile') {
        // 已汇入完整书籍档案：直接采用，不覆写
        addLog('l-ok', `  └ 使用上传的书籍档案：论点 ${p.themes.length} 条 / 金句 ${p.quoteSrc.length} 条（含出处）`);
      } else if (p.parsed && p.parsed.quotes.length) {
        // 仅上传内文：用本机规则抽取的结果，并明确标示
        p.summary = p.summary || `本书共 ${p.parsed.chapters.length} 个章节、约 ${p.parsed.chars.toLocaleString()} 字。以下内容由本机规则从上传内文中抽取，未经 AI 理解，仅供流程验证。`;
        p.themes = (p.themes && p.themes.length) ? p.themes : p.parsed.chapters.slice(0, 5);
        p.quoteSrc = p.parsed.quotes.map(t => ({ text: t, chapter: null, page: null }));
        p.quotes = p.parsed.quotes;
        const s = DATA.SEED_BOOKS[0];
        p.audiences = p.audiences || s.audiences; p.pains = p.pains || s.pains; p.hots = p.hots || s.hots;
        addLog('l-warn', '  └ 未提供书籍档案，改用内文本地规则抽取（非 AI 阅读）');
      } else if (!p.summary) {
        const s = DATA.SEED_BOOKS.find(b => b.title === p.title) || DATA.SEED_BOOKS[0];
        p.summary = `本书围绕「${(p.tags && p.tags[0]) || p.category}」展开，提出一套可落地的方法论，并用大量案例说明如何在真实场景中使用。`;
        p.themes = s.themes; p.quotes = s.quotes;
        p.audiences = s.audiences; p.pains = s.pains; p.hots = s.hots;
        addLog('l-warn', '  └ 未上传任何资料，本阶段使用内建演示数据');
      }
    }
  }

  function finish(p) {
    p.status = 'done'; p.progress = 100;
    const n = (p.videos || []).length;
    addLog('l-ok', `🎉 全流程完成：${p.titles.length} 个标题 / ${p.hooks.length} 个 Hook / ${(p.scripts || []).length} 篇稿子`);
    addLog('l-info', `📹 ${n} 支影片已列为「待生成」——到「内容资产库」逐支点「生成这一支」才会真的做出影片`);
    // 额度只在影片真的送去生成时才扣，这里不能预扣：现在一支影片都还没做。
    STORE.log('ok', `《${p.title}》稿子已全部产出（${(p.scripts || []).length} 篇），影片待逐支生成`);
    running = null; STORE.update(); emit('finish');
    UI.toast(`《${p.title}》稿子已写完，${n} 支影片待生成`, 'ok');
  }

  return { start, stop, resume, on, snapshot, get logs() { return logs; },
    get isRunning() { return !!running; }, get isPaused() { return paused; } };
})();

## STEP 1 · 上传书籍资料
**在做什么**：把书交给系统，并拆成可检索的小段落。
**为什么要拆**：这样后面 AI 引用某句话时，能精确告诉你出自第几章第几页——不是编的。
**你要做的**：拖文件进去，其余不用管。

## STEP 2 · AI 读完整本书
**在做什么**：像一个读得很快的编辑通读全书，找出这本书到底在讲什么、哪几句最有传播力、该讲给谁听。
**产出**：全书摘要、核心论点、30 条以上金句（都带页码）、读者画像、痛点清单、可匹配的热门话题。
**你要做的**：扫一眼摘要准不准。**觉得哪句金句可疑，点开能看到原文出处。**

## STEP 3 · 定营销策略
**在做什么**：同一本书，抖音和小红书要用完全不同的讲法。这一步决定每个平台发几支、什么调性、结尾怎么引导。
**产出**：八个平台各自的适配度评分、建议支数、时长、语气、引导语。
**你要做的**：看评分。某个平台你不打算做，后面不发就行。

## STEP 4 · AI 批量写稿
**在做什么**：不是写一篇，是一次写几十条备选。
**七种角度**：故事版（讲一个场景）、痛点版（戳最焦虑的事）、金句版（一句话立住观点）、商业版（拆方法论）、知识版（讲透一个概念）、书摘版（原文＋点评）、作者故事版（讲作者其人）。
**你要做的**：挑喜欢的，不喜欢的重生成单条。

## STEP 5 · 改写成本人口吻
**在做什么**：AI 写的稿子谁用都一样，一股机器味。这一步按本人平时的说话方式重写一遍。

具体改三样：
1. **说话方式**——书面语改口语、结论提前、长句拆短
2. **口头禅**——从词库里挑一句自然塞进去，每支最多 2 处（多了会腻）
3. **底线检查**——绝对化用语、乱承诺一律拦掉，再打一个「像不像本人」的分，低于 90 分退回重写

**举个例子**：
- 改写前：「本书提出了一个值得重视的观点：真正拉开差距的不是努力的总量。」
- 改写后：「**我讲得直白一点**，你不是时间不够，你是把时间花在了不产生复利的事情上。」

**你要做的**：去「数字人 · 声音 · 人格」页面调五个参数、加自己常说的话。这里就会照着改。

## STEP 6 · 数字人开口说话
**在做什么**：用本人的声音把稿子念出来，再让数字人形象对上口型——包括表情、眼神、手势。
**你要做的**：等着就行。

## STEP 7 · 自动剪辑包装
**在做什么**：相当于一个剪辑师。加字幕、插书封、金句变大字、配背景音乐、片尾加购买引导。
**你要做的**：想换风格就挑模板，不想要某个元素就去系统设置里关掉。

**你要做的**：导出文案包，或直接送进发布排程。

## 使用

**跑完一本书要多久？**
演示环境约 15 秒。真实环境从上传到 30 支成片，预计 2–4 小时（多支视频并发渲染）。

**生成的稿子能改吗？**
能。每条标题、Hook、脚本都可以人工编辑、锁定、或者只重生成这一条，不影响其他内容。

**一本书能出多少条？**
一次跑完是 30 支视频 + 20 标题 + 20 Hook + 14 篇脚本。不够可以再跑，每次角度和措辞都不一样。

**换一本新书，人格要重新设置吗？**
不用。人格模型是跟人走的，不是跟书走的。设一次，之后所有书都用同一套。

## 内容质量

**AI 会不会写错书里的内容、或者编造？**
系统强制要求每条金句必须能回溯到原文的具体页码，点开就能看出处。做不到溯源的内容不会被采用。

**生成的内容会不会跟别人撞车？**
每次生成都会换角度和措辞。但同类书的通用观点难免相似，所以数据分析里有「角度表现排行」——表现差的角度会自动降低下一轮的生成比重。

**为什么有的稿子被退回了？**
两种情况：一是「像不像本人」评分低于 90 分；二是命中了合规检查（绝对化用语、未证实的数据、医疗或投资承诺）。两种都会显示具体是哪一段有问题。

## 发布

**生成完会自动发出去吗？**
**不会。** 所有内容默认需要人工确认才发布。系统设置里有「生成后自动发布」开关，建议一直保持关闭——发布是收不回来的动作。

**为什么有的视频显示「待审核」？**
说明它还没走完审核流程。在发布排程里点确认就会进入发布队列。

**现在按「发布」是真的发出去了吗？**
**不是。** 目前只是把状态改成已发布，方便你验证流程。要真的送到平台，每个平台都要申请开发者帐号、通过应用审核、完成帐号授权，而且必须由服务端呼叫接口——浏览器做不到。
另外要有心理准备：**不是每个平台都能一键发布**。YouTube Shorts 门槛最低；抖音、TikTok、Meta 系需要审核；**小红书目前没有公开的发布接口**，只能人工上传。


**日历上怎么分辨发了没发？**
实心色块＝待发布，虚线外框加 ✓＝已发布；每格右上角还有「已发布/总数」。点任一条目可以预览、改标题、改平台与时间、立即发布或移出排程。

**平台会不会因为是 AI 生成而限流？**
有这个风险。所以系统默认在成片里加 AI 生成标识（很多平台和地区也强制要求），并且建议提高原创解读的比重、多平台分散发布。

## 数据

**数据分析里的数字是真的吗？**

**数据有什么用？**

## 其他

**忘了怎么用怎么办？**
点顶栏的「◎ 导览」，一分钟带你重看一遍。

**数据存在哪？**
演示版本存在你自己的浏览器里，换电脑就没了。系统设置里可以「重置演示数据」恢复初始状态。

# 名词解释

短视频行业的黑话不少，这里只解释系统里会出现的。

## 内容相关

**Hook（钩子）**
视频前 3 秒说的那句话。决定观众是继续看还是划走，是整支视频最关键的部分。所以系统一次生成 20 个备选。

**CTA**
Call To Action，行动引导。就是结尾那句「点击左下角购书链接」「评论区扣书单」。

**开场白**
Hook 之后的第一句自我介绍或场景引入，比如「我是⋯⋯，今天聊一本刚拿到的新书」。

**金句**
书里最适合单独拎出来传播的句子。通常短、有张力、能引起共鸣。

**脚本角度**
同一本书的七种讲法：故事版、痛点版、金句版、商业版、知识版、书摘版、作者故事版。**同一个观点换角度讲，能覆盖不同的人群。**

**分镜表**
一支视频拆成几个镜头，每个镜头讲什么、怎么运镜、画面上出现什么、持续几秒。点开任意脚本就能看到。

## 制作相关

**口型同步（Lip-sync）**
数字人说话时嘴型和声音对得上。误差超过 60 毫秒人眼就能看出「假」，系统控制在 40 毫秒以内。

**B-roll**
穿插在人物画面之间的辅助镜头（空镜、素材画面）。作用是让视频不那么单调，也方便遮掉剪辑点。

**人格一致性评分**
系统给改写后的稿子打分，衡量「像不像本人说的」。低于 90 分会被退回重写。

## 数据相关

**完播率**
看完整支视频的人占播放量的比例。短视频最重要的指标，直接影响平台推不推你。

**转化漏斗**
从曝光 → 播放 → 看完一半 → 互动 → 点击书链 → 下单，每一层会掉多少人。看哪一层掉得最狠，就知道该优化哪里。

**适配度评分**
系统判断这本书的内容在某个平台上表现会有多好，0–100 分。分数低的平台可以少做或不做。

**响度平衡（LUFS）**
让所有视频的音量听起来一样大，不会这支很吵下一支听不见。行业标准是 -14 LUFS。

  /* ---- 极简 Markdown 渲染 ---- */
  function render(md) {
    const lines = md.trim().split('\n');
    let out = '', inList = false, inOl = false, inCode = false, inTable = false;
    const inline = s => UI.esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');

    const closeList = () => { if (inList) { out += '</ul>'; inList = false; } if (inOl) { out += '</ol>'; inOl = false; } };
    const closeTable = () => { if (inTable) { out += '</tbody></table>'; inTable = false; } };

    for (let i = 0; i < lines.length; i++) {
      const L = lines[i];
      if (/^```/.test(L)) {
        if (!inCode) { closeList(); closeTable(); out += '<pre style="background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-x:auto;margin:12px 0"><code style="background:none;color:var(--txt-2);font-size:14px;line-height:1.7;white-space:pre">'; inCode = true; }
        else { out += '</code></pre>'; inCode = false; }
        continue;
      }
      if (inCode) { out += UI.esc(L) + '\n'; continue; }

      if (/^\|/.test(L)) {
        const cells = L.split('|').slice(1, -1).map(c => c.trim());
        if (/^\|[\s:\-|]+\|$/.test(L)) continue;
        if (!inTable) { closeList(); out += '<table><thead><tr>' + cells.map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>'; inTable = true; }
        else out += '<tr>' + cells.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>';
        continue;
      } else closeTable();

      if (/^### /.test(L)) { closeList(); out += `<h3>${inline(L.slice(4))}</h3>`; }
      else if (/^## /.test(L)) { closeList(); out += `<h2>${inline(L.slice(3))}</h2>`; }
      else if (/^# /.test(L)) { closeList(); out += `<h1>${inline(L.slice(2))}</h1>`; }
      else if (/^> /.test(L)) { closeList(); out += `<blockquote>${inline(L.slice(2))}</blockquote>`; }
      else if (/^---+$/.test(L)) { closeList(); out += '<hr>'; }
      else if (/^[-*] /.test(L)) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(L.slice(2))}</li>`; }
      else if (/^\d+\. /.test(L)) { if (!inOl) { out += '<ol>'; inOl = true; } out += `<li>${inline(L.replace(/^\d+\.\s/, ''))}</li>`; }
      else if (L.trim() === '') closeList();
      else { closeList(); out += `<p>${inline(L)}</p>`; }
    }
    closeList(); closeTable();
    return out;
  }

  return {

    return `<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer" data-act="open-proj" data-id="${p.id}">
      <div style="width:42px;height:56px;border-radius:8px;background:${p.cover};flex:0 0 42px"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:650;font-size:15.5px">《${esc(p.title)}》</div>
        <div style="font-size:13.5px;color:var(--txt-3)">${esc(p.author)} · ${esc(p.publisher)} · ${(p.videos || []).length} 支视频</div>
        <div class="bar" style="margin-top:7px"><i style="width:${p.progress}%"></i></div>
      </div>
      <div style="text-align:right">${statusTag(p.status)}<div style="font-size:13px;color:var(--txt-3);margin-top:5px">${p.progress}%</div></div>
    </div>`;
  }

  function timeAgo(t) {
    const d = Date.now() - t, h = Math.floor(d / 3600e3);
    if (h < 1) return Math.max(1, Math.floor(d / 60e3)) + ' 分钟前';
    if (h < 24) return h + ' 小时前';
    return Math.floor(h / 24) + ' 天前';
  }

  /* =======================================================
   * 书籍项目
   * ===================================================== */
  VIEWS.projects = function (q) {
    const filter = (q && q.f) || 'all';
    let list = STORE.s.projects;
    if (filter !== 'all') list = list.filter(p => p.status === filter);
    const kw = (UI.$('#global-search') || {}).value || '';
    if (kw) list = list.filter(p => (p.title + p.author + p.publisher).indexOf(kw) >= 0);

    return `
    <div class="page-h">
      <div><div class="page-t">书籍项目</div><div class="page-d">每一本书都是一条独立的内容生产线</div></div>
      <div class="right">
        <div class="seg" data-seg="proj-filter">
          ${[['all', '全部'], ['producing', '生产中'], ['ready', '待生产'], ['done', '已完成'], ['draft', '草稿']]
            .map(x => `<button data-v="${x[0]}" class="${filter === x[0] ? 'on' : ''}">${x[1]}</button>`).join('')}
        </div>
        <button class="btn btn-primary" data-act="new-proj">＋ 新建项目</button>
      </div>
    </div>

    ${list.length ? `<div class="grid g3">${list.map(p => `
      <div class="book-card" data-act="open-proj" data-id="${p.id}">
        <div class="book-cover" style="background:${p.cover}">
          <div class="st">${statusTag(p.status)}</div>
          ${/* 删除钮放左上、跟状态标签分开，避免手滑点错。
                不加 stopPropagation：事件分发走 document 层的 closest('[data-act]')，
                内层按钮本来就会优先命中。 */''}
          <button class="book-del" data-act="del-proj" data-id="${p.id}" title="删除这本书">✕</button>
          <div class="bt">《${esc(p.title)}》</div>
        </div>
        <div class="book-b">
          <div class="book-meta">${esc(p.author)} 著 · ${esc(p.publisher)}</div>
          <div class="chip-list">${(p.tags || []).slice(0, 3).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
          <div style="font-size:14px;color:var(--txt-3);line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(p.summary || '尚未进行 AI 阅读，上传资料后即可自动生成解读。')}</div>
          <div class="book-stats">
            <div class="bs"><b>${(p.videos || []).length}</b>视频</div>
            <div class="bs"><b>${(p.scripts || []).length}</b>脚本</div>
            <div class="bs"><b>${(p.titles || []).length}</b>标题</div>
            <div class="bs" style="margin-left:auto"><b>${p.progress}%</b>进度</div>
          </div>
        </div>
      </div>`).join('')}</div>`
      : `<div class="card empty"><div class="big">▤</div><div>暂无符合条件的项目</div>
         <div style="margin-top:14px"><button class="btn btn-primary" data-act="new-proj">＋ 新建书籍项目</button></div></div>`}`;
  };

  /* 「接下来该做什么」。
   * 使用者最常卡住的地方是：八个步骤平铺在上面，跑完了也不知道该看哪、该去哪。
   * 这里按专案的实际状态，只给一个明确的下一步和一颗按钮，不给选择题。 */
  function nextStepCard(p) {
    const vs = p.videos || [];
    const pa = STORE.s.persona;
    const hasMaterial = (p.materials || []).length > 0;
    const hasScript = (p.scripts || []).length > 0;
    const pending = vs.filter(v => !v.demo && v.status === '待生成').length;
    const making = vs.filter(v => v.status === '生成中').length;
    const made = vs.filter(v => v.videoUrl).length;
    const avatarOk = pa.realAvatarMode === 'image' ? !!pa.realPhotoAssetId : !!pa.realAvatarId;
    const voiceOk = !!pa.realVoiceId;

    let s;
    if (ENGINE.isRunning) return '';                    // 正在跑，日志区已经在讲话了
    if (!hasMaterial) {
      s = { t: '先把书的资料传进来', d: '在下面 STEP 1 把书籍档案、内文档拖进上传区。不传也能跑，但产出的会是内建演示内容，不是你这本书的。',
        b: '去 STEP 1 上传', act: 'sel-stage', k: 'upload' };
    } else if (!hasScript) {
      s = { t: '可以开始跑了', d: '资料已经在了。点「一键跑完整流程」，AI 会真的读这本书、真的写稿，大约几十秒。',
        b: '▶ 一键跑完整流程', act: 'run-all' };
    } else if (!avatarOk || !voiceOk) {
      s = { t: '选一个数字人和声音', d: `稿子已经写好 ${(p.scripts || []).length} 篇了。影片里出现的那张脸和那个声音要先选好，才做得出影片。目前${!avatarOk ? '形象' : '声音'}还没选。`,
        b: '去选形象和声音', act: 'goto', k: 'persona' };
    } else if (making) {
      s = { t: `有 ${making} 支正在生成中`, d: '通常 1-3 分钟。可以先去做别的，好了会自己更新，不用守着。',
        b: '去内容资产库看进度', act: 'goto', k: 'library' };
    } else if (pending) {
      s = { t: `${pending} 支影片等你决定要不要做`, d: `稿子都写好了，但影片还没做——真的做要送去数字人服务，一支约 US$1-3、等 1-3 分钟，所以由你挑。到资产库点想做的那一支。`,
        b: '去内容资产库生成影片', act: 'goto', k: 'library' };
    } else if (made) {
      s = { t: `已经做好 ${made} 支真影片`, d: '可以下载，或排进发布排程。发布之后平台回传的数据才会出现在「数据分析」。',
        b: '去内容资产库看影片', act: 'goto', k: 'library' };
    } else {
      s = { t: '这本书的流程走完了', d: '产出的文案素材都在内容资产库里。',
        b: '去内容资产库', act: 'goto', k: 'library' };
    }

    const attr = s.act === 'sel-stage' ? `data-act="sel-stage" data-k="${s.k}"`
      : s.act === 'goto' ? `data-act="goto" data-route="${s.k}"` : `data-act="${s.act}"`;
    return `
      <div class="card" style="margin-bottom:16px;border-color:var(--violet);background:linear-gradient(180deg,rgba(124,108,255,.09),transparent)">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <div style="flex:1;min-width:240px">
            <div style="font-size:13px;color:var(--violet-2);font-weight:700;letter-spacing:1px">接下来该做什么</div>
            <div style="font-size:19px;font-weight:750;margin:5px 0 6px">${esc(s.t)}</div>
            <div style="font-size:15px;color:var(--txt-2);line-height:1.75">${s.d}</div>
          </div>
          <button class="btn btn-primary" style="font-size:15px;padding:11px 20px" ${attr}>${esc(s.b)}</button>
        </div>
      </div>`;
  }

  /* =======================================================
   * 生产流水线
   * ===================================================== */
  VIEWS.pipeline = function (q) {
    const p = STORE.current;
    if (!p) return '<div class="card empty">请先创建书籍项目</div>';
    const stages = p.stages || DATA.STAGES.map(s => ({ key: s.key, state: 'todo' }));
    const activeKey = (q && q.s) || (stages.find(s => s.state === 'run') || {}).key ||
      (stages.filter(s => s.state === 'done').slice(-1)[0] || {}).key || 'upload';
    const doneCount = stages.filter(s => s.state === 'done').length;
    const pct = Math.round(doneCount / DATA.STAGES.length * 100);

    return `
    <div class="page-h">
      <div><div class="page-t">生产流水线</div>
        <div class="page-d">当前项目：《${esc(p.title)}》 · ${esc(p.author)} 著 · ${esc(p.publisher)}</div></div>
      <div class="right">
        <select class="input" style="width:190px" data-act="switch-proj">
          ${STORE.s.projects.map(x => `<option value="${x.id}" ${x.id === p.id ? 'selected' : ''}>《${esc(x.title)}》</option>`).join('')}
        </select>
        <button class="btn" data-act="goto" data-route="creative">✦ 设计创意分镜</button>
        <span class="tag ${(window.AIREAL && AIREAL.canUse()) ? 'g' : 'a'}" title="STEP 2 读书与 STEP 4 写稿是否真的呼叫大模型">
          ${(window.AIREAL && AIREAL.canUse()) ? '真实 AI 已开' : '模板模式'}
        </span>
        ${ENGINE.isRunning
          ? `<button class="btn" data-act="stop-run">■ 中止任务</button>`
          : `<button class="btn btn-primary" data-act="run-all">▶ 一键跑完整流程</button>`}
      </div>
    </div>

    ${nextStepCard(p)}

    ${ENGINE.isPaused ? (() => {
      const pa = STORE.s.persona;
      const pool = DATA.sceneTemplateLibrary ? DATA.sceneTemplateLibrary() : [];
      const sceneNames = (p.sceneIds || []).map(id => (pool.find(x => x.id === id) || {}).name).filter(Boolean);
      const avatarLabel = pa.realAvatarMode === 'image'
        ? '你上传的照片' : (pa.realAvatarName || '（尚未选择）');
      return `
      <div class="card" style="margin-bottom:16px;border-color:var(--violet-2)">
        <div class="card-h"><div><div class="card-t">⏸ 已暂停 —— 请确认这批影片要怎么生成</div>
            <div class="card-s">下一步就会产出成片，形象、声音、场景到时候改就得整批重跑，先在这里确认</div></div></div>
        <div class="grid g3" style="margin-bottom:14px">
          ${[['数字人形象', avatarLabel, 'persona'],
             ['声音', pa.realVoiceName || '（尚未选择）', 'persona'],
             ['拍摄场景', sceneNames.length ? sceneNames.join('、') : '（未选，系统自动配）', 'creative']]
            .map(x => `<div style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px">
              <div style="font-size:13.5px;color:var(--txt-3)">${x[0]}</div>
              <div style="font-size:16px;font-weight:700;margin:4px 0 8px">${esc(x[1])}</div>
              <button class="btn btn-sm" data-act="goto" data-route="${x[2]}">去修改</button>
            </div>`).join('')}
        </div>
        <div style="display:flex;gap:9px">
          <button class="btn btn-primary" data-act="resume-run">✓ 确认，继续生成</button>
          <button class="btn" data-act="stop-run">■ 中止</button>
        </div>
        <div class="hint" style="margin-top:10px">去修改设定后回到这一页，这里会一直等你，不会自己跑掉。</div>
      </div>`;
    })() : ''}

    <div class="pipe">${DATA.STAGES.map((st, i) => {
      const s = stages[i] || { state: 'todo' };
      /* 出错的那一步必须看得出来。以前只有 done/run/todo 三种，
       * 一旦某步出错也照样显示「已完成」，产出却是空的——状态跟事实对不上。 */
      const ico = s.state === 'done' ? '<i class="dot g"></i>已完成'
        : s.state === 'run' ? '<i class="dot v"></i>执行中'
          : s.state === 'error' ? '<i class="dot r"></i>出错了'
            : '<i class="dot"></i>待执行';
      return `<div class="pstep ${s.state} ${activeKey === st.key ? 'on' : ''}" data-act="sel-stage" data-k="${st.key}">
        <div class="pn">${st.n}</div><div class="pt">${st.t}</div><div class="ps">${ico}</div></div>`;
    }).join('')}</div>

    <div class="grid g-2-1" style="margin-top:16px">
      <div>${stagePanel(p, activeKey)}</div>
      <div class="card">
        <div class="card-h"><div class="card-t">总体进度</div></div>
        <div style="display:flex;gap:18px;align-items:center">
          ${CHART.ring(pct)}
          <div style="flex:1;font-size:14.5px;line-height:2">
            <div>已完成阶段 <b>${doneCount}/8</b></div>
            <div>产出脚本 <b>${(p.scripts || []).length}</b> 篇</div>
            <div>产出视频 <b>${(p.videos || []).length}</b> 支</div>
            <div>预计剩余 <b>${ENGINE.isRunning ? Math.max(1, (8 - doneCount) * 3) + ' 分钟' : '—'}</b></div>
          </div>
        </div>
        <div class="card-h" style="margin:20px 0 12px"><div class="card-t">实时执行日志</div>
          <div class="right"><span class="tag ${ENGINE.isRunning ? 'g' : ''}"><i class="dot ${ENGINE.isRunning ? 'g' : ''}"></i>${ENGINE.isRunning ? '运行中' : '空闲'}</span></div></div>
        <div class="log" id="run-log">${ENGINE.logs.length
          ? ENGINE.logs.map(l => `<div class="${l.cls}">[${l.ts}] ${esc(l.text)}</div>`).join('')
          : '<div class="l-info">等待任务启动…<br>点击右上角「一键跑完整流程」开始。</div>'}</div>
      </div>
    </div>`;
  };

  function stagePanel(p, key) {
    const st = DATA.STAGES.find(s => s.key === key) || DATA.STAGES[0];
    const head = `<div class="card-h"><div><div class="card-t">${st.n} · ${st.t}</div><div class="card-s">${st.d}</div></div>
      <div class="right"><button class="btn btn-sm" data-act="run-stage" data-k="${st.key}">▶ 单独执行此阶段</button></div></div>
      <div class="explain">
        <div class="ex-r"><span class="ex-k">这一步在做什么</span><span>${st.why}</span></div>
        <div class="ex-r"><span class="ex-k">你需要做什么</span><span>${st.you}</span></div>
        <div class="ex-r"><span class="ex-k">这一步产出</span><span>${st.out}</span></div>
      </div>`;
    const body = {
      upload: () => {
        const ms = p.materials || [];
        const ico = t => ({ '书籍档案': '🗂', '内文': '📃', 'PDF': '📕', '图片': '🖼', '简报': '📊', '电子书': '📘' }[t] || '📄');
        const st = s => s === '已汇入' || s === '已解析' ? 'g' : s === '待服务端解析' ? 'a' : s === '格式错误' || s === '读取失败' ? 'r' : '';
        return `
        <div class="drop" data-act="pick-file"><div class="di">⬆</div>
          <div style="font-weight:650;margin-top:8px">点击选择档案，或直接把档案拖进来</div>
          <div class="hint" style="margin-top:5px">JSON 书籍档案会被完整读取；TXT / MD 内文会在本机解析；PDF / 图片等记录后交由服务端处理</div></div>

        ${ms.length ? `<div style="margin-top:14px">${ms.map(m => `
          <div class="file-item"><div class="file-ico">${ico(m.type)}</div>
            <div style="flex:1;min-width:0">
              <div style="font-size:15px;font-weight:600">${esc(m.name)}</div>
              <div style="font-size:13px;color:var(--txt-3)">${esc(m.type)} · ${esc(m.size)}${m.note ? ' · ' + esc(m.note) : ''}</div></div>
            <span class="tag ${st(m.status)}"><i class="dot ${st(m.status)}"></i>${esc(m.status)}</span></div>`).join('')}
          <div style="margin-top:10px"><button class="btn btn-sm" data-act="clear-files">清空已上传资料</button></div></div>`
          : `<div class="hint" style="margin-top:14px">尚未上传任何资料。未上传时，后续步骤会使用内建的演示数据。</div>`}

        ${p.source && p.source.kind === 'profile' ? `
          <div class="explain" style="margin-top:16px;border-left-color:var(--green)">
            <div class="ex-r"><span class="ex-k">资料来源</span><span>已汇入完整书籍档案，后续每一步都会使用<b>这本书的真实内容</b>，不再套用演示数据。</span></div>
            <div class="ex-r"><span class="ex-k">已读取</span><span>${(p.themes || []).length} 条核心论点 · ${(p.quoteSrc || []).length} 条金句（含章节页码） · ${(p.audiences || []).length} 类读者画像 · ${(p.toc || []).length} 章目录 · 全书 ${(p.words || 0).toLocaleString()} 字</span></div>
          </div>` : ''}

        ${p.parsed ? `
          <div class="label" style="margin-top:18px">内文本地解析结果<span class="hint" style="margin-left:8px;font-weight:400">纯规则抽取，不是 AI 阅读</span></div>
          <div class="grid g3" style="margin-bottom:12px">
            ${[['中文字数', p.parsed.chars.toLocaleString()], ['章节标题', p.parsed.chapters.length], ['候选金句', p.parsed.quotes.length]]
              .map(x => `<div style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center">
                <div style="font-size:20.5px;font-weight:750">${x[1]}</div><div style="font-size:13px;color:var(--txt-3);margin-top:3px">${x[0]}</div></div>`).join('')}
          </div>
          <div class="chip-list">${p.parsed.chapters.slice(0, 8).map(c => `<span class="tag c">${esc(c)}</span>`).join('')}</div>` : ''}`;
      },

      read: () => p.summary ? `
        <div class="explain" style="border-left-color:${p.source && p.source.kind === 'profile' ? 'var(--green)' : 'var(--amber)'}">
          <div class="ex-r"><span class="ex-k">资料来源</span><span>${p.source && p.source.kind === 'profile'
            ? '来自你上传的书籍档案，以下内容全部出自这本书'
            : p.source && p.source.kind === 'text'
              ? '来自你上传的内文，由本机规则抽取（非 AI 阅读）'
              : '未上传资料，以下为内建演示数据'}</span></div>
        </div>
        <div class="field"><div class="label">全书摘要</div>
          <div style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:14px;line-height:1.85;font-size:15.5px">${esc(p.summary)}</div></div>
        <div class="row2">
          <div><div class="label">核心论点</div>${(p.themes || []).map((t, i) => `
            <div style="display:flex;gap:9px;padding:8px 0;font-size:15px"><b style="color:var(--violet-2)">0${i + 1}</b><span>${esc(t)}</span></div>`).join('')}</div>
          <div><div class="label">目标读者画像</div>${(p.audiences || []).map(a => `
            <div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:14.5px">
              <span>${esc(a.name)}</span><b>${a.size}%</b></div>
              <div class="bar" style="margin-top:4px"><i style="width:${a.size * 2.2}%"></i></div>
              <div style="font-size:13px;color:var(--txt-3);margin-top:3px">${esc(a.note)}</div></div>`).join('')}</div>
        </div>
        <div class="field" style="margin-top:6px"><div class="label">高传播金句${(p.quoteSrc || []).length ? '（可溯源）' : ''}</div>
          ${((p.quoteSrc && p.quoteSrc.length) ? p.quoteSrc : (p.quotes || []).map(t => ({ text: t }))).map((q, i) => `
            <div class="copy-item" style="margin-bottom:8px">
              <div class="ci-h"><span class="ci-n">Q${String(i + 1).padStart(2, '0')}</span>
                ${q.chapter ? `<span class="tag v">第 ${q.chapter} 章 · P${q.page}</span>` : '<span class="tag">未标注出处</span>'}
                <span class="ci-a"><button class="btn btn-sm" data-act="copy" data-t="${esc(q.text)}">复制</button></span></div>
              <div class="copy-txt">${esc(q.text)}</div></div>`).join('')}</div>
        <div class="row2">
          <div><div class="label">读者痛点</div><div class="chip-list">${(p.pains || []).map(x => `<span class="tag r">${esc(x)}</span>`).join('')}</div></div>
          <div><div class="label">可匹配热点话题</div><div class="chip-list">${(p.hots || []).map(x => `<span class="tag c">${esc(x)}</span>`).join('')}</div></div>
        </div>`
        : emptyStage('尚未执行 AI 阅读', '执行本阶段后，系统会输出摘要、核心论点、金句、受众画像与可传播内容单元。'),

      strategy: () => p.strategy ? `
        <div class="field"><div class="label">内容定位</div>

  function emptyStage(t, d) {

  /* 注意：卡片里的「生成这一支」按钮不要加 stopPropagation。

   * 挡掉冒泡反而让事件到不了监听器，按钮会完全没反应。 */
  window.vidCard = function (v) {
    const live = v.status === '已发布';
    const done = v.status === '已生成' && v.videoUrl;
    /* 卡片上必须一眼看得出这支「到底存不存在」：
     * 已生成 = 真的有影片档；待生成 = 只有稿子；演示数据 = 假的。
     * 以前全部长一样，才会让人以为跑完流程就有 30 支真影片。 */
    const format = v.format || defaultVideoMode();
    const badge = v.demo ? '<span class="plat" style="background:#f59e0bcc;left:auto;right:8px">演示假数据</span>'
      : done ? '<span class="plat" style="background:#2ee6a8cc;left:auto;right:8px">真影片</span>'
        : v.status === '生成中' ? '<span class="plat" style="background:#f59e0bcc;left:auto;right:8px">生成中…</span>'
          : v.status === '生成失败' ? '<span class="plat" style="background:#ef4444cc;left:auto;right:8px">失败</span>'
            : '<span class="plat" style="background:#6b7280cc;left:auto;right:8px">还没做</span>';
    return `<div class="vid" data-act="play" data-id="${v.id}">
      <div class="vid-th" style="background:${v.cover}">
        <span class="plat" style="background:${v.color}cc">${v.platformName}</span>
        ${badge}
        <span class="dur">${v.duration}s</span>
        <div class="vid-play"><span>${done ? '▶' : '✎'}</span></div>
        <div></div><div class="vid-cap">${esc(v.caption)}</div>
      </div>
      <div class="vid-b">
        <div class="vid-tt">${esc(v.title)}</div>
        <div class="vid-m"><span>${v.angle}</span><span>${v.ratio}</span><span>${format === 'conversation' ? '访谈式对谈 · ' + DATA.interviewFormat(STORE.s.persona.interviewFormat).name : '单人口播'}</span></div>
        <div class="vid-m" style="align-items:center;gap:8px">
          <span>形式</span>
          <select class="input" data-act="video-format" data-id="${v.id}" style="flex:1;padding:6px 8px;border-radius:9px">
            <option value="single" ${format !== 'conversation' ? 'selected' : ''}>单人口播</option>
            <option value="conversation" ${format === 'conversation' ? 'selected' : ''}>访谈式对谈</option>

        </div>

          <span>片长</span>

          <span>秒</span>
        </div>
        <div class="vid-m">${live && v.demo
          ? `<span style="color:var(--amber)">▶ ${nf(v.views)}（假）</span><span style="color:var(--amber)">完播 ${v.watch}%（假）</span>`

            : v.status === '待生成' ? '<span style="color:var(--txt-3)">只有稿子，影片还没做</span>'
              : `<span style="color:var(--txt-3)">${esc(v.status)}</span>`}</div>
        ${!v.demo && (v.status === '待生成' || v.status === '生成失败')

  /* =======================================================

  VIEWS.library = function (q) {
    const p = STORE.current;
    const tab = (q && q.t) || 'video';

          <div style="font-weight:650;font-size:15.5px;margin-bottom:6px">${esc(s.title)}</div>

  VIEWS.analytics = function (q) {
    const scope = (q && q.sc) || 'all';
    const ps = STORE.s.projects;
    const videos = scope === 'all' ? ps.reduce((a, p) => a.concat(p.videos || []), []) : (STORE.current.videos || []);
    const an = DATA.genAnalytics(videos);
    /* 统计只能算已发布的：没发布的影片不可能有数据 */
    const live = videos.filter(v => v.status === '已发布');

    /* 按角度聚合 */
    const byAngle = DATA.ANGLES.map(a => {
      const vs = live.filter(v => v.angle === a.name);
      const views = vs.reduce((x, v) => x + v.views, 0);
      const watch = vs.length ? Math.round(vs.reduce((x, v) => x + v.watch, 0) / vs.length) : 0;
      return { name: a.name, color: a.color, value: views, count: vs.length, watch };
    }).filter(x => x.count).sort((a, b) => b.value - a.value);

    const top = live.slice().sort((a, b) => b.views - a.views).slice(0, 6);
    const totalLike = live.reduce((a, v) => a + v.like, 0);
    const totalShare = live.reduce((a, v) => a + v.share, 0);
    const totalClick = live.reduce((a, v) => a + v.click, 0);
    const avgWatch = live.length ? Math.round(live.reduce((a, v) => a + v.watch, 0) / live.length) : 0;

    /* 这一页的数据全部来自 video 物件上的 views / like / watch 等栏位，
     * 而那些栏位目前只有内建示范书才有值（而且是随机造的）。
     * 真实产出的影片一律是 0，因为没有真的发布到任何平台、也没有平台回传数据。
     * 所以必须先算清楚「这页现在显示的到底是真是假」，摆在最上面讲明白。 */
    const demoLive = live.filter(v => v.demo).length;
    const allDemo = live.length > 0 && demoLive === live.length;

    return `
    <div class="page-h">
      <div><div class="page-t">数据分析</div>
        <div class="page-d">${allDemo ? '目前显示的是内建示范书的模拟数据' : '统计已发布影片的实际表现'}</div></div>
      <div class="right">
        <div class="seg" data-seg="ana-scope">
          <button data-v="all" class="${scope === 'all' ? 'on' : ''}">全部项目</button>
          <button data-v="cur" class="${scope === 'cur' ? 'on' : ''}">《${esc(STORE.current.title)}》</button>
        </div>
        <button class="btn" data-act="export-report">⬇ 导出数据报告</button>
      </div>
    </div>

    ${live.length === 0
      ? `<div class="explain" style="margin-bottom:16px;border-left-color:var(--amber)">
           <div class="ex-r"><span class="ex-k">这页现在是空的</span><span>共 <b>${videos.length}</b> 支影片，<b>一支都还没发布</b>，所以没有任何数据。</span></div>
           <div class="ex-r"><span class="ex-k">数据从哪来</span><span>影片要先<b>真的生成出来</b>（在内容资产库逐支生成），再<b>真的发布到平台</b>，平台回传之后这里才会有数字。</span></div>
           <div class="ex-r"><span class="ex-k">下面的图</span><span>下面的折线、圆饼、漏斗<b>全是示意用的假图</b>，不代表任何真实表现。</span></div>
         </div>`
      : allDemo
        ? `<div class="explain" style="margin-bottom:16px;border-left-color:var(--amber)">
             <div class="ex-r"><span class="ex-k" style="color:var(--amber)">⚠ 全部是假数据</span><span>
               这页现在显示的 <b>${live.length}</b> 支「已发布」影片，<b>全部来自内建示范书</b>，
               播放量、完播率、按赞、转化漏斗<b>都是随机产生的假数字</b>，不是真实表现。</span></div>
             <div class="ex-r"><span class="ex-k">怎么看到真的</span><span>自己建一本书跑完流程 → 在资产库逐支生成影片 → 发布到平台，之后这里才会出现真数据。</span></div>
           </div>`
        : `<div class="explain" style="margin-bottom:16px;border-left-color:var(--cyan)">
             <div class="ex-r"><span class="ex-k">统计范围</span><span>共 <b>${videos.length}</b> 支影片，已发布 <b>${live.length}</b> 支${demoLive ? `，其中 <b style="color:var(--amber)">${demoLive} 支是示范书的假数据</b>` : ''}。</span></div>
           </div>`}

    ${live.length ? '' : `<div class="card empty" style="margin-bottom:16px"><div class="big">◷</div>
      <div style="font-weight:650;color:var(--txt-2)">这个范围内还没有任何影片发布</div>
      <div style="margin-top:6px;font-size:14.5px">到「发布排程」发布之后，数据才会开始累积。</div></div>`}

    <div class="grid g4" style="margin-bottom:16px">
      ${[['总播放量', nf(an.total), '已发布 ' + live.length + ' 支', ''],
         ['平均完播率', avgWatch + '%', avgWatch >= 35 ? '优于均值' : '待优化', avgWatch < 30 ? 'down' : ''],
         ['总互动量', nf(totalLike + totalShare), '点赞 ' + nf(totalLike) + ' · 分享 ' + nf(totalShare), ''],
         ['书链点击', nf(totalClick), '点击率 ' + ((totalClick / (an.total || 1)) * 100).toFixed(2) + '%', '']]
        .map(x => `<div class="kpi"><div class="kpi-l">${x[0]}</div><div class="kpi-v">${x[1]}</div>
          <div class="kpi-d ${x[3]}">${x[2]}</div></div>`).join('')}
    </div>

    <div class="grid g-2-1" style="margin-bottom:16px">
      <div class="card">
        <div class="card-h"><div><div class="card-t">播放与互动趋势</div><div class="card-s">近 7 日</div></div></div>
        ${CHART.line(an.days)}
      </div>
      <div class="card">
        <div class="card-h"><div class="card-t">转化漏斗</div></div>
        ${CHART.funnel(an.funnel)}
        <div class="hint" style="margin-top:12px">从曝光到下单的整体转化率约 ${((an.funnel[5].v / an.funnel[0].v) * 100).toFixed(3)}%，主要流失在「播放 → 看完 50%」，建议优化前 3 秒 Hook。</div>
      </div>
    </div>

    <div class="grid g2" style="margin-bottom:16px">

        <table><thead><tr><th>角度</th><th>支数</th><th>总播放</th><th>完播率</th></tr></thead><tbody>
          ${byAngle.map(a => `<tr><td><span class="tag" style="color:${a.color}">${a.name}</span></td>
            <td>${a.count}</td><td>${nf(a.value)}</td><td>${scoreBar(a.watch)}</td></tr>`).join('')}

    <div class="card">
      <div class="card-h"><div><div class="card-t">表现最好的内容</div><div class="card-s">系统会自动分析这些内容的共性并写回提示词</div></div></div>

 *     接上真实的数字人生成或真实收款。

 *     繁体由 i18n.js 在渲染时统一转换，源码不该手写繁体。

(function () {
  const { esc } = UI;

  /* =======================================================

  VIEWS.creative = function () {

          </div>

      : `<div class="hint" style="padding:16px;text-align:center;background:var(--panel-2);border-radius:12px">

         </div>`}
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-h"><div><div class="card-t">画面风格参考样片</div>

`;
  };

  /* =======================================================
   * 书中角色 —— 让书里的主角走进影片

   * 现在所有影片都是同一个形式：一个人对着镜头讲。这一段做的是另一件事：
   * 从书里把人物读出来，生成这个角色长什么样，再让他真的出现在画面里，
   * 把「讲这本书」变成「演这本书」。

   *   2. 生成定妆照，先看长相对不对，不对就改外貌描述重生成
   *   3. 一键把角色写成影片提示词，落到下面那张卡直接生成短片

   * 不另外开一条会花钱的新路径。

  function characterCard(p) {
    const list = Array.isArray(p.characters) ? p.characters : [];

    return `
    <div class="card" style="margin-bottom:18px;border-color:var(--violet)">

          这里是把书里的<b>角色</b>做出来，让他自己出现在画面里，从「讲这本书」变成「演这本书」。</span></div>
        <div class="ex-r"><span class="ex-k">为什么值得做</span><span>三十支影片如果都是同一张脸对镜头讲，平台会判定为批量生产的低质内容；
          有了角色与场景，每支影片天然长得不一样。小说、传记、历史、儿童书这些品类也才做得动。</span></div>
        <div class="ex-r"><span class="ex-k">怎么用</span><span>①让 AI 读出角色 → ②生成定妆照，长相不对就改描述重生成 → ③写成影片提示词，

      ${list.length ? `<div class="grid g3">${list.map((c, i) => characterItem(c, i)).join('')}</div>`

           还没有角色。按上面「让 AI 从书里读出角色」最快；非虚构的书也可以，AI 会抽出书里出现的真实人物、案例主角或典型读者。
         </div>`}
    </div>
`;
  }

  function characterItem(c, i) {
    return `
    <div class="card" style="background:var(--panel-2);margin:0">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">

        <b data-act="del-char" data-i="${i}" style="cursor:pointer;opacity:.55;padding:0 6px">✕</b>
      </div>

      <div class="char-portrait" data-for="${i}">${c.portraitUrl
        ? `<img src="${esc(c.portraitUrl)}" style="width:100%;border-radius:10px;margin-bottom:10px">`
        : `<div class="hint" style="background:var(--panel);border:1px dashed var(--line);border-radius:10px;
             padding:22px 10px;text-align:center;margin-bottom:10px">还没有定妆照</div>`}</div>

      <div class="field" style="margin-bottom:8px"><div class="label">名字</div>
        <input class="input" data-act="edit-char" data-i="${i}" data-k="name" value="${esc(c.name || '')}" placeholder="角色的名字"></div>
      <div class="field" style="margin-bottom:8px"><div class="label">身份 / 在书里是谁</div>
        <input class="input" data-act="edit-char" data-i="${i}" data-k="role" value="${esc(c.role || '')}" placeholder="例如：书中的年轻工程师、作者本人、故事的叙述者"></div>
      <div class="field" style="margin-bottom:8px"><div class="label">长什么样<span class="hint" style="margin-left:8px;font-weight:400">长相不对就改这里再生成一次</span></div>
        <textarea class="input" data-act="edit-char" data-i="${i}" data-k="look" rows="3"

      <div class="field" style="margin-bottom:10px"><div class="label">代表场景</div>

      <div style="display:flex;gap:9px;flex-wrap:wrap">

        <button class="btn btn-sm btn-primary" data-act="char-to-prompt" data-i="${i}">让他走进影片 →</button>
      </div>
      <div class="hint" style="margin-top:8px">定妆照约 US$0.03-0.07 一张；「让他走进影片」只是写成提示词，还不会扣影片额度。</div>
    </div>`;
  }

  function creativeSamples() {

/* ============================================================
 * tour.js — 新手导览（聚光灯式分步引导）
 *   首次打开自动启动；顶栏「导览」按钮可随时重看
 * ========================================================== */
window.TOUR = (function () {

  const OWNER = () => (window.STORE && STORE.s.account && STORE.s.account.name) || '主理人';

  const STEPS = [
    {
      center: true, route: 'dashboard',
      title: '欢迎使用书影 BookReel',
      text: '这是一套把「一本书」变成「几十支短影音」的内容生产系统。<br><br>' +
            '左边的顺序就是实际的做事顺序：<b>先到「数字人 / 声音 / 克隆」选形象和声音 → 上传一本新书 → 一键生成短影音 → 挑素材 → 发布</b>。<br><br>' +
            '<b>接下来 9 步，大约 1 分钟，带你走一遍。</b>',
      note: '演示原型：介面与流程是真实设计，影片与数据为模拟生成。'
    },
    {
      route: 'persona', sel: '.card', centerPop: true,
      title: '第一步：选数字人形象和声音',
      text: '位置在左侧选单：<b>先设定一次 → 数字人 / 声音 / 克隆</b>。<br><br>' +
            '<b>这一步要在生成之前做</b>，否则生成完才发现脸或口吻不对，整批要重跑。<br><br>' +
            '先选 <b>数字人形象</b>，再选 <b>声音</b>。三种声音来源：<br>' +
            '<b>本人克隆声</b>——用本人录音训练，最像本人<br>' +
            '<b>配音员声库</b>——挑一个专业音色，立刻可用<br>' +
            '<b>系统合成音</b>——免费但生硬，不建议正式用<br><br>' +
            '下面还能调语速、亲和度、口头禅与禁语。'
    },
    {
      route: 'projects', sel: '.book-card',
      title: '第二步：上传一本新书',
      text: '每一本书是一条独立生产线，互不干扰。<br><br>' +
            '进去之后可以直接把 <b>PDF、书封、目录、宣传稿</b>拖进来。' +
            '资料越全，后面写出来的稿子越准。<br><br>' +
            '卡片上能看到这本书已经产出多少影片、脚本和标题。'
    },
    {
      route: 'pipeline', sel: '.pipe',
      title: '生产流水线怎么看',
      text: '这是系统的核心。从上传资料到多平台输出，一共八步。<br><br>' +
            '<b>点任意一步</b>，下面会用大白话说清楚：这一步在做什么、你需要做什么、会产出什么。<br><br>' +
            '绿点＝已完成，紫点＝执行中，灰点＝待执行。'
    },
    {
      route: 'pipeline', sel: '[data-act="run-all"], [data-act="stop-run"]',
      title: '第三步：一键生成短影音',
      text: '点下去，系统自动依序跑完八步，大约 15 秒。<br><br>' +
            '右侧会实时滚动执行日志，跑完产出 <b>30 支影片、14 篇脚本、20 个标题、20 个 Hook</b>。<br><br>' +
            '<b>导览结束后第一件事就试试它。</b>'
    },
    {
      route: 'library', sel: '[data-seg="lib-tab"]',
      title: '第四步：挑素材',
      text: '影片、脚本、标题、Hook、开场白分五个分页收好。<br><br>' +
            '点影片可以<b>真的播放预览</b>——有声音、有人物、有画面，按时间轴逐镜播。<br>' +
            '点脚本能看到完整<b>分镜表</b>：每个镜头讲什么、怎么运镜、几秒。'
    },
    {
      route: 'publish', sel: '.cal',
      title: '第五步：发布与数据',
      text: '月历上一眼看出状态：<b>实心色块＝待发布</b>，<b>虚线打勾＝已发布</b>。<br><br>' +
            '点任一条目可以预览、改标题、改平台与时间。<br><br>' +
            '⚠️ <b>Instagram Reels 已接真实发布</b>（需另外启动发布服务并完成授权），' +
            '其余平台目前仍是演示。'
    },
    {
      route: 'dashboard', sel: '#nav',
      title: '补充：左边选单怎么分',
      text: '<b>先设定一次</b>——这里有「数字人 / 声音 / 克隆」，先选好影片里出现的脸和声音。<br><br>' +
            '<b>每本书都会用到</b>——上传新书、一键生成、挑素材、发布，照做事顺序排。<br><br>' +
            '<b>团队 / 管理员</b>——收在下面的折叠区，偶尔才碰：人物引擎、数据分析、文件中心、系统设定。<br><br>' +
            '点一下折叠区的标题就会展开。'
    },
    {
      route: 'engine', sel: '.engine-card',
      title: '一个平台，可以服务多个人',
      text: '「人物引擎」在管理员区。每个人一份专属风格包，各自训练、各自评分。<br><br>' +
            '下面还有训练闭环、评分器规划与资料表设计——' +
            '<b>用得越久，累积的判断越准</b>，这是别人复制不走的部分。'
    },
    {
      center: true, route: 'dashboard',
      title: '最后两件小事',
      text: '<b>左下角</b>点一下可以改显示名称——系统里所有「这个数字人属于谁」都会跟着变，' +
            '目前是「{OWNER}」。<br><br>' +   // {OWNER} 在显示时才代入，不能在载入时求值
            '<b>右上角 ◐</b> 可切换深色与浅色。<br><br>' +
            '想重看这份导览，随时点顶栏的<b>「导览」</b>。'
    }
  ];

  let idx = 0, mask = null, hole = null, pop = null, active = false;

  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function build() {
    mask = el('div', 'tour-mask');
    hole = el('div', 'tour-hole');
    pop = el('div', 'tour-pop');
    mask.appendChild(hole);
    document.body.appendChild(mask);
    document.body.appendChild(pop);
    mask.addEventListener('click', e => { if (e.target === mask) next(); });
    document.addEventListener('keydown', onKey);
  }

  function onKey(e) {
    if (!active) return;
    if (e.key === 'Escape') stop();
    if (e.key === 'ArrowRight' || e.key === 'Enter') next();
    if (e.key === 'ArrowLeft') prev();
  }

  function render() {
    const s = STEPS[idx];
    if (s.route && typeof go === 'function') go(s.route);

    setTimeout(() => {
      const target = s.center ? null : document.querySelector(s.sel);
      const pad = 8;

      // 窄画面时侧栏是收起的（移到画面外），指着它没有意义 → 先打开
      if (target && target.closest('#sidebar')) {
        const sb = document.getElementById('sidebar');
        if (sb && sb.getBoundingClientRect().right <= 0) sb.classList.add('open');
      }

      if (target && visible(target)) {
        target.scrollIntoView({ block: 'center', behavior: 'smooth' });
        setTimeout(() => place(target, pad, !!s.centerPop), 220);
      } else {
        hole.style.opacity = '0';
        pop.className = 'tour-pop center';
        pop.style.left = ''; pop.style.top = '';
      }
      paint();
      if (window.I18N) I18N.apply(pop);
    }, s.route ? 60 : 0);
  }

  /* 目标真的看得到吗？看不到就退回置中卡，不要指一个画面外的东西 */
  function visible(el) {
    const r = el.getBoundingClientRect();
    return r.width > 4 && r.height > 4 && r.right > 0 && r.bottom > 0
      && r.left < innerWidth && r.top < innerHeight;
  }

  function place(target, pad, centerPop) {
    const r = target.getBoundingClientRect();
    hole.style.opacity = '1';
    hole.style.left = (r.left - pad) + 'px';
    hole.style.top = (r.top - pad) + 'px';
    hole.style.width = (r.width + pad * 2) + 'px';
    hole.style.height = (r.height + pad * 2) + 'px';

    pop.className = centerPop ? 'tour-pop center' : 'tour-pop';
    if (centerPop) {
      pop.style.left = '';
      pop.style.top = '';
      return;
    }
    const pw = 340, ph = pop.offsetHeight || 240;
    let left = r.left, top = r.bottom + 16;
    if (top + ph > window.innerHeight - 12) top = Math.max(12, r.top - ph - 16);
    if (left + pw > window.innerWidth - 12) left = window.innerWidth - pw - 12;
    if (left < 12) left = 12;
    if (top < 12) top = 12;
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  function paint() {
    const s = STEPS[idx];
    pop.innerHTML = `
      <div class="tour-h">
        <span class="tour-n">${idx + 1} / ${STEPS.length}</span>
        <button class="icon-btn tour-x" data-t="stop" title="关闭导览">✕</button>
      </div>
      <div class="tour-t">${s.title}</div>
      <div class="tour-b">${s.text.replace(/\{OWNER\}/g, OWNER())}</div>
      ${s.note ? `<div class="tour-note">${s.note}</div>` : ''}
      <div class="tour-dots">${STEPS.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('')}</div>
      <div class="tour-f">
        <button class="btn btn-sm btn-ghost" data-t="stop">跳过</button>
        <span style="flex:1"></span>
        ${idx > 0 ? '<button class="btn btn-sm" data-t="prev">上一步</button>' : ''}
        <button class="btn btn-sm btn-primary" data-t="next">${idx === STEPS.length - 1 ? '开始使用' : '下一步'}</button>
      </div>`;
    pop.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', ev => {
      ev.stopPropagation();
      const a = b.dataset.t;
      if (a === 'next') next(); else if (a === 'prev') prev(); else stop();
    }));
  }

  function next() { if (idx < STEPS.length - 1) { idx++; render(); } else stop(); }
  function prev() { if (idx > 0) { idx--; render(); } }

  function start(from) {
    if (active) return;
    active = true; idx = from || 0;
    if (!mask) build();
    mask.style.display = 'block'; pop.style.display = 'block';
    render();
  }

  function stop() {
    active = false;
    if (mask) mask.style.display = 'none';
    if (pop) pop.style.display = 'none';
    if (STORE && !STORE.s.settings.tourDone) { STORE.s.settings.tourDone = true; STORE.update(); }
  }

  return { start, stop, get active() { return active; }, steps: STEPS.length };
})();


/* ===== app.js ===== */
/* ============================================================
 * app.js — 路由、事件绑定、交互逻辑
 * ========================================================== */
(function () {
  const { $, $$, esc, nf, toast, modal, closeModal, copy, download } = UI;

  const TITLES = {
    dashboard: '工作台', projects: '书籍项目', pipeline: '生产流水线', creative: '创意分镜', library: '内容资产库', billing: '支付与方案',
    engine: '人物引擎',
    persona: '数字人 · 声音 · 人格', publish: '发布与数据', analytics: '数据分析',
    settings: '系统设置', docs: '文档中心'
  };

  let route = 'dashboard', query = {};

  /* ---------------- 渲染 ---------------- */
  function render() {
    const fn = VIEWS[route] || VIEWS.dashboard;
    $('#view').innerHTML = fn(query);
    $('#crumb').textContent = TITLES[route] || '';
    $$('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.route === route));
    const st = STORE.s.settings;
    $('#quota-num').textContent = st.quotaUsed + ' / ' + st.quotaTotal;
    $('#quota-bar').style.width = (st.quotaUsed / st.quotaTotal * 100) + '%';
    const prod = STORE.s.projects.filter(p => p.status === 'producing').length;
    $('#badge-dash').textContent = prod ? prod : '';
    // 左下角显示目前登录的人，不是写死的
    const ac = STORE.s.account;
    $('#user-name').textContent = ac.name;
    $('#user-role').textContent = ac.title;
    $('#user-avatar').textContent = ac.initial || ac.name.slice(0, 1);
    if (route === 'pipeline') $('#view').scrollTop = 0;
    if (route === 'persona') showVoiceInfo();
    if (route === 'persona' || route === 'pipeline') hgAutoCheck();
    if (window.I18N) { I18N.apply($('#view')); I18N.apply($('#crumb')); }
  }
  window.render = render;

  function go(r, q) { route = r; query = q || {}; $('#sidebar').classList.remove('open'); render(); }
  window.go = go;

  /* ---------------- 导航 ---------------- */
  $('#nav').addEventListener('click', e => {
    const it = e.target.closest('.nav-item');
    if (it) go(it.dataset.route);
  });
  $('#btn-menu').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
  $('#btn-new').addEventListener('click', newProjectModal);
  $('#modal-close').addEventListener('click', closeModal);
  $('#modal-mask').addEventListener('click', e => { if (e.target.id === 'modal-mask') closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  $('#btn-tour').addEventListener('click', () => TOUR.start(0));
  $('#user-block').addEventListener('click', accountModal);

  /* 帐户设定：决定左下角显示谁、数字人属于谁 */
  function accountModal() {
    const ac = STORE.s.account;
    modal('帐户设定', `
      <div class="explain" style="margin:0 0 16px;border-left-color:var(--violet)">
        <div class="ex-r"><span class="ex-k">这里改什么</span><span>左下角显示的名字，以及整个系统里「这个数字人属于谁」的称呼。</span></div>
        <div class="ex-r"><span class="ex-k">为什么要改</span><span>每个使用者有自己的专属数字人与声音模型。填上本人名字后，人格页、影片署名都会跟着变。</span></div>
      </div>
      <div class="row2">
        <div class="field"><div class="label">显示名称 <span style="color:var(--red)">*</span></div>
          <input class="input" id="ac-name" value="${esc(ac.name)}" placeholder="填本人的名字或称呼"></div>
        <div class="field"><div class="label">职称 / 角色</div>
          <input class="input" id="ac-title" value="${esc(ac.title)}" placeholder="例如：超级管理员"></div>
      </div>
      <div class="field"><div class="label">头像文字<span class="hint" style="margin-left:8px;font-weight:400">留空就取名字第一个字</span></div>
        <input class="input" id="ac-initial" value="${esc(ac.initial || '')}" maxlength="2" style="width:120px"></div>
      <div class="hint">这只是显示设定。真正的数字人形象与声音在「数字人 · 声音 · 人格」页面训练与切换。</div>`,
      `<button class="btn" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-primary" data-modal-act="save-account">保存</button>`);
  }

  /* 支付与方案：呼叫本机/自建的支付后端建立 Checkout（前端不保存任何金流 Key） */
  async function checkoutPlan(planId) {
    const input = $('#payment-server');
    const base = (input && input.value.trim()) || STORE.s.settings.paymentServer || 'http://localhost:8788';
    STORE.s.settings.paymentServer = base.replace(/\/+$/, '');
    STORE.update();
    const plan = (DATA.BILLING_PLANS || []).find(p => p.id === planId);
    if (!plan) return toast('找不到这个方案', 'warn');
    try {
      toast('正在建立付款页面...', 'ok');
      const res = await fetch(`${STORE.s.settings.paymentServer}/api/payments/checkout`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          planId,
          projectId: STORE.current && STORE.current.id,
          customerEmail: STORE.s.account.email || '',
          customerName: STORE.s.account.name || ''
        })
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok || !body.url) throw new Error(body.error || `HTTP ${res.status}`);
      location.href = body.url;
    } catch (err) {
      toast(`付款服务未就绪：${err.message}`, 'warn');
    }
  }

  $('#btn-theme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme')
      || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nx);
    STORE.s.settings.theme = nx; STORE.s.settings.themeSet = true; STORE.update();
  });

  let searchTimer;
  $('#global-search').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { if (route !== 'projects') go('projects'); else render(); }, 260);
  });

  /* ---------------- 全局事件委托 ---------------- */
  /* 上传照片 / 上传录音：檔案 input 的 change 事件，挂在 #view 上做委派，
   * 这样即使这一页重新渲染，监听器也不会失效（跟下面 click 委派同一招）。 */
  $('#view').addEventListener('change', e => {
    if (e.target.id === 'hg-photo-input') return hgUploadPhoto(e.target.files[0]);
    if (e.target.id === 'hg-audio-input') return hgUploadAudio(e.target.files[0]);
  });

  $('#view').addEventListener('click', e => {
    const seg = e.target.closest('[data-seg] button, [data-seg] [data-v]');
    if (seg) {
      const name = seg.closest('[data-seg]').dataset.seg;
      if (name === 'proj-filter') return go('projects', { f: seg.dataset.v });
      if (name === 'lib-tab') return go('library', { t: seg.dataset.v });
      if (name === 'ana-scope') return go('analytics', { sc: seg.dataset.v });
    }

    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    switch (act) {
      case 'goto': return go(el.dataset.route);
      case 'gen-video': return genVideoModal(el.dataset.id);
      case 'del-proj': return delProjectModal(el.dataset.id);
      case 'open-proj': STORE.setCurrent(el.dataset.id); return go('pipeline');
      case 'new-proj': return newProjectModal();
      case 'sel-stage': return go('pipeline', { s: el.dataset.k });
      case 'copy': return copy(el.dataset.t);
      case 'print': return window.print();

      case 'quick-run':
      case 'run-all': {
        const p = STORE.current;
        if (ENGINE.isRunning) return toast('已有任务在执行中', 'warn');
        go('pipeline');
        ENGINE.start(p, 0);
        toast(`《${p.title}》全流程已启动`, 'ok');
        return;
      }
      case 'run-stage': {
        const idx = DATA.STAGES.findIndex(s => s.key === el.dataset.k);
        if (ENGINE.isRunning) return toast('已有任务在执行中', 'warn');
        ENGINE.start(STORE.current, idx);
        return;
      }
      case 'stop-run': return ENGINE.stop();
      case 'resume-run': return ENGINE.resume();

      case 'view-script': return scriptModal(el.dataset.id);
      case 'play': return playerModal(el.dataset.id);
      case 'checkout-plan': return checkoutPlan(el.dataset.plan);
      case 'copy-payment-env': {
        return copy([
          'STRIPE_SECRET_KEY=sk_test_...',
          'STRIPE_WEBHOOK_SECRET=whsec_...',
          'STRIPE_PRICE_STARTER=price_...',
          'STRIPE_PRICE_PRO=price_...',
          'STRIPE_PRICE_STUDIO=price_...',
          'PUBLIC_APP_URL=http://127.0.0.1:8081'
        ].join('\n'));
      }
      case 'pick-file': return $('#file-input').click();
      case 'clear-files': {
        const p = STORE.current;
        p.materials = []; p.source = null; p.parsed = null;
        STORE.update(); render(); toast('已清空本项目的上传资料', 'ok');
        return;
      }
      case 'export-all': return exportAll();
      case 'export-report': return exportReport();

      case 'day-detail': return dayModal(+el.dataset.d);
      case 'open-sched': return schedModal(el.dataset.id);
      case 'pub-one': {
        const it = STORE.s.schedule.find(x => x.id === el.dataset.id);
        if (it) {
          it.status = '已发布'; syncVideoStatus(it, true);
          STORE.log('ok', `已发布：${it.title}（${it.platform}）`);
          toast('已发布至 ' + it.platform + '，数据待平台回传', 'ok'); render();
        }
        return;
      }
      case 'publish-all': {
        const n = STORE.s.schedule.filter(x => x.status === '待发布').length;
        if (!n) return toast('没有待发布内容', 'warn');
        return modal('批量确认发布', `<div style="font-size:15.5px;line-height:1.9">
            即将发布 <b>${n}</b> 条内容到已授权平台。<br>发布后可在数据分析中查看表现。</div>
            <div class="hint" style="margin-top:12px">提示：发布是不可撤回的对外动作，请确认内容已审核通过。</div>`,
          `<button class="btn" onclick="UI.closeModal()">取消</button>
           <button class="btn btn-primary" data-modal-act="confirm-pub">确认发布 ${n} 条</button>`);
      }
      case 'auth-plat': return toast(`请在「${el.dataset.n}」开放平台完成授权后回到本页`, 'warn');

      /* ---- Instagram Reels 真实发布 ---- */
      case 'ig-check': return igCheck();
      case 'ig-save-app': return igSaveApp();
      case 'ig-connect': {
        window.open(igBase() + '/auth/start', '_blank');
        toast('已开新分页进行授权，完成后回来按「检测」', 'ok');
        return;
      }
      case 'ig-disconnect': {
        fetch(igBase() + '/api/disconnect', { method: 'POST' })
          .then(() => { toast('已断开连接', 'ok'); igCheck(); })

          <div class="wave" style="margin-top:16px">${Array.from({ length: 40 }).map((_, i) => `<i style="animation-delay:${(i * .04).toFixed(2)}s"></i>`).join('')}</div>
          <div class="hint" style="margin-top:12px">当前参数：语速 ${p.speed} · 亲和 ${p.warmth} · 正式度 ${p.formal} · 停顿 ${p.pause} · 强调 ${p.emphasis}。
          声音来源：<b>${{ clone: STORE.s.account.name + '本人声音', library: (DATA.VOICES.find(v => v.id === p.voiceActor) || {}).name, system: '系统合成音' }[p.voiceMode]}</b>。
          演示环境以浏览器语音代播，正式版由声音模型合成，语气与停顿会自然得多。</div>`);

  /* 下拉与滑块 */
  $('#view').addEventListener('change', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    if (el.dataset.act === 'switch-proj') { STORE.setCurrent(el.value); render(); }
    if (el.dataset.act === 'plat-filter') go('publish', { p: el.value });
    if (el.dataset.act === 'set') { STORE.s.settings[el.dataset.k] = el.value; STORE.update(); toast('已保存', 'ok'); }
    if (el.dataset.act === 'persona-set') {
      STORE.s.persona[el.dataset.k] = el.value;
      STORE.update(); render(); toast('已保存', 'ok');
    }
    if (el.dataset.act === 'video-format') {
      setVideoFormat(el.dataset.id, el.value, true);
    }
    if (el.dataset.act === 'set-quota-total' || el.dataset.act === 'set-quota-used') {
      const k = el.dataset.act === 'set-quota-total' ? 'quotaTotal' : 'quotaUsed';
      STORE.s.settings[k] = Math.max(0, Math.floor(+el.value || 0));
      STORE.update(); render(); toast('已保存', 'ok');
      return;
    }
    if (el.dataset.act === 'set-number') {
      STORE.s.settings[el.dataset.k] = clampDuration(el.value);
      STORE.update(); render(); toast('已保存', 'ok');
    }
  });
  $('#view').addEventListener('input', e => {
    // 提示词是使用者随时会改的，边打边存，不用另外按储存
    // 角色的名字/身份/外貌也是边打边存，跟提示词一样不重画，免得打断打字
    const ce = e.target.closest('[data-act="edit-char"]');
    if (ce) {
      const p = STORE.current;
      const c = p && (p.characters || [])[+ce.dataset.i];
      if (c) { c[ce.dataset.k] = ce.value; STORE.update(); }
      return;
    }
    const pe = e.target.closest('[data-act="edit-prompt"]');
    if (pe) {
      const p = STORE.current;
      if (p && p.videoPrompts && p.videoPrompts[+pe.dataset.i]) {
        p.videoPrompts[+pe.dataset.i].text = pe.value;
        STORE.update();   // 只存资料，不重画——重画会打断你正在打的字
      }
      return;
    }
    const dur = e.target.closest('[data-act="video-duration"]');
    if (dur) {
      setVideoDuration(dur.dataset.id, dur.value, false);
      return;
    }
    const ps = e.target.closest('[data-act="persona-set"]');
    if (ps) {
      STORE.s.persona[ps.dataset.k] = ps.value;
      STORE.update();
      return;
    }
    const el = e.target.closest('[data-act="persona-slider"]');
    if (!el) return;
    const k = el.dataset.k;
    STORE.s.persona[k] = +el.value;
    const lab = $('#pv-' + k); if (lab) lab.textContent = el.value;
  });

  $('#view').addEventListener('change', e => {
    const dur = e.target.closest('[data-act="video-duration"]');
    if (dur) setVideoDuration(dur.dataset.id, dur.value, true);
  });

  /* 弹窗内按钮 */
  $('#modal').addEventListener('click', e => {
    const el = e.target.closest('[data-modal-act]');
    if (!el) return;
    const a = el.dataset.modalAct;
    if (a === 'confirm-pub') {
      STORE.s.schedule.forEach(x => { if (x.status === '待发布') { x.status = '已发布'; syncVideoStatus(x, true); } });
      STORE.log('ok', '批量发布完成'); closeModal(); render(); toast('全部内容已发布', 'ok');
    }
    if (a === 'confirm-reset') { STORE.reset(); closeModal(); go('dashboard'); toast('已恢复初始演示数据', 'ok'); }
    if (a === 'ga-preset') { const box = $('#ga-prompt'); if (box) { box.value = el.dataset.text || ''; box.focus(); } return; }
    if (a === 'bg-run') return batchGenRun();
    if (a === 'ga-run') return hgGenAvatarRun();
    if (a === 'ga-use') return hgGenAvatarUse();
    if (a === 'mp-ok') return mpFinish(el.dataset.step, true);
    if (a === 'mp-cancel') return mpFinish(null, false);
    if (a === 'confirm-hg-gen') { closeModal(); return hgDoGenerate(); }
    if (a === 'confirm-gen-video') return doGenVideo(el.dataset.id);
    if (a === 'confirm-conversation-video') return doGenConversationVideo(el.dataset.id);
    if (a === 'goto-persona') { closeModal(); return go('persona'); }
    if (a === 'confirm-del-proj') {
      const id = el.dataset.id;
      const p = STORE.s.projects.find(x => x.id === id);
      const name = p ? p.title : '';
      STORE.removeProject(id);
      STORE.log('warn', `已删除书籍项目《${name}》`);
      closeModal(); render();
      return toast(`《${name}》已删除`, 'ok');
    }
    if (a === 'goto-lib-before-del') {
      STORE.setCurrent(el.dataset.id);
      closeModal(); return go('library');
    }
    if (a === 'new-proj-from-del') { closeModal(); return newProjectModal(); }
    if (a === 'confirm-hg-clone') { const assetId = el.dataset.asset; closeModal(); return hgDoCloneVoice(assetId); }
    if (a === 'confirm-prompt-video') { const i = +el.dataset.i; closeModal(); return doPromptVideo(i); }
    if (a === 'ai-rewrite') return aiRewriteScript(el.dataset.id);
    if (a === 'create-proj') createProject();
    if (a === 'ig-do') return igDoPublish(el.dataset.id, el);
    if (a === 'ig-open') return igPublishModal(el.dataset.id);
    if (a === 'yt-do') return ytDoUpload(el.dataset.id, el);
    if (a === 'yt-open') return ytPublishModal(el.dataset.id);
    if (a === 'save-account') {
      const n = ($('#ac-name').value || '').trim();
      if (!n) return toast('显示名称不能空白', 'warn');
      STORE.s.account = {
        name: n,
        title: ($('#ac-title').value || '').trim() || '成员',
        initial: ($('#ac-initial').value || '').trim() || n.slice(0, 1)
      };
      STORE.update(); closeModal(); render(); toast(`已切换为「${n}」`, 'ok');
    }
    if (a === 'copy-cap') copy(el.dataset.t);
    if (a === 'pub-one') {
      const it = STORE.s.schedule.find(x => x.id === el.dataset.id);
      if (it) {
        it.status = '已发布'; syncVideoStatus(it, true);
        STORE.log('ok', `已发布：${it.title}（${it.platform}）`);
        toast('已发布至 ' + it.platform, 'ok'); render(); dayModal(+el.dataset.day);
      }
    }
    if (a === 'sched-save') {
      const it = STORE.s.schedule.find(x => x.id === el.dataset.id);
      if (!it) return;
      const t = ($('#sc-title').value || '').trim();
      if (!t) return toast('标题不能空白', 'warn');
      const plat = DATA.PLATFORMS.find(x => x.name === $('#sc-plat').value);
      it.title = t; it.platform = plat.name; it.color = plat.color;
      it.day = +$('#sc-day').value; it.hour = +$('#sc-hour').value;
      const p = STORE.s.projects.find(x => x.id === it.projectId);
      const v = p && (p.videos || []).find(x => x.id === it.videoId);
      if (v) { v.title = t; v.platformName = plat.name; v.color = plat.color; v.ratio = plat.ratio; }
      STORE.update(); render(); closeModal(); toast('已储存变更', 'ok');
    }
    if (a === 'sched-pub') {
      const it = STORE.s.schedule.find(x => x.id === el.dataset.id);
      if (it) { it.status = '已发布'; syncVideoStatus(it, true); STORE.log('ok', `已发布：${it.title}（${it.platform}）`); STORE.update(); render(); toast('已发布至 ' + it.platform + '，数据待平台回传', 'ok'); schedModal(it.id); }
    }
    if (a === 'sched-unpub') {
      const it = STORE.s.schedule.find(x => x.id === el.dataset.id);
      if (it) { it.status = '待发布'; syncVideoStatus(it, false); STORE.update(); render(); toast('已撤回为待发布，数据一并清除', 'ok'); schedModal(it.id); }
    }
    if (a === 'sched-del') {
      STORE.s.schedule = STORE.s.schedule.filter(x => x.id !== el.dataset.id);
      STORE.update(); render(); closeModal(); toast('已移出排程', 'ok');
    }
    if (a === 'open-script') { if (el.dataset.id) scriptModal(el.dataset.id); }
    if (a === 'open-sched') schedModal(el.dataset.id);
    if (a === 'pub-day') {
      const d = +el.dataset.day; let n = 0;
      STORE.s.schedule.forEach(x => { if (x.day === d && x.status === '待发布') { x.status = '已发布'; syncVideoStatus(x, true); n++; } });
      STORE.log('ok', `批量发布 ${d} 日的 ${n} 条内容`);
      STORE.update(); render(); dayModal(d); toast(`已发布 ${n} 条`, 'ok');
    }
    if (a === 'dl-shots') {
      let v = null, p = null;
      STORE.s.projects.forEach(x => (x.videos || []).forEach(y => { if (y.id === el.dataset.id) { v = y; p = x; } }));
      if (!v) return;
      const s = (p.scripts || []).find(x => x.id === v.scriptId) || (p.scripts || [])[0];
      const shots = s ? DATA.genShots(s, p) : [];
      let out = `${v.title}\n${'='.repeat(46)}\n平台：${v.platformName}　角度：${v.angle}　时长：${v.duration}s　尺寸：${v.ratio}\n出自：《${p.title}》${p.author} 著\n\n`;
      if (s) out += `【开场 Hook】\n${s.hook}\n\n【脚本正文】\n${s.body}\n\n【结尾 CTA】\n${s.cta}\n\n`;
      out += `【分镜表】\n` + shots.map((sh, i) =>
        `${String(i + 1).padStart(2, '0')} ${sh.t}　${sh.dur}\n   台词：${sh.txt}\n   运镜：${sh.cam}\n   画面：${sh.vis}\n`).join('\n');
      download(`${p.title}_${v.platformName}_分镜.txt`, out);
    }
    if (a === 'add-sched') {
      let v = null, p = null;
      STORE.s.projects.forEach(x => (x.videos || []).forEach(y => { if (y.id === el.dataset.id) { v = y; p = x; } }));
      if (!v) return;
      if (STORE.s.schedule.some(s => s.videoId === v.id)) return toast('这支影片已经在排程里了', 'warn');
      STORE.s.schedule.push({
        id: DATA.uid('sc'), projectId: p.id, bookTitle: p.title, videoId: v.id, title: v.title,
        platform: v.platformName, color: v.color, day: new Date().getDate(),
        hour: [8, 12, 18, 20, 21][Math.floor(Math.random() * 5)], status: '待发布'
      });
      STORE.update(); toast('已加入发布排程', 'ok');
    }
  });

  /* 发布/撤回时同步更新影片状态。刚发布的影片数据归零，等平台回传 */
  function syncVideoStatus(item, published) {
    const p = STORE.s.projects.find(x => x.id === item.projectId);
    const v = p && (p.videos || []).find(x => x.id === item.videoId);
    if (!v) return;
    if (published) {
      if (v.status !== '已发布') { v.status = '已发布'; v.views = 0; v.watch = 0; v.like = 0; v.share = 0; v.click = 0; }

    }

  /* ============================================================
   * 数字人开口说话（外部真实数字人生成服务）
   * 静态 API Key，没有 OAuth 流程。三种操作、三种花费等级：
   *   - 查询形象/声音、上传照片/录音本身：免费
   *   - 克隆一个声音：会花一点钱
   *   - 生成一支影片：会花比较多钱（约 US$1-3）
   * 故意不做「一键生成全部」的批次按钮。
   * ========================================================== */
  const HG = {
    mode: 'avatar',      // 'avatar' 用现成形象 / 'image' 用刚上传的照片
    avatarId: null, assetId: null, assetPreview: null,
    voiceId: null, text: '',
    avatars: [], voices: []
  };
  /* 部署在 Vercel、一直开着的数字人生成服务，金钥存在 Vercel 项目的
   * 环境变量里——网页上不再需要「服务网址」「API Key」这些欄位，
   * 用户完全看不到、也不用管本机有没有开着什么服务。
   *
   * 「看」（形象、声音列表）对所有人开放，所以公开展示版一进页面就
   * 直接显示得出来；「做」（上传 / 克隆 / 生成，会写入帐号或真的花钱）
   * 需要下面这把凭证，只有内部版建置时才会被 build.js 填进来。 */
  const HG_BASE = 'https://heygen-api-self.vercel.app';
  const HG_WRITE_TOKEN = "wSZNS0NgUyQGOSGmPC7xaJlCQe7ZaI_d"; /* build-token */
  const hgCanWrite = () => !!HG_WRITE_TOKEN;

  /* 一定要有逾时：fetch 预设永远不会自己放弃，网路卡住时那个 Promise
   * 既不成功也不失败，介面就永远停在「连线中…」——使用者只看到一个
   * 转不完的圈，也没有任何出路。逾时后当成失败处理，才有机会显示重试。 */
  async function hgFetch(p, opt, timeoutMs) {
    const o = Object.assign({}, opt);
    if (HG_WRITE_TOKEN) o.headers = Object.assign({}, o.headers, { 'x-bookreel-token': HG_WRITE_TOKEN });
    const ac = new AbortController();
    o.signal = ac.signal;
    const ms = timeoutMs || 15000;
    const timer = setTimeout(() => ac.abort(), ms);
    let r;
    try {
      r = await fetch(HG_BASE + p, o);
    } catch (e) {
      if (e.name === 'AbortError') throw new Error(`连线逾时（超过 ${Math.round(ms / 1000)} 秒没有回应）`);
      throw new Error('连不上服务器：' + e.message);
    } finally {
      clearTimeout(timer);
    }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  }

  /* 把「选了哪个形象、哪个声音」写进 STORE。
   * 这一步是三个问题的共同解法：选择存下来之后，页面重整不会掉，
   * 生产流水线也才读得到——在这之前这些选择只活在记忆体里，
   * 除了手动「试跑一支」以外没有任何地方会用到。 */
  function hgSaveChoice() {
    const p = STORE.s.persona;
    p.realAvatarMode = HG.mode;
    p.realAvatarId = HG.avatarId;
    p.realAvatarName = (HG.avatars.find(a => a.id === HG.avatarId) || {}).name || '';
    p.realPhotoAssetId = HG.assetId;
    p.realPhotoPreview = HG.assetPreview;
    p.realVoiceId = HG.voiceId;
    p.realVoiceName = (HG.voices.find(v => v.id === HG.voiceId) || {}).name || '';
    STORE.update();
  }

  /* 反向：进页面时把存过的选择放回记忆体，让介面显示上次选的 */
  function hgRestoreChoice() {
    const p = STORE.s.persona;
    if (p.realAvatarMode) HG.mode = p.realAvatarMode;
    if (p.realAvatarId) HG.avatarId = p.realAvatarId;
    if (p.realPhotoAssetId) HG.assetId = p.realPhotoAssetId;
    if (p.realPhotoPreview) HG.assetPreview = p.realPhotoPreview;
    if (p.realVoiceId) HG.voiceId = p.realVoiceId;
  }

  /* 公开展示版按下会花钱的动作时，与其送出去被挡、跳一个看起来像坏掉的
   * 错误，不如直接讲清楚这是展示版。 */
  function hgDemoNotice() {

  let hgTried = false;
  /* 只有第一次进这个页面才真的去连线；之后这页因为其他操作（比如加一句
   * 口头禅）整页重画时，直接从快取重画形象/声音，不用每次都重打网络请求，

  function hgAutoCheck() {

        </span></div>

  function hgRepaintStatus() {
    const status = $('#hg-status');

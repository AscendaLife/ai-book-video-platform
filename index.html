  /* ============================================================
   * 真实 AI 写稿（接 Model Router 的 chat）
   *
   * 现况：STEP 4 产出的对谈稿是模板拼出来的，句型固定、换本书也
   * 只有书名变。这里让它真的送进大模型重写一遍，成本约 US$0.01-0.05
   * 一篇，所以做成「单篇触发」而不是整批自动跑。
   * 接不上或没设定金钥时，维持原本的模板稿，不会把页面弄坏。
   * ========================================================== */
  async function aiRewriteScript(id) {
    let p = null, s = null;
    STORE.s.projects.forEach(x => (x.scripts || []).forEach(y => { if (y.id === id) { s = y; p = x; } }));
    if (!s) return;
    if (!hgCanWrite()) return hgDemoNotice();

    const pa = STORE.s.persona;
    const scenes = (s.scenePlan || []).map(x => `${x.name}（${x.visual}）`).join('、') || '棚内访谈';
    /* 必须是单人口播：数字人服务一次只能一个形象、一个声音。
     * 写成双人对谈的话，生成时只能由同一个人念完两边台词，稿子会对不上成品。 */
    const speaker = STORE.s.account.name || '主讲人';
    const system = '你是短视频编剧，专写中文单人口播短片脚本。只输出 JSON，不要任何解释文字。';
    const duration = clampDuration(s.duration || defaultVideoDuration());
    const minWords = Math.max(80, Math.round(duration * 4.1));
    const maxWords = Math.max(minWords + 30, Math.round(duration * 5.3));
    const prompt = `帮我写一支 ${duration} 秒的单人口播短视频脚本，用来推荐这本书。

【书籍】《${p.title}》${p.author ? '，作者' + p.author : ''}
【全书摘要】${p.summary || '（未提供）'}
【核心论点】${(p.themes || []).slice(0, 5).join('；') || '（未提供）'}
【书中金句】${(p.quotes || []).slice(0, 6).join('；') || '（未提供）'}
【读者痛点】${(p.pains || []).slice(0, 4).join('；') || '（未提供）'}

【形式】**一个人对着镜头讲**，全程只有一个说话的人，不要写成两个人对谈、不要有问答角色。
这个人叫「${speaker}」，所有台词的 speaker 都填「${speaker}」。
【画面场地】依序是：${scenes}（只是背景变化，人物始终是同一个）
【口吻要求】语速 ${pa.speed}/100、亲和 ${pa.warmth}/100、正式度 ${pa.formal}/100（数字越高越正式）
${(pa.habits || []).length ? '【口头禅】自然植入其中 1-2 句，不要每句都用：' + pa.habits.join('、') : ''}

要求：
- 开头 3 秒就要让人停下来，别铺陈、别说「大家好」
- 讲人话、短句，像跟朋友说话，不要书面语和排比句
- 中间要有一次自问自答（先讲出观众可能的反驳，再回应）
- 引用书里的一句原话，前后留停顿
- 讲书里真正的观点，不要空泛的「这本书很好看」
- 8-10 句，每句给时间区间，总长不超过 ${duration} 秒，全篇 ${minWords}-${maxWords} 字
- 最后给一个今天就能做的具体动作，再带出引导留言或试读的 CTA

只输出这个 JSON 结构：
{"title":"一句吸引人的标题","hook":"前3秒开场白","dialogue":[{"t":"0.0-4.0s","speaker":"${speaker}","cue":"语气与节奏提示","text":"台词"}],"cta":"结尾引导语"}`;

    /* 先问要用哪个模型。这一步是真的花钱，选贵选便宜差很多，
     * 不该由程式码替使用者决定。取消就什么都不做，原稿保持不变。 */
    const pick = await askModel('rewrite');
    if (!pick) return toast('已取消，这一篇没有被改动', 'warn');
    scriptModal(id);           // 选模型的窗口盖掉了稿子详情，选完把它开回来

    const body = $('#modal-body');
    if (body) body.insertAdjacentHTML('afterbegin',
      '<div id="ai-rw" class="hint" style="margin-bottom:12px;color:var(--violet-2)">✨ 真实 AI 重写中，约 10-30 秒…</div>');
    const setMsg = (t, color) => { const el = $('#ai-rw'); if (el) { el.textContent = t; el.style.color = color || 'var(--violet-2)'; } };

    try {
      const r = await hgFetchSlow('/api/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ prompt, system, maxTokens: 2000, wantJson: true }, pick))
      });
      let out;
      try { out = JSON.parse(r.content); }
      catch (e) {
        // 模型偶尔会在 JSON 外面包一层 ```json，取出中间那段再试一次
        const m = (r.content || '').match(/\{[\s\S]*\}/);
        if (!m) throw new Error('模型没有回传可解析的 JSON');
        out = JSON.parse(m[0]);
      }
      if (!out.dialogue || !out.dialogue.length) throw new Error('模型回传的内容里没有对谈台词');

      s.title = out.title || s.title;
      s.hook = out.hook || s.hook;
      s.dialogue = out.dialogue;
      s.cta = out.cta || s.cta;
      s.duration = duration;
      s.aiWritten = true;
      s.aiModel = r.model || null;
      STORE.update();
      toast('已用真实 AI 重写（模型：' + (r.model || '未知') + '）', 'ok');
      const note = mpServedNote(pick, r.model);
      if (note) toast(note, 'warn');
      render(); scriptModal(id);
    } catch (e) {
      setMsg('AI 重写失败：' + e.message + '（原本的稿子没有被改动）', 'var(--red)');
    }
  }

  /* ---- 真实场景示意图（Model Router 的 image 任务）----
   * $0.03-0.07 一张，所以一次只生一张、按一次生一次，不做批次。 */
  async function aiSceneImage(templateId) {
    const t = (DATA.sceneTemplateLibrary ? DATA.sceneTemplateLibrary() : []).find(x => x.id === templateId);
    const slot = $(`.ai-scene-img[data-for="${templateId}"]`);
    if (!t || !slot) return;
    if (!hgCanWrite()) return hgDemoNotice();

    const pick = await askModel('image');
    if (!pick) return toast('已取消，没有生成图片', 'warn');

    const p = STORE.current;
    slot.innerHTML = '<div class="hint" style="margin-top:8px;color:var(--violet-2)">✨ 生成中，约 10-20 秒…</div>';
    const prompt = `短视频场景示意图，直式 9:16 构图。场景：${t.name}——${t.setting}。`
      + `画面里有 ${t.roles}，气氛${t.tone}。`
      + (p ? `内容主题与《${p.title}》这本书有关。` : '')
      + '电影感打光、真实摄影风格、不要出现文字或字幕。';

    try {
      const r = await hgFetchSlow('/api/ai/image', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ prompt }, pick))
      });
      if (!r.url) throw new Error('平台没有回传图片网址');
      slot.innerHTML = `<img src="${esc(r.url)}" style="width:100%;border-radius:10px;margin-top:10px">
        <div class="hint" style="margin-top:6px">AI 生成的场景示意图，仅供沟通画面用</div>`;
    } catch (e) {
      slot.innerHTML = `<div class="hint" style="margin-top:8px;color:var(--amber)">生成失败：${esc(e.message)}</div>`;
    }
  }

  /* ============================================================
   * 用提示词直接生成短片
   *
   * 原本是「从 30 个固定场景挑一个」，但文字转影片本来就不受场景限制——
   * 提示词写什么就生成什么。所以改成：AI 读这本书写出提示词 → 使用者
   * 随便改 → 直接生成。30 个模板退成灵感参考，点一下变成可编辑的提示词。
   * ========================================================== */

  /* AI 根据书的内容写几组影片提示词（花钱很少，约 US$0.01-0.05） */
  /* ============================================================
   * 给生产流水线用的「真实 AI」接口
   *
   * STEP 2「AI 读完整本书」与 STEP 4「AI 批量写稿」以前都是模板产生的，
   * 名字叫 AI 但没有 AI。这里把它们接上真实模型。engine.js 透过
   * window.AIREAL 呼叫，接不上或关闭时会自动退回原本的模板逻辑，
   * 不会把流程弄坏。
   * ========================================================== */
  /* 从模型的回覆里挖出 JSON。
   *
   * 以前是「整段 parse 不过，就用 /\{[\s\S]*\}/ 抓一次」。那个样式是贪婪的，
   * 从第一个 { 一路吃到最后一个 }——模型只要多回一个区块（讲一句解释、
   * 再补一个 JSON），抓下来的就是两坨黏在一起的东西，parse 直接炸，
   * 画面上只剩一句 "Unexpected non-whitespace character after JSON at
   * position 89"，没人看得懂那是什么意思。
   *
   * 改成真的做括号配对：逐个 { 往后扫，遇到字串要跳过（字串里的大括号
   * 不算数、跳脱字元也要处理），配平了就试 parse。取第一个 parse 得过
   * 而且有内容的。 */
  function jsonChunks(text) {
    const out = [];
    const s = String(text || '');
    for (let i = 0; i < s.length; i++) {
      if (s[i] !== '{') continue;
      let depth = 0, inStr = false, esc = false;
      for (let j = i; j < s.length; j++) {
        const ch = s[j];
        if (esc) { esc = false; continue; }
        if (ch === '\\') { if (inStr) esc = true; continue; }
        if (ch === '"') { inStr = !inStr; continue; }
        if (inStr) continue;
        if (ch === '{') depth++;
        else if (ch === '}') {
          depth--;
          if (depth === 0) { out.push(s.slice(i, j + 1)); i = j; break; }
        }
      }
      if (out.length >= 8) break;      // 防呆：回来一整篇文章时不要扫到天荒地老
    }
    return out;
  }

  function aiJson(content, wantKey) {
    const raw = String(content || '').replace(/^\s*```(?:json)?\s*|\s*```\s*$/g, '');
    try {
      const j = JSON.parse(raw);
      if (j && typeof j === 'object') return j;
    } catch (e) { /* 往下用括号配对再试 */ }

    const chunks = jsonChunks(raw);
    let fallback = null;
    for (const c of chunks) {
      let j;
      try { j = JSON.parse(c); } catch (e) { continue; }
      if (!j || typeof j !== 'object') continue;
      /* 指定了要哪个栏位就优先挑有那个栏位的——模型有时会先回一个
       * 无关的小物件（例如 {"status":"ok"}），那个不是我们要的。 */
      if (wantKey && j[wantKey] != null) return j;
      if (!fallback && Object.keys(j).length) fallback = j;
    }
    if (fallback) return fallback;
    /* 失败时要讲清楚它到底回了什么，否则每次都得重跑一遍才知道发生什么事。 */
    throw new Error('模型没有回传可解析的 JSON。它回的是：'
      + raw.replace(/\s+/g, ' ').slice(0, 160) + (raw.length > 160 ? '…' : ''));
  }

  /* ============================================================
   * 每一步开跑前先选模型
   *
   * Model Router 后面挂着几十个模型，价钱差到上百倍（最便宜的每百万
   * token 不到 $0.04，最贵的 $216）。以前程式码里写死 quality:'auto'，
   * 等于每一步都让平台自己挑，使用者完全没得选、也不知道花了多少钱。
   *
   * 现在每个会花钱的 AI 步骤按下去，先弹一个窗：列出目前真的可用的
   * 模型（清单是即时跟服务要的，不是写死的）、各自价钱、还有这一步
   * 大概会花多少。选完才真的送出去。
   *
   * 选择会记住（settings.modelPicks），也可以勾「以后不用再问」变成
   * 静默模式（settings.askModel = false），之后直接用记住的那个。
   * 系统设置页可以随时改回来。
   * ========================================================== */

  /* 每个步骤：给什么用、预设挑什么、大概吃多少 token（用来估这一步的花费）。
   * est 的数字是从各步骤真正送出去的 prompt 长度与 maxTokens 抓的概数，
   * 不是精确值——目的是让人在选贵模型前有个量级概念。 */
  const AI_STEPS = {
    read:    { t: 'AI 读完整本书', kind: 'text', def: 'auto', est: { in: 13000, out: 2500 },
               note: '把上传的内文整本送进模型读一遍，产出摘要、核心论点、金句与读者画像。内文很长，便宜的模型通常也够用。' },
    script:  { t: 'AI 批量写稿', kind: 'text', def: 'auto', est: { in: 3000, out: 6000 },
               note: '写标题、Hook 与完整口播稿。这一步最影响影片好不好看，值得用好一点的模型。' },
    rewrite: { t: '重写这一篇口播稿', kind: 'text', def: 'auto', est: { in: 1500, out: 2000 },
               note: '只重写你现在打开的这一篇，其他稿子不受影响。' },
    prompts: { t: 'AI 写影片提示词', kind: 'text', def: 'auto', est: { in: 1200, out: 1200 },
               note: '读这本书写几组「文字转影片」提示词，输出很短，很便宜。' },
    image:   { t: '生成场景示意图', kind: 'image', def: 'fast', est: null,
               note: '一次只生一张，价钱看档位与模型，大约 US$0.03-0.15。' },
    persona: { t: '改写成本人口吻', kind: 'text', def: 'auto', est: { in: 2500, out: 3000 },
               note: '把已经写好的口播稿，按本人的语速、口气、正式度与口头禅重写一遍。改的是讲法，不改观点。' },
    chars:   { t: 'AI 读出书里的角色', kind: 'text', def: 'auto', est: { in: 1500, out: 1500 },
               note: '读这本书抽出几个可以「演出来」的角色，输出很短，很便宜。' },
    portrait: { t: '生成角色定妆照', kind: 'image', def: 'fast', est: null,
               note: '一次只生一张，价钱看档位与模型，大约 US$0.03-0.15。' },
    cast:    { t: 'AI 读出书里的主要人物', kind: 'text', def: 'auto', est: { in: 1600, out: 2200 },
               note: '「书影（书中人物）」用的：读这本书抓出男主角、女主角与其他主要人物，输出很短，很便宜。' },
    intro:   { t: 'AI 写人物自述稿', kind: 'text', def: 'auto', est: { in: 1800, out: 2400 },
               note: '一次只写一个人物的自述稿（钩子／他是谁、在哪里／他心里的事／收尾，十几段加一篇成稿），输出不长，很便宜。' }
  };

  /* 「策略」不是模型，是「让平台自己挑」。文字与图像两边的可选档位不一样：
   * 文字走 /v1/chat/completions 的 auto/cheap/smart/fast；
   * 图像走 /v1/tasks 的 fast/balanced/premium 品质档。 */
  const MP_TEXT_STRATEGY = ['auto', 'cheap', 'smart', 'fast'];
  const MP_IMAGE_STRATEGY = [
    { id: 'fast', name: '快速档（平台自己挑）', desc: '最省，约 $0.03 一张' },
    { id: 'balanced', name: '平衡档（平台自己挑）', desc: '约 $0.05 一张' },
    { id: 'premium', name: '高品质档（平台自己挑）', desc: '约 $0.07 一张' }
  ];

  let mpScaleNote = '';        // 这一次要跑几段、写几篇——份量不同价钱差很多，要写在窗口上
  let mpCache = null;          // 模型清单只抓一次，之后重复用
  let mpPending = null;        // 目前有人在等这个窗口的结果

  async function mpModels() {
    if (mpCache) return mpCache;
    const r = await hgFetch('/api/ai/models', {}, 12000);
    mpCache = (r.models || []).filter(m => m.kind === 'model');
    return mpCache;
  }

  const mpMoney = n => n == null ? '—'
    : (n >= 1 ? '$' + n.toFixed(2) : '$' + n.toFixed(n >= 0.1 ? 3 : 4).replace(/0+$/, '').replace(/\.$/, ''));

  function mpPriceText(m) {
    if (m.unit === 'image') return `约 ${mpMoney(m.inPrice)} / 张`;
    if (m.unit === 'character') return `约 ${mpMoney(m.inPrice)} / 百万字符`;
    if (m.unit === 'audio-minute') return `约 ${mpMoney(m.inPrice)} / 分钟`;
    if (m.inPrice == null) return '价钱未公布';
    return `每百万 token：输入 ${mpMoney(m.inPrice)} · 输出 ${mpMoney(m.outPrice)}`;
  }

  /* 这一步用这个模型大概花多少。估得出来才显示——估不出来宁可不写，
   * 也不要编一个数字给人当真。 */
  /* 这一步的用量不一定是固定的：读一本 15 万字的书要切成十几段送，
   * 花费是「一段的钱 × 段数」。所以估算值允许呼叫端当场覆盖，
   * 不然窗口上写的价钱会跟实际差一个数量级。 */
  let mpEstOverride = null;

  function mpStepCost(step, m) {
    const est = mpEstOverride || (AI_STEPS[step] && AI_STEPS[step].est);
    if (!est || !m || m.unit !== 'tokens' || m.inPrice == null) return '';
    const c = m.inPrice * est.in / 1e6 + (m.outPrice || 0) * est.out / 1e6;
    return `这一步约 ${nf(est.in)} 输入 + ${nf(est.out)} 输出 tokens，${c < 0.001 ? '<$0.001' : mpMoney(c)}`;
  }

  function mpCandidates(step, models) {
    const kind = AI_STEPS[step].kind;
    const want = kind === 'image' ? ['image-gen'] : ['text-chat', 'reasoning', 'multimodal'];
    const list = (models || []).filter(m => want.indexOf(m.modality) >= 0);
    // 便宜的排前面：绝大多数步骤便宜的就够用，把贵的摆后面比较不会误按
    const w = m => (m.inPrice == null ? 1e9 : m.inPrice * 3 + (m.outPrice || 0));
    return list.sort((a, b) => w(a) - w(b));
  }

  /* 把选到的 id 换成真正要送给后端的欄位。
   * 策略字串走 quality，具体模型走 model——后端两个都收。 */
  function mpPayload(step, id) {
    const kind = AI_STEPS[step].kind;
    if (kind === 'image') {
      return MP_IMAGE_STRATEGY.some(x => x.id === id) ? { quality: id } : { model: id, quality: 'fast' };
    }
    return MP_TEXT_STRATEGY.indexOf(id) >= 0 ? { quality: id } : { model: id };
  }

  function mpLabel(step, id) {
    const cfg = AI_STEPS[step];
    if (!cfg) return id;
    if (cfg.kind === 'image') {
      const s = MP_IMAGE_STRATEGY.find(x => x.id === id);
      if (s) return s.name;
    } else if (MP_TEXT_STRATEGY.indexOf(id) >= 0) {
      return { auto: '智能路由（平台自己挑）', cheap: '最省钱', smart: '最聪明', fast: '最快' }[id] || id;
    }
    const m = (mpCache || []).find(x => x.id === id);
    return m ? m.name : id;
  }

  /* 平台说话不算话时，要当场讲出来。
   *
   * 2026-08-14 实测：Model Router 的 /v1/chat/completions 只认
   * auto/cheap/smart/fast 这四个策略词，送任何一个具体模型 id（包括
   * 瞎编的名字）它都照收不误，然后一律退回最便宜的 mistral-nemo。
   * 也就是说「指定模型」这件事服务方还没实作。
   *
   * 我们不能因此假装没事——使用者挑了 Claude Opus 5，实际跑的却是
   * 别的模型，这必须让他知道。回应里的 model 欄位是平台自己报的
   * 「真的用了谁」，拿它跟使用者挑的比对，不一样就明讲。
   * 等服务方补上指定模型的支援，这个提示自然就不会再出现。 */
  function mpServedNote(pick, served) {
    if (!pick || !pick.model || !served) return '';
    if (served === pick.model) return '';
    return `注意：你挑的是「${mpLabel('script', pick.model)}」，但平台实际用的是「${served}」`
      + '——这个路由服务目前还不支援指定模型，只认「让平台自己挑」那四个档位。';
  }

  function mpSaved(step) {
    const picks = STORE.s.settings.modelPicks || {};
    return picks[step] || AI_STEPS[step].def;
  }

  function mpRow(id, name, desc, price, checked) {
    return `<label style="display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);
        border-radius:10px;margin-bottom:8px;cursor:pointer">
      <input type="radio" name="mp-choice" value="${esc(id)}" ${checked ? 'checked' : ''} style="margin-top:3px">
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;font-weight:600">${esc(name)}</div>
        ${desc ? `<div class="hint" style="margin-top:2px">${esc(desc)}</div>` : ''}
        ${price ? `<div class="hint" style="margin-top:2px">${esc(price)}</div>` : ''}
      </div>
    </label>`;
  }

  function mpRender(step, models, err) {
    const cfg = AI_STEPS[step];
    const sel = mpSaved(step);
    const strat = cfg.kind === 'image'
      ? MP_IMAGE_STRATEGY.map(x => mpRow(x.id, x.name, x.desc, '', sel === x.id)).join('')
      : [['auto', '智能路由（平台自己挑）', '按这段内容的难度自动挑一个划算的模型。不确定时选这个。'],
         ['cheap', '最省钱', '永远挑最便宜的可用模型。'],
         ['smart', '最聪明', '永远挑当下最强的旗舰模型，最贵。'],
         ['fast', '最快', '永远挑反应最快的那一档。']]
        .map(x => mpRow(x[0], x[1], x[2], '', sel === x[0])).join('');

    const list = mpCandidates(step, models);
    const modelRows = list.map(m => mpRow(m.id, m.name,
      [m.vendor, m.context ? '上下文 ' + Math.round(m.context / 1000) + 'K' : '', m.openWeight ? '开源权重' : '']
        .filter(Boolean).join(' · '),
      [mpPriceText(m), mpStepCost(step, m)].filter(Boolean).join(' · '),
      sel === m.id)).join('');

    modal(`选择这一步用的模型 · ${esc(cfg.t)}`, `
      <div class="explain" style="margin:0 0 16px;border-left-color:var(--violet)">
        <div class="ex-r"><span class="ex-k">这一步在做什么</span><span>${esc(cfg.note)}</span></div>
        ${mpScaleNote ? `<div class="ex-r"><span class="ex-k">这次的份量</span><span>${esc(mpScaleNote)}</span></div>` : ''}
        <div class="ex-r"><span class="ex-k">怎么选</span><span>不确定就用第一个「智能路由」。清单里的价钱是服务方即时回报的，不是写死的。</span></div>
      </div>
      ${err ? `<div class="hint" style="color:var(--amber);margin-bottom:12px">拿不到完整模型清单（${esc(err)}），
        只能先用下面这几个档位；网络恢复后重开这个窗口就会有完整清单。</div>` : ''}
      <div class="label" style="margin-bottom:8px">让平台自己挑</div>
      ${strat}
      ${modelRows ? `<div class="label" style="margin:16px 0 8px">指定一个模型（共 ${list.length} 个）</div>
        <div class="hint" style="color:var(--amber);margin:-2px 0 10px">
          先说清楚：这个路由服务目前<b>还不支援指定模型</b>（2026-08-14 实测，连不存在的模型名它都照收，
          然后一律退回最便宜的那个）。所以下面这些现在挑了不一定算数——真的跑完之后，
          我们会把平台实际用了哪个模型如实告诉你。想稳的话请用上面那四个档位。
        </div>${modelRows}` : ''}
      <label style="display:flex;gap:10px;align-items:center;margin-top:14px;cursor:pointer">
        <input type="checkbox" id="mp-remember">
        <span style="font-size:14px">以后每一步都直接用记住的模型，不用再问我
          <span class="hint">（系统设置里可以随时改回来）</span></span>
      </label>`,
      `<button class="btn" data-modal-act="mp-cancel">取消，这一步不跑</button>
       <button class="btn btn-primary" data-modal-act="mp-ok" data-step="${esc(step)}">用这个模型开始</button>`, true);
  }

  /* 开窗口问，回传要送给后端的欄位；使用者取消就回传 null。
   * 静默模式（askModel === false）直接用记住的那个，不打断。 */
  async function askModel(step, scale) {
    if (!AI_STEPS[step]) return {};
    mpEstOverride = (scale && scale.est) || null;
    mpScaleNote = (scale && scale.note) || '';
    if (STORE.s.settings.askModel === false) return mpPayload(step, mpSaved(step));
    let models = null, err = '';
    try { models = await mpModels(); } catch (e) { err = e.message; }
    return new Promise(resolve => {
      /* 顺序不能反：modal() 一开始就会跑一遍「关闭钩子」，而下面那个钩子
       * 会把 mpPending 当成使用者取消收掉。先画窗口、再挂上等待中的
       * Promise，才不会自己把自己取消掉（一开窗就直接回 null）。 */
      mpRender(step, models, err);
      mpPending = { step, resolve };
    });
  }

  function mpFinish(step, ok) {
    const pend = mpPending;
    mpPending = null;
    if (!pend) return;
    if (!ok) { closeModal(); return pend.resolve(null); }
    const r = document.querySelector('input[name="mp-choice"]:checked');
    const id = (r && r.value) || mpSaved(step);
    const picks = STORE.s.settings.modelPicks || (STORE.s.settings.modelPicks = {});
    picks[step] = id;
    if (($('#mp-remember') || {}).checked) STORE.s.settings.askModel = false;
    STORE.update();
    closeModal();
    pend.resolve(mpPayload(step, id));
  }

  /* 使用者按右上角叉叉或 Esc 关掉窗口，等于取消这一步——一定要把那个
   * Promise 收掉，否则呼叫端会永远卡在 await，画面停在「生成中」不动。 */
  UI.onClose(() => {
    if (!mpPending) return;
    const pend = mpPending; mpPending = null;
    pend.resolve(null);
  });

  /* 系统设置页要显示「这一步现在预设用哪个模型」，也要能直接改。 */
  window.MODELPICK = {
    steps: () => AI_STEPS,
    savedId: mpSaved,
    label: step => mpLabel(step, mpSaved(step)),
    async change(step) {
      const was = STORE.s.settings.askModel;
      STORE.s.settings.askModel = true;      // 设置页点「更改」当然要弹窗
      const r = await askModel(step);
      if (!r) STORE.s.settings.askModel = was;   // 取消就什么都别动
      STORE.update();
      if (window.render) render();
      if (r) toast('已设为：' + mpLabel(step, mpSaved(step)), 'ok');
    }
  };

  window.AIREAL = {
    /* 公开展示版没有写入凭证，一律走模板；使用者也可以在系统设置关掉 */
    canUse: () => hgCanWrite() && STORE.s.settings.realAI !== false,

    /* ============================================================
     * STEP 2：真的读完整本书
     *
     * 以前只送前 12,000 字——一本书 8-15 万字，等于只读了开头 10%，
     * 介面上却写「AI 读完整本书」。现在改成整本切段送、逐段读，
     * 最后再把各段的结果收敛成一份全书分析。
     *
     * 为什么要切段：模型的上下文放得下十几万字，但一次送这么多，单一请求
     * 会跑很久，很容易撞到闸道器的执行时间上限（这条路上实测过 502）。
     * 切成段各自都很快，其中一段失败也不会让整本书作废。
     * ========================================================== */
    async readBook(p, onProgress) {
      const text = STORE.getBookText(p.id) || (p.parsed && p.parsed.raw) || '';
      if (!text.trim()) return null;          // 没有原始内文就没得读，交回模板逻辑

      const chunks = splitBook(text, 12000, 24);
      const say = onProgress || function () {};

      /* 花费跟段数成正比，选模型的窗口一定要按这次的实际份量报价，
       * 不然使用者看到的是「一段」的钱，实际付的是「十几段」的钱。 */
      const pick = await askModel('read', {
        est: { in: 12500 * chunks.n + 1500, out: 900 * chunks.n + 2500 },
        note: `这本书约 ${text.length.toLocaleString()} 字，会切成 ${chunks.n} 段逐段读，`
          + `最后再收敛成一份全书分析——总共 ${chunks.n + 1} 次呼叫。`
          + (chunks.clipped ? `（内文超过单次上限，这一轮只读前 ${chunks.n} 段）` : '')
      });
      // 取消选模型＝这一步不要真的花钱跑。丢出去让 engine 退回本地规则抽取。
      if (!pick) throw new Error('已取消选择模型');

      const call = (prompt, system, maxTokens) => hgFetchSlow('/api/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ prompt, system, maxTokens, wantJson: true }, pick))
      });

      // ---- 逐段读 ----
      let done = 0, model = null;
      say(`共 ${chunks.n} 段，开始逐段阅读…`);
      const parts = await pool(chunks.list, 3, async (chunk, i) => {
        try {
          const r = await call(`这是《${p.title}》的第 ${i + 1} 段（共 ${chunks.n} 段），读完做重点摘要。

【本段内文】
${chunk}

只输出这个 JSON：
{"summary":"这一段讲了什么，150-250 字",
 "themes":["这一段的论点，最多 3 条"],
 "quotes":["这一段里值得引用的原句，最多 4 条，必须原文照抄，不要改写"],
 "pains":["这一段点到的读者痛点，最多 2 条"]}`,
            '你是出版社的内容编辑，只输出 JSON，不要任何解释文字。', 1200);
          model = model || r.model;
          say(`已读完 ${++done}/${chunks.n} 段`);
          return aiJson(r.content);
        } catch (e) {
          done++;
          say(`第 ${i + 1} 段读取失败（${e.message}），跳过这一段`);
          return null;
        }
      });

      const got = parts.filter(Boolean);
      if (!got.length) throw new Error('每一段都没读成功');

      // ---- 收敛成全书分析 ----
      say(`${got.length} 段读完，正在收敛成全书分析…`);
      const merged = {
        summaries: got.map((x, i) => `[第${i + 1}段] ${x.summary || ''}`).join('\n'),
        themes: dedupe(got.reduce((a, x) => a.concat(x.themes || []), [])),
        quotes: dedupe(got.reduce((a, x) => a.concat(x.quotes || []), [])),
        pains: dedupe(got.reduce((a, x) => a.concat(x.pains || []), []))
      };

      const r2 = await call(`下面是《${p.title}》${p.author ? '（作者' + p.author + '）' : ''}逐段读完之后的笔记，把它收敛成一份全书分析。

【各段摘要】
${merged.summaries.slice(0, 9000)}

【各段整理出的论点】${merged.themes.slice(0, 40).join('；')}
【各段摘录的原句】${merged.quotes.slice(0, 60).join('；')}
【各段点到的痛点】${merged.pains.slice(0, 20).join('；')}

要求：论点要是贯穿全书的，不是某一段的枝节；金句一律从上面的原句里挑，不要自己造。

只输出这个 JSON：
{"summary":"全书摘要 200-300 字",
 "themes":["核心论点，5 条"],
 "quotes":["书中金句，8-12 条，从上面的原句里挑"],
 "audiences":[{"name":"读者画像名称","size":30,"note":"特征"}],
 "pains":["这些读者的痛点，4 条"],
 "hots":["可搭配的热点话题标签，5 个，带 # 号"]}`,
        '你是出版社的内容编辑，只输出 JSON，不要任何解释文字。', 2500);

      const j = aiJson(r2.content);
      if (!j.summary) throw new Error('模型没有回传摘要');
      // 收敛那一步偶尔会把金句改写掉，缺的话拿逐段抄回来的原句补上
      if (!j.quotes || j.quotes.length < 4) j.quotes = merged.quotes.slice(0, 12);

      return {
        data: j, model: r2.model || model,
        note: mpServedNote(pick, r2.model),
        read: { chunks: chunks.n, ok: got.length, chars: text.length, clipped: chunks.clipped }
      };
    },

    /* ============================================================
     * 改写成本人口吻
     *
     * 以前这一步是 DATA.applyPersona()：在 hook 前面黏一句随机口头禅、
     * 再把分数随机加个 5-10 分，如此而已。日志却报「台词已改写」
     * 「语气与节奏已调整」——讲的跟做的完全是两回事。
     *
     * 现在真的把稿子连同人格参数送进模型重写。要守住三件事：
     *   1. 只改讲法，不改观点——改完还是这本书的意思，不能借机瞎编
     *   2. 时间轴与句数原样保留——后面要按 t 去切镜头、对口型，
     *      句数一变，镜头表和影片时长就全乱了
     *   3. 口头禅最多植入 1-2 处，多了就变口癖，比不改还难听
     * 分批送：一次两篇，输出量跟写稿那步差不多，再多会撞到闸道器上限。
     * ========================================================== */
    async rewritePersona(p, onProgress) {
      const say = onProgress || function () {};
      const list = (p.scripts || []).filter(s => s && (s.dialogue || []).length);
      if (!list.length) throw new Error('还没有稿子可以改');

      const pa = STORE.s.persona;
      const speaker = (STORE.s.account && STORE.s.account.name) || '主讲人';
      const batch = 2;
      const rounds = Math.ceil(list.length / batch);

      const pick = await askModel('persona', {
        est: { in: 1400 * rounds, out: 1800 * rounds },
        note: `要把 ${list.length} 篇稿子按「${speaker}」的口吻重写一遍，分 ${rounds} 批送。`
      });
      if (!pick) throw new Error('已取消选择模型');

      const rule = `【要改成谁的口吻】${speaker}
【语速】${pa.speed}/100（越高越快、句子越短）
【亲和】${pa.warmth}/100（越高越像跟朋友聊天，越低越冷静）
【正式度】${pa.formal}/100（越高越书面，越低越口语）
【停顿密度】${pa.pause}/100　【强调力度】${pa.emphasis}/100
${(pa.habits || []).length ? '【口头禅】' + pa.habits.join('、') + '——全篇最多自然植入 1-2 句，不要每句都用' : ''}
${(pa.values || []).length ? '【说话原则】' + pa.values.join('；') : ''}
${(pa.forbid || []).length ? '【绝对不能出现】' + pa.forbid.join('；') : ''}`;

      let done = 0, model = null;
      say(`共 ${list.length} 篇，分 ${rounds} 批改写…`);

      const packs = await pool(Array.from({ length: rounds }, (_, i) => i), 2, async (ri) => {
        const from = ri * batch;
        const part = list.slice(from, from + batch);
        const payload = part.map((s, i) => ({
          i: from + i,
          hook: s.hook || '',
          cta: s.cta || '',
          dialogue: (s.dialogue || []).map(x => ({ t: x.t, cue: x.cue, text: x.text }))
        }));
        try {
          const r = await hgFetchSlow('/api/ai/chat', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(Object.assign({
              system: '你是资深口播编剧，专门把稿子改写成特定人物的说话方式。只输出 JSON，不要任何解释文字。',
              maxTokens: 3000, wantJson: true,
              prompt: `把下面这几篇口播稿改写成这个人自己讲出来的样子。

${rule}

【要改的稿子】
${JSON.stringify(payload)}

铁规矩（违反就等于白改）：
- **只改讲法，不改观点**：书里的论点、引用的原句、举的例子都要保留，不要自己新增书里没有的说法
- **每篇的句数与每句的 t 时间区间原样照抄**，一句都不能多、不能少、不能改时间——后面要按这个切镜头
- 口头禅全篇最多 1-2 处，放在自然的地方；不要每句开头都黏一句
- 改完要像人在讲话：短句、有停顿、有语气，不要书面语和排比句
- cue 那一栏也跟着改，写清楚这一句该用什么语气、哪里停

只输出：{"scripts":[{"i":原本的编号,"hook":"改写后的开场","cta":"改写后的结尾引导","dialogue":[{"t":"照抄","cue":"语气与节奏提示","text":"改写后的台词"}]}]}`
            }, pick))
          });
          const out = (aiJson(r.content).scripts || []).filter(x => x && x.dialogue && x.dialogue.length);
          model = model || r.model;
          done += out.length;
          say(`已改写 ${done}/${list.length} 篇`);
          return out;
        } catch (e) {
          say(`第 ${from + 1}-${from + part.length} 篇改写失败（${e.message}），这几篇维持原样`);
          return [];
        }
      });

      const got = packs.reduce((a, x) => a.concat(x), []);
      if (!got.length) throw new Error('每一批都没改成功');

      /* 只覆盖真的改回来的那几篇，其余保持原样——绝不能因为某一批失败，
       * 就把没改到的稿子也标成「已套用人格」。 */
      got.forEach(o => {
        const s = list[o.i];
        if (!s) return;
        // 句数对不上就不要用：时间轴与镜头表会跟着错乱，宁可这一篇不改
        if ((o.dialogue || []).length !== (s.dialogue || []).length) return;
        s.hook = o.hook || s.hook;
        s.cta = o.cta || s.cta;
        s.dialogue = s.dialogue.map((line, i) => Object.assign({}, line, {
          cue: (o.dialogue[i] && o.dialogue[i].cue) || line.cue,
          text: (o.dialogue[i] && o.dialogue[i].text) || line.text
        }));
        s.persona = true;
        s.personaByAI = true;
        s.personaModel = model || null;
      });

      const applied = list.filter(s => s.personaByAI).length;
      STORE.update();
      return { applied, total: list.length, model, note: mpServedNote(pick, model) };
    },

    /* ============================================================
     * STEP 4：每一篇稿子都真的让模型写
     *
     * 以前只写 3 篇，其余 11 篇是模板骨架，介面上却一律显示成稿子，
     * 使用者要逐篇点「重写」才会变成真的。现在整批都送，分批写完，
     * 哪一批失败就只有那一批退回模板，而且如实说是哪几篇。
     * ========================================================== */
    async writeScripts(p, onProgress) {
      const say = onProgress || function () {};
      const total = 14;                 // 与 DATA.genScripts(p, 14) 对齐
      const batch = 2;                  // 一次两篇：再多输出会撞到闸道器的时间上限
      const rounds = Math.ceil(total / batch);

      const pick = await askModel('script', {
        est: { in: 1200 * (rounds + 1) + 1800, out: 2600 * rounds + 2500 },
        note: `这一步会写 20 个标题、20 个 Hook、10 个开场白，加上 ${total} 篇完整口播稿——`
          + `口播稿分 ${rounds} 批送，总共 ${rounds + 1} 次呼叫。`
      });
      if (!pick) throw new Error('已取消选择模型');

      const ctx = `【书名】《${p.title}》${p.author ? '，作者' + p.author : ''}
【摘要】${(p.summary || '（未提供）').slice(0, 600)}
【核心论点】${(p.themes || []).slice(0, 5).join('；') || '（未提供）'}
【金句】${(p.quotes || []).slice(0, 6).join('；') || '（未提供）'}
【读者痛点】${(p.pains || []).slice(0, 4).join('；') || '（未提供）'}`;

      /* 原文片段。以前这一步只给模型看「摘要 + 主题 + 金句」——那三样
       * 全是模型自己先前写出来的东西，等于让它照着自己的印象再编一次，
       * 讲得出大方向、讲不出书里的细节，想举例只能凭空生。
       * 现在按位置从原文切段送进去，并要求每篇都标出处，写出来的内容
       * 才回溯得到书的哪一章、哪一段。 */
      const bookText = (window.STORE && STORE.getBookText(p.id)) || (p.parsed && p.parsed.raw) || '';
      const idx = p.bookIndex;
      /* 取样要摊开在全书。只拿前面几段的话，14 篇稿会全在讲第一章。 */
      const allPas = (idx && bookText && window.BOOKLIB)
        ? BOOKLIB.spread(bookText, idx, Math.min(3 * rounds, 30)) : [];

      const call = (prompt, maxTokens) => hgFetchSlow('/api/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({
          system: '你是短视频编剧，只输出 JSON，不要任何解释文字。',
          maxTokens, wantJson: true, prompt
        }, pick))
      });

      // 第一段：标题 / Hook / 开场白（输出短，很快）
      say('正在写标题、Hook 与开场白…');
      const r1 = await call(`帮这本书写短视频文案。

${ctx}

要求：标题要有具体信息或反差，不要「这本书改变了我」这种空话；Hook 是前 3 秒的第一句，要让人停下来。
${hookLibBlock()}

只输出：{"titles":["20 个标题"],"hooks":["20 个 Hook"],"opens":["10 个开场白，比 Hook 长一点"]}`, 2500);
      const d1 = aiJson(r1.content);
      if (!d1.titles || !d1.titles.length) throw new Error('模型没有回传标题');

      /* 口播稿分批写。
       *
       * 一定要写「单人口播」而不是双人对谈：数字人服务一次只能让一个形象、
       * 一个声音念一段话。写成对谈的话，生成时只能由同一个人把两边台词都念完，
       * 稿子和做得出来的影片对不上。 */
      const speaker = (window.STORE && STORE.s.account && STORE.s.account.name) || '主讲人';
      const duration = defaultVideoDuration();
      const minWords = Math.max(80, Math.round(duration * 4.1));
      const maxWords = Math.max(minWords + 30, Math.round(duration * 5.3));
      /* 五类选题框架。这份表是我们自己的行业知识——别人抄得走程式码，
       * 抄不走「哪五类会让人停下来」。 */
      const TYPES = (window.DATA && DATA.HOOK_TYPES) || [];

      let wrote = 0;
      say(`标题写完，开始写 ${total} 篇口播稿（分 ${rounds} 批）…`);
      const packs = await pool(Array.from({ length: rounds }, (_, i) => i), 2, async (ri) => {
        const from = ri * batch;
        const want = Math.min(batch, total - from);
        const pas = allPas.slice(ri * 3, ri * 3 + 3);
        /* 每一篇指定一种选题类型，轮著来。以前只给一串形容词（故事切入、
         * 痛点切入…），同一本书跑两次选题会飘，也说不出为什么选这一段。
         * 写死成五类之后，模型的工作变成「从书里各找一个符合这类的段落」。 */
        const types = Array.from({ length: want }, (_, k) => TYPES[(from + k) % TYPES.length]);
        const typeBlock = types.map((ty, k) => `第 ${from + k + 1} 篇 —— ${ty.name}` + NL
          + `　要找什么：${ty.find}` + NL
          + `　句型：${ty.shape}` + NL
          + `　好的例子：${ty.good}` + NL
          + `　${ty.bad}`).join(NL + NL);
        const pasLines = pas.map((x, k) => `[${k + 1}] 出处：${x.label}` + NL + `原文：${x.text.slice(0, 380)}`);
        const pasBlock = pas.length
          ? NL + '【这几篇可以用的原文片段】（下面是书里的原话，不是摘要）' + NL
            + pasLines.join(NL + NL) + NL + NL
            + '引用规则：要引用就从上面这几段里挑，一字不差地抄，不要改写、不要润色。'
            + '没有列在上面的书中情节、人名、数字，一律不准写——宁可不举例，也不要编。' + NL
          : '';
        try {
          const r = await call(`帮这本书写 ${want} 篇 ${duration} 秒短视频口播稿，这是第 ${from + 1}-${from + want} 篇。

${ctx}
${pasBlock}
【这几篇各要写成哪一类】
${typeBlock}

${hookLibBlock()}
形式：**一个人对着镜头讲**，全程只有一个说话的人，不要写成两个人对谈、不要有主持人问答。
这个人叫「${speaker}」，所有台词的 speaker 都填「${speaker}」。

写法要求：
- 开头 3 秒就要让人停下来，别铺陈、别说「大家好」
- 讲人话，短句，像跟朋友说话，不要书面语和排比句
- 中间要有一次自问自答（预设观众的反驳，然后回应）
- ${pas.length ? '要从上面的原文片段里引用一句原话（一字不差），并留一个停顿' : '可以引用书里的话，但不确定的就不要写'}
- 结尾给一个今天就能做的具体动作，再自然带出引导语
- 每篇 8-10 句，全篇加起来 ${minWords}-${maxWords} 字（${duration} 秒念得完）

只输出：{"scripts":[{"title":"标题","hook":"前3秒开场","quote":"你引用的那句原话，没引用就留空","source":"引用的是第几个片段，填数字，没引用就留空","dialogue":[{"t":"0.0-4.0s","speaker":"${speaker}","cue":"语气与节奏提示","text":"台词"}],"cta":"结尾引导语"}]}`, 3000);
          const list = (aiJson(r.content).scripts || []).filter(x => x && x.dialogue && x.dialogue.length);
          /* 模型回的 source 是「第几个片段」，把它换成人看得懂的出处，
           * 并留下原文——之后要查证「这句到底是不是书里写的」才有依据。 */
          list.forEach((sc, k2) => {
            const ty = types[k2];
            if (ty) { sc.hookType = ty.key; sc.hookTypeName = ty.name; }
            const k = parseInt(sc.source, 10);
            const hit = k >= 1 && pas[k - 1];
            if (hit) { sc.source = hit.label; sc.sourceText = hit.text; }
            else { delete sc.source; }
          });
          wrote += list.length;
          say(`口播稿 ${wrote}/${total} 篇`);
          return list;
        } catch (e) {
          say(`第 ${from + 1}-${from + want} 篇没写成（${e.message}），这几篇退回模板`);
          return [];
        }
      });

      const scripts = packs.reduce((a, x) => a.concat(x), []);
      return {
        data: Object.assign({}, d1, { scripts }),
        model: r1.model, note: mpServedNote(pick, r1.model),
        write: { want: total, got: scripts.length }
      };
    }
  };

  const NL = String.fromCharCode(10);

  /* ---- 发布登记 ----
   *
   * 「发布与数据」那一页的图表全是假的（页面自己有标注）。真数据要从
   * 哪来？现在一支都还没真的发出去，就算今天把各平台 API 全接上，回来
   * 的也是一片空白——数据回流是最后一块，不是现在这块。
   *
   * 所以先做最土的版本：发出去之后自己填三个数字。丑，但是真的。
   * 累积三、五十支之后才有第一份能回答「哪一类选题在哪个平台有用」的
   * 对照表，那时候再谈自动化才有东西可自动。
   *
   * 选题类型在登记的当下就抄一份存起来，不要之后再回头去 join——稿子
   * 可能被改、被删，抄下来的那一刻才是当时真正发出去的东西。 */
  function pubLog() {
    if (!Array.isArray(STORE.s.publishLog)) STORE.s.publishLog = [];
    return STORE.s.publishLog;
  }

  function pubToday() {
    const d = new Date();
    const p2 = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
  }

  function pubRegisterModal(videoId) {
    const p = STORE.current;
    const v = p && (p.videos || []).find(x => x.id === videoId);
    if (!v) return;
    const sc = (p.scripts || []).find(x => x.id === v.scriptId) || {};
    modal('登记这一支发到哪了', `
      <div class="explain" style="margin:0 0 14px">
        <div class="ex-r"><span class="ex-k">为什么要填</span><span>
          平台的播放数据没办法自动拿回来。先登记发到哪、什么时候发的，
          <b>过几天再回来补播放量</b>，累积几十支之后就能看出哪一类选题真的有人看。</span></div>
      </div>
      <div style="font-weight:650;margin-bottom:10px">《${esc(p.title)}》 · ${esc(v.title)}</div>
      <div class="row2">
        <div class="field"><div class="label">发到哪个平台</div>
          <select class="input" id="pub-plat">
            ${DATA.PLATFORMS.map(x => `<option value="${esc(x.name)}" ${x.name === v.platformName ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
          </select></div>
        <div class="field"><div class="label">发布日期</div>
          <input class="input" type="date" id="pub-date" value="${pubToday()}"></div>
      </div>
      <div class="field"><div class="label">影片连结<span class="hint" style="margin-left:6px;font-weight:400">选填，之后回来查数据方便</span></div>
        <input class="input" id="pub-url" placeholder="贴上发布后的网址"></div>`,
      `<button class="btn" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-primary" data-modal-act="pub-save" data-id="${esc(videoId)}">登记</button>`);
  }

  function pubSave(videoId) {
    const p = STORE.current;
    const v = p && (p.videos || []).find(x => x.id === videoId);
    if (!v) return;
    const sc = (p.scripts || []).find(x => x.id === v.scriptId) || {};
    pubLog().unshift({
      id: 'pb_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      videoId, projectId: p.id, book: p.title, title: v.title,
      hookType: sc.hookType || null, hookTypeName: sc.hookTypeName || '',
      platform: ($('#pub-plat') || {}).value || '',
      at: ($('#pub-date') || {}).value || pubToday(),
      url: (($('#pub-url') || {}).value || '').trim(),
      views: null, likes: null, comments: null
    });
    v.status = '已发布';
    STORE.update(); closeModal(); render();
    toast('登记好了。过几天回「发布与数据」补上播放量', 'ok');
  }

  /* 手动登记一笔。
   * 「登记发布」那颗按钮只长在真影片上，但真实情况是：影片可能在别处
   * 剪好、已经发出去了，系统里根本没有对应的档案。发布记录的价值在于
   * 累积够多笔才看得出规律，不该被「一定要从这里生成」卡住。 */
  function pubManualModal() {
    const types = (window.DATA && DATA.HOOK_TYPES) || [];
    modal('手动登记一笔发布', `
      <div class="explain" style="margin:0 0 14px">
        <div class="ex-r"><span class="ex-k">什么时候用</span><span>
          影片在别的地方剪好、已经发出去了，系统里没有对应档案的时候。
          <b>选题类型一定要选</b>——那张对照表就是靠它分组的。</span></div>
      </div>
      <div class="row2">
        <div class="field"><div class="label">影片标题 <span style="color:var(--red)">*</span></div>
          <input class="input" id="pm-title" placeholder="例如：努力没有杠杆，选择才有"></div>
        <div class="field"><div class="label">哪本书</div>
          <input class="input" id="pm-book" value="${esc((STORE.current && STORE.current.title) || '')}"></div>
      </div>
      <div class="row2">
        <div class="field"><div class="label">发到哪个平台</div>
          <select class="input" id="pm-plat">
            ${DATA.PLATFORMS.map(x => `<option value="${esc(x.name)}">${esc(x.name)}</option>`).join('')}
          </select></div>
        <div class="field"><div class="label">选题类型</div>
          <select class="input" id="pm-type">
            <option value="">（未分类）</option>
            ${types.map(t => `<option value="${esc(t.key)}">${esc(t.name)}</option>`).join('')}
          </select></div>
      </div>
      <div class="row2">
        <div class="field"><div class="label">发布日期</div>
          <input class="input" type="date" id="pm-date" value="${pubToday()}"></div>
        <div class="field"><div class="label">影片连结<span class="hint" style="margin-left:6px;font-weight:400">选填</span></div>
          <input class="input" id="pm-url" placeholder="贴上发布后的网址"></div>
      </div>`,
      `<button class="btn" onclick="UI.closeModal()">取消</button>
       <button class="btn btn-primary" data-modal-act="pm-save">登记</button>`);
  }

  function pubManualSave() {
    const val = id => (($('#' + id) || {}).value || '').trim();
    const title = val('pm-title');
    if (!title) return toast('至少要填影片标题', 'warn');
    const types = (window.DATA && DATA.HOOK_TYPES) || [];
    const ty = types.find(t => t.key === val('pm-type'));
    pubLog().unshift({
      id: 'pb_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      videoId: null, projectId: (STORE.current || {}).id || null,
      book: val('pm-book'), title,
      hookType: ty ? ty.key : null, hookTypeName: ty ? ty.name : '',
      platform: val('pm-plat'), at: val('pm-date') || pubToday(), url: val('pm-url'),
      views: null, likes: null, comments: null, manual: true
    });
    STORE.update(); closeModal(); render();
    toast('登记好了。过几天回来补播放量', 'ok');
  }

  function pubSet(id, key, value) {
    const rec = pubLog().find(x => x.id === id);
    if (!rec) return;
    const n = value === '' ? null : Number(value);
    rec[key] = (n == null || isNaN(n)) ? null : n;
    rec.updatedAt = Date.now();
    STORE.update();
  }

  function pubDel(id) {
    STORE.s.publishLog = pubLog().filter(x => x.id !== id);
    STORE.update(); render();
  }

  /* 按选题类型汇总。这张表就是第二项那五类框架的验收成绩单——
   * 没有它，五类只是我们自己觉得有道理。 */
  function pubByType() {
    const rows = {};
    pubLog().forEach(r => {
      if (r.views == null) return;             // 还没填数字的不算进平均
      const k = r.hookTypeName || '（未分类）';
      if (!rows[k]) rows[k] = { n: 0, views: 0, likes: 0 };
      rows[k].n++; rows[k].views += r.views; rows[k].likes += (r.likes || 0);
    });
    return Object.keys(rows).map(k => ({
      name: k, n: rows[k].n,
      avg: Math.round(rows[k].views / rows[k].n),
      like: Math.round(rows[k].likes / rows[k].n)
    })).sort((a, b) => b.avg - a.avg);
  }

  window.PUBLOG = { list: pubLog, byType: pubByType };

  /* ---- 钩子库 ----
   *
   * 你看完一支影片说「这个开头没有想停下来听的感觉」——这个判断是整个
   * 产品里最难复制的东西，模型给不出来。但它以前只存在于对话里，讲完
   * 就没了，下一次写稿又从零开始。
   *
   * 现在把它存起来：你按过👍的进范例，按过👎的进反例，写稿时一起送进
   * 提示词。用得越久，写出来的越像你要的。 */
  const HOOKLIB_MAX = 40;

  function hookLib() {
    const st = STORE.s.settings;
    if (!st.hookLib) st.hookLib = { good: [], bad: [] };
    return st.hookLib;
  }

  function hookMark(text, verdict) {
    const t = String(text || '').trim();
    if (!t) return;
    const lib = hookLib();
    /* 同一句只能站一边，改判就把另一边移掉。 */
    lib.good = lib.good.filter(x => x.t !== t);
    lib.bad = lib.bad.filter(x => x.t !== t);
    const side = verdict === 'good' ? lib.good : verdict === 'bad' ? lib.bad : null;
    if (side) {
      side.unshift({ t, at: Date.now(), book: (STORE.current && STORE.current.title) || '' });
      if (side.length > HOOKLIB_MAX) side.length = HOOKLIB_MAX;
    }
    STORE.update();
    render();
    toast(verdict === 'good' ? '记住了，之后写稿会照这种感觉写'
      : verdict === 'bad' ? '记住了，之后会避开这种写法' : '已取消标记', 'ok');
  }

  /* views-*.js 是另一个 IIFE，拿不到这里的区域函式。曝露读取用的两支
   * 就够——写入一律走 data-act，集中在一个地方好追。 */
  window.HOOKS = {
    verdict: hookVerdict,
    count: () => ({ good: hookLib().good.length, bad: hookLib().bad.length })
  };

  function hookVerdict(text) {
    const t = String(text || '').trim();
    const lib = hookLib();
    if (lib.good.some(x => x.t === t)) return 'good';
    if (lib.bad.some(x => x.t === t)) return 'bad';
    return null;
  }

  /* 送进提示词的那一段。好的当范例、坏的当反例，两边都给模型才知道
   * 界线在哪——只给好例子，它会照抄；只给坏例子，它不知道该往哪写。 */
  function hookLibBlock() {
    const lib = hookLib();
    if (!lib.good.length && !lib.bad.length) return '';
    let out = NL + '【这个人认可的开头】（照这种感觉写，不要照抄原句）' + NL;
    out += (lib.good.slice(0, 6).map(x => '· ' + x.t).join(NL) || '（还没有）');
    if (lib.bad.length) {
      out += NL + NL + '【这个人否掉的开头】（不要写成这样）' + NL
        + lib.bad.slice(0, 4).map(x => '· ' + x.t).join(NL);
    }
    return out + NL;
  }

  /* 把整本书切成模型吃得下的段落。优先断在段落与句号，不要把一句话
   * 从中间剖开——切在句子中间会让那一段的摘要变得莫名其妙。 */
  function splitBook(text, size, maxChunks) {
    const list = [];
    let i = 0;
    while (i < text.length && list.length < maxChunks) {
      let end = Math.min(i + size, text.length);
      if (end < text.length) {
        const tail = text.slice(end - 400, end);
        const br = Math.max(tail.lastIndexOf('\n\n'), tail.lastIndexOf('。'), tail.lastIndexOf('\n'));
        if (br > 0) end = end - 400 + br + 1;
      }
      list.push(text.slice(i, end));
      i = end;
    }
    return { list, n: list.length, clipped: i < text.length };
  }

  /* 有限并发：全部同时送会被服务方挡下来，一次一个又太慢。 */
  async function pool(items, limit, fn) {
    const out = new Array(items.length);
    let next = 0;
    const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
      while (next < items.length) {
        const i = next++;
        out[i] = await fn(items[i], i);
      }
    });
    await Promise.all(workers);
    return out;
  }

  function dedupe(list) {
    const seen = Object.create(null);
    return (list || []).filter(x => {
      const k = String(x || '').trim();
      if (!k || seen[k]) return false;
      seen[k] = 1; return true;
    });
  }

  /* ============================================================
   * 书中角色 —— 让书里的主角走进影片
   *
   * 其他影片都是「一个人对着镜头讲」，这一条路径不一样：先把书里的人物
   * 读出来，生成这个角色长什么样，再让他自己出现在画面里。
   *
   *   aiReadCharacters()  文字模型读书 → 抽出角色（几乎不花钱，约 US$0.01-0.05）
   *   aiCharPortrait(i)   image 任务 → 定妆照（一张约 US$0.03-0.07）
   *   charToPrompt(i)     角色写成影片提示词 → 落到既有的提示词生成流程
   *
   * 刻意不另外开一条生成影片的新路径：影片一律走下面那张卡的
   * 「生成这支短片」，扣额度的地方只有一个，使用者才不会不小心花钱。
   * ========================================================== */
  async function aiReadCharacters() {
    const p = STORE.current;
    if (!p) return;
    if (!hgCanWrite()) return hgDemoNotice();

    const box = $('#ai-char-status');
    const setMsg = (t, color) => {
      if (box) box.innerHTML = `<div class="hint" style="color:${color || 'var(--violet-2)'};margin-bottom:12px">${esc(t)}</div>`;
    };
    const pick = await askModel('chars');
    if (!pick) return toast('已取消，没有去读角色', 'warn');
    setMsg('✨ AI 正在读这本书找角色，约 10-30 秒…');

    const prompt = `读这本书，抽出 3-4 个可以「演出来」的角色，让他们出现在推荐这本书的短视频画面里。

【书籍】《${p.title}》${p.author ? '，作者' + p.author : ''}
【摘要】${p.summary || '（未提供）'}
【核心论点】${(p.themes || []).slice(0, 5).join('；') || '（未提供）'}
【金句】${(p.quotes || []).slice(0, 5).join('；') || '（未提供）'}
【读者痛点】${(p.pains || []).slice(0, 4).join('；') || '（未提供）'}

要求：
- 小说、传记、历史这类书，就抽书里真正的人物，名字用书里的名字
- 非虚构、商管、知识类的书如果没有故事人物，就抽书里出现的真实人物、案例主角，
  或是一个能代表读者的具体化身（要给他一个具体的名字与身份，不要写成「读者A」）
- look 要具体到画得出来：年龄、性别、脸型、发型、穿着、神情、时代与地域感，60-100 字
- scene 是这个角色在书里最有代表性的一幕：他在哪里、在做什么、气氛如何，40-80 字
- 只写书里真的有依据的角色，不要凭空发明与全书无关的人

只输出这个 JSON：
{"characters":[{"name":"角色名字","role":"他在书里是谁","look":"外貌描述","scene":"代表场景"}]}`;

    try {
      const r = await hgFetchSlow('/api/ai/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({
          prompt, system: '你是选角导演，只输出 JSON，不要任何解释文字。',
          maxTokens: 2000, wantJson: true
        }, pick))
      }, 60000);
      const out = aiJson(r.content);
      const list = (out.characters || [])
        .filter(x => x && (x.name || x.look))
        .map(x => ({
          id: DATA.uid('ch'), name: x.name || '', role: x.role || '',
          look: x.look || '', scene: x.scene || '', intro: {}
        }));
      if (!list.length) throw new Error('模型没有读出角色');
      p.characters = (p.characters || []).concat(list);
      STORE.update(); render();
      toast(`AI 从书里读出 ${list.length} 个角色，可以直接改`, 'ok');
      const note = mpServedNote(pick, r.model);
      if (note) toast(note, 'warn');
    } catch (e) {
      setMsg('AI 读角色失败：' + e.message, 'var(--red)');
    }
  }

  /* 角色定妆照：一次只生一张、按一次生一次，跟场景示意图同样的成本考量 */
  /* 定妆照的历史。每一张都真的花过钱，覆盖掉就再也找不回来——
   * 形象生成那边早就有这个机制，人物这边是后来另外写的，漏了。 */
  const PORTRAIT_MAX = 6;

  function portraitHistory(c) {
    if (!Array.isArray(c.portraitHistory)) c.portraitHistory = [];
    return c.portraitHistory;
  }

  function portraitHistoryAdd(c, url) {
    if (!url) return;
    const h = portraitHistory(c);
    if (h.indexOf(url) >= 0) return;
    h.unshift(url);
    if (h.length > PORTRAIT_MAX) h.length = PORTRAIT_MAX;
  }

  async function aiCharPortrait(i) {
    const p = STORE.current;
    const c = p && (p.characters || [])[i];
    if (!c) return;
    if (!hgCanWrite()) return hgDemoNotice();
    if (!(c.look || '').trim() && !(c.name || '').trim()) return toast('先写下这个角色的名字或长相', 'warn');

    const pick = await askModel('portrait');
    if (!pick) return toast('已取消，没有生成定妆照', 'warn');

    /* 节点一定要在选完模型之后才抓。
     * 选模型是一个弹窗，关掉的时候整页会重画——在那之前抓到的节点
     * 已经从画面上被换掉了，往上面写字什么都不会发生。使用者按了
     * 「重生成定妆照」完全没有反应、也看不到进度，就是这个原因。 */
    const slot = $(`.char-portrait[data-for="${i}"]`);
    if (slot) {
      slot.innerHTML = '<div class="hint" style="color:var(--violet-2);border:1px dashed var(--violet-2);'
        + 'border-radius:10px;padding:22px 10px;text-align:center;margin-bottom:10px">'
        + '✨ 正在生成定妆照，约 20-30 秒…<br><span style="opacity:.75">这段时间可以先去改别的，做好会自己出现</span></div>';
      slot.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }
    toast('开始生成「' + (c.name || '这个人物') + '」的定妆照，约 20-30 秒', 'ok');

    /* 提示词沿用形象生成那边调过的摄影语言。
     * 「真实人像摄影风格」六个字模型没有依据，出来就是磨皮塑胶脸；
     * 给镜头、光圈、景深、肤质这些具体条件才像真人。 */
    const extra = (c.portraitNote || '').trim();
    const prompt = `${c.name ? c.name + '，' : ''}${c.role || ''}${c.look ? '，' + c.look : ''}。`
      + (c.scene ? `场景：${c.scene}。` : '')
      + (extra ? `${extra}。` : '')
      + '中景，人物在画面中间偏一侧、上半身入镜并留出头顶空间，'
      + '脸部正对镜头、五官完整清晰不被遮挡，'
      + '以全画幅相机搭配 85mm 定焦镜头拍摄，光圈 f/2.0，浅景深，背景自然虚化，'
      + '光线有层次，皮肤保有真实质感与细微毛孔、脸上有自然的光泽与瑕疵，'
      + '发丝与衣物织纹清晰可见，神情自然，像抓拍而不是摆拍，'
      + '纪实人像摄影，色调自然不过饱和，高解析度，'
      + '不要磨皮、不要美颜滤镜、不要塑胶感皮肤、不要过度锐化、'
      + '不要 HDR 感、不要过曝、不要 3D 渲染感、不要插画或卡通风格，'
      + '不要侧脸、不要背影、不要多个人、不要任何文字或浮水印、'
      + '不要出现任何品牌标志或商标。';

    try {
      const r = await hgFetchSlow('/api/ai/image', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({
          prompt,
          deevid: { resolution: '1K', size: 'NINE_BY_SIXTEEN' }
        }, pick))
      });
      if (!r.url) throw new Error('平台没有回传图片网址');
      portraitHistoryAdd(c, c.portraitUrl);   // 旧的先收进历史，再换新的
      c.portraitUrl = r.url;
      portraitHistoryAdd(c, r.url);
      c.assetId = null; c.assetFor = null;    // 换脸了，旧的 asset 作废
      STORE.update(); render();

      /* 立刻把图存进数位人服务（这一步免费）。
       * 生成服务的图片网址只托管一段时间，过期之后再去抓就是 404——
       * 使用者按「生成影片」才发现「取图失败」，而那通常是几小时后，
       * 定妆照早就调满意了，等于要重来一遍。存过之后影片那一步用的是
       * asset id，跟原网址过不过期无关。 */
      try {
        const up = await hgFetchSlow(
          `/api/heygen/upload?url=${encodeURIComponent(r.url)}&name=${encodeURIComponent('portrait.png')}`,
          { method: 'POST' });
        if (up.assetId) { c.assetId = up.assetId; c.assetFor = r.url; STORE.update(); }
      } catch (e) {
        /* 存不进去不影响看图，之后生成影片时还会再试一次。 */
      }
      toast('定妆照好了。不满意可以改「长什么样」或补充说明再生成一次', 'ok');
    } catch (e) {
      slot.innerHTML = `<div class="hint" style="color:var(--amber);margin-bottom:10px">生成失败：${esc(e.message)}</div>`;
    }
  }

  /* 角色 → 影片提示词。写完落到下面那张卡，使用者可以再改，
   * 真正扣额度的「生成这支短片」还是要自己按。 */
  function charToPrompt(i) {
    const p = STORE.current;
    const c = p && (p.characters || [])[i];
    if (!c) return;
    const name = (c.name || '').trim() || '书中人物';
    if (!(c.look || '').trim() && !(c.scene || '').trim()) return toast('先写下这个角色的长相或代表场景', 'warn');

    p.videoPrompts = (p.videoPrompts || []).concat([{
      label: `${name}走进影片`,
      text: `${name}${c.role ? `（${c.role}）` : ''}出现在画面里。`
        + (c.look ? `人物外貌：${c.look}。` : '')
        + (c.scene ? `场景：${c.scene}。` : '')
        + `人物有明确的动作与情绪，镜头缓慢推进，电影感打光，真实摄影风格，直式 9:16 构图，`
        + `不要出现文字或字幕。内容与《${p.title}》这本书有关。`
    }]);
    STORE.update(); render();
    toast(`已把「${name}」写成影片提示词，在下面可以再改`, 'ok');
    const box = $('#ai-prompt-status');
    if (box) box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  /* ============================================================
   * 书影（书中人物） —— 单独功能，介面在 views-roles.js
   *
   * 做的是跟主理人口播同一条数字人生成路径（一张脸 + 一个声音 + 一段
   * 台词 → 服务端合成），差别只有两处：脸用的是这个人物的定妆照，
   * 台词是他的第一人称自述稿。所以这里不另外接新的外部服务，
   * 只是把既有的那条路径换一张脸、换一段稿子。
   *
   *   rolesLoadVoices()    进这一页时把声音清单抓回来（唯读、免费）
   *   aiReadCast()         读书 → 抓出男主角／女主角／其他主要人物
   *   aiCharIntro(i)       写这个人物的自述稿（分段结构见 views-roles.js）
   *   composeIntro(i)      各段 → 拼成要念的台词（纯拼接，不花钱）
   *   charVideoConfirm / doCharVideo / pollCharVideo   真的生成影片
   *
   * 会花钱的只有两处：定妆照（很便宜，共用「创意分镜」那支函式）与最后
   * 生成影片（一支约 US$1-3）。影片跟流水线共用同一个月额度闸门，
   * 用满就挡下来，不会因为多开一个入口就多一条绕过额度的路。
   * ========================================================== */

  const charJobs = {};       // 人物 id -> true，挡住同一个人物被重复送出
  let rolesVoiceTried = false;

  /* views-roles.js 在另一个 IIFE 里，拿不到 HG；开一个只读的窗口给它。 */
  window.HGINFO = { voices: () => HG.voices, canWrite: () => hgCanWrite() };

  /* 声音清单：人物自述页每个人物都要挑声音，但这一页没有 #hg-status 挂载点，
   * hgAutoCheck() 那一套用不上，所以自己抓一次就好。抓失败不挡任何事——
   * 页面照样能用「数字人 / 声音」那边已经选好的声音。 */
  async function rolesLoadVoices() {
    if (HG.voices.length || rolesVoiceTried) return;
    rolesVoiceTried = true;
    try {
      const vo = await hgFetch('/api/heygen/voices');
      HG.voices = (vo.voices || []).map(decorateVoice);
      hgRestoreChoice();
      if (!HG.voiceId && HG.voices[0]) { HG.voiceId = HG.voices[0].id; hgSaveChoice(); }
      if (route === 'roles' && HG.voices.length) render();
    } catch (e) {
      rolesVoiceTried = false;   // 网络断一下而已，下次进这一页再试一次
    }
  }

  /* 人物在生成影片这段期间要被跨页、跨重整地追踪，光靠阵列索引不够用
   * （中间删掉一个人，索引就对到别人身上了），所以给一个稳定的 id。 */
  function ensureCharId(c) {
    if (!c.id) { c.id = DATA.uid('ch'); STORE.update(); }
    return c.id;
  }

  function findChar(pid, cid) {
    const p = (STORE.s.projects || []).find(x => x.id === pid);
    if (!p) return null;
    const c = (p.characters || []).find(x => x.id === cid);
    return c ? { p, c } : null;
  }

  /* 读出这本书的主要人物。跟「创意分镜 · 书中角色」共用同一份名单，
   * 差别是这里会多要一个「角色定位」——男主角、女主角还是配角，
   * 决定的是使用者先做谁，不是给模型的技术栏位。 */
  /* 平台只给英文代号和性别。中文名与年龄感是我们自己补的对照表，
   * 补完之后清单才看得懂，自动配对也才有「年龄」这个维度可以配。 */
  function decorateVoice(v) {
    const z = window.DATA && DATA.voiceZh ? DATA.voiceZh(v.name) : null;
    if (z) { v.zh = z.zh; v.age = z.age; v.note = z.note; }
    else if (v.accent === 'multi') { v.zh = ''; v.age = null; v.note = '多语声音，腔调不保证，先试听'; }
    else { v.zh = ''; v.age = null; v.note = ''; }
    return v;
  }

  function voiceLabel(v) {
    if (!v) return '';
    /* 中文名摆前面，英文代号留着——之后要对帐、要回报问题都靠它。 */
    return (v.zh ? v.zh + '（' + v.name + '）' : v.name);
  }

  const AGE_NAME = { old: '年长', mid: '中年', young: '年轻', child: '儿童' };

  /* 删掉的人物存进 STORE，不是记忆体。
   *
   * 第一版只用一个模块变数存最后删掉的那个——使用者重新整理一次页面，
   * 那份暂存就没了，「复原」形同虚设。花钱产出来的东西，复原一定要撑得过
   * 关页面、撑得过隔天再来。
   *
   * 留最近 10 个，够救回手滑，也不会把浏览器空间塞爆。 */
  const TRASH_MAX = 10;

  function charTrash() {
    if (!Array.isArray(STORE.s.trashChars)) STORE.s.trashChars = [];
    return STORE.s.trashChars;
  }

  function charTrashAdd(pid, idx, c) {
    const t = charTrash();
    t.unshift({ pid, idx, at: Date.now(), c });
    if (t.length > TRASH_MAX) t.length = TRASH_MAX;
    STORE.update();
  }

  /* 只列出当前这本书删掉的——跨书列出来只会让人以为救错人。 */
  function charTrashFor() {
    const p = STORE.current;
    return p ? charTrash().filter(x => x.pid === p.id) : [];
  }

  window.CHARX = {
    canRestore: () => charTrashFor().length > 0,
    trash: charTrashFor
  };

  /* ---- 按人物特徵自动配声音 ----
   *
   * 以前每个人物都套「数位人／声音」那一页选的同一个声音。实测七十一岁
   * 的男主角配到 Xiaocheng（女声），而且要等影片做出来（一支 US$1-3）
   * 才听得出来。
   *
   * 人物的性别在 cast（男主角／女主角）和 look（「七十岁左右的男性」）
   * 里写得很清楚，声音清单本来就带 gender——两边对起来是一句话的事，
   * 没有理由让人自己去挑。
   *
   * 只做性别与腔调的配对。年龄配不了：声音清单没有年龄这个栏位，
   * 硬要从名字猜「哪个听起来比较老」就是瞎掰。所以配完还是要试听，
   * 介面上也这样写。 */
  function guessGender(c) {
    const t = [c.cast, c.look, c.role, c.name].filter(Boolean).join(' ');
    if (/男主角|男配角/.test(c.cast || '')) return 'male';
    if (/女主角|女配角/.test(c.cast || '')) return 'female';
    /* look 里通常会写「…岁左右的男性」「二十多岁的女性」。 */
    if (/女性|女子|女孩|女士|太太|妈妈|母亲|奶奶|阿姨|小姐/.test(t)) return 'female';
    if (/男性|男子|男孩|先生|爸爸|父亲|爷爷|叔叔|大叔|老先生/.test(t)) return 'male';
    return null;
  }

  /* 腔调优先序：台湾腔 → 语气自然 → 其他中文 → 大陆腔。粤语一律排除，
   * 选到了整支影片都会变粤语。 */
  const VOICE_RANK = { tw: 0, multi: 1, other: 2, cn: 3 };

  /* 把人物的实际年龄折成声音清单用的四档。 */
  function ageBucket(age) {
    if (age == null) return null;
    if (age >= 60) return 'old';
    if (age >= 30) return 'mid';
    if (age >= 13) return 'young';
    return 'child';
  }

  function pickVoiceFor(c, used) {
    const want = guessGender(c);
    const wantAge = ageBucket(guessAge(c));
    const pool = (HG.voices || []).filter(v => v.accent !== 'yue');
    if (!pool.length) return null;
    const scored = pool
      .filter(v => !want || !v.gender || v.gender === 'unknown' || v.gender === want)
      .map(v => ({
        v,
        /* 性别对得上排最前（差 100，绝对压过其他条件）；再来是腔调（每档
         * 差 10）；最后是「有没有被别人用过」。
         * 用过的扣 25 是刻意大于一档腔调：宁可换一个腔调稍差但不重复的，
         * 也不要三个人物配到同一个声音——几支影片放在一起会像同一个人
         * 在讲话，这一页的意义就没了。 */
        s: (want && v.gender === want ? 0 : 1) * 100
          /* 年龄摆在腔调前面：七十一岁的老板宁可配一个大陆腔的成熟男声，
           * 也不要一个听起来三十岁的台湾腔男声——年龄不对，一开口就出戏，
           * 腔调不对顶多是口音。 */
          + (wantAge && v.age ? (v.age === wantAge ? 0 : 4) : 2) * 10
          + (VOICE_RANK[v.accent] == null ? 4 : VOICE_RANK[v.accent])
          + ((used && used.indexOf(v.id) >= 0) ? 25 : 0)
      }))
      .sort((a, b) => a.s - b.s);
    return scored.length ? scored[0].v : null;
  }

  /* 从人物描述里把年龄读出来。「七十一岁」「二十多岁」「五十多岁」
   * 这几种写法 AI 都会用；中文数字也要认，不然「六十三岁」抓不到。 */
  const CN_NUM = { 零: 0, 一: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  function guessAge(c) {
    const t = [c.look, c.role, c.name].filter(Boolean).join(' ');
    const m = t.match(/([0-9]{2})\s*[岁歲]/);
    if (m) return Number(m[1]);
    /* 中文：十位 + （可选）个位，例如「七十一岁」「六十岁」「二十多岁」 */
    const cn = t.match(/([一二三四五六七八九])十([一二三四五六七八九])?\s*[多余幾几]?\s*[岁歲]/);
    if (cn) return CN_NUM[cn[1]] * 10 + (cn[2] ? CN_NUM[cn[2]] : 0);
    if (/老先生|老太太|老人|爷爷|奶奶/.test(t)) return 70;
    return null;
  }

   * 声音只有性别没有年龄，同一个男声念七十岁和念二十岁一模一样。 */
  function speedForAge(age) {
    if (age == null) return null;
    if (age >= 65) return 0.85;
    if (age >= 50) return 0.9;
    if (age >= 35) return 0.95;
    if (age <= 25) return 1.05;
    return 1;
  }

      if (v) { c.voiceId = v.id; c.voiceName = v.name; used.push(v.id); n++; }
      const sp = speedForAge(guessAge(c));
      if (sp != null) c.voiceSpeed = sp;
    });
    return n;
  }

  /* ============================================================
   * 台词清洗
   *
   * 提示词已经写明「不要舞台指示、不要括号说明」，但模型不见得照做，
   * 而我们以前对回传内容一个字都没清就直接送去念——结果影片里真的会
   * 念出「钩子：」「（微笑）」「**」这种东西。使用者回报过。
   *
   * 这里是送去合成之前的最后一道拦截：不管模型怎么写，一律洗过。
   * 括号内容一律拿掉——口播稿里的括号几乎都是给人看的动作或语气指示，
   * 不是要念出来的。
   * ========================================================== */

  /* 直接列出自述稿实际用的段落名，加上其他常见结构词。
   * 只有命中这份清单才剥掉行首标签——像「他说：」这种真正的对白不能动，
   * 所以宁可列得具体，也不要用「凡是冒号就剥」那种粗暴规则。 */
  const SPEECH_LABELS = ['一句话钩子', '钩子', '开场',
    '我是谁', '这本书的情景', '我周遭的环境', '我现在的行为', '我的心态',
    '我怎么走到这一步', '我卡在哪里', '我身边的人', '我的想法',
    '我后来明白了什么', '我接下来要做什么', '我最想说的一句话', '给看到这里的你',
    '身份', '情景', '环境', '行为', '心态', '前史', '困境', '想法', '领悟',
    '金句', '收尾', 'CTA', '结尾', '旁白', '独白', '台词', '口播'];

  function cleanSpeech(t) {
    let s = String(t || '').replace(/\r/g, '');

    // 整段被引号包起来的，拆掉最外层（句子里真的在引述的不动）
    s = s.replace(/^\s*[「『“"']([\s\S]*)[」』”"']\s*$/, '$1');

    // Markdown 粗体记号
    s = s.replace(/\*\*|__/g, '');

    s = s.split('\n').map(function (line) {
      let x = line.trim();
      x = x.replace(/^#{1,6}\s*/, '');        // 标题
      x = x.replace(/^[-–—•·]\s+/, '');       // 条列
      x = x.replace(/^\d+[.、)]\s*/, '');     // 编号
      const m = x.match(/^([^：:]{1,10})[：:]\s*/);
      if (m) {
        for (let i = 0; i < SPEECH_LABELS.length; i++) {
          if (m[1].indexOf(SPEECH_LABELS[i]) >= 0) { x = x.slice(m[0].length); break; }
        }
      }
      return x;
    }).join('\n');

    // 【】里的是时间轴与语气标注，给人看的，不是要念的
    s = s.replace(/【[^】]{0,60}】/g, '');

    // 括号内容（动作／语气指示）
    s = s.replace(/[（(][^（()）]{0,40}[)）]/g, '');

    // 模型常见的开场白，可能连着好几层（「好的，以下是⋯」），所以一直剥到没有为止
    for (let g = 0; g < 4; g++) {
      const before = s;
      s = s.replace(/^(好的|当然|没问题|以下是|这是|这里是)[^，,。！？\n]{0,10}[，,：:]\s*/, '');
      if (s === before) break;
    }

    // 收尾：多余空白、行首孤立标点
    s = s.replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n');
    s = s.split('\n').map(function (x) {
      return x.replace(/^[，,、。.；;：:]+/, '').trim();
    }).join('\n');

    return s.trim();
  }

  /* 各段 → 要念的台词。纯拼接，不呼叫模型、不花钱，
   * 所以改完其中一段可以随便重按。留空的段落直接跳过——
   * 有人只想讲钩子＋一句话，那也是一支能用的影片。 */
  function composeIntroText(c) {
    const it = c.intro || {};
    const list = window.ROLE_INTRO_PARTS || [];
    const name = (c.name || '').trim();
    /* 「我是谁」那一段没写时自动补一句自报身份，但位置照原顺序摆——
     * 补在钩子后面，不要跑到最前面去把钩子挤掉（第一句就自报名字，
     * 是短视频最快被划走的开头）。写过就不补，免得念两次。 */
    const fallbackId = name ? `我是${name}${(c.role || '').trim() ? '，' + c.role.trim() : ''}。` : '';
    let real = 0;

  function pollCharVideo(pid, cid) {
    const tick = async () => {
      const hit = findChar(pid, cid);
      if (!hit) { delete charJobs[cid]; return; }     // 人物或项目被删了
      const { c } = hit;
      if (!c.heygenId) { delete charJobs[cid]; return; }
      try {
        const s = await hgFetch('/api/status?service=heygen-video&id=' + encodeURIComponent(c.heygenId));
        if (s.status === 'completed' && s.videoUrl) {
          delete charJobs[cid];

          // 额度跟流水线共用同一本帐：影片真的做出来了才算用掉一支
          const st = STORE.s.settings;
          st.quotaUsed = Math.min(st.quotaTotal, st.quotaUsed + 1);
          STORE.update(); render();
          STORE.log('ok', `人物自述影片已生成：${c.name || '未命名人物'}`);
          toast(`「${c.name || '这个人物'}」的自述短片做好了`, 'ok');

        }

          delete charJobs[cid];

        // 查询失败通常是暂时的（网络断一下），继续再试，不要直接判死
        setTimeout(tick, 8000);
      }
    };
    tick();
  }

  let pv = null;                       // 播放状态

  /* 挑一个「台湾口音的国语」语音。
     注意 zh-HK 是香港粤语，绝对不能选——之前误把它跟 zh-TW 并列，
     导致系统语音清单里粤语排前面时就被选中。
     语音清单是非同步载入的，要等 voiceschanged。 */
  const CANTONESE = /zh[-_]HK|yue|cantonese|粤|粵/i;
  function pickVoice() {
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { return null; }
    const ok = vs.filter(v => !CANTONESE.test(v.lang) && !CANTONESE.test(v.name));
    return ok.find(v => /zh[-_]TW/i.test(v.lang))                    // 台湾国语，最优先
      || ok.find(v => /台灣|臺灣|Taiwan/i.test(v.name))
      || ok.find(v => /zh[-_]CN|zh[-_]Hans/i.test(v.lang))           // 退而求其次：普通话
      || ok.find(v => /^zh/i.test(v.lang))
      || ok.find(v => /Chinese|中文|國語|国语|普通话/i.test(v.name))
      || null;
  }

  /* ---- 依性别把可用的中文语音分池 ----
     六个配音员如果共用同一个语音，只靠音高语速区分，听起来就是同一个人。
     微软语音命名有规律：曉/晓/Xiao 多为女声，雲/云/Yun 多为男声。 */
  const FEMALE = /曉|晓|Xiao|Hsiao|雅婷|Yating|涵涵|HanHan|慧慧|Huihui|瑤瑤|瑶瑶|Yaoyao|Tracy|Zhiyu|Female|女/i;
  const MALE = /雲|云|Yun|志威|Zhiwei|康康|Kangkang|Danny|Male|男/i;

  function voicePool() {
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { return { male: [], female: [], all: [] }; }
    const zh = vs.filter(v => !CANTONESE.test(v.lang) && !CANTONESE.test(v.name) && /^zh/i.test(v.lang));
    // 台湾国语排最前面，其余中文次之
    const rank = v => (/zh[-_]TW/i.test(v.lang) ? 0 : 1);
    zh.sort((a, b) => rank(a) - rank(b));
    return {
      all: zh,
      male: zh.filter(v => MALE.test(v.name) && !FEMALE.test(v.name)),
      female: zh.filter(v => FEMALE.test(v.name) && !MALE.test(v.name))
    };
  }

  /* 给某个配音员指派一个实际语音：同性别的池子里依序取，尽量各不相同 */
  function voiceForActor(id) {
    const pool = voicePool();
    const list = DATA.VOICES;
    const a = list.find(v => v.id === id);
    if (!a) return pickVoice();
    const same = list.filter(v => v.gender === a.gender);
    const idx = Math.max(0, same.findIndex(v => v.id === id));
    const src = a.gender === '男' ? pool.male : pool.female;
    if (src.length) return src[idx % src.length];
    // 该性别没有对应语音，退回任何中文语音（页面会提示）
    return pool.all[idx % Math.max(1, pool.all.length)] || pickVoice();
  }

  /* 声库诊断：告诉使用者这台电脑能不能真的区分不同声音 */
  function libraryDiag() {
    const pool = voicePool();
    return {
      total: pool.all.length, male: pool.male.length, female: pool.female.length,
      assigned: DATA.VOICES.map(a => {
        const v = voiceForActor(a.id);
        return { id: a.id, name: a.name, gender: a.gender, voice: v ? v.name : null, lang: v ? v.lang : null };
      })
    };
  }
  window.__libraryDiag = libraryDiag;

  /* 目前实际用到的系统语音，供人格页显示（各台电脑装的语音不同） */
  function voiceInfo() {
    let vs = [];
    try { vs = speechSynthesis.getVoices() || []; } catch (e) { return null; }
    const v = pickVoice();
    if (!v) return { none: true, total: vs.length };
    return {
      name: v.name, lang: v.lang,
      isTW: /zh[-_]TW/i.test(v.lang) || /台灣|臺灣|Taiwan/i.test(v.name),
      total: vs.length
    };
  }
  window.__voiceInfo = voiceInfo;

  /* 把实际用到的系统语音显示在人格页，方便判断是不是台湾国语 */
  function showVoiceInfo() {
    // 每张配音员卡显示实际指派到的语音
    const cards = document.querySelectorAll('.vc-sys');
    if (cards.length) {
      const d = libraryDiag();
      cards.forEach(c => {
        const a = d.assigned.find(x => x.id === c.dataset.vid);
        c.textContent = a && a.voice ? '系统语音：' + a.voice.replace(/^Microsoft\s*/, '') : '此机无可用语音';
      });
      const box = document.getElementById('voice-sys');
      if (box) {
        if (d.total <= 1) {
          box.innerHTML = `⚠ 这台电脑只有 <b>${d.total}</b> 个中文语音，六位配音员会听起来一模一样。<br>
            装多几个语音才分得出来（Windows 设定 → 时间与语言 → 语言与地区 → 中文（繁体，台湾）→ 语音）。`;
          box.style.color = 'var(--amber)'; return;
        }
        if (!d.male || !d.female) {
          box.innerHTML = `⚠ 这台电脑的中文语音里${!d.male ? '没有男声' : '没有女声'}（共 ${d.total} 个），
            ${!d.male ? '男声' : '女声'}配音员只能用现有语音代替，性别听起来会不对。`;
          box.style.color = 'var(--amber)'; return;
        }
        box.innerHTML = `此机可用中文语音 <b>${d.total}</b> 个（男 ${d.male} / 女 ${d.female}），已分别指派给各配音员。`;
        box.style.color = 'var(--txt-3)'; return;
      }
    }
    const el = document.getElementById('voice-sys');
    if (!el) return;
    const v = voiceInfo();
    if (!v) { el.innerHTML = '这个浏览器不支援语音合成。'; return; }
    if (v.none) {
      el.innerHTML = v.total
        ? '⚠ 这台电脑没有可用的中文语音，试听不会有声音。'
        : '语音清单载入中…';
      el.style.color = 'var(--amber)'; return;
    }
    el.innerHTML = v.isTW
      ? `目前试听使用：<b>${esc(v.name)}</b>（${esc(v.lang)}）— 台湾国语 ✓`
      : `目前试听使用：<b>${esc(v.name)}</b>（${esc(v.lang)}）<br>
         ⚠ 这台电脑没装台湾国语语音，改用其他中文语音代替。<br>
         Windows 可到「设定 → 时间与语言 → 语言与地区 → 新增语言 → 中文（繁体，台湾）」并勾选语音套件。`;
    el.style.color = v.isTW ? 'var(--txt-3)' : 'var(--amber)';
  }
  try { speechSynthesis.addEventListener('voiceschanged', showVoiceInfo); } catch (e) {}
  try {
    speechSynthesis.addEventListener('voiceschanged', () => {
      if (!pv) return;
      pv.voice = pickVoice();
      const w = document.getElementById('pv-novoice');
      if (w) w.style.display = pv.voice ? 'none' : 'block';
    });
  } catch (e) {}

  /* 依「声音来源」设定语速与音高。系统音只能模拟差异，正式版由 TTS 服务产生 */
  function voiceParams() {
    const pa = STORE.s.persona;
    let rate = 0.75 + (pa.speed / 100) * 0.6, pitch = 1;
    if (pa.voiceMode === 'library') {
      const a = DATA.VOICES.find(v => v.id === pa.voiceActor);
      // 音色已由指派的实际语音决定，音高只做小幅微调，压太多会失真
      if (a) { rate *= a.rate; pitch = 1 + (a.pitch - 1) * 0.4; }
    } else if (pa.voiceMode === 'clone') {
      rate *= 0.97; pitch = 0.95;
    }
    return { rate: Math.max(0.5, Math.min(2, rate)), pitch: Math.max(0.5, Math.min(2, pitch)) };
  }

  function utter(text) {
    const u = new SpeechSynthesisUtterance(T(text).replace(/[【】]/g, ' '));
    const pa = STORE.s.persona;
    // 配音员声库：每位指派不同的实际语音，不能只靠音高假装
    const v = (pa.voiceMode === 'library' ? voiceForActor(pa.voiceActor) : null)
      || (pv && pv.voice) || pickVoice();
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
    const q = voiceParams();
    u.rate = q.rate; u.pitch = q.pitch;
    return u;
  }

  function speak(text) {
    if (!pv || pv.muted || !text) return;
    try {
      speechSynthesis.cancel();
      const u = utter(text);
      u.onboundary = () => { if (pv) pv.talkPulse = 1; };
      pv.utter = u;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* 声音试听（人格页） */
  const SAMPLE_LINE = '我讲得直白一点。你不是时间不够，你是把时间花在了不产生复利的事情上。说句实在话，这件事我自己也是很晚才想明白的。';
  function tryVoice(id) {
    const pa = STORE.s.persona;
    const prev = { mode: pa.voiceMode, actor: pa.voiceActor };
    if (id && id !== 'clone' && id !== 'system') { pa.voiceMode = 'library'; pa.voiceActor = id; }
    else if (id === 'system') pa.voiceMode = 'system';
    try {
      speechSynthesis.cancel();
      const u = utter(SAMPLE_LINE);
      u.onend = () => { pa.voiceMode = prev.mode; pa.voiceActor = prev.actor; };
      u.onerror = u.onend;
      speechSynthesis.speak(u);
      const v = DATA.VOICES.find(x => x.id === id);
      toast(v ? '试听：' + v.name : id === 'clone' ? '试听：' + STORE.s.account.name + '本人声音（演示以系统音代替）' : '试听：系统合成音', 'ok');
      if (!pickVoice()) toast('这个浏览器没有中文语音，听不到声音', 'warn');
    } catch (e) { toast('这个浏览器不支持语音合成', 'warn'); }
    finally { pa.voiceMode = prev.mode; pa.voiceActor = prev.actor; }
  }

  const SCENE = ['open', 'point', 'broll', 'quote', 'point', 'broll', 'cta'];

  function pvApplyShot(i) {
    const el = id => document.getElementById(id);
    if (!el('mv-sub')) return;
    const s = pv.shots[i];
    const kind = SCENE[Math.min(i, SCENE.length - 1)];
    el('mv-shot').textContent = T(`镜头 ${i + 1}/${pv.shots.length} · ${s.t}`);
    el('mv-sub').textContent = T(s.txt);
    el('mv-vis').textContent = T(`${s.cam}　|　${s.vis}`);
    el('mv-book').classList.toggle('show', kind === 'open' || kind === 'cta');
    el('mv-broll').classList.toggle('show', kind === 'broll');
    el('mv-kw').classList.toggle('show', kind === 'quote');
    el('mv-cta').classList.toggle('show', kind === 'cta');
    if (kind === 'quote') el('mv-kw').textContent = T(s.txt);
    el('mv-person').classList.toggle('far', kind === 'broll' || kind === 'quote');
    document.querySelectorAll('#pv-shots .shot').forEach((e, n) => e.classList.toggle('on', n === i));
    speak(s.txt);
  }

  function pvFrame() {
    if (!pv) return;
    const ts = performance.now();
    const el = id => document.getElementById(id);
    if (!el('mv-sub')) { stopPreview(); return; }

    if (pv.playing) {
      const dt = pv.last ? Math.min(0.5, (ts - pv.last) / 1000) : 0;   // 分页被节流时不要一次跳太多
      pv.last = ts;
      pv.t = Math.min(pv.dur, pv.t + dt);
      let i = pv.shots.findIndex(s => pv.t < s.t1);
      if (i < 0) i = pv.shots.length - 1;
      if (i !== pv.shot) { pv.shot = i; pvApplyShot(i); }
      el('pv-time').textContent = `${mmss(pv.t)} / ${mmss(pv.dur)}`;
      el('pv-bar').style.width = (pv.t / pv.dur * 100) + '%';
      if (pv.t >= pv.dur) {
        pv.playing = false;
        try { speechSynthesis.cancel(); } catch (e) {}
        const b = el('pv-play'); if (b) { b.textContent = '↻'; b.classList.remove('hide'); }
      }
    }

    /* 口型与眨眼 */
    let talking = false;
    try { talking = pv.playing && !pv.muted && speechSynthesis.speaking; } catch (e) {}
    if (pv.playing && pv.muted) talking = true;          // 静音时也让嘴动，画面才不呆
    pv.talkPulse = Math.max(0, (pv.talkPulse || 0) - 0.06);
    const mouth = el('mv-mouth');
    if (mouth) {
      const open = talking ? 1.6 + Math.sin(ts / 70) * 1.1 + pv.talkPulse * 2.2 : 0.6;
      mouth.setAttribute('ry', Math.max(0.6, open).toFixed(2));
    }
    if (!pv.blinkAt || ts > pv.blinkAt) { pv.blinkAt = ts + 2200 + Math.random() * 2600; pv.blinking = ts; }
    const lid = ts - (pv.blinking || 0) < 130;
    ['mv-eyeL', 'mv-eyeR'].forEach(k => { const e = el(k); if (e) e.setAttribute('ry', lid ? 0.4 : 2.6); });
    const body = el('mv-person');
    if (body) body.style.setProperty('--bob', (Math.sin(ts / 900) * 3).toFixed(2) + 'px');
  }

  function pvToggle() {
    if (!pv) return;
    const btn = document.getElementById('pv-play');
    if (pv.playing) {
      pv.playing = false; pv.last = 0;
      try { speechSynthesis.cancel(); } catch (e) {}
      btn.textContent = '▶'; btn.classList.remove('hide');
      return;
    }
    if (pv.t >= pv.dur) { pv.t = 0; pv.shot = -1; }
    pv.playing = true; pv.last = 0;
    btn.textContent = '❚❚'; btn.classList.add('hide');
    if (pv.shot < 0) { pv.shot = 0; pvApplyShot(0); }
  }

  function pvMute() {
    if (!pv) return;
    pv.muted = !pv.muted;
    const b = document.getElementById('pv-mute');
    if (b) b.textContent = pv.muted ? '🔇' : '🔊';
    if (pv.muted) { try { speechSynthesis.cancel(); } catch (e) {} }
    else if (pv.playing) speak(pv.shots[pv.shot].txt);
  }

  /* 建立播放器（在 modal 之后呼叫） */
  function pvInit(v, shots) {
    pv = { shots, dur: v.duration, t: 0, shot: -1, playing: false, muted: false, timer: 0, last: 0, voice: pickVoice() };
    const play = document.getElementById('pv-play');
    const mute = document.getElementById('pv-mute');
    if (play) play.addEventListener('click', e => { e.stopPropagation(); pvToggle(); });
    if (mute) mute.addEventListener('click', e => { e.stopPropagation(); pvMute(); });
    // 点画面任意处也能播放/暂停；但按钮自己已处理，别让它冒泡上来重复触发
    const stage = document.getElementById('mv-stage');
    if (stage) stage.addEventListener('click', e => {
      if (e.target.closest('#pv-play') || e.target.closest('#pv-mute')) return;
      pvToggle();
    });
    if (shots.length) { pv.shot = 0; pvApplyShot(0); try { speechSynthesis.cancel(); } catch (e) {} }
    const warn = document.getElementById('pv-novoice');
    if (warn && !pv.voice) warn.style.display = 'block';
    // 用计时器而不是 requestAnimationFrame：分页不在前台时 rAF 会整个停住
    pv.timer = setInterval(pvFrame, 50);
  }

  function playerModal(id) {
    let v = null, p = null;
    STORE.s.projects.forEach(x => (x.videos || []).forEach(y => { if (y.id === id) { v = y; p = x; } }));
    if (!v) return;
    stopPreview();

    const script = (p.scripts || []).find(s => s.id === v.scriptId) || (p.scripts || [])[0];
    const shots = script ? DATA.genShots(script, p) : [];

    const done = v.status === '已生成' && v.videoUrl;
    /* 旧影片当初没存时长，开详情时补查一次，之后就有费用可看了。
     * 这支查询是唯读、免费的，查完会自动重画。 */
    if (done) backfillDuration(v);
    modal(done ? '影片（真的做出来了）' : v.demo ? '分镜预览（演示数据）' : '分镜预览（影片还没生成）', `
      <div style="display:flex;gap:22px;flex-wrap:wrap">
        <div style="flex:0 0 232px">
          ${done
            ? `<video src="${esc(v.videoUrl)}" controls playsinline style="width:100%;border-radius:16px;background:#000"></video>
               <div class="hint" style="margin-top:10px;line-height:1.7">这是<b style="color:var(--green)">真的影片</b>，用${esc(v.avatarName || '你选的形象')}＋${esc(v.voiceName || '你选的声音')}生成。<br>
                 影片网址约 <b>7 天后失效</b>，要留请尽快下载。</div>
               <div style="margin-top:8px;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;line-height:1.7">
                 ${videoCostHtml(v)}</div>`
            : `${phoneFrame(v, shots, v.caption, p)}
               <div class="hint" style="margin-top:10px;line-height:1.7">
                 <b style="color:var(--amber)">这不是影片</b>，是拿脚本文字做的分镜示意动画。<br>
                 上面那个卡通小人是画上去的固定图案，<b>跟你选的数字人无关</b>。<br>
                 要真的影片，用右边的「生成这一支」。</div>`}
        </div>
        <div style="flex:1;min-width:250px">
          <div style="font-size:17.5px;font-weight:700;line-height:1.5">${esc(v.title)}</div>
          <div class="chip-list" style="margin:12px 0">
            <span class="tag v">${v.angle}</span><span class="tag">${v.ratio}</span>
            <span class="tag">《${esc(p.title)}》</span>${UI.statusTag(v.status)}</div>
          ${v.demo
            ? `<div class="explain" style="border-left-color:var(--amber);margin:0">
                 <div class="ex-r"><span class="ex-k">演示数据</span><span>这一支属于<b>内建示范书</b>，播放量、完播率、按赞全是<b>随机编出来的假数字</b>，不是真的。</span></div>
                 <div class="ex-r"><span class="ex-k">想看真的</span><span>自己新建一本书、上传资料跑一遍，产出的才是真稿子、真影片。</span></div>
               </div>
               ${v.views > 0 ? `<div class="grid g2" style="gap:10px;margin-top:12px;opacity:.55">
                  ${[['播放量', nf(v.views)], ['完播率', v.watch + '%'], ['点赞', nf(v.like)], ['分享', nf(v.share)]]
                    .map(x => `<div style="background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px">
                      <div style="font-size:14px;color:var(--txt-3)">${x[0]}<span style="color:var(--amber)"> · 假</span></div>
                      <div style="font-size:18.5px;font-weight:700;margin-top:2px">${x[1]}</div></div>`).join('')}
                </div>` : ''}`
            : v.status === '待生成'
              ? `<div class="explain" style="border-left-color:var(--violet);margin:0">
                   <div class="ex-r"><span class="ex-k">目前状态</span><span><b>稿子写好了，影片还没做</b>。左边看到的是分镜示意，不是影片。</span></div>
                   <div class="ex-r"><span class="ex-k">怎么做出来</span><span>点下面「生成这一支」，会用你选的数字人和声音真的做一支影片出来。约 US$1-3、等 1-3 分钟。</span></div>
                 </div>`
            : v.status === '生成中'
              ? `<div class="explain" style="border-left-color:var(--amber);margin:0">
                   <div class="ex-r"><span class="ex-k">正在生成</span><span><b>已送出，通常 1-3 分钟</b>。可以关掉这个窗去做别的，好了会自己更新。</span></div>
                   <div class="ex-r"><span class="ex-k">用的是</span><span>形象 <b>${esc(v.avatarName || '—')}</b>　声音 <b>${esc(v.voiceName || '—')}</b></span></div>
                 </div>`
            : v.status === '生成失败'
              ? `<div class="explain" style="border-left-color:var(--red);margin:0">
                   <div class="ex-r"><span class="ex-k">生成失败</span><span>${esc(v.error || '未知原因')}</span></div>
                   <div class="ex-r"><span class="ex-k">常见原因</span><span>上传的照片没侦测到脸（要正脸、五官完整）、台词太长、或额度用完。可以改完再试一次。</span></div>
                 </div>`
            : v.status === '已生成'
              ? `<div class="explain" style="border-left-color:var(--green);margin:0">
                   <div class="ex-r"><span class="ex-k">已经做出来了</span><span>用形象 <b>${esc(v.avatarName || '—')}</b>、声音 <b>${esc(v.voiceName || '—')}</b> 生成，左边可以直接播。</span></div>
                   <div class="ex-r"><span class="ex-k">还没发布</span><span>播放、按赞这些数字要真的发到平台、平台回传才会有。现在是 0 很正常。</span></div>
                 </div>`
            : `<div class="explain" style="border-left-color:var(--amber);margin:0">
                 <div class="ex-r"><span class="ex-k">目前状态</span><span><b>${esc(v.status)}</b></span></div>
               </div>`}
          <div class="label" style="margin-top:16px">发布文案</div>
          <div style="background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:13px;font-size:15px;line-height:1.8">
            ${esc(v.title)}<br><span style="color:var(--cyan)">${(p.hots || ['#读书', '#新书推荐']).join(' ')}</span></div>
          <div style="display:flex;gap:9px;margin-top:14px;flex-wrap:wrap">
            ${!v.demo && (v.status === '待生成' || v.status === '生成失败')
              ? `<button class="btn btn-sm btn-primary" data-act="gen-video" data-id="${v.id}">
                   ${v.status === '生成失败' ? '重试生成' : '▶ 生成这一支'}（真的花钱）</button>` : ''}
            ${done ? `<a class="btn btn-sm btn-primary" href="${esc(v.videoUrl)}" download target="_blank">下载影片</a>` : ''}
            <button class="btn btn-sm" data-modal-act="copy-cap" data-t="${esc(v.title + '\n' + (p.hots || []).join(' '))}">复制文案</button>
            <button class="btn btn-sm" data-modal-act="dl-shots" data-id="${v.id}">下载脚本与分镜</button>
            ${done || v.demo ? `<button class="btn btn-sm" data-modal-act="add-sched" data-id="${v.id}">加入排程</button>` : ''}
          </div>
        </div>
      </div>

      ${shots.length ? `<div class="label" style="margin-top:20px">分镜表（播放时会同步高亮）</div>${shotList(shots)}` : ''}`, '', true);

    // 必须在 modal() 之后建立：开启弹窗会触发关闭钩子，那会清掉播放状态
    pvInit(v, shots);
  }

  /* ============================================================
   * 创意分镜：60 秒模拟成片播放（用分镜时间轴模拟节奏，不是真实渲染影片）
   * ========================================================== */
  /* ---- 排程项目：预览 + 编辑 ---- */
  function phoneFrame(v, shots, capFallback, p) {
    const first = shots.length ? shots[0] : null;
    return `

        <div class="mv-vig"></div>

          <div class="mv-book-c" style="background:${v.cover}">

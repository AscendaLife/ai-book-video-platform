<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>书影 BookReel · AI 新书短视频营销平台</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
<style>
/* ============================================================
   书影 BookReel · AI 新书短视频营销平台 — 全局样式
   ============================================================ */

:root{
  --violet:#7c6cff; --violet-2:#a48bff; --cyan:#22d3ee; --pink:#ff5d8f;
  --green:#2ee6a8; --amber:#ffb020; --red:#ff5a65;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:24px;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --grad:linear-gradient(135deg,var(--violet) 0%,#8b5cf6 45%,var(--cyan) 100%);
  --font:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
}
/* 主题令牌：默认深色 → 跟随系统 → 用户/查看者显式切换（后者优先） */
:root,[data-theme="dark"],:root[data-theme="dark"]{
  --bg:#080b14; --bg-2:#0d1220; --panel:#111829; --panel-2:#161f34;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --txt:#e9edf7; --txt-2:#9aa3bd; --txt-3:#6b7490;
  --shadow:0 18px 50px rgba(0,0,0,.35);
  --glow:radial-gradient(1100px 520px at 82% -12%,rgba(124,108,255,.20),transparent 62%),
         radial-gradient(760px 420px at 8% 0%,rgba(34,211,238,.12),transparent 60%);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#f4f6fb; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f7f9fd;
    --line:rgba(16,24,48,.09); --line-2:rgba(16,24,48,.16);
    --txt:#141a2c; --txt-2:#5b657f; --txt-3:#8b94ab;
    --shadow:0 14px 40px rgba(20,30,60,.10);
    --glow:radial-gradient(1000px 480px at 85% -14%,rgba(124,108,255,.16),transparent 62%),
           radial-gradient(700px 400px at 5% 0%,rgba(34,211,238,.12),transparent 60%);
  }
}
[data-theme="light"],:root[data-theme="light"]{
  --bg:#f4f6fb; --bg-2:#ffffff; --panel:#ffffff; --panel-2:#f7f9fd;
  --line:rgba(16,24,48,.09); --line-2:rgba(16,24,48,.16);
  --txt:#141a2c; --txt-2:#5b657f; --txt-3:#8b94ab;
  --shadow:0 14px 40px rgba(20,30,60,.10);
  --glow:radial-gradient(1000px 480px at 85% -14%,rgba(124,108,255,.16),transparent 62%),
         radial-gradient(700px 400px at 5% 0%,rgba(34,211,238,.12),transparent 60%);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); background:var(--bg); color:var(--txt);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;height:100vh;overflow:hidden}

/* ---------------- 侧边栏 ---------------- */
.sidebar{
  width:250px;flex:0 0 250px;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;transition:transform .25s
}
.brand{display:flex;align-items:center;gap:11px;padding:19px 18px 16px}
.brand-logo{
  width:38px;height:38px;border-radius:11px;background:var(--grad);display:grid;place-items:center;
  font-weight:800;font-size:19.5px;color:#fff;box-shadow:0 8px 22px rgba(124,108,255,.45)
}
.brand-title{font-weight:700;font-size:16.5px;letter-spacing:.2px}
.brand-sub{font-size:12.5px;color:var(--txt-3);letter-spacing:1.1px;text-transform:uppercase}

.nav{flex:1;overflow-y:auto;padding:6px 12px 12px}
.nav-group{font-size:12.5px;color:var(--txt-3);letter-spacing:1.4px;padding:16px 10px 7px;font-weight:600}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
  color:var(--txt-2);font-size:15.5px;margin-bottom:2px;position:relative;transition:.16s
}
.nav-item .ni{width:18px;text-align:center;opacity:.8;font-size:15px}
.nav-item:hover{background:var(--panel);color:var(--txt)}
.nav-item.active{background:var(--panel-2);color:var(--txt);font-weight:600}
.nav-item.active::before{
  content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--grad)
}
.ni-badge{margin-left:auto;background:var(--violet);color:#fff;font-size:12px;padding:1px 6px;border-radius:20px;font-weight:700}
.ni-badge:empty{display:none}

.sidebar-foot{padding:14px;border-top:1px solid var(--line)}
.quota-head{display:flex;justify-content:space-between;font-size:13px;color:var(--txt-3);margin-bottom:6px}
.bar{height:5px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:5px;transition:width .6s}
.user{display:flex;align-items:center;gap:10px;margin-top:14px;padding:6px;margin-left:-6px;margin-right:-6px;
  border-radius:10px;cursor:pointer;transition:.15s;position:relative}
.user:hover{background:var(--panel)}
.user::after{content:"⚙";position:absolute;right:8px;opacity:0;transition:.15s;color:var(--txt-3);font-size:14px}
.user:hover::after{opacity:1}
.avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff8a5b,#ff5d8f);display:grid;place-items:center;font-weight:700;color:#fff;font-size:16px}
.user-name{font-size:15px;font-weight:600}
.user-role{font-size:13px;color:var(--txt-3)}

/* ---------------- 顶栏 ---------------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);background-image:var(--glow)}
.topbar{
  height:62px;flex:0 0 62px;display:flex;align-items:center;gap:14px;padding:0 24px;
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px);
}
.crumb{font-size:17px;font-weight:650}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;width:260px;color:var(--txt-3)}
.search input{background:none;border:0;outline:0;width:100%;font-size:15px}
.icon-btn{
  width:36px;height:36px;border-radius:10px;background:var(--panel);border:1px solid var(--line);
  cursor:pointer;display:grid;place-items:center;color:var(--txt-2);transition:.16s
}
.icon-btn:hover{border-color:var(--line-2);color:var(--txt)}
.only-mobile{display:none}

.view{flex:1;overflow-y:auto;padding:24px 26px 60px}

/* ---------------- 通用组件 ---------------- */
.btn{
  border:1px solid var(--line-2);background:var(--panel);border-radius:10px;padding:8px 15px;
  cursor:pointer;font-size:15px;font-weight:600;transition:.16s;white-space:nowrap;display:inline-flex;
  align-items:center;gap:7px
}
.btn:hover{background:var(--panel-2);transform:translateY(-1px)}
.btn-primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 22px rgba(124,108,255,.35)}
.btn-primary:hover{box-shadow:0 12px 28px rgba(124,108,255,.5)}
.btn-ghost{background:transparent}
/* 折叠区：把次要 / 尚未实作的设定收起来，别把真正要做的事淹没掉 */
.adv{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.adv>summary{padding:15px 20px;cursor:pointer;font-weight:650;font-size:15px;color:var(--txt-2);
  list-style:none;display:flex;align-items:center;gap:9px;user-select:none}
.adv>summary::-webkit-details-marker{display:none}
.adv>summary::before{content:"▸";color:var(--txt-3);transition:.16s;display:inline-block}
.adv[open]>summary::before{transform:rotate(90deg)}
.adv>summary:hover{background:var(--panel-2);color:var(--txt)}
.adv-b{padding:0 20px 20px}
/* 不可逆动作用红底，跟旁边的「取消」在视觉上分清楚 */
.btn-danger{background:var(--red);border:0;color:#fff}
.btn-danger:hover{filter:brightness(1.1);box-shadow:0 8px 20px rgba(239,68,68,.4)}
.btn-sm{padding:5px 11px;font-size:14px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;position:relative}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.card-t{font-size:16.5px;font-weight:680}
.card-s{font-size:14px;color:var(--txt-3)}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}

.grid{display:grid;gap:16px}
/* 格线子项预设 min-width:auto，长内容会撑破栏宽导致整页横向溢出 */
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g-2-1{grid-template-columns:2fr 1fr}
.g-1-2{grid-template-columns:1fr 2fr}
@media(max-width:1280px){.g4{grid-template-columns:repeat(2,1fr)}.g-2-1,.g-1-2{grid-template-columns:1fr}}
@media(max-width:900px){.g3,.g2{grid-template-columns:1fr}}

.tag{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;padding:3px 9px;border-radius:20px;
  background:var(--panel-2);border:1px solid var(--line);color:var(--txt-2);white-space:nowrap}
.tag.v{color:var(--violet-2);border-color:rgba(124,108,255,.35);background:rgba(124,108,255,.12)}
.tag.c{color:var(--cyan);border-color:rgba(34,211,238,.3);background:rgba(34,211,238,.1)}
.tag.g{color:var(--green);border-color:rgba(46,230,168,.3);background:rgba(46,230,168,.1)}
.tag.a{color:var(--amber);border-color:rgba(255,176,32,.3);background:rgba(255,176,32,.1)}
.tag.p{color:var(--pink);border-color:rgba(255,93,143,.3);background:rgba(255,93,143,.1)}
.tag.r{color:var(--red);border-color:rgba(255,90,101,.3);background:rgba(255,90,101,.1)}

.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--txt-3)}
.dot.g{background:var(--green);box-shadow:0 0 0 3px rgba(46,230,168,.18)}
.dot.a{background:var(--amber);box-shadow:0 0 0 3px rgba(255,176,32,.18)}
.dot.v{background:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.2)}
.dot.r{background:var(--red);box-shadow:0 0 0 3px rgba(255,90,101,.2)}

.page-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.page-t{font-size:24px;font-weight:750;letter-spacing:-.2px}
.page-d{font-size:15px;color:var(--txt-3);margin-top:3px}
.page-h .right{margin-left:auto;display:flex;gap:9px}

.hint{font-size:14px;color:var(--txt-3)}
.muted{color:var(--txt-2)}
.empty{text-align:center;padding:56px 20px;color:var(--txt-3)}
.empty .big{font-size:42px;opacity:.35;margin-bottom:10px}
.mono{font-family:"JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:14px}

/* KPI 卡 */
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:17px 19px;overflow:hidden;position:relative}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;
  background:var(--grad);opacity:.10;filter:blur(6px)}
.kpi-l{font-size:14px;color:var(--txt-3);display:flex;align-items:center;gap:6px}
.kpi-v{font-size:29px;font-weight:760;margin:7px 0 4px;letter-spacing:-.6px}
.kpi-v small{font-size:15px;font-weight:600;color:var(--txt-3);margin-left:3px}
.kpi-d{font-size:13.5px;color:var(--green);font-weight:600}
.kpi-d.down{color:var(--red)}

/* 表格 */
table{width:100%;border-collapse:collapse}
th{font-size:13.5px;color:var(--txt-3);text-align:left;font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.14s}
tbody tr:hover{background:var(--panel-2)}

/* 表单 */
.field{margin-bottom:14px}
.label{font-size:14px;color:var(--txt-2);margin-bottom:6px;display:flex;align-items:center;gap:6px;font-weight:600}
.input,select.input,textarea.input{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:0;transition:.16s;font-size:15px
}
.input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.16)}
textarea.input{resize:vertical;min-height:88px;line-height:1.7}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.switch{width:40px;height:22px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line-2);
  position:relative;cursor:pointer;transition:.2s;flex:0 0 40px}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--txt-3);transition:.2s}
.switch.on{background:var(--grad);border-color:transparent}
.switch.on::after{left:20px;background:#fff}
.setting-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-row .right{margin-left:auto}
input[type=range]{width:100%;accent-color:var(--violet)}

/* 分段控件 */
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:6px 13px;border-radius:8px;cursor:pointer;font-size:14.5px;color:var(--txt-2);transition:.15s}
.seg button.on{background:var(--panel);color:var(--txt);font-weight:650;box-shadow:0 2px 8px rgba(0,0,0,.15)}

/* ---------------- 项目卡 ---------------- */
.book-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;
  transition:.2s;cursor:pointer;display:flex;flex-direction:column}
.book-card:hover{transform:translateY(-3px);border-color:var(--line-2);box-shadow:var(--shadow)}
.book-cover{height:132px;position:relative;display:flex;align-items:flex-end;padding:14px}
.book-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.book-cover .bt{position:relative;z-index:2;color:#fff;font-weight:750;font-size:17.5px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.book-cover .st{position:absolute;top:12px;right:12px;z-index:2}
/* 删除钮：平常半透明、滑到卡片上才明显，按下去会跳确认窗，不会直接删 */
.book-del{position:absolute;top:10px;left:10px;z-index:3;width:30px;height:30px;border-radius:9px;
  border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.34);color:#fff;font-size:14px;
  cursor:pointer;opacity:0;transition:.16s;display:grid;place-items:center;padding:0;backdrop-filter:blur(4px)}
.book-card:hover .book-del{opacity:.85}
.book-del:hover{opacity:1;background:var(--red);border-color:var(--red);transform:scale(1.06)}
.book-b{padding:14px 16px 16px;flex:1;display:flex;flex-direction:column;gap:9px}
.book-meta{font-size:14px;color:var(--txt-3)}
.book-stats{display:flex;gap:14px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.bs{font-size:13px;color:var(--txt-3)}
.bs b{display:block;font-size:17px;color:var(--txt);font-weight:700}

/* ---------------- 流水线 ---------------- */
.pipe{display:flex;gap:0;overflow-x:auto;padding:4px 0 14px}
.pstep{
  flex:1;min-width:118px;padding:13px 12px;border:1px solid var(--line);background:var(--panel);position:relative;
  cursor:pointer;transition:.18s
}
.pstep:first-child{border-radius:var(--r) 0 0 var(--r)}
.pstep:last-child{border-radius:0 var(--r) var(--r) 0}
.pstep+.pstep{border-left:0}
.pstep:hover{background:var(--panel-2)}
.pstep.on{background:var(--panel-2)}
.pstep.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad)}
.pstep .pn{font-size:12.5px;color:var(--txt-3);letter-spacing:1px}
.pstep .pt{font-size:14.5px;font-weight:650;margin-top:4px}
.pstep .ps{font-size:12.5px;margin-top:6px;display:flex;align-items:center;gap:5px;color:var(--txt-3)}
.pstep.done .pt{color:var(--green)}
.pstep.run .pt{color:var(--violet-2)}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;margin-top:16px}
.log{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:14px;max-height:230px;
  overflow-y:auto;font-family:"JetBrains Mono",Consolas,monospace;font-size:13.5px;line-height:1.9}
.log .l-ok{color:var(--green)}.log .l-run{color:var(--cyan)}.log .l-info{color:var(--txt-3)}.log .l-warn{color:var(--amber)}

.ring{position:relative;width:132px;height:132px;flex:0 0 132px}
.ring svg{transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:750}

.drop{
  border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:34px;text-align:center;transition:.18s;cursor:pointer;background:var(--panel-2)
}
.drop:hover,.drop.over{border-color:var(--violet);background:rgba(124,108,255,.07)}
.drop .di{font-size:36px;opacity:.5}
.file-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);margin-top:8px}
.file-ico{width:32px;height:32px;border-radius:9px;background:var(--grad);display:grid;place-items:center;font-size:15px;color:#fff;flex:0 0 32px}

/* 内容资产 */
.chip-list{display:flex;flex-wrap:wrap;gap:8px}
.copy-item{background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;transition:.16s;position:relative}
.copy-item:hover{border-color:var(--line-2)}
.copy-item .ci-h{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.copy-item .ci-n{font-size:13px;color:var(--txt-3);font-family:monospace}
.copy-item .ci-a{margin-left:auto;opacity:0;transition:.16s;display:flex;gap:6px}
.copy-item:hover .ci-a{opacity:1}
.copy-txt{font-size:15.5px;line-height:1.75}

/* 视频卡 */
.vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
.vid{border-radius:14px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.2s}
.vid:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--line-2)}
.vid-th{aspect-ratio:9/16;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:11px}
.vid-th::after{content:"";position:absolute;inset:0;background:linear-gradient(190deg,rgba(0,0,0,.28),transparent 42%,rgba(0,0,0,.68))}
.vid-th>*{position:relative;z-index:2}
.vid-cap{color:#fff;font-weight:700;font-size:15px;line-height:1.45;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.vid-play{position:absolute;inset:0;display:grid;place-items:center;z-index:3;opacity:0;transition:.2s;background:rgba(0,0,0,.3)}
.vid:hover .vid-play{opacity:1}
.vid-play span{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center;font-size:17.5px;padding-left:3px}
.vid-b{padding:10px 12px;display:flex;flex-direction:column;gap:7px}
.vid-tt{font-size:14.5px;font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vid-m{display:flex;justify-content:space-between;font-size:13px;color:var(--txt-3)}
.plat{position:absolute;top:10px;left:10px;z-index:3;font-size:12.5px;padding:3px 8px;border-radius:6px;
  background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px);font-weight:600}
.dur{position:absolute;bottom:10px;right:10px;z-index:3;font-size:12.5px;padding:2px 6px;border-radius:5px;background:rgba(0,0,0,.6);color:#fff}

/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-h{font-size:13px;color:var(--txt-3);text-align:center;padding:4px 0;font-weight:600}
.cal-d{min-height:92px;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px;background:var(--panel-2);font-size:13px;transition:.15s}
.cal-d:hover{border-color:var(--line-2)}
.cal-d.out{opacity:.35}
.cal-d.today{border-color:var(--violet);box-shadow:0 0 0 2px rgba(124,108,255,.18)}
.cal-n{color:var(--txt-3);margin-bottom:5px;font-weight:600}
.cal-e{font-size:12px;padding:2px 5px;border-radius:5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;color:#fff;background:var(--ec);cursor:pointer;transition:.14s;border:1px solid transparent}
.cal-e:hover{filter:brightness(1.12);transform:translateX(1px)}
.cal-e.done{background:transparent;border:1px dashed var(--line-2);color:var(--txt-3)}
.cal-e.done::before{content:"✓ ";font-weight:700;color:var(--green)}
.cal-e.done:hover{filter:none;background:var(--panel)}
.cal-legend{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--txt-3)}
.cal-legend i{display:inline-block;width:14px;height:10px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.cal-legend .lg-p{background:var(--violet)}
.cal-legend .lg-d{background:transparent;border:1px dashed var(--line-2)}

/* 时间线 */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl-i{position:relative;padding-bottom:18px}
.tl-i::before{content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.2)}
.tl-t{font-size:15px;font-weight:640}
.tl-s{font-size:13.5px;color:var(--txt-3)}

/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(4,7,15,.66);backdrop-filter:blur(5px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:24px}
.modal-mask.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-xl);width:100%;max-width:660px;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:pop .22s ease}
.modal.wide{max-width:940px}
@keyframes pop{from{transform:translateY(14px) scale(.985);opacity:0}}
.modal-head{display:flex;align-items:center;padding:18px 22px;border-bottom:1px solid var(--line)}
.modal-title{font-size:17.5px;font-weight:700;flex:1}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
.modal-foot:empty{display:none}

/* Toast */
.toasts{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--panel);border:1px solid var(--line-2);border-left:3px solid var(--violet);border-radius:12px;
  padding:12px 16px;box-shadow:var(--shadow);min-width:250px;animation:slide .25s ease;font-size:15px}
.toast.ok{border-left-color:var(--green)}.toast.warn{border-left-color:var(--amber)}.toast.err{border-left-color:var(--red)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}

/* 文档 */
.doc{max-width:900px;line-height:1.85;font-size:16px}
.doc h1{font-size:26px;margin:6px 0 16px;font-weight:750}
.doc h2{font-size:19.5px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);font-weight:700}
.doc h3{font-size:17px;margin:20px 0 9px;font-weight:680;color:var(--violet-2)}
.doc p{margin:9px 0;color:var(--txt-2)}
.doc ul,.doc ol{margin:9px 0 9px 22px;color:var(--txt-2)}
.doc li{margin:5px 0}
.doc code{background:var(--panel-2);padding:2px 6px;border-radius:5px;font-family:monospace;font-size:14.5px;color:var(--cyan)}
.doc table{margin:12px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.doc blockquote{border-left:3px solid var(--violet);padding:8px 14px;margin:12px 0;background:var(--panel-2);border-radius:0 10px 10px 0;color:var(--txt-2)}
.doc hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.doc strong{color:var(--txt)}

/* 分镜 */
.shot{display:grid;grid-template-columns:56px 1fr;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.shot:last-child{border-bottom:0}
.shot-n{width:56px;height:56px;border-radius:11px;background:var(--panel-2);border:1px solid var(--line);
  display:grid;place-items:center;font-weight:700;color:var(--txt-3);font-size:14px}
.shot-t{font-size:15.5px;line-height:1.7}
.shot-d{font-size:13.5px;color:var(--txt-3);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
.shot.on{background:rgba(124,108,255,.09);border-radius:10px}
.shot.on .shot-n{border-color:var(--violet);color:var(--violet-2);background:rgba(124,108,255,.14)}
#pv-play:hover{background:#fff;transform:translate(-50%,-50%) scale(1.06)}
#pv-play{transition:.15s}

/* 创意分镜 */
.creative-hero{
  border:1px solid var(--line-2);border-radius:var(--r-xl);padding:24px;
  background:linear-gradient(135deg,rgba(124,108,255,.18),rgba(34,211,238,.10) 48%,rgba(255,176,32,.10));
  display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:center;margin-bottom:18px
}
.creative-hero h2{font-size:26px;line-height:1.25;margin-bottom:9px;letter-spacing:0;font-weight:780}
.creative-hero p{font-size:15.5px;color:var(--txt-2);line-height:1.9;max-width:760px}
.creative-board{min-height:210px;border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:16px;position:relative;overflow:hidden}
.creative-board::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(124,108,255,.16),transparent 45%),radial-gradient(circle at 82% 20%,rgba(34,211,238,.18),transparent 34%);pointer-events:none}
.creative-frame{position:relative;z-index:1;border:1px solid var(--line-2);border-radius:14px;min-height:178px;background:var(--bg-2);padding:14px;display:flex;flex-direction:column;justify-content:space-between}
.frame-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.frame-avatar{width:62px;height:62px;border-radius:18px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:26px;box-shadow:0 12px 30px rgba(124,108,255,.35)}
.frame-book{width:48px;height:68px;border-radius:6px;background:linear-gradient(150deg,#ff8a5b,#7c6cff);box-shadow:0 12px 24px rgba(0,0,0,.25)}
.frame-caption{font-size:15px;font-weight:760;line-height:1.55;max-width:260px}
.creative-mode{border:1px solid var(--line);border-radius:16px;padding:15px;background:var(--panel);cursor:pointer;transition:.16s;min-height:150px}
.creative-mode:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.creative-mode.on{border-color:rgba(124,108,255,.55);background:linear-gradient(135deg,rgba(124,108,255,.14),rgba(34,211,238,.06))}
.creative-mode .ico{width:34px;height:34px;border-radius:11px;background:var(--panel-2);display:grid;place-items:center;margin-bottom:10px;font-weight:800;color:var(--violet-2)}
.creative-mode .name{font-size:16px;font-weight:730;margin-bottom:5px}
.creative-mode .desc{font-size:14px;color:var(--txt-2);line-height:1.65}
.creative-preview{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden;transition:.16s}
.creative-preview:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.creative-thumb{aspect-ratio:16/9;background:linear-gradient(135deg,#1d2540,#7c6cff 58%,#22d3ee);position:relative;padding:12px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.creative-thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(0,0,0,.06),rgba(0,0,0,.68));pointer-events:none}
.creative-thumb>*{position:relative;z-index:1}
.creative-thumb .mini-book{width:34px;height:48px;border-radius:5px;background:rgba(255,255,255,.88);box-shadow:0 10px 24px rgba(0,0,0,.25)}
.creative-thumb .mini-line{height:7px;border-radius:9px;background:rgba(255,255,255,.72);margin-top:6px}
.creative-preview-b{padding:13px 14px}
.creative-preview-b .title{font-size:15.5px;font-weight:730;margin-bottom:4px}
.creative-preview-b .desc{font-size:14px;color:var(--txt-2);line-height:1.6;min-height:38px}
.creative-shot{display:grid;grid-template-columns:70px 1fr 156px;gap:14px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}
.creative-shot:last-child{border-bottom:0}
.creative-shot .time{font-family:"JetBrains Mono",Consolas,monospace;font-size:14px;color:var(--violet-2);font-weight:700}
.creative-shot .main{font-size:15.5px;font-weight:680;line-height:1.55}
.creative-shot .sub{font-size:14px;color:var(--txt-3);line-height:1.65;margin-top:4px}
.creative-shot .asset{font-size:13.5px;color:var(--txt-2);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:8px;line-height:1.55}
.visual-card{border:1px solid var(--line);border-radius:14px;background:var(--panel-2);padding:14px;min-height:128px}
.visual-card b{display:block;font-size:15.5px;margin-bottom:6px}
.visual-card span{font-size:14px;color:var(--txt-2);line-height:1.65}
.sample-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sample-card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px;overflow:hidden}
.sample-video{width:100%;aspect-ratio:9/16;border-radius:12px;background:#060912;display:block;object-fit:cover;border:1px solid var(--line)}
.sample-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 8px}
.sample-title{font-size:15.5px;font-weight:730;line-height:1.45}
.sample-desc{font-size:14px;color:var(--txt-2);line-height:1.65;margin-top:4px}
.scene-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.scene-pill{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px}
.scene-pill b{display:block;font-size:14.5px;margin-bottom:4px}
.scene-pill span{font-size:13.5px;color:var(--txt-2);line-height:1.5}
.template-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.template-toolbar .input{max-width:280px}
.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.template-card{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:14px;min-height:220px;display:flex;flex-direction:column;gap:10px;transition:.16s}
.template-card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.template-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.template-ico{width:38px;height:38px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;font-weight:800;color:var(--cyan);flex:0 0 38px}
.template-name{font-size:16px;font-weight:760;line-height:1.35}
.template-meta{display:flex;gap:6px;flex-wrap:wrap}
.template-desc{font-size:14px;color:var(--txt-2);line-height:1.65}
.template-roles{font-size:13.5px;color:var(--txt-3);line-height:1.6;margin-top:auto}
.template-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.custom-scene{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
@media(max-width:1080px){.creative-hero{grid-template-columns:1fr}.creative-shot{grid-template-columns:58px 1fr}}
@media(max-width:1080px){.sample-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:1080px){.template-grid{grid-template-columns:repeat(2,1fr)}.custom-scene{grid-template-columns:1fr 1fr}}
@media(max-width:1080px){.creative-shot .asset{grid-column:2}}
@media(max-width:640px){.creative-shot{grid-template-columns:1fr}.creative-shot .asset{grid-column:auto}.creative-hero{padding:18px}.sample-grid,.scene-strip,.template-grid,.custom-scene{grid-template-columns:1fr}}

.persona-hero{
  border-radius:var(--r-xl);padding:26px;background:linear-gradient(135deg,rgba(124,108,255,.22),rgba(34,211,238,.12));
  border:1px solid var(--line-2);display:flex;gap:24px;align-items:center;flex-wrap:wrap
}
.pv{width:112px;height:112px;border-radius:26px;background:linear-gradient(150deg,#5b4bff,#22d3ee);display:grid;place-items:center;
  font-size:42px;font-weight:800;color:#fff;flex:0 0 112px;box-shadow:0 16px 40px rgba(91,75,255,.4)}
.wave{display:flex;align-items:center;gap:3px;height:34px}
.wave i{width:3px;background:var(--cyan);border-radius:3px;animation:w 1.1s ease-in-out infinite}
@keyframes w{0%,100%{height:20%}50%{height:100%}}

/* ---------------- 文档卡 ---------------- */
.doc-card{cursor:pointer;padding:15px 16px;transition:.18s}
.doc-card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.doc-card.on{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.14)}
.doc-card .dc-i{font-size:20.5px;color:var(--violet-2);line-height:1}
.doc-card .dc-n{font-weight:680;font-size:15.5px;margin-top:8px}

/* ---------------- 阶段说明条 ---------------- */
.explain{background:var(--panel-2);border:1px solid var(--line);border-left:3px solid var(--violet);
  border-radius:0 12px 12px 0;padding:13px 16px;margin:-4px 0 18px;display:flex;flex-direction:column;gap:7px}
.ex-r{display:flex;gap:12px;font-size:15px;line-height:1.75}
.ex-k{flex:0 0 84px;color:var(--txt-3);font-size:14px;font-weight:650;padding-top:1px}
.ex-r>span:last-child{color:var(--txt-2);flex:1}
mark.hl{background:rgba(124,108,255,.28);color:var(--txt);border-radius:4px;padding:1px 4px;font-weight:600}
@media(max-width:700px){.ex-r{flex-direction:column;gap:2px}.ex-k{flex:none}}

/* ---------------- 声音来源与声库 ---------------- */
.vsrc{border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;transition:.16s;background:var(--panel-2)}
.vsrc:hover{border-color:var(--line-2)}
.vsrc.on{border-color:var(--violet);background:rgba(124,108,255,.08);box-shadow:0 0 0 3px rgba(124,108,255,.12)}
.vradio{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 14px;transition:.16s}
.vsrc.on .vradio{border-color:var(--violet);background:radial-gradient(circle,var(--violet) 0 45%,transparent 46%)}
.vcard{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.16s;background:var(--panel-2)}
.vcard:hover{border-color:var(--line-2);transform:translateY(-2px)}
.vcard.on{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,108,255,.12)}
.vdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 10px}

/* ---------------- 模拟成片播放器 ---------------- */
.mv{aspect-ratio:9/16;border-radius:16px;position:relative;overflow:hidden;cursor:pointer;user-select:none}
.mv-vig{position:absolute;inset:0;background:linear-gradient(190deg,rgba(0,0,0,.36),transparent 34%,rgba(0,0,0,.82))}
.mv-broll{position:absolute;inset:0;opacity:0;transition:opacity .5s;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 55%),
             radial-gradient(circle at 75% 70%,rgba(0,0,0,.35),transparent 55%);
  animation:kb 9s ease-in-out infinite alternate}
.mv-broll.show{opacity:1}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.16) translate(-3%,-2%)}}

.mv-person{position:absolute;left:50%;bottom:26%;width:56%;transform:translate(-50%,var(--bob,0px));
  transition:width .6s cubic-bezier(.4,0,.2,1),bottom .6s;filter:drop-shadow(0 10px 26px rgba(0,0,0,.4))}
.mv-person.far{width:34%;bottom:34%}

.mv-book{position:absolute;left:50%;top:16%;transform:translate(-50%,14px);opacity:0;transition:.55s;text-align:center;z-index:2}
.mv-book.show{opacity:1;transform:translate(-50%,0)}
.mv-book-c{width:86px;height:120px;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);
  display:grid;place-items:center;padding:8px;margin:0 auto;border:1px solid rgba(255,255,255,.25)}
.mv-book-c span{color:#fff;font-weight:800;font-size:15px;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.mv-book-t{color:#fff;font-size:12.5px;opacity:.85;margin-top:7px}

.mv-kw{position:absolute;inset:12% 10% auto 10%;z-index:3;color:#fff;font-weight:850;font-size:20.5px;line-height:1.45;
  text-align:center;text-shadow:0 4px 18px rgba(0,0,0,.65);opacity:0;transform:scale(.94);transition:.4s;
  display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mv-kw.show{opacity:1;transform:scale(1)}

.mv-top{position:absolute;top:12px;left:12px;right:12px;z-index:4;display:flex;justify-content:space-between;align-items:flex-start}
.mv-btn{background:rgba(0,0,0,.5);border:0;color:#fff;border-radius:6px;padding:2px 6px;font-size:13px;cursor:pointer;line-height:1.5}
.mv-btn:hover{background:rgba(0,0,0,.72)}

.mv-bottom{position:absolute;left:14px;right:14px;bottom:14px;z-index:4}
.mv-meta{color:#fff;opacity:.75;font-size:12.5px;letter-spacing:.4px}
.mv-sub{color:#fff;font-weight:750;font-size:16.5px;line-height:1.55;margin-top:5px;
  text-shadow:0 2px 12px rgba(0,0,0,.8);min-height:88px;
  display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mv-cta{margin-top:8px;display:none;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  border-radius:8px;padding:6px 9px;color:#fff;font-size:13px;backdrop-filter:blur(3px)}
.mv-cta.show{display:block}
.mv-sign{display:flex;align-items:center;gap:7px;margin-top:9px;color:#fff;font-size:13px;opacity:.9}
.mv-track{height:3px;background:rgba(255,255,255,.3);border-radius:3px;margin-top:10px;overflow:hidden}
.mv-track>div{width:0%;height:100%;background:#fff;border-radius:3px}

.mv-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;width:54px;height:54px;border-radius:50%;
  background:rgba(255,255,255,.93);border:0;cursor:pointer;font-size:18.5px;color:#111;display:grid;place-items:center;transition:.2s}
.mv-play:hover{background:#fff;transform:translate(-50%,-50%) scale(1.06)}
.mv-play.hide{opacity:0;pointer-events:none}
.mv:hover .mv-play.hide{opacity:.75;pointer-events:auto}
@media(prefers-reduced-motion:reduce){.mv-broll{animation:none}}

/* ---------------- 新手导览 ---------------- */
.tour-mask{position:fixed;inset:0;z-index:150;display:none}
.tour-hole{position:absolute;border-radius:14px;border:2px solid var(--violet);
  box-shadow:0 0 0 9999px rgba(4,7,15,.74),0 0 26px rgba(124,108,255,.6);
  transition:left .3s cubic-bezier(.4,0,.2,1),top .3s cubic-bezier(.4,0,.2,1),width .3s,height .3s,opacity .2s;pointer-events:none}
[data-theme="light"] .tour-hole{box-shadow:0 0 0 9999px rgba(10,16,34,.55),0 0 26px rgba(124,108,255,.5)}
.tour-pop{position:fixed;z-index:151;width:340px;background:var(--panel);border:1px solid var(--line-2);
  border-radius:18px;padding:18px 20px 16px;box-shadow:var(--shadow);display:none;animation:pop .22s ease}
.tour-pop.center{left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:min(460px,calc(100vw - 32px))}
.tour-h{display:flex;align-items:center;margin-bottom:9px}
.tour-n{font-size:13px;color:var(--txt-3);letter-spacing:1px;font-weight:700}
.tour-x{width:26px;height:26px;margin-left:auto;border-radius:8px;font-size:14px}
.tour-t{font-size:18px;font-weight:730;margin-bottom:9px;letter-spacing:-.2px;text-wrap:balance}
.tour-b{font-size:15.5px;line-height:1.85;color:var(--txt-2)}
.tour-b b{color:var(--txt)}
.tour-note{margin-top:12px;font-size:13.5px;color:var(--amber);background:rgba(255,176,32,.1);
  border:1px solid rgba(255,176,32,.28);border-radius:9px;padding:7px 10px;line-height:1.6}
.tour-dots{display:flex;gap:5px;margin:15px 0 13px}
.tour-dots i{width:16px;height:3px;border-radius:3px;background:var(--line-2);transition:.2s}
.tour-dots i.on{background:var(--grad);width:24px}
.tour-f{display:flex;align-items:center;gap:8px}
@media(prefers-reduced-motion:reduce){.tour-hole{transition:none}.tour-pop{animation:none}}

/* ---------------- 以下来自同事版本合并：人物引擎 ---------------- */
.nav-group.admin{margin-top:12px;border-top:1px solid var(--line);padding-top:18px}
.nav-item.admin{font-size:14.5px;opacity:.72}
.nav-item.admin:hover,.nav-item.admin.active{opacity:1}
.nav-more{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.nav-more summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--txt-3);letter-spacing:1.4px;padding:8px 10px 7px;font-weight:600}
.nav-more summary::-webkit-details-marker{display:none}
.nav-more summary::after{content:"▾";float:right;opacity:.65}
.nav-more:not([open]) summary::after{content:"▸"}
.zhao-hero-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:18px;align-items:center}
.daily-actions{display:grid;grid-template-columns:1.25fr .9fr .9fr;gap:12px;margin-top:16px}
.daily-action{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:15px;cursor:pointer;transition:.16s;min-height:116px}
.daily-action.primary{background:linear-gradient(135deg,rgba(124,108,255,.18),rgba(255,176,32,.12));border-color:rgba(124,108,255,.38)}
.daily-action:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.daily-action .num{width:28px;height:28px;border-radius:9px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;margin-bottom:10px}
.daily-action .title{font-size:17px;font-weight:730;margin-bottom:5px}
.daily-action .desc{font-size:14.5px;color:var(--txt-2);line-height:1.65}
.task-list{display:grid;gap:10px}
.task-row{display:flex;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);cursor:pointer;transition:.16s}
.task-row:hover{border-color:var(--line-2);transform:translateY(-1px)}
.task-icon{width:34px;height:34px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;flex:0 0 34px}
.task-title{font-weight:700;font-size:15.5px}
.task-desc{font-size:14px;color:var(--txt-3);margin-top:2px}
.task-panel{background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:16px}
.quiet-stat{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.quiet-stat:last-child{border-bottom:0}
.quiet-stat b{font-size:19.5px}
.voice-preview{display:grid;gap:10px}
.voice-box{border:1px solid var(--line);background:var(--panel-2);border-radius:12px;padding:13px;line-height:1.75;font-size:15px}
.voice-box b{display:block;font-size:14px;color:var(--txt-3);margin-bottom:4px}
.engine-card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;cursor:pointer;transition:.16s}
.engine-card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
.engine-card.on{border-color:rgba(124,108,255,.45);background:linear-gradient(135deg,rgba(124,108,255,.14),rgba(255,176,32,.08))}
.engine-score{font-size:29px;font-weight:780;letter-spacing:-.4px}
.engine-flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.engine-step{border:1px solid var(--line);background:var(--panel-2);border-radius:14px;padding:14px;min-height:120px}
.engine-step .n{width:26px;height:26px;border-radius:8px;background:var(--grad);display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;margin-bottom:10px}
.schema-table td:first-child{font-family:"JetBrains Mono",Consolas,monospace;color:var(--violet-2);font-size:14px}
@media(max-width:900px){.zhao-hero-grid{grid-template-columns:1fr}}
@media(max-width:900px){.daily-actions{grid-template-columns:1fr}}
@media(max-width:900px){.engine-flow{grid-template-columns:1fr}}

@media(max-width:980px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:var(--shadow)}
  .only-mobile{display:grid}
  .search{display:none}
  .view{padding:18px 15px 50px}
  .row2{grid-template-columns:1fr}
  .tour-pop{width:calc(100vw - 24px);left:12px!important}
  #btn-tour{display:none}
}

  const n = Number(value);
  return Number.isFinite(n) ? Math.min(180, Math.max(15, Math.round(n))) : 60;
}

}

  const rand = a => (a && a.length) ? a[Math.floor(Math.random() * a.length)] : undefined;

   * 模板不必每一行都自己防。 */
  function withDefaults(b) {

  /* 生成单人口播脚本。
   *
   * 为什么是单人不是双人对谈：数字人服务一次只能让「一个形象 + 一个声音」
   * 念一段话，做不出两个人真的对谈。以前这里写的是主持人＋作者的双人对谈稿，
   * 但生成时只能由同一个数字人把两边台词都念完——稿子和实际做得出来的东西
   * 对不上，等于给人看一份永远拍不出来的剧本。
   * 改成单人口播后，稿子写什么、影片就是什么，完全一致。
   * 资料结构维持 [{t, speaker, cue, text}] 不变，分镜表与预览都能沿用。 */
  function genSceneDialogue(b, angle, i) {
    const q = (b.quotes && b.quotes[i % b.quotes.length]) || '把力气用在真正会变大的地方。';
    const pain = (b.pains && b.pains[i % b.pains.length]) || '很努力却看不到结果';
    const theme = (b.themes && b.themes[i % b.themes.length]) || '先判断任务的回报结构';
    const pool = sceneTemplateLibrary();
    /* 优先用使用者在「创意分镜」选好的场景。以前这里一律用
     * (i*3+n) 自动分配，使用者选了也没用——这是「选了没反应」的根因。
     * 没选才退回自动分配，行为跟以前一样。 */
    const picked = (b.sceneIds || []).map(id => pool.find(x => x.id === id)).filter(Boolean);
    const scenes = [0, 1, 2].map(n => {
      const t = picked.length ? picked[n % picked.length] : pool[(i * 3 + n) % pool.length];
      return { name: t.name, visual: t.setting, role: t.fit };
    });
    const style = {
      story: '故事感',
      pain: '痛点追问',
      quote: '金句拆解',
      biz: '专业访谈',
      know: '知识图解',
      excerpt: '书摘讨论',
      author: '作者观察'
    }[angle] || '口播';
    /* 单人口播：一个人对着镜头把这本书讲清楚。
     * 每句都是同一个人说的，所以 speaker 一律是主讲人——影片里也就只会
     * 出现这一个数字人、这一个声音，跟你在「数字人/声音」页选的完全一致。 */
    const me = OWNER();
    const dialogue = [
      { t: '0.0-4.0s', speaker: me, cue: '直接抛问题，别铺陈', text: `先别急着说你没时间。${pain}——这件事《${b.title}》讲得比我狠。` },
      { t: '4.0-10.0s', speaker: me, cue: '给结论，语速稳下来', text: `这本书讲的不是成功学，是面对「${pain}」的时候，你到底该怎么少走弯路。` },
      { t: '10.0-17.0s', speaker: me, cue: '停一下再讲重点', text: `它的核心其实就一句：${theme}。` },
      { t: '17.0-24.0s', speaker: me, cue: '念金句，放慢、加重', text: `书里有句话我抄下来了：${q}` },
      { t: '24.0-31.0s', speaker: me, cue: '解释为什么', text: '为什么这句重要？因为低倍数的努力只会让你越来越忙，高倍数的判断才会让结果自己长出来。' },
      { t: '31.0-38.0s', speaker: me, cue: '预设反驳，自问自答', text: '你可能会说，道理我都懂。但问题从来不是懂不懂，是你有没有真的停下来算过这笔账。' },
      { t: '38.0-46.0s', speaker: me, cue: '给具体动作，语速回快', text: '所以今晚做一件事就够：拿张纸列三栏——消耗、维持、放大。先删掉一个消耗你的任务。' },
      { t: '46.0-52.0s', speaker: me, cue: '收束，讲人话', text: '不用一次改完。删掉一个，你这周就能感觉到差别。' },
      { t: '52.0-60.0s', speaker: me, cue: 'CTA，自然一点别硬推', text: `想看《${b.title}》第一章的书摘，留言「书摘」，下一支我直接拆里面的方法。` }
    ];
    return {
      template: '单人口播',
      style,
      rhythm: '短句、停顿、自问自答、语速有快慢差',
      scenePlan: scenes,
      voicePlan: [
        { role: '主讲人', voice: '用你在「数字人 / 声音 / 克隆」页选好的那个声音', pace: '180-200 wpm', emotion: '像跟朋友讲话，有停顿、有轻重' }
      ],
      dialogue
    };
  }

  /* 生成完整脚本对象 */
  function genScripts(b, count) {
    b = withDefaults(b);
    const out = [];
    for (let i = 0; i < (count || 10); i++) {
      const a = ANGLES[i % ANGLES.length];
      const p = PLATFORMS[i % PLATFORMS.length];
      const duration = defaultVideoDuration();
      const sceneDialogue = genSceneDialogue(b, a.key, i);
      out.push({
        id: uid('s'), n: i + 1, angle: a.key, angleName: a.name, platform: p.key, platformName: p.name,
        title: TITLE_TPL[i % TITLE_TPL.length](b),
        hook: HOOK_TPL[i % HOOK_TPL.length](b),
        body: genScriptBody(b, a.key),
        sceneMode: sceneDialogue.template,
        sceneStyle: sceneDialogue.style,
        rhythm: sceneDialogue.rhythm,
        scenePlan: sceneDialogue.scenePlan,
        voicePlan: sceneDialogue.voicePlan,
        dialogue: scaleDialogue(sceneDialogue.dialogue, duration),
        cta: p.cta, duration, words: Math.round(duration * 4.7),
        score: 66 + Math.floor(Math.random() * 32), persona: false
      });
    }
    return out;
  }

  function scaleDialogue(dialogue, duration) {
    const lines = Array.isArray(dialogue) ? dialogue : [];
    if (!lines.length) return lines;
    const D = clampDuration(duration);
    return lines.map((line, i) => {
      const t0 = +(i * D / lines.length).toFixed(1);
      const t1 = +((i + 1) * D / lines.length).toFixed(1);
      return Object.assign({}, line, { t: `${t0.toFixed(1)}-${t1.toFixed(1)}s` });
    });
  }

  /* 人格改写（Step 5） */
  const HABITS = ['我讲得直白一点，', '你听我说完，', '这里我要停一下，', '说句实在话，', '我自己的体会是，'];
  function applyPersona(s) {
    const dialogue = (s.dialogue || []).map((line, i) => Object.assign({}, line, {
      text: line.speaker === '作者' && i % 2
        ? rand(HABITS) + line.text
        : line.text
    }));
    return Object.assign({}, s, {
      persona: true,
      hook: rand(HABITS) + s.hook,
      body: s.body.replace(/\n\n/g, () => '\n\n') + `\n\n【${OWNER()}收尾】我不劝你一定要买这本书，我只希望你把刚才那句话想清楚。想清楚了，这条视频就没白看。`,
      dialogue,
      score: Math.min(99, s.score + 5 + Math.floor(Math.random() * 6))
    });
  }

  /* 生成分镜（时间轴按实际片长等比分配，不写死秒数） */
  function genShots(s, b) {
    const D = clampDuration(s.duration || defaultVideoDuration());
    if (s.scenePlan && s.dialogue) {
      const scenes = s.scenePlan;
      const lines = s.dialogue;
      const first = scenes[0] || { name: '马路街访', visual: '街景与路人', role: '开场' };
      const second = scenes[1] || { name: '专业访谈室', visual: '书架与沙发', role: '观点' };
      const third = scenes[2] || { name: '车内聊天', visual: '车窗城市', role: '收尾' };
      /* 单人口播的镜头语言：全程同一个人，靠景别、书封、金句卡和换场做变化，
       * 不再有「双人交叉剪」「插嘴重叠」这种数字人做不出来的东西。
       * txt 直接取台词本文，不加「谁说的」前缀——反正全篇只有一个人在讲。 */
      const say = (...idx) => idx.map(n => lines[n]).filter(Boolean).map(x => x.text).join('\n');
      const parts = [
        { t: first.name + '开场', txt: say(0) || s.hook, cam: '中景，背后看得见场地，人物占画面 45%', vis: '前 3 秒字幕大字 + 环境声', w: 0.07 },
        { t: '给结论', txt: say(1), cam: '正面中近景，轻微推镜', vis: '结论关键词大字', w: 0.10 },
        { t: '讲核心观点', txt: say(2), cam: '近景，语速稳', vis: '书封插入 + 核心句字幕', w: 0.12 },
        { t: '金句停顿', txt: say(3), cam: '人物让位，切书页划线与金句卡', vis: '全屏金句卡 + 停顿留白', w: 0.12 },
        { t: second.name + '换场解释', txt: say(4), cam: `换到${second.visual}，中景`, vis: second.role, w: 0.12 },
        { t: '自问自答', txt: say(5), cam: '正面近景，直视镜头', vis: '反问字幕卡', w: 0.12 },
        { t: '给具体做法', txt: say(6), cam: '中景，语速回快', vis: '三栏清单动画（消耗/维持/放大）', w: 0.13 },
        { t: third.name + '收束', txt: say(7), cam: `${third.visual}，中景`, vis: third.role, w: 0.10 },
        { t: 'CTA 与 AI 标识', txt: say(8) || s.cta, cam: '书封 + 人物小窗 + 留言提示', vis: '留言书摘 / 试读 / AI 生成声明', w: 0.12 }
      ];
      let acc = 0;
      return parts.map((p, i) => {
        const t0 = +(acc * D).toFixed(1);
        acc += p.w;
        const t1 = i === parts.length - 1 ? D : +(acc * D).toFixed(1);
        return { t: p.t, txt: p.txt, cam: p.cam, vis: p.vis, t0, t1, dur: `${t0}–${t1}s` };
      });
    }
    const parts = [
      { t: '开场特写', txt: s.hook, cam: '数字人正面近景', vis: '书封悬浮入场', w: 0.13 },
      { t: '观点抛出', txt: s.body.split('\n\n')[1] || s.body.slice(0, 60), cam: '中景 + 轻微推镜', vis: '关键词大字动效', w: 0.27 },
      { t: '论证展开', txt: s.body.split('\n\n')[2] || '展开论证段落', cam: '中景', vis: 'B-roll 场景素材', w: 0.30 },
      { t: '金句强调', txt: rand(b.quotes) || '', cam: '静止近景', vis: '全屏金句卡 + 停顿', w: 0.20 },
      { t: '收尾 CTA', txt: s.cta, cam: '正面中景', vis: '书封 + 购买链接角标', w: 0.10 }
    ];
    let acc = 0;
    return parts.map((p, i) => {
      const t0 = Math.round(acc * D);
      acc += p.w;
      const t1 = i === parts.length - 1 ? D : Math.round(acc * D);
      return { t: p.t, txt: p.txt, cam: p.cam, vis: p.vis, t0, t1, dur: `${t0}–${t1}s` };
    });
  }

  /* 生成视频。只有「已发布」的才有数据——没发布过的影片不可能有观看数 */
  /* 真实流程用：一篇稿子 = 一支待生成的影片。
   * 这里刻意不产生任何播放量、按赞、完播率——那些数字只有影片真的做出来、
   * 真的发布到平台、平台真的回传之后才会有。凭空生成会让人以为影片已经存在。 */
  function genPendingVideos(b, scripts) {
    return scripts.map((s, i) => {
      const p = PLATFORMS.find(x => x.key === s.platform);
      return {
        id: uid('v'), scriptId: s.id, title: s.title, caption: s.hook.slice(0, 26) + '…',
        platform: s.platform, platformName: p.name, color: p.color, ratio: p.ratio,
        angle: s.angleName, duration: s.duration, format: defaultVideoMode(), cover: COVERS[i % COVERS.length],
        status: '待生成',
        videoUrl: null,      // 真的生成出来才有，有了才播得了、下载得了
        heygenId: null,      // 送去生成后的任务编号，用来查进度
        avatarName: '', voiceName: '',   // 这支实际用了哪个形象与声音
        views: 0, watch: 0, like: 0, share: 0, click: 0, day: 0
      };
    });
  }

  /* 仅供内建示范专案使用：连播放数据一起造，好让工作台/数据分析页有东西可看。
   * 每一支都带 demo:true，介面必须据此标示「演示数据」，不可与真实产出混为一谈。 */
  function genVideos(b, scripts) {
    // 状态用加权随机，不能跟平台一样按序号循环——否则周期互相整除，
    // 会变成永远只有固定那几个平台有已发布的影片
    const pick = () => {
      const r = Math.random();
      return r < 0.4 ? '已发布' : r < 0.65 ? '待审核' : r < 0.85 ? '排程中' : '草稿';
    };
    return scripts.map((s, i) => {
      const p = PLATFORMS.find(x => x.key === s.platform);
      const status = pick();
      const live = status === '已发布';
      const views = live ? Math.floor(Math.random() * 480000) + 8000 : 0;
      return {
        id: uid('v'), scriptId: s.id, title: s.title, caption: s.hook.slice(0, 26) + '…',
        platform: s.platform, platformName: p.name, color: p.color, ratio: p.ratio,
        angle: s.angleName, duration: s.duration, cover: COVERS[i % COVERS.length],
        status,
        demo: true,          // 这是演示数据，介面必须标示出来
        views,
        watch: live ? 28 + Math.floor(Math.random() * 55) : 0,
        like: live ? Math.floor(views * (0.02 + Math.random() * 0.06)) : 0,
        share: live ? Math.floor(views * (0.004 + Math.random() * 0.02)) : 0,
        click: live ? Math.floor(views * (0.002 + Math.random() * 0.012)) : 0,
        day: Math.floor(Math.random() * 28) + 1
      };
    });
  }

  /* 平台策略评分 */
  function genStrategy(b) {
    /* 这些栏位不保证有值：新建的空专案还没跑过 AI 阅读，或者 AI 回传的
     * JSON 里就是没有 audiences。以前直接取 b.audiences[...].name，
     * 遇到空阵列会 i % 0 → NaN → 读 undefined.name 抛错，
     * 而这个错会直接中断整条流水线（外面没有 try/catch），
     * 使用者只看到进度卡在某一步不动、也没有任何提示。 */
    const auds = (b.audiences && b.audiences.length) ? b.audiences : [{ name: '一般读者' }];
    const anchor = (b.tags && b.tags[0]) || b.category || '这本书的主题';
    return {
      positioning: `以「${anchor}」为主锚点，用${OWNER()}的一线判断力做信任背书，把《${b.title}》从一本书拆成一套可持续讨论的话题矩阵。`,
      kpi: [{ k: '单书视频产出', v: '30+ 支' }, { k: '目标总曝光', v: '500 万' }, { k: '目标完播率', v: '≥ 38%' }, { k: '书籍详情页点击', v: '≥ 2.5 万' }],
      platforms: PLATFORMS.map((p, i) => ({
        key: p.key, name: p.name, color: p.color, ratio: p.ratio, len: p.len, tone: p.tone, cta: p.cta,
        fit: [92, 88, 85, 80, 74, 70, 83, 86][i], count: [8, 5, 6, 4, 3, 2, 4, 5][i],
        audience: (auds[i % auds.length] || {}).name || '一般读者'
      }))
    };
  }

  /* 数据分析（7 日 / 平台 / 漏斗）。统计范围只含已发布的影片 */
  function genAnalytics(all) {
    const videos = (all || []).filter(v => v.status === '已发布');
    const days = [];
    for (let i = 6; i >= 0; i--) {
      days.push({ label: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'][6 - i],
        view: 40000 + Math.floor(Math.random() * 90000), inter: 2000 + Math.floor(Math.random() * 7000) });
    }
    const byPlat = PLATFORMS.map(p => {
      const vs = videos.filter(v => v.platform === p.key);
      return { name: p.name, color: p.color, value: vs.reduce((a, v) => a + v.views, 0), count: vs.length };
    }).filter(x => x.count).sort((a, b) => b.value - a.value);
    const total = videos.reduce((a, v) => a + v.views, 0) || 1;
    const funnel = [
      { k: '曝光', v: Math.round(total * 3.4) }, { k: '播放', v: total },
      { k: '看完 50%', v: Math.round(total * 0.42) }, { k: '互动', v: Math.round(total * 0.061) },
      { k: '点击书链', v: Math.round(total * 0.0093) }, { k: '下单', v: Math.round(total * 0.0011) }
    ];
    return { days, byPlat, funnel, total, liveCount: videos.length, allCount: (all || []).length };
  }

  /* 构建一个完整项目 */
  function buildProject(seed, full) {
    const b = Object.assign({ id: uid('bk'), createdAt: Date.now(), materials: [] }, seed);
    if (full) {
      // 只有内建的示范项目（工作台上那几本already-done的书）才假装「本来就有资料」；
      // 使用者自己新建的项目必须从空列表开始，不然会跟真的上传结果混在一起，分不清哪些是自己传的。
      b.materials = [
        { name: `${b.title}_内文.pdf`, type: 'PDF', size: '8.4 MB', status: '已解析' },
        { name: `${b.title}_书封.jpg`, type: '图片', size: '1.2 MB', status: '已解析' },
        { name: '作者介绍与推荐序.docx', type: '文档', size: '286 KB', status: '已解析' },
        { name: '出版社宣传资料.pptx', type: '文档', size: '4.1 MB', status: '已解析' }
      ];
      b.strategy = genStrategy(b);
      b.titles = genTitles(b, 20);
      b.hooks = genHooks(b, 20);
      b.opens = genOpens(b);
      b.scripts = genScripts(b, 14).map(s => (b.status === 'done' || b.status === 'ready') ? applyPersona(s) : s);
      b.videos = genVideos(b, b.scripts).concat(genVideos(b, genScripts(b, 16)));
      b.stages = STAGES.map(s => ({ key: s.key, state: 'done' }));
    } else {
      b.titles = []; b.hooks = []; b.opens = []; b.scripts = []; b.videos = [];
      b.stages = STAGES.map(s => ({ key: s.key, state: 'todo' }));
    }
    return b;
  }

  function seedAll() {
    const list = [buildProject(SEED_BOOKS[0], true), buildProject(SEED_BOOKS[1], true), buildProject(SEED_BOOKS[2], true)];
    list[1].stages = STAGES.map((s, i) => ({ key: s.key, state: i < 4 ? 'done' : i === 4 ? 'run' : 'todo' }));
    list[1].videos = list[1].videos.slice(0, 9);
    return list;
  }

  /* 书籍档案（JSON）→ 专案资料。支援中文与英文栏位名。 */
  function importProfile(json, p) {
    const g = (...keys) => { for (const k of keys) if (json[k] != null) return json[k]; };
    const title = g('书名', 'title');
    if (!title) return { ok: false, msg: '档案里找不到「书名」栏位，请确认格式' };

    p.title = title;
    p.subtitle = g('副标题', 'subtitle') || '';
    p.author = g('作者', 'author') || '佚名';
    p.publisher = g('出版社', 'publisher') || '未填写';
    p.category = g('分类', 'category') || '';
    p.tags = g('标签', 'tags') || [];
    p.summary = g('全书摘要', 'summary') || '';
    p.themes = g('核心论点', 'themes') || [];
    p.pains = g('读者痛点', 'pains') || [];
    p.hots = g('热点话题', 'hots') || [];
    p.toc = (g('目录', 'toc') || []).map(t => (typeof t === 'string' ? t : `第 ${t['章'] || t.no} 章　${t['标题'] || t.title}`));
    p.words = g('字数', 'words') || 0;
    p.chapterCount = g('章节数', 'chapters') || p.toc.length;
    p.authorBio = g('作者简介', 'authorBio') || '';
    p.publisherBio = g('出版社简介', 'publisherBio') || '';

    const qs = g('金句', 'quotes') || [];
    p.quoteSrc = qs.map(q => (typeof q === 'string'
      ? { text: q, chapter: null, page: null }
      : { text: q['文字'] || q.text, chapter: q['章节'] || q.chapter, page: q['页码'] || q.page }))
      .filter(q => q.text);
    p.quotes = p.quoteSrc.map(q => q.text);

    const au = g('读者画像', 'audiences') || [];
    p.audiences = au.map(a => (typeof a === 'string'
      ? { name: a, size: Math.round(100 / au.length), note: '' }
      : { name: a['名称'] || a.name, size: a['占比'] || a.size || 0, note: a['特征'] || a.note || '' }));

    const ci = g('封面配色', 'cover');
    if (typeof ci === 'number' && COVERS[ci]) p.cover = COVERS[ci];

    p.source = { kind: 'profile', label: '完整书籍档案' };
    return {
      ok: true,
      stat: { 论点: p.themes.length, 金句: p.quoteSrc.length, 画像: p.audiences.length, 痛点: p.pains.length, 目录: p.toc.length }
    };
  }

  /* 内文（TXT / MD）→ 本地启发式解析（非 AI，纯规则） */
  function parseText(text) {
    const chars = (text.match(/[一-鿿]/g) || []).length;
    const heads = (text.match(/^(#{1,3}\s*.+|第\s*[0-9一二三四五六七八九十]+\s*章.*)$/gm) || [])
      .map(s => s.replace(/^#+\s*/, '').trim());
    const seen = {};
    const quotes = text
      .split(/[。！？\n]/).map(s => s.replace(/^[#\s>*\-]+/, '').trim())
      .filter(s => {
        if (s.length < 12 || s.length > 40) return false;
        if (/[0-9A-Za-z（）()《》]/.test(s)) return false;
        if (seen[s]) return false;
        seen[s] = 1; return true;
      });

/* ============================================================
 * store.js — 全局状态与本地持久化
 * ========================================================== */
window.STORE = (function () {
  const KEY = 'zd_ai_book_video_v1';

  const def = () => ({
    projects: DATA.seedAll(),
    currentId: null,
    /* 登录帐户：每个使用者有自己的名称与专属数字人、声音。
       演示环境用中性预设，实际使用时在系统设定改成本人名字。 */
    account: { name: '主理人', title: '超级管理员', initial: '主' },
    /* 人物档案：一个平台可以服务多个人，各自有专属风格包（合并自同事版本） */
    people: null,
    persona: JSON.parse(JSON.stringify(DATA.PERSONA)),
    settings: {
      theme: 'dark',
      llm: 'claude-opus-5',
      tts: 'zhao-voice-v3',
      avatarEngine: 'ZD-Avatar 2.0 (口型+表情+手势)',
      autoPersona: true, autoSubtitle: true, autoBroll: true, autoBgm: true,
      videoDuration: 60,
      realAI: true,   // STEP 2/4 用真实模型（约 US$0.6/本）；关掉就走模板
      /* 每个会花钱的 AI 步骤开跑前，先弹窗让人挑模型。
       * 勾了「不用再问」就变 false，之后直接用 modelPicks 里记住的。 */
      askModel: true,
      /* 各步骤记住的模型：{ read/script/rewrite/prompts/image: '模型 id 或策略' }。
       * 空的时候各步骤用自己的预设（文字 auto、图像 fast）。 */
      modelPicks: {},
      compliance: true, watermark: true, autoPublish: false,
      quotaUsed: 186, quotaTotal: 500
    },
    schedule: [],
    activity: []
  });

  let state;
  try {
    const raw = localStorage.getItem(KEY);
    state = raw ? JSON.parse(raw) : def();
    if (!state.projects || !state.projects.length) state = def();
  } catch (e) { state = def(); }

  /* 资料迁移：浏览器里可能存着旧版本的资料，缺少新版新增的栏位。
     不补齐的话，新功能一读到 undefined 就会整页崩掉。 */
  (function migrate() {
    const d = def();
    state.persona = Object.assign({}, d.persona, state.persona || {});
    state.settings = Object.assign({}, d.settings, state.settings || {});
    // 旧资料没有这个物件，不补齐的话选模型窗口一存就崩
    if (!state.settings.modelPicks || typeof state.settings.modelPicks !== 'object') state.settings.modelPicks = {};
    state.account = Object.assign({}, d.account, state.account || {});
    if (!state.account.name) state.account = d.account;
    if (!Array.isArray(state.persona.cloneSamples)) state.persona.cloneSamples = d.persona.cloneSamples;
    /* 访谈式对谈：旧资料只有一个笼统的「来宾」，没有「对面坐的是谁」这件事。
       补成预设的 AI 提问者，旧的固定模板 ID 也一并放掉，改由形式自己决定。 */
    if (!DATA.INTERVIEW_FORMATS.some(f => f.id === state.persona.interviewFormat)) {
      state.persona.interviewFormat = d.persona.interviewFormat;
    }
    if (state.persona.conversationTemplateId === 'bookreel_fixed_interview_v1') state.persona.conversationTemplateId = '';
    if (state.persona.guestName === '来宾') state.persona.guestName = '';
    if (!Array.isArray(state.persona.habits)) state.persona.habits = d.persona.habits;
    if (!Array.isArray(state.people) || !state.people.length) state.people = null;
    if (!Array.isArray(state.schedule)) state.schedule = [];
    if (!Array.isArray(state.activity)) state.activity = [];
    state.projects.forEach(p => {
      if (!Array.isArray(p.materials)) p.materials = [];
      // 书中角色：旧资料没有这个栏位，不补齐的话「让主角走进影片」一读就崩
      if (!Array.isArray(p.characters)) p.characters = [];
      if (!Array.isArray(p.videoPrompts)) p.videoPrompts = [];
      ['titles', 'hooks', 'opens', 'scripts', 'videos'].forEach(k => { if (!Array.isArray(p[k])) p[k] = []; });
      /* 旧版影片全是凭空造的假数据（随机播放量、随机「已发布」状态），
       * 但没有 demo 标记，介面会把它们当成真影片显示。
       * 凡是带旧状态值又没有真影片档的，一律补上 demo 标记，
       * 介面才能明确标示「这是演示假数据」，不再让人误会。 */
      p.videos.forEach(v => {
        if (v.demo === undefined && !v.videoUrl &&
            ['已发布', '待审核', '排程中', '草稿'].indexOf(v.status) >= 0) v.demo = true;
        if (!v.format) v.format = state.persona.videoMode || d.persona.videoMode;
      });
      if (!Array.isArray(p.stages)) p.stages = DATA.STAGES.map(s => ({ key: s.key, state: 'todo' }));
      /* 旧版稿子是「主持人＋作者」双人对谈，但数字人一次只能一个形象一个声音，
       * 那种稿子永远拍不出来。凡是还带双人台词的，一律重新产生成单人口播稿，
       * 否则使用者拿旧稿去生成，出来的东西还是跟稿子对不上。
       * 判断依据：dialogue 里出现两个以上不同的 speaker。 */
      const isTwoPerson = s => new Set((s.dialogue || []).map(x => x.speaker)).size > 1;
      if (p.scripts.length && p.scripts.some(isTwoPerson)) {
        const fresh = DATA.genScripts(p, p.scripts.length);
        p.scripts = p.scripts.map((s, i) => Object.assign({}, s, {
          sceneMode: fresh[i].sceneMode,
          rhythm: fresh[i].rhythm,
          voicePlan: fresh[i].voicePlan,
          dialogue: fresh[i].dialogue,
          aiWritten: false        // 重新产生过，不能再挂着「AI 写的」标记
        }));
      }
      // 旧版脚本没有场景对谈栏位（scenePlan / dialogue / voicePlan），补生成一份，
      // 否则「创意分镜」与脚本详情弹窗读到 undefined 会直接崩掉
      if (p.scripts.length && p.scripts.some(s => !s.scenePlan || !s.dialogue || !s.voicePlan)) {
        const fresh = DATA.genScripts(p, p.scripts.length);
        p.scripts = p.scripts.map((s, i) => Object.assign({}, s, {
          duration: defaultVideoDuration(),
          sceneMode: fresh[i].sceneMode,
          sceneStyle: fresh[i].sceneStyle,
          rhythm: fresh[i].rhythm,
          scenePlan: fresh[i].scenePlan,
          voicePlan: fresh[i].voicePlan,
          dialogue: fresh[i].dialogue
        }));
      }
    });
  })();

  if (!state.currentId) state.currentId = state.projects[0].id;

  const subs = [];
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function emit() { save(); subs.forEach(f => f(state)); }

  /* 首次生成排程 */
  function ensureSchedule() {
    if (state.schedule.length) return;
    const all = [];
    state.projects.forEach(p => (p.videos || []).slice(0, 12).forEach(v => {
      all.push({ id: DATA.uid('sc'), projectId: p.id, bookTitle: p.title, videoId: v.id,
        title: v.title, platform: v.platformName, color: v.color, day: v.day,
        hour: [8, 12, 18, 20, 21][Math.floor(Math.random() * 5)],
        status: v.status === '已发布' ? '已发布' : '待发布' });
    }));
    state.schedule = all;
  }

  function log(type, text) {
    state.activity.unshift({ id: DATA.uid('a'), type, text, at: Date.now() });
    state.activity = state.activity.slice(0, 40);
  }

  if (!state.activity.length) {
    ['《认知杠杆》30 支短视频已全部渲染完成', '主理人人格模型 v3.2 校验通过（一致性 96.4%）',
     '《慢决策》进入「套用主理人人格」阶段', '本周抖音总播放突破 120 万', '《第二曲线的起点》营销策略已生成'
    ].forEach((t, i) => state.activity.push({ id: DATA.uid('a'), type: ['ok', 'ok', 'run', 'info', 'ok'][i], text: t, at: Date.now() - i * 3600e3 }));
  }
  ensureSchedule();
  save();

  return {
    get s() { return state; },
    get current() { return state.projects.find(p => p.id === state.currentId) || state.projects[0]; },
    setCurrent(id) { state.currentId = id; emit(); },
    addProject(p) { state.projects.unshift(p); state.currentId = p.id; log('ok', `新建书籍项目《${p.title}》`); emit(); },
    removeProject(id) {
      state.projects = state.projects.filter(p => p.id !== id);
      state.schedule = state.schedule.filter(s => s.projectId !== id);
      if (!state.projects.length) state.projects = DATA.seedAll();
      if (!state.projects.find(p => p.id === state.currentId)) state.currentId = state.projects[0].id;
      emit();
    },
    update() { emit(); },
    log(t, x) { log(t, x); emit(); },
    reset() { state = def(); ensureSchedule(); emit(); },
    on(f) { subs.push(f); }
  };
})();

/* ============================================================
 * ui.js — 通用 UI 工具
 * ========================================================== */
window.UI = (function () {

  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const nf = n => n >= 100000000 ? (n / 100000000).toFixed(1) + '亿'
    : n >= 10000 ? (n / 10000).toFixed(1) + '万' : String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');

  function toast(msg, type) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.innerHTML = esc(msg);
    box.appendChild(el);
    if (window.I18N) I18N.apply(el);
    setTimeout(() => { el.style.transition = '.3s'; el.style.opacity = '0'; el.style.transform = 'translateX(24px)'; setTimeout(() => el.remove(), 300); }, 2800);
  }

  /* 弹窗关闭钩子：任何开启或关闭都会触发，用于停掉弹窗内的计时器等资源 */
  const closeHooks = [];
  const onClose = f => closeHooks.push(f);
  const runHooks = () => closeHooks.forEach(f => { try { f(); } catch (e) {} });

  function modal(title, body, foot, wide) {
    runHooks();
    $('#modal-title').innerHTML = title;
    $('#modal-body').innerHTML = body;
    $('#modal-foot').innerHTML = foot || '';
    $('#modal').classList.toggle('wide', !!wide);
    $('#modal-mask').classList.add('show');
    if (window.I18N) I18N.apply($('#modal'));
  }
  function closeModal() { runHooks(); $('#modal-mask').classList.remove('show'); }

  function copy(text) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板', 'ok'); } catch (e) { toast('复制失败，请手动选择', 'warn'); }
    ta.remove();
  }

  function download(name, content) {
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    toast('已导出：' + name, 'ok');
  }

  const statusTag = s => {
    const m = { 'done': ['g', '已完成'], 'ready': ['c', '待生产'], 'producing': ['a', '生产中'], 'draft': ['', '草稿'],
      '已发布': ['g', '已发布'], '待审核': ['a', '待审核'], '排程中': ['c', '排程中'], '草稿': ['', '草稿'], '待发布': ['v', '待发布'],
      // 影片按需生成的四个状态：稿子写好了但还没做成影片 → 正在做 → 做好了 → 做失败
      '待生成': ['', '待生成'], '生成中': ['a', '生成中'], '已生成': ['g', '已生成'], '生成失败': ['r', '生成失败'] };
    const x = m[s] || ['', s];
    return `<span class="tag ${x[0]}"><i class="dot ${x[0]}"></i>${x[1]}</span>`;
  };

  const scoreBar = v => `<div style="display:flex;align-items:center;gap:8px">
      <div class="bar" style="width:56px"><i style="width:${v}%"></i></div>
      <span style="font-size:13px;color:var(--txt-3);font-weight:600">${v}</span></div>`;

  return { $, $$, esc, nf, toast, modal, closeModal, onClose, copy, download, statusTag, scoreBar };
})();

/* ============================================================
 * charts.js — 纯 SVG 图表（无第三方依赖）
 * ========================================================== */
window.CHART = (function () {
  const nf = n => window.UI ? UI.nf(n) : n;

  /* 折线 + 面积图（双系列） */
  function line(data, opt) {
    opt = opt || {};
    const W = 720, H = 230, PL = 46, PR = 14, PT = 16, PB = 28;
    const max = Math.max.apply(null, data.map(d => d.view)) * 1.18 || 1;
    const iw = W - PL - PR, ih = H - PT - PB;
    const x = i => PL + (iw / (data.length - 1 || 1)) * i;
    const y = v => PT + ih - (v / max) * ih;

    const p1 = data.map((d, i) => `${i ? 'L' : 'M'}${x(i)},${y(d.view)}`).join(' ');
    const area = p1 + ` L${x(data.length - 1)},${PT + ih} L${PL},${PT + ih} Z`;
    const p2 = data.map((d, i) => `${i ? 'L' : 'M'}${x(i)},${y(d.inter * 8)}`).join(' ');

    let grid = '', ylab = '';
    for (let g = 0; g <= 4; g++) {
      const gy = PT + (ih / 4) * g;
      grid += `<line x1="${PL}" y1="${gy}" x2="${W - PR}" y2="${gy}" stroke="var(--line)" stroke-dasharray="3 5"/>`;
      ylab += `<text x="${PL - 9}" y="${gy + 4}" text-anchor="end" font-size="10" fill="var(--txt-3)">${nf(Math.round(max - (max / 4) * g))}</text>`;
    }
    const xlab = data.map((d, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10.5" fill="var(--txt-3)">${d.label}</text>`).join('');
    const dots = data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.view)}" r="3.6" fill="var(--bg)" stroke="#7c6cff" stroke-width="2"><title>${d.label} 播放 ${nf(d.view)} · 互动 ${nf(d.inter)}</title></circle>`).join('');

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
      <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7c6cff" stop-opacity=".38"/><stop offset="100%" stop-color="#7c6cff" stop-opacity="0"/>
      </linearGradient></defs>
      ${grid}${ylab}
      <path d="${area}" fill="url(#ga)"/>
      <path d="${p1}" fill="none" stroke="#7c6cff" stroke-width="2.4" stroke-linecap="round"/>
      <path d="${p2}" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/>
      ${dots}${xlab}
    </svg>`;
  }

  /* 横向条形图 */
  function bars(items) {
    const max = Math.max.apply(null, items.map(i => i.value)) || 1;
    return `<div style="display:flex;flex-direction:column;gap:13px">` + items.map(i => `
      <div>
        <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px">
          <span style="display:flex;align-items:center;gap:7px"><i style="width:8px;height:8px;border-radius:2px;background:${i.color};display:inline-block"></i>${UI.esc(i.name)}
            <span style="color:var(--txt-3);font-size:13px">${i.count ? i.count + ' 支' : ''}</span></span>
          <b style="font-weight:650">${nf(i.value)}</b>
        </div>
        <div class="bar" style="height:7px"><i style="width:${(i.value / max * 100).toFixed(1)}%;background:${i.color}"></i></div>
      </div>`).join('') + `</div>`;
  }

  /* 环形图 */
  function donut(items, center) {
    const total = items.reduce((a, i) => a + i.value, 0) || 1;
    const R = 62, C = 2 * Math.PI * R;
    let off = 0;
    const segs = items.map(i => {
      const len = (i.value / total) * C;
      const s = `<circle cx="80" cy="80" r="${R}" fill="none" stroke="${i.color}" stroke-width="17"
        stroke-dasharray="${len - 2.5} ${C - len + 2.5}" stroke-dashoffset="${-off}" stroke-linecap="round"
        transform="rotate(-90 80 80)"><title>${UI.esc(i.name)} ${((i.value / total) * 100).toFixed(1)}%</title></circle>`;
      off += len; return s;
    }).join('');
    return `<div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap">
      <div style="position:relative;width:160px;height:160px;flex:0 0 160px">
        <svg viewBox="0 0 160 160" style="width:160px;height:160px">
          <circle cx="80" cy="80" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="17"/>${segs}</svg>
        <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center">
          <div><div style="font-size:21.5px;font-weight:750">${center || nf(total)}</div>
          <div style="font-size:12.5px;color:var(--txt-3)">总播放</div></div></div>
      </div>
      <div style="flex:1;min-width:170px;display:flex;flex-direction:column;gap:9px">

          <b>${((i.value / total) * 100).toFixed(1)}%</b></div>`).join('')}
      </div></div>`;
  }

  /* 漏斗 */
  function funnel(items) {
    const max = items[0].v || 1;
    const cols = ['#7c6cff', '#8b5cf6', '#a855f7', '#22d3ee', '#2ee6a8', '#ffb020'];
    return `<div style="display:flex;flex-direction:column;gap:9px">` + items.map((it, i) => {
      const w = Math.max(12, (it.v / max) * 100);
      const rate = i ? ((it.v / items[i - 1].v) * 100).toFixed(1) + '%' : '—';
      return `<div style="display:flex;align-items:center;gap:12px">
        <div style="width:66px;font-size:14px;color:var(--txt-2)">${it.k}</div>
        <div style="flex:1;background:var(--panel-2);border-radius:8px;overflow:hidden;height:32px;position:relative">
          <div style="width:${w}%;height:100%;background:linear-gradient(90deg,${cols[i]},${cols[i]}aa);border-radius:8px;
            display:flex;align-items:center;padding-left:11px;font-size:14px;font-weight:650;color:#fff">${nf(it.v)}</div>
        </div>
        <div style="width:52px;text-align:right;font-size:13.5px;color:var(--txt-3)">${rate}</div>
      </div>`;
    }).join('') + `</div>`;
  }

  /* 进度环 */
  function ring(pct, label) {
    const R = 56, C = 2 * Math.PI * R;
    return `<div class="ring"><svg viewBox="0 0 132 132" width="132" height="132">
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--panel-2)" stroke-width="10"/>
      <defs><linearGradient id="rg"><stop offset="0%" stop-color="#7c6cff"/><stop offset="100%" stop-color="#22d3ee"/></linearGradient></defs>
